# cargo-nextest config — https://nexte.st/book/configuration.html
#
# Surgical handling of the vendored ISPC encoders in ph2d-asset-cooker, which:
#   (a) are globally thread-UNSAFE → must run serially (the old
#       `RUST_TEST_THREADS=1` rule; nextest expresses it as a max-threads=1 group);
#   (b) SIGBUS ~50% NON-deterministically even single-threaded + isolated
#       (characterized W1.T15: same binary, run 1 crash / run 2 ok — infra flake,
#       not a code bug) → bounded retries.
#
# Scoped to ph2d-asset-cooker ONLY. We do NOT retry globally — that would mask
# real flaky tests elsewhere. ship.sh and CI both read this file, so the cook
# job stops flaking in both.

[test-groups.asset-cooker-ispc]
# Serialize all ph2d-asset-cooker tests (ISPC global state is not thread-safe).
max-threads = 1

[[profile.default.overrides]]
filter = 'package(ph2d-asset-cooker)'
test-group = 'asset-cooker-ispc'
# Bumped 3 → 6 (2026-05-29) → 10 (2026-06-02): the W1.T15-characterized ~50%
# per-run vendored-ISPC SIGABRT. 6 retries (7 tries) → ~0.5^7 ≈ 0.8% PER TEST,
# but across the ~10 cook tests the aggregate residual is ~1-(0.992)^10 ≈ 8% of
# CI runs — and `seam_cook_decode_ktx2::cook_tagged_desktop_sprite_color_reports_
# straight_intent` hit it on macOS (aborted 7/7) 2026-06-02. 10 retries (11 tries)
# → ~0.5^11 ≈ 0.05% per test, aggregate ~0.5%. This is the ONLY effective lever:
# the crash is in vendored ctt (no code root-cause our side — see the test-group
# note). Retries are nearly free — each aborts in ~0.06s.
retries = 10
# 2026-06-20: besides the fast SIGABRT/SIGBUS crash above, the vendored ISPC can
# also HANG non-deterministically (observed: a single cook test stuck >40min with
# no abort during a ship.sh run). A hang never returns to trigger a retry, so the
# crash-retry lever above doesn't cover it. `slow-timeout` with `terminate-after`
# KILLS a stuck attempt (120s ≫ a normal cook's few seconds, even on a loaded CI
# box) so it becomes a failure the `retries` then re-attempts — extending the
# existing retry strategy to the hang mode. Scoped to asset-cooker only.
slow-timeout = { period = "60s", terminate-after = 2 }

# ── Os gates que precisam da MÁQUINA para medir o que afirmam ────────────────
#
# Um gate de RAZÃO entre um caminho serial e um paralelo não pode correr ao lado
# de trinta e um outros processos de teste: o `rayon` reporta os 32 threads e não
# tem um núcleo livre para usar, então o paralelo mede o mesmo que o serial e o
# gate reprova código correto. Medido no ship de 2026-08-08:
#
#     serial 15.243 ms · paralelo 15.441 ms · ganho 0.99x   (32 threads)
#
# ⚠️ **Isto NÃO afrouxa a barra** — a asserção fica onde estava; o que muda é que
# ela passa a ser feita com a máquina que ela precisa para ser verdadeira. E a
# mensagem do próprio gate mostra por que a cura tinha de vir para cá: ela oferece
# duas hipóteses (*"PAR_MIN alto demais? limiar invertido?"*) e nenhuma delas é a
# causa, porque o gate não pode ver o runner que o está a matar de fome.
#
# ⚠️ **A lista é MEDIDA, não adivinhada:** só entra o gate que foi visto reprovar
# sob a suíte cheia **e passar isolado** — esse par é que separa *fome de núcleo*
# de *regressão*. Um filtro largo por convenção de nome (`measure_*`) serializaria
# dezenas de sondas que não medem razão nenhuma.
#
# ⚠️ **E a lista foi enumerada com `--no-fail-fast`, o que não é detalhe:** o
# `fail-fast` revela UMA falha por corrida, então descobri-las pelo ship custa uma
# corrida de ship por gate — e cada corrida "conserta" o anterior e revela o
# seguinte, o que se lê como progresso e é uma fila. Uma passada com
# `--no-fail-fast` deu as quatro de uma vez.
#
# As quatro, com o que cada uma mede e o número que ela viu sob a suíte cheia:
#   · measure_normals_parallel_speedup ............ serial÷paralelo · 0.99x
#   · the_cost_of_sampling_a_path_is_flat_in_its_anchors · custo×âncoras
#   · the_cost_of_depth_is_linear_not_explosive .... 3.00x contra barra 2.9
#   · the_cost_of_a_gated_stroke_follows_the_footprint_not_the_canvas
#                                                   1.72x (varrer o plano daria 4x)
# ⭐ 2026-09-10 (auditoria de velocidade, docs/DevOps/AUDITORIA_VELOCIDADE_DE_DESENVOLVIMENTO_2026-09-10.md
# §4-C4): a lista passa a ser a FAMÍLIA inteira do CLAUDE.md §5.0 — todo gate que compara dois
# relógios ou conta alocações sob a suíte de fan-out. Os 23 nomes foram verificados a existir
# na árvore no dia da escrita (+ a família `flip_smooth::…::orcamento::the_fit_*` da shell, que
# reprovou 1 de 22 635 na suíte da W1 e passou 3/3 sozinha a load 12-16). Cada um corre SOZINHO (`threads-required = num-cpus`) e no FIM
# (`priority = -100`), quando a suíte esvazia: o custo é a soma deles serializados (segundos) uma
# vez por corrida, e a barra de nenhum foi tocada. Um gate novo desta espécie entra AQUI pelo
# nome — ou, melhor, nasce num ficheiro `tests/it/measure_*.rs` para entrar por `test(/^measure_/)`
# (desde W1 cada ficheiro de `tests/it/` é um MÓDULO do binário `it`, e o nome do teste leva o prefixo).
[[profile.default.overrides]]
filter = 'test(/orcamento::the_fit_/) + test(an_abandoned_march_returns_nothing_and_returns_fast) + test(apply_from_doc_is_zero_alloc_steady_state) + test(a_round_live_offset_costs_like_the_other_joins) + test(a_wet_move_costs_what_the_footprint_costs_not_what_the_canvas_costs) + test(emitter_sim_ceiling_probe) + test(interaction_dispatch_no_alloc) + test(measure_brush_kernel) + test(measure_normals_parallel_speedup) + test(only_the_lower_row_breathes_and_it_moves_with_the_playhead) + test(o_pen_down_do_filtro_e_linear_nos_vertices) + test(packing_a_dense_scribble_is_bounded) + test(the_brush_snapshot_costs_the_same_on_a_canvas_sixteen_times_bigger) + test(the_cache_makes_a_preview_frame_cost_the_tail_not_the_stroke) + test(the_cost_of_a_gated_stroke_follows_the_footprint_not_the_canvas) + test(the_cost_of_a_player_is_linear_in_their_number) + test(the_cost_of_depth_is_linear_not_explosive) + test(the_cost_of_sampling_a_path_is_flat_in_its_anchors) + test(the_mask_stroke_cost_does_not_follow_the_canvas) + test(the_quads_are_as_square_as_the_oracles) + test(the_region_refresh_is_bound_by_the_footprint_not_by_the_mesh) + test(the_shape_match_is_linear_in_the_mesh) + test(the_trusted_len_collect_allocates_once) + test(the_ui_clock_does_not_allocate_per_frame)'
threads-required = 'num-cpus'
priority = -100

# ── Tecto GLOBAL e as três regras que viviam em scripts ─────────────────────────
#
# Medido 2026-09-10 (auditoria §3.3): nos dois últimos logs completos da suíte (20 041 testes)
# NENHUM teste passa dos 60 s no `ci-test` (o máximo é 42 s, `ph2d-gridmap`), e o executor não
# tinha tecto nenhum fora do `ph2d-asset-cooker` — foi assim que dois binários órfãos queimaram
# 1 h 55 min a ~6 núcleos (handoff do esqueleto de 10/09) e uma suíte de `dev` custou 55 min.
# `period = 60s` só AVISA (SLOW); `terminate-after = 3` MATA aos 180 s e conta como falha. O Zed
# mata aos 60 s; a Oxide aos 900 s com o motivo escrito ao lado. Quem precisar de mais pede por
# `[[overrides]]` com o número medido — nunca subindo o global.
# `fail-fast = false`: a regra do CLAUDE.md §5.0 («use --no-fail-fast») vivia em dois scripts e
# uma corrida parou em 11 240 com 1 007 por correr. Aqui é o default; `--fail-fast` na linha de
# comando continua a existir para quem quiser o cancelamento.
# `junit`: o histórico por teste (tempo, flaky) que hoje só existe raspando logs.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

[profile.default.junit]
path = "junit.xml"
