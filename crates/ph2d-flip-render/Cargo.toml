[package]
name = "ph2d-flip-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Documento Flip (fonte da geometria a rasterizar).
ph2d-flip = { path = "../ph2d-flip" }
# Vec2 + math (posições, câmera ortográfica).
ph2d-core = { path = "../ph2d-core" }
# Pipeline wgpu dedicado (ADR-0114 §Decisão 5): o traço do Flip NÃO vai pela
# vello::Scene — vai por este passe wgpu, pela performance de tempo real. wgpu 28
# em lockstep com ph2d-render/ph2d-gpu.
wgpu = "28"
# Empacotamento de storage buffers (Pod/Zeroable + cast_slice), mesma convenção
# do `instance_buffer` do ph2d-render.
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
# block_on para os testes GPU headless (`--ignored`), como os testes do ph2d-gpu.
pollster = "0.4"
# SÓ testes: o e2e de T1.7 valida o seam real (stage → inject → composite → blit)
# com o `LayerCompositor` 22-modos de verdade. Em PRODUÇÃO esse reuso é
# orquestrado no shell (o compositor NÃO é dep de runtime do flip-render).
ph2d-render = { path = "../ph2d-render" }
ph2d-gpu = { path = "../ph2d-gpu" }
# O wire u8 dos 22 modos (Normal/Multiply) para montar a op-list do teste.
ph2d-painter-effects = { path = "../ph2d-painter-effects" }
# SÓ diagnóstico (`--ignored`): grava o alvo offscreen num PNG para OLHAR o pixel —
# o oráculo desta linha (BUGS #2: um gate verde pode conviver com o bug na tela).
image = { version = "0.25", default-features = false, features = ["png"] }
# O balde: o teste de ENCAIXE rasteriza a cena real (o fill que o solver devolve + a
# linha por cima) e mede o vão entre a cor e o contorno.
ph2d-flip-fill = { path = "../ph2d-flip-fill" }
