[package]
name = "ph2d-app-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# A TABELA DE TEXTOS (HR-15): o nome do clipe sai daqui.
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-macro = { path = "../ph2d-macro" }
# A declaração da família ao registo gerado (`FAMILY`).
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-timeline = { path = "../ph2d-timeline" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
# O Painter grava por esta crate; o Motion é outra família e chega pela composição (a gravadora e
# `ph2d_editor_core::macro_etapas::EtapasDaFamilia`).
ph2d-tool-painter = { path = "../ph2d-tool-painter" }
# Exportar…/Importar… (W18): o diálogo nativo, só pela porta `ph2d_app_host::modal`.
rfd = "0.17"
# O seletor de cor do pincel (a cena `PH2D_MACRO_SMOKE=7`).
ph2d-tokens = { path = "../ph2d-tokens" }
# A família «mundo» (W19): os bytes da trilha, e a corrida da física (a fita, o rapier da reprodução).
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }
# A reprodução do mundo conduz `S(t)` pelo ledger do preview (os blobs): vê-se, não entra no undo.
ph2d-preview-drive = { path = "../ph2d-preview-drive" }
# O passo fixo da física: a duração de «Simular» nas etapas do mundo.
ph2d-core = { path = "../ph2d-core" }
# O recurso embutido (a imagem importada) viaja em PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
# O encaixe vivo (a lei do «por cima», na folha das duas famílias): onde a continuação do Painter começa;
# e a `Sprite` (o registo do render no aplicar sem placa).
ph2d-sprite-screen = { path = "../ph2d-sprite-screen" }
ph2d-render = { path = "../ph2d-render" }

[features]
# ⚠️ HOWTO §2.5 — do tamanho do que ATRAVESSA: `aplicar::sem_placa` (o gate da shell que grava e abre).
test-support = []

[dev-dependencies]
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
# O gate 7: o painel de verdade, clicado.
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-anim = { path = "../ph2d-anim" }
ph2d-panel-macros = { path = "../ph2d-panel-macros" }
ph2d-panel-timeline = { path = "../ph2d-panel-timeline" }
# O clipe que vive com o objecto Macro (o undo global tira-o): `aplicar_motion`.
ph2d-timeline-persist = { path = "../ph2d-timeline-persist" }

[lints]
workspace = true
