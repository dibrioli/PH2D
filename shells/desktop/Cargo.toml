[package]
name = "ph2d-host-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ph2d-host-desktop"
path = "src/main.rs"

[dependencies]
ph2d-panel-flip = { path = "../../crates/ph2d-panel-flip" }
# A lei da máquina de estados do Morph (plano 32) — folha, partilhada com o runtime do jogo.
ph2d-morph-machine = { path = "../../crates/ph2d-morph-machine" }
# libm — HR-5 cross-OS bit-identical sincosf used in input_dispatch.rs
# + render_loop/snapshots.rs + input_dispatch/gizmo_drag.rs (T1.3.5
# workspace-wide sweep; the shell's gizmo math mirrors ph2d-ecs's
# Transform::compose and must use the same impl).
libm = { version = "=0.2.16", default-features = false }
ph2d-host = { path = "../../crates/ph2d-host" }
# ⭐ **A porta por onde uma família de módulo fala com a shell** (W2, ADR-0075). A shell é o lado
# que a IMPLEMENTA (`src/app_host.rs`); as crates `ph2d-app-*` são as que a consomem.
ph2d-app-host = { path = "../../crates/ph2d-app-host" }
# ⭐ A moldura de uma janela 3D (vistas · navball · split · gizmo), partilhada pelos DOIS
# módulos 3D. Ela saiu de `field3d_*` porque `sculpt3d_*` já a consumia em 7 ficheiros —
# ver o doc do `lib.rs` dela.
ph2d-viewport3d = { path = "../../crates/ph2d-viewport3d" }
# ⭐ **A família `field3d` — os 15 207 LOC de produto e 16 990 de teste que viviam nesta crate.**
# A shell continua a chamá-la pelo nome; a seta aponta da shell para a família, nunca ao contrário.
ph2d-app-field3d = { path = "../../crates/ph2d-app-field3d" }
ph2d-core = { path = "../../crates/ph2d-core" }
ph2d-form-donation = { path = "../../crates/ph2d-form-donation" }
ph2d-gpu = { path = "../../crates/ph2d-gpu" }
# GPU/M5 Fase 1 (ADR-0126): GPU-resident node cook (PH2D_GPU_COOK=1).
ph2d-gpu-cook = { path = "../../crates/ph2d-gpu-cook" }
ph2d-ecs = { path = "../../crates/ph2d-ecs" }
# ⭐ A lei do ABANÃO (suplente #25) — a shell soma o offset dela ao centro da vista, e é a única
# crate que vê a FAIXA do expoente (`ph2d-shake`) e os chips do painel ao mesmo tempo.
ph2d-shake = { path = "../../crates/ph2d-shake" }
# A saida de SINAIS (ADR-0143 + ADR-0075). Crate-folha, sem uma unica dependencia:
# a timeline e a fisica publicam nela, e cada consumidor le com o proprio cursor.
# A shell e' o lugar onde as duas fontes se encontram -- e isso ja estava escrito
# no doc do produtor da fisica (`bridge/signals.rs`), nao e' escolha desta linha.
ph2d-runtime = { path = "../../crates/ph2d-runtime" }
ph2d-physics-ecs = { path = "../../crates/ph2d-physics-ecs" }
# ⭐ A lei do mover de VISTA DE CIMA (TOP-20 #13) — a shell traduz os enums dela para as tags do
# painel, e a tradução tem gate de ida-e-volta nos dois sentidos.
ph2d-topdown = { path = "../../crates/ph2d-topdown" }
# A metade da família `physics` que não precisa da shell (W2/L2) — as cenas de
# smoke e as leis que só povoam um `World`. A seta aponta só nesta direcção.
ph2d-app-physics = { path = "../../crates/ph2d-app-physics" }
# ⭐ A família das INSTÂNCIAS (W2 Fase D) — receitas, cópias vivas, variantes, o
# prefab que se abre, e os quatro componentes do TOP-20. Dep directa e
# não-opcional: o `render_loop` chama-lhe os passes pelo nome, em ordem.
ph2d-app-components = { path = "../../crates/ph2d-app-components" }
# ⭐ **A árvore de tags do projecto** (TOP-20 #9) — a shell guarda a ÁRVORE VIVA no `AppGfx` e os
# BYTES dela no `ProjectState`; o formato e a cache vivem na família (`ph2d_app_components::tags_doc`).
ph2d-tags = { path = "../../crates/ph2d-tags" }
# ADR-0161 W4 — o painel de MODELAGEM 3D (nao confundir com `panel-sculpt3d`,
# que e o da escultura). Dep direta nao-opcional: o `field3d_smoke` publica o
# retrato e drena os intents dele.
ph2d-panel-model3d = { path = "../../crates/ph2d-panel-model3d" }
# The world-settings panel (ADR-0131 D8 / W2b). The shell drains its intents
# in `render_loop::physics_panel_bridge`.
ph2d-panel-physics = { path = "../../crates/ph2d-panel-physics" }
# O painel de TOKENS (plano UI/UX W6): a shell drena os intents dele e faz o
# read-back do picker, entao a dep e' direta e nao-opcional, como a de fisica.
ph2d-panel-tokens = { path = "../../crates/ph2d-panel-tokens" }
ph2d-panel-authored = { path = "../../crates/ph2d-panel-authored" }
ph2d-panel-wet-tuning = { path = "../../crates/ph2d-panel-wet-tuning" }
ph2d-render = { path = "../../crates/ph2d-render" }
# ⭐ A folha do afim `imagem-px → ecrã-px`: quatro assuntos da shell partilhavam esta lei, e duas
# famílias que partilham código partilham uma FOLHA, nunca uma delas à outra (HOWTO §1.2).
# ⭐ A folha da ranhura de pre-visualizacao: o tipo era uma struct do `app_state.rs`,
# partilhada pela remocao de fundo e pelo Painter (o doc dela ja dizia "tool-agnostic").
ph2d-preview-slot = { path = "../../crates/ph2d-preview-slot" }
ph2d-sprite-screen = { path = "../../crates/ph2d-sprite-screen" }
# ⭐ A lei de quem só move pixels — saiu desta shell em 2026-09-19 pela catraca do tecto.
ph2d-sprite-precision = { path = "../../crates/ph2d-sprite-precision" }
# ⭐ A FAMILIA Painter (W2 Fase D): as cenas de smoke, as pontes de desenho e os corpos dos
# gestos de canvas. A shell chama `ph2d_app_painter::<mod>::<fn>` no ponto certo do laco.
ph2d-app-painter = { path = "../../crates/ph2d-app-painter" }
# ADR-0166: o descritor de componente. A shell é a ÚNICA que vê os cinco registradores, e
# por isso é aqui que mora o censo de dois lados do catálogo
# (`tests/every_registered_component_is_described.rs`) — um censo dentro de qualquer crate
# sozinha seria verdadeiro por vacuidade sobre os componentes das outras.
ph2d-component-desc = { path = "../../crates/ph2d-component-desc" }
# Os PIXELS PRÓPRIOS de um sprite dentro do arquivo de projeto (plano `docs/Sprite_projeto/17`
# §3). Crate fina, ao lado da `ph2d-render` porque é a mesma matéria vista do lado do disco: ela
# é dona do `SpriteSource`, esta é dona dos bytes que o `Individual` deixava morrer com o
# processo. Consumida por `project_sprite_pixels`.
ph2d-sprite-sheet = { path = "../../crates/ph2d-sprite-sheet" }
# O leitor do `.ase`/`.aseprite` (Enio, 2026-08-23). Crate-folha PURA: bytes -> quadros RGBA8 +
# tags, sem ECS e sem GPU. A costura — empacotar a folha, subir a textura, traduzir as tags para
# `AnimationTag` — vive no `crate::ase_import`, que é o consumidor dela.
ph2d-aseprite = { path = "../../crates/ph2d-aseprite" }
# ZLIB, e só para o `ase_smoke` ESCREVER o ficheiro de demonstração — o smoke larga um `.ase` de
# verdade pela porta do produto, para não precisar do Aseprite instalado. ⚠️ Mesma crate (e mesma
# major) que o leitor usa: duas bibliotecas de zlib na árvore seriam duas respostas a *"o que é um
# fluxo comprimido"*.
# ⛔ TETO: ver `ph2d-aseprite/Cargo.toml` (duas cópias, benignas).
miniz_oxide = "0.8"
# Wave 11 color-space migration (ADR-0042 §6 #2): typed color wrappers
# (SrgbRgba) at the IO boundary. The shell casts between the existing
# Vec<u8> pixel buffers and the tools' typed signatures via
# bytemuck::cast_slice.
ph2d-color = { path = "../../crates/ph2d-color" }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
# Node-system substrate for the Motion Nodes module (docs/Motion Nodes/): the
# `MotionState` cook path (motion_state.rs + render_loop/motion_bridge.rs) cooks
# the graph per frame and lowers its stream to `RenderInstance`s via
# `ph2d-eval-motion`. (Replaced the retired PH2D_MOTION_SMOKE debug scene.)
ph2d-nodegraph = { path = "../../crates/ph2d-nodegraph" }
ph2d-node-registry = { path = "../../crates/ph2d-node-registry" }
ph2d-eval-motion = { path = "../../crates/ph2d-eval-motion" }
# Motion Nodes module (docs/Motion Nodes/): document model + full node registry.
# `MotionState` (motion_state.rs) holds the persistent `Cook`, the registry (all
# registered node ops) and the transport; `motion_bridge` cooks it per frame
# while the Motion tool is active.
ph2d-motion-doc = { path = "../../crates/ph2d-motion-doc" }
ph2d-app-motion = { path = "../../crates/ph2d-app-motion" }
ph2d-node-registry-init = { path = "../../crates/ph2d-node-registry-init" }
# doc 67: the shell reads the fx.glow node's params to drive the Motion glow pass.
ph2d-node-fx-glow = { path = "../../crates/ph2d-node-fx-glow" }
# General timeline data layer (M0): keyframe store + curves. Backs the
# app-general TimelineDoc (authoring + sampling at the engine Playhead) and the
# per-component SpriteAnimation apply path.
ph2d-anim = { path = "../../crates/ph2d-anim" }
# General-timeline runtime (M0/W1): binds ph2d-anim Clips to scene entities and
# applies them at the Playhead each frame (render_loop apply pass), and drives
# the app-general TimelineDoc via apply_from_doc. The
# `render` feature enables the sprite-opacity resolver (writes Sprite.tint[3]).
ph2d-timeline = { path = "../../crates/ph2d-timeline", features = [
    "render",
    "physics",
    "skeleton",
] }
ph2d-timeline-preview = { path = "../../crates/ph2d-timeline-preview" }
# ⭐ O MOTOR do onion da timeline — saiu da shell em 2026-09-14 (a cura nomeada do tecto
# `the_shell_only_shrinks`): ele só depende de crates irmãs, e a shell fica com a CHAMADA.
ph2d-timeline-onion = { path = "../../crates/ph2d-timeline-onion" }
# Docked timeline panel — the shell publishes its view snapshot each frame via
# `set_current_timeline` (the panel is also pulled transitively by
# panel-registry-init, but the direct dep names that publish fn).
ph2d-panel-timeline = { path = "../../crates/ph2d-panel-timeline" }
# Tool registry — convention-by-discovery infrastructure (PR 8 of
# the migration plan: `docs/Migracao/2026-05-convention-by-discovery.md`).
# `init.rs` calls `register_all()` at boot and stashes the built
# `Registry` on `AppGfx`. PR 9 will replace the `pending_X` drains
# with a registry-driven dispatcher reading from this instance.
ph2d-tool-registry = { path = "../../crates/ph2d-tool-registry" }
ph2d-tool-registry-init = { path = "../../crates/ph2d-tool-registry-init" }
# ADR-0054 W0.T6: image I/O registries populated at boot.
ph2d-imageio = { path = "../../crates/ph2d-imageio" }
ph2d-imageio-registry-init = { path = "../../crates/ph2d-imageio-registry-init" }
# Wave 10 / Etapa 1.B — generic helpers for the per-tool bridges
# (drive_source_push / drive_preview_cache / drive_pending_commit /
# drive_deactivate_cleanup over `RasterEditTool`). Each *_bridge.rs
# composes these so bridges shrink ~30-50 LOC each.
ph2d-tool-runtime = { path = "../../crates/ph2d-tool-runtime" }
# Background Removal — the shell constructs + downcasts to BgRemovalTool
# (interactive preview, eyedropper, protect-brush) and runs the full-res
# commit. Now its own crate (ADR-0040 T2); was reached via editor-core.
ph2d-tool-bgremoval = { path = "../../crates/ph2d-tool-bgremoval" }
# Painter — the layers + effects host. Shell downcasts to PainterTool for the
# layer-composite GPU preview + Apply bake (painter_bridge.rs / painter_gpu_*).
ph2d-tool-painter = { path = "../../crates/ph2d-tool-painter", features = [
    "gpu",
] }
# Layer blend modes + adjustment effects — `painter_gpu_flatten.rs` reads
# BlendMode + adjustment LUTs to drive the GPU LayerCompositor.
ph2d-painter-effects = { path = "../../crates/ph2d-painter-effects" }
# ADR-0129: o motor do envelope/warp (deformação não-afim de geometria Bézier).
ph2d-vec-envelope = { path = "../../crates/ph2d-vec-envelope" }
# ⭐⭐⭐ **O MÓDULO DO ESQUELETO** (2026-09-06) — as duas metades, e a repartição é o ponto:
# `ph2d-skeleton` é a LEI (para onde vai um ponto) e não sabe o que é um caminho, logo serve raster,
# 3D e Flip; `ph2d-skeleton-ecs` possui o osso e a pele e regista-os pela porta dela (precedente:
# `ph2d-physics-ecs`); e `ph2d-vec-skin` é o 1.º CLIENTE — a única peça que sabe que um vértice tem
# três pontos. É a mesma repartição do *Armature modifier* do Blender, que é um só e tem a
# implementação do Grease Pencil à parte porque *o que é um ponto* ali é outra coisa.
ph2d-skeleton = { path = "../../crates/ph2d-skeleton" }
# A malha de uma imagem (2.ª mídia do esqueleto) — `serde` porque ela viaja
# nos bytes opacos da `SkinBind`.
ph2d-poly2d = { path = "../../crates/ph2d-poly2d", features = ["serde"] }
ph2d-skeleton-live = { path = "../../crates/ph2d-skeleton-live" }
ph2d-image-import = { path = "../../crates/ph2d-image-import" }
ph2d-skeleton-render = { path = "../../crates/ph2d-skeleton-render" }
ph2d-skeleton-ecs = { path = "../../crates/ph2d-skeleton-ecs" }
ph2d-tool-vector = { path = "../../crates/ph2d-tool-vector" }
# Flip drawing tool (ADR-0114 W2) — the shell's `flip_bridge` downcasts it for
# the brush style + routes canvas pointer → world → `FlipDoc` stroke.
ph2d-tool-flip = { path = "../../crates/ph2d-tool-flip" }
# Make Square one-shot — the shell drain calls
# `ph2d_tool_make_square::make_square` on the selected sprite's source
# RGBA and swaps the texture (ADR-0040 T1.5: was reached via the
# editor-core facade, now the crate directly; editor-core ⊥ tools).
ph2d-tool-make-square = { path = "../../crates/ph2d-tool-make-square" }
# Trim Transparency one-shot — the shell drain calls
# `ph2d_tool_trim_transparency::trim_transparency` and crops the sprite
# (ADR-0040 T3; was reached via editor-core).
ph2d-tool-trim-transparency = { path = "../../crates/ph2d-tool-trim-transparency" }
# Real Size one-shot — the shell drain applies `real_size_scale` to the
# selected sprite's ECS Transform (see render_loop/image_edit.rs).
ph2d-tool-real-size = { path = "../../crates/ph2d-tool-real-size" }
# Padding bake — the shell drain runs `add_padding` on the selected
# sprite's source RGBA and swaps the texture (see hero_intents/image_edit.rs).
ph2d-tool-padding = { path = "../../crates/ph2d-tool-padding" }
# Color Equalization bake — the shell drain pushes each selected
# sprite's source RGBA into the active tool's preview cache and runs
# `run_full_resolution` for the bake (see render_loop/
# color_equalization_bridge.rs + hero_intents/image_edit.rs).
ph2d-tool-color-equalization = { path = "../../crates/ph2d-tool-color-equalization", features = [
    "gpu",
] }
# Equalize Sizes bake — multi-sprite size normalization. The shell drain
# collects per-sprite inputs from `hero.gizmo.iter_selected()` and runs
# `EqualizeSizesTool::run_full_resolution_multi` in one batch (see
# render_loop/equalize_sizes_bridge.rs + hero_intents/image_edit.rs).
ph2d-tool-equalize-sizes = { path = "../../crates/ph2d-tool-equalize-sizes" }
# Rasterize one-shot — bakes Transform.scale + .rotation into the
# sprite source pixels and resets Transform to identity (see
# render_loop/image_edit.rs + hero_intents/image_edit.rs).
ph2d-tool-rasterize = { path = "../../crates/ph2d-tool-rasterize" }
# Upscale bake — stateful sabor 3. The shell drain pushes each
# selected sprite's source RGBA into the active tool's preview cache
# and runs `run_full_resolution` for the bake (see render_loop/
# upscale_bridge.rs + hero_intents/image_edit.rs).
ph2d-tool-upscale = { path = "../../crates/ph2d-tool-upscale" }
# Wave 8 Phase 1 — panel registry install at boot. `register_all_panels()`
# is mandatory BEFORE the first `HeroScreen::new` (audit B1 closure:
# the previous auto-install in `HeroScreen::new` silently overrode
# `panel-*` cargo features at runtime). `default-features = false` so
# the shell's own `[features]` table drives panel selection; defaults
# below re-enable all 4 panels for the standard build.
ph2d-panel-registry-init = { path = "../../crates/ph2d-panel-registry-init", default-features = false }
# Integration demo deps:
# - ph2d-asset (M6): PNG load, blake3 ids, hot-reload watcher
# - ph2d-script (M7): Luau ScriptHost, ph2d.set/get/input bindings
# - ph2d-input (M8): gamepad/pencil device abstraction
# - ph2d-editor (M12): FloatingPanel, ZenMode, ToastQueue (data layer
#   visible via window title until Vello widget paint wires in)
# - ph2d-tokens (M12): semantic tokens for theme switching
ph2d-asset = { path = "../../crates/ph2d-asset" }
# KTX2 Fase 2 (W2.T4): the `PH2D_KTX2_SMOKE` harness cooks an RGBA8 KTX2 in
# memory via `encode_uncompressed_rgba8` so the cooked-texture loader path has
# a real artifact to render — no ISPC / committed binary fixture. Pure
# read+write codec crate, no GPU / cycle.
ph2d-asset-ktx2 = { path = "../../crates/ph2d-asset-ktx2" }
# ⭐⭐ A JUNÇÃO das duas fontes de asset (plano `docs/Components/07`, wave A1/A2) — crate FOLHA:
# vocabulário + consulta, sem ECS, sem `AssetDb`, sem UI. Quem a preenche é `asset_index_build`.
ph2d-asset-index = { path = "../../crates/ph2d-asset-index" }
ph2d-script = { path = "../../crates/ph2d-script" }
ph2d-input = { path = "../../crates/ph2d-input" }
ph2d-editor-core = { path = "../../crates/ph2d-editor-core" }
# ADR-0029 Phase C.1: direct dep on the panel-inspector crate so the
# host can publish per-frame snapshots via the typed thread-local
# setters that replace the pre-C.1 `hero.inspector.<field> = ...`
# writes. Gated by the `panel-inspector` feature alongside the
# registry-init's mirror feature.
ph2d-panel-inspector = { path = "../../crates/ph2d-panel-inspector", optional = true }
# ⭐ O NAVEGADOR DE ASSETS (plano `docs/Components/07`) — o shell publica-lhe o índice do quadro.
ph2d-panel-asset-browser = { path = "../../crates/ph2d-panel-asset-browser" }
# Audio Mixer panel (Phase 2.3c) — the render_loop bridge publishes live
# levels via `set_snapshot` + reads `master_muted` to drive the master gain.
ph2d-panel-audio-mixer = { path = "../../crates/ph2d-panel-audio-mixer", optional = true }
# Audio Editor panel (docs/Audio/, W1) — the render_loop editor bridge reads the
# transport intents + drives the preview engine + publishes position back.
ph2d-panel-audio-editor = { path = "../../crates/ph2d-panel-audio-editor", optional = true }
ph2d-panel-bgremoval = { path = "../../crates/ph2d-panel-bgremoval", optional = true }
ph2d-panel-color-equalization = { path = "../../crates/ph2d-panel-color-equalization", optional = true }
ph2d-panel-equalize-sizes = { path = "../../crates/ph2d-panel-equalize-sizes", optional = true }
ph2d-panel-upscale = { path = "../../crates/ph2d-panel-upscale", optional = true }
ph2d-panel-padding = { path = "../../crates/ph2d-panel-padding", optional = true }
# Vector Style panel (ADR-0108 cutover) — typed panel with the `vector` tool's
# Width slider + Stroke / Fill OKLCH colour swatches + Fill "None". Right-docked
# (Inspector slot takeover) while the `vector` tool is active. Shell publishes
# the snapshot via `ph2d_panel_vector::set_current_vector_style` (vector_bridge).
ph2d-panel-vector = { path = "../../crates/ph2d-panel-vector", optional = true }
ph2d-panel-skeleton = { path = "../../crates/ph2d-panel-skeleton", optional = true }
ph2d-panel-tags = { path = "../../crates/ph2d-panel-tags", optional = true }
# Painter layers panel — typed panel listing the LayerStack (thumb + name +
# visibility + opacity + blend) + adjustment-layer editors. Right-docked
# (Inspector slot takeover) when the Painter (layers + effects) tool is active.
# Gated por feature `panel-painter-layers`. Shell publica o snapshot via
# `ph2d_panel_painter_layers::set_current_layers` (painter_bridge.rs).
ph2d-panel-painter-layers = { path = "../../crates/ph2d-panel-painter-layers", optional = true }
# ADR-0029 Phase C.2: direct dep on the panel-hierarchy crate so the
# host can call `sync_from_hierarchy` / `clear_live_hierarchy` /
# `set_live_component_count` and read the panel-owned live entries
# thread-local. Gated by the `panel-hierarchy` feature alongside the
# registry-init's mirror feature.
ph2d-panel-hierarchy = { path = "../../crates/ph2d-panel-hierarchy", optional = true }
ph2d-i18n = { path = "../../crates/ph2d-i18n" }
# A MATH dos tokens (plano UI/UX W4c.3). ⚠️ A aresta e do SHELL, nunca da `ph2d-tokens`: e o
# que impede o substrato de grafo (`ph2d-expr` -> `ph2d-nodegraph`) de chegar a 44 widgets.
ph2d-token-math = { path = "../../crates/ph2d-token-math" }
ph2d-tokens = { path = "../../crates/ph2d-tokens" }
# O CODEC DTCG (plano UI/UX W9) — o interop da tabela de tokens. ⚠️ A aresta e do SHELL pelo mesmo
# motivo da math acima: a `ph2d-tokens` declara zero deps de runtime, e um parser de JSON no
# caminho de compilacao de 44 widgets seria a aresta ao contrario. A shell e a unica que tem o
# dialogo nativo, entao ela e' tambem o unico chamador possivel.
ph2d-tokens-dtcg = { path = "../../crates/ph2d-tokens-dtcg" }
# M11 widget paint pass — Vello scene encoder + parley text contexts.
# Editor's `Paint` trait lowers widgets into a `VectorScene` that the
# render crate's `VelloPass` then composites onto the surface.
ph2d-vector = { path = "../../crates/ph2d-vector" }
# ADR-0108 Fase 0: pipeline vetorial NOVA (modelo editor-first `ph2d-vec-scene`
# + render `ph2d-vec-render` sobre o VectorScene fundacional). Aditiva — coexiste
# com o sistema de edição antigo até o cutover (Fase R).
ph2d-vec-scene = { path = "../../crates/ph2d-vec-scene" }
# ⭐ A metade-shell da família `vec`, extraída em W2/L4 — a shell chama-a, ela nunca chama a shell.
ph2d-app-vec = { path = "../../crates/ph2d-app-vec" }
ph2d-system-fonts = { path = "../../crates/ph2d-system-fonts" }
ph2d-vec-text = { path = "../../crates/ph2d-vec-text" }
# A lei de LADRILHO do Texture Pattern (plano 33): o `texture_pattern_live` assa a arte no
# reticulado pedido antes de a entregar ao render. Folha ZERO-dep.
ph2d-vec-pattern = { path = "../../crates/ph2d-vec-pattern" }
ph2d-vec-render = { path = "../../crates/ph2d-vec-render" }
# ⭐ A ARTE VIVA do vetor (W2 Fase C): o ladrilho do padrão e a arte do pincel saíram da shell
# porque `632` linhas delas prendiam `99 845` da família `motion` — o `motion_object_bake` chama o
# `brush::resolve` dentro de um laço. ⚠️ O TIPO vive lá; o CAMPO fica na `App`.
ph2d-vec-art-live = { path = "../../crates/ph2d-vec-art-live" }
# ⭐ A outra folha que a `motion` destrancou (W2 Fase C): a sonda do drift de pan. ⚠️ A irmã dela,
# a redução a miniatura (`ph2d-thumbnail`), SAIU daqui em 2026-09-13: o último leitor na shell eram
# as leis dos assets, que se mudaram para `ph2d-app-components` (o `cargo machete` acusou-a).
ph2d-pan-diag = { path = "../../crates/ph2d-pan-diag" }
# ADR-0108 Fase 1.1: máquinas de edição interativa (Pen agora) sobre a cena nova.
ph2d-vec-edit = { path = "../../crates/ph2d-vec-edit" }
# ⭐ O BALDE (plano 40) — a rede de arcos e a face que o clique aponta. Crate-folha: ela não sabe o
# que é uma cena, uma pose ou um ponteiro.
ph2d-vec-fill = { path = "../../crates/ph2d-vec-fill" }
ph2d-guides = { path = "../../crates/ph2d-guides" }
# Os ESTADOS de UI + o Smart Animate (plano UI/UX W7).
ph2d-ui-state = { path = "../../crates/ph2d-ui-state" }
# O CODEGEN DE PAINEL (plano UI/UX W8b): a arvore autorada descreve um painel, e a shell e quem
# a LE (ela e' a unica que ve o ECS e o documento). O gerador nao ve nenhum dos dois.
ph2d-ui-codegen = { path = "../../crates/ph2d-ui-codegen" }
# O motor de AUTO LAYOUT (ADR-0153): a crate-folha que confina o `taffy`. A shell monta a árvore a
# partir do ECS e consome retângulos — o motor não conhece ECS, documento nem tema.
ph2d-vec-layout = { path = "../../crates/ph2d-vec-layout" }
# ADR-0108 Fase 1: booleanas edit-time (union/intersect/subtract via linesweeper).
ph2d-vec-boolean = { path = "../../crates/ph2d-vec-boolean" }
# ADR-0114: documento do Flip (animação quadro-a-quadro). W0 = dados + ponte ECS
# (flip_entities) + undo/save; render e tool vêm nas waves seguintes.
# ⭐ A metade de APLICAÇÃO do Flip (W2/L5): as leis do editor que não precisam da shell.
# ⛔ A dependência é de sentido ÚNICO — a crate nunca vê a `App`, senão é ciclo.
ph2d-app-flip = { path = "../../crates/ph2d-app-flip" }
ph2d-flip-entities = { path = "../../crates/ph2d-flip-entities" }
ph2d-flip = { path = "../../crates/ph2d-flip" }
# ADR-0114 W1: pipeline wgpu dedicado do traço do Flip (passe no present.rs).
ph2d-flip-render = { path = "../../crates/ph2d-flip-render" }
ph2d-field = { path = "../../crates/ph2d-field" }
# ADR-0161 — a ponte ECS: e ela que faz um objeto de campo ser salvo e desfeito.
ph2d-field-ecs = { path = "../../crates/ph2d-field-ecs" }
# ADR-0150 — a malha residente e o passe wgpu dela. `optional`: e o que torna a
# feature `sculpt3d` uma promessa de remocao verificavel, e nao uma opiniao.
ph2d-mesh = { path = "../../crates/ph2d-mesh", optional = true }
ph2d-mesh-render = { path = "../../crates/ph2d-mesh-render", optional = true }
# O rig de luz do artista, para a cena 3D acender pelas MESMAS lampadas da tinta.
# ⚠️ NAO e `optional`: `ph2d-light` e a unica peca nao-removivel do modulo 3D
# (docs/3D/02.3) e ja chega aqui pelo Painter de qualquer jeito -- marca-la de
# opcional afirmaria uma removibilidade que ela nao tem.
ph2d-light = { path = "../../crates/ph2d-light" }
# A familia `sculpt3d` a sair da shell (W2/L3): por agora as reguas do gesto e o estado de
# PEDIDO que a `App` guardava solto. Tem ZERO dependencias.
# ⛔⛔ NAO e' `optional`, e a excepcao e' DELIBERADA -- ela e' a unica crate do modulo que nao
# ⚠️⚠️ **NÃO-OPCIONAL, como as outras CINCO famílias — e a razão que a prendia aqui DISSOLVEU-SE,
# sem que a conclusão mudasse.** Ela foi nao-opcional a Fase A inteira porque o
# `Sculpt3dRequests::doc` era um passa-adiante que um binario sem a feature tem de carregar; e a
# mesma nota dizia, uma linha abaixo, *«e' tambem por isso que ela nao pode ganhar dependencias:
# quem nunca esculpe paga-as»*. A Fase B deu-lhe vinte e oito. ⇒ o passa-adiante voltou a ser um
# `Vec<u8>` na `App` (`App::sculpt_doc`), que e' onde esteve ate' a Fase A — *a cerca era sobre o
# DOCUMENTO, nunca sobre a crate*.
#
# ⛔⛔ **E torna-la `optional` foi CONSTRUIDO, MEDIDO e REVERTIDO no mesmo dia (W2/L3-B):** ele
# nao compra nada na arvore de dependencias, porque o `ph2d-app-registry-init` declara as SEIS
# familias `optional` e liga-as TODAS no `default`, por decisao escrita (*«uma familia fora do
# default … o gate e o CI deixariam de a compilar em silencio»*). Com a crate opcional na shell,
# o registo continua a puxa-la — e a `ph2d-panel-sculpt3d` tambem. *Uma sonda de `cargo tree` nao
# distingue os dois casos, e foi ela que quase me fez landar o desvio.*
# ⇒ a promessa de removibilidade do `docs/3D/02.3` mede-se por **onde o codigo mora**, e o gate
# que a mede (`a_baked_object_outlives_the_3d_module`) diz isso de si mesmo, no cabecalho.
ph2d-app-sculpt3d = { path = "../../crates/ph2d-app-sculpt3d" }
ph2d-sculpt3d = { path = "../../crates/ph2d-sculpt3d", optional = true }
# O voxel remesh (W7). `optional` pelo mesmo motivo dos outros tres: e a
# quarta crate do modulo, e a promessa de removibilidade so e verificavel se
# todas elas caírem com a feature.
ph2d-sdf = { path = "../../crates/ph2d-sdf", optional = true }

# Texto vetorial (W1): glyph outlines (skrifa) → VecPath do motor novo. O crate é
# foundational mas está FORA do gate congelado (que só escaneia -doc/-traits).
ph2d-vector-font = { path = "../../crates/ph2d-vector-font" }
ph2d-text = { path = "../../crates/ph2d-text" }
# bevy_ecs is required as a direct dep so `#[derive(Component)]` can
# resolve its `::bevy_ecs::*` absolute paths. The shell is the
# application layer and is the only place we tolerate this leak.
bevy_ecs = "0.19"
# image: shell uses for procedural-PNG-fixture generation at first
# launch (so M6 has real files to consume). Same dep ph2d-asset
# pulls — workspace Cargo.lock unifies version.
image = { version = "0.25", default-features = false, features = ["png"] }
# postcard: serialize Transform (and future component blobs) for the
# editor command pipeline (M14.A). Pushed as `EditorCommand::SetComponent
# { data: Vec<u8> }` and decoded by `apply_editor_commands` via the
# `ComponentRegistry` registered at boot.
postcard = { version = "1", features = ["alloc"] }
# serde: the `Serialize` bound on the §7 ordering-edit `queue_set` helper
# (postcard-encodes optional sorting components). Already in the lockfile
# transitively; declaring it direct just names the trait.
# ⚠️ `rc` = a serde escreve um `Arc<T>` como o próprio `T`. É isso que deixa o `ProjectState`
# PARTILHAR a cena vetorial entre passos de undo sem mover um byte do formato — o mesmo argumento
# que o `WorldSnapshot` já fez com `Arc` por linha (ADR-0164 F2).
serde = { version = "1", features = ["rc"] }
wgpu = "29.0.4"
winit = "0.30"
gilrs = "0.11"
# Phase 2.1 audio wiring. `cpal` owns the OS output device (HR-1: the platform
# backend lives in the shell, never in `ph2d-audio`); the core `AudioRenderer`
# fills the callback buffer. cpal on Linux uses ALSA (`alsa-lib`).
ph2d-audio = { path = "../../crates/ph2d-audio" }
# Audio Editor (docs/Audio/, W1) — offline EditClip (peak cache) + WAV export.
# Optional, pulled in only by the `panel-audio-editor` feature.
ph2d-audio-edit = { path = "../../crates/ph2d-audio-edit", optional = true }
ph2d-audio-encode = { path = "../../crates/ph2d-audio-encode", optional = true }
# arboard: system clipboard read/write for the Cmd+C/V/X handlers in
# ph2d-editor's dispatch. Constructed once at startup; pasted text is
# fed back to the store via `apply_clipboard_paste`.
arboard = "3"
# bumpalo: per-frame arena for HeroScreen interaction events
# (ADR-0024). Allocated once at AppGfx construction; reset every
# frame after dispatch.
bumpalo = "3"
# rfd: native file picker (M14.4c "Import…" button + future Save As).
# Cross-platform (macOS / Windows / Linux); modal `pick_files()`
# blocks the main thread for the duration of the dialog — acceptable
# for a user-initiated import flow.
# ⭐ 0.17: a 0.17.0 trocou o backend XDG-portal de `ashpd`(zbus) por `libdbus` via
# `dlopen` ⇒ **41 pacotes saem do grafo** (o `zbus` inteiro). Zero mudanca de codigo:
# as 8 assinaturas que usamos sao identicas entre 0.15.4 e 0.17.2.
# ⛔ TETO: e' ELE que prende o `pollster` em `^0.4` (confirmado no `Cargo.toml` da
# 0.17.2, sob a feature `xdg-portal`, que esta' no default). O `pollster 1.0` existe
# e nao e' alcancavel enquanto o rfd nao passar de 0.4.
# ⚠️ O transporte D-Bus passa a ser uma `.so` do sistema aberta em runtime; o
# fallback para o `zenity` cobre tambem "libdbus ausente", sem panico.
rfd = "0.17"

# ═══ AS FOLHAS PARTILHADAS (line/shell-folhas, 12/09) ═══
