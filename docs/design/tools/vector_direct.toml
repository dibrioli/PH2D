# Vector Direct Select — Stateful tool, vertex/tangent editing (plan T2.3).
# Grabs a vertex or cubic handle of a committed network and drags it via
# event-sourced MoveVertex/MoveTangent ops (replay-safe → T2.5 Undo).
# Alt-drag breaks a smooth tangent. Shares VectorSelection with
# vector_select.
#
# Cluster `vector_tools`. Canonical source for
# `crates/ph2d-tool-vector-direct/src/lib.rs`.

[tool]
id          = "vector_direct"
cluster     = "vector_tools"
zone        = "top_right"
order       = 50
a11y_role   = "Button"
icon_slug   = "vector-direct"
touches_sim = false

[label]
pt_br_inline = "Seleção Direta"
en_us_inline = "Direct Select"
fluent_key   = "tool.vector_direct.label"

[memory_budget]
vram_mb        = 0
ram_mb         = 1
heap_script_mb = 0
