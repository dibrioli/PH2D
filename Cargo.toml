[workspace]
resolver = "3"
members = [
    "crates/ph2d-core",
    "crates/ph2d-host",
    "crates/ph2d-ecs",
    "crates/ph2d-gpu",
    "crates/ph2d-render",
    "crates/ph2d-vector",
    "crates/ph2d-text",
    "crates/ph2d-sdf",
    "crates/ph2d-light",
    "crates/ph2d-physics",
    "crates/ph2d-physics-soft",
    "crates/ph2d-fluids",
    "crates/ph2d-audio",
    "crates/ph2d-asset",
    "crates/ph2d-script",
    "crates/ph2d-net",
    "crates/ph2d-input",
    "crates/ph2d-editor",
    "crates/ph2d-mcp",
    "crates/ph2d-i18n",
    "crates/ph2d-a11y",
    "crates/ph2d-save",
    "crates/ph2d-telemetry",
    "tests/spike",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "LicenseRef-Proprietary"
authors = ["Enio Oliveira Dias Brito <dibrioli@gmail.com>"]

[profile.dev]
opt-level = 0
# `line-tables-only` keeps panic backtraces with file:line but skips
# variable type info — ~30% smaller artifacts, faster link, lighter
# CI cache. Re-enable full `debug = true` locally if you need LLDB
# variable inspection (per-package override or `cargo --config`).
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

# Used by CI for tests + spike correctness fixtures. Runs at -O3 like
# release (so test asserts on perf-sensitive code are realistic) but
# without LTO + with parallel codegen, saving 30-60s per build vs
# `--release`. Real benchmarks (criterion) still use `--release` for
# fidelity.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"

[profile.bench]
inherits = "release"
debug = true
