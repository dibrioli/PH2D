[package]
name = "ph2d-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# parley — Linebender's text-layout engine. Wraps harfrust (HarfBuzz
# rewrite in Rust) for shaping and skrifa for font handling. Currently
# 0.x; same alpha-risk note as Vello (M11 plan).
parley = "0.11.1"
# ph2d-tokens — TextRendering enum + crisp_weight_boost (Crisp Text
# Rendering Phase 0). Used by `layout_for_rendering` to bump nominal
# FontWeight at small sizes when the rendering strategy is Crisp.
ph2d-tokens = { path = "../ph2d-tokens" }
# read-fonts — lê o directório de tabelas para tirar o `prep` inerte das fontes embutidas
# (`bundled::without_prep_table`). Já no grafo (skrifa 0.44 → read-fonts 0.41.0).
read-fonts = "0.41.0"

[lints]
workspace = true
