[package]
name = "ph2d-field-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐⭐⭐ O campo implícito NO DISPOSITIVO — a fita do documento gerada em WGSL e compilada uma vez
# por ESTRUTURA. Ver `docs/Render3d/05` §33 para os números que escolheram esta rota (a mesma peça:
# `1 998 ms` na CPU contra `5,00 ms` aqui).
#
# ⛔ Ela é a IRMÃ do `ph2d-field-render`, nunca um substituto: aquele é a referência de CPU contra
# a qual esta se mede (*dois motores, uma lei* — o molde do Flip e do pincel de tecido).
[dependencies]
ph2d-bloom = { path = "../ph2d-bloom" }
ph2d-field      = { path = "../ph2d-field" }
ph2d-field-eval = { path = "../ph2d-field-eval" }
# ⛔ A direcção é esta e nunca a contrária: o `ph2d-field-render` recusa o `wgpu` por escrito, e é
# ele a REFERÊNCIA de CPU contra a qual esta se mede.
ph2d-field-render = { path = "../ph2d-field-render" }
ph2d-material = { path = "../ph2d-material" }
# ⭐ O pintor aplica o OLHAR no dispositivo, e a lei dele vive aqui — ver `paint.rs`.
ph2d-view-transform = { path = "../ph2d-view-transform" }
ph2d-style = { path = "../ph2d-style" }
# ⭐ A curva sRGB da descida a 8 bits: o fundo da borda entra na media em LINEAR.
ph2d-color = { path = "../ph2d-color" }
wgpu = { version = "29.0.4", features = ["wgsl"] }
pollster = "0.4.0"


[lints]
workspace = true

[dev-dependencies]
# ⭐⭐⭐ **naga (o mesmo major do wgpu 29) — para o shader do BRILHO ser PARSADO e VALIDADO em
# `cargo test`.** O texto dele é montado em tempo de execução a partir de TRÊS fontes (a lei da
# `ph2d-bloom`, a porta desta crate e as entradas), logo um erro de sintaxe só aparece quando o
# pipeline é construído — ou seja, **na primeira vez que o artista liga o Bloom**, com a tela a não
# mudar e uma mensagem no terminal. ⚠️ É o mesmo gate que o `bloom.wgsl` do `ph2d-render` já tem.
naga = { version = "29.0.4", features = ["wgsl-in"] }
