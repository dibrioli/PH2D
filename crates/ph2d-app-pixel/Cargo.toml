[package]
name = "ph2d-app-pixel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# A família Pixel Art (ADR-0196): o objecto Pixel Sprite (Add, modo Edit), as ferramentas internas
# (lápis, borracha, conta-gotas), o desfazer de cada sprite, a vista e o blob do projecto.
# ⛔ Nunca `ph2d-app-painter` nem o contrato `Tool=12`: as ferramentas são da família.
[dependencies]
ph2d-pixel-core = { path = "../ph2d-pixel-core" }
ph2d-pixel-render = { path = "../ph2d-pixel-render" }
# Load/Save Palette (os formatos de ficheiro de paleta).
ph2d-pixel-io = { path = "../ph2d-pixel-io" }
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-component-desc = { path = "../ph2d-component-desc" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-host = { path = "../ph2d-host" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-render = { path = "../ph2d-render" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-unique-name = { path = "../ph2d-unique-name" }
ph2d-vector = { path = "../ph2d-vector" }
# As formas do Vector no Pixel (P6b): o `cook` do catálogo — a mesma porta do editor vetorial.
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# A forma VIVA (P6d): a LEI das alças do Vector (só as funções puras de `shape_handles`, nunca o
# `Tool`) e a pintura delas.
ph2d-tool-vector = { path = "../ph2d-tool-vector" }
ph2d-vec-render = { path = "../ph2d-vec-render" }
# A etiqueta do arrasto da forma viva (P6f): a ficha da casa (`ph2d_editor_core::readout`) mede o texto.
ph2d-text = { path = "../ph2d-text" }
winit = "0.30"
# O diálogo de ficheiro do Load/Save Palette (pela porta `ph2d_app_host::modal`).
rfd = "0.17"

[lints]
workspace = true
