[package]
name = "ph2d-host-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ph2d-host-desktop"
path = "src/main.rs"

[dependencies]
# libm — HR-5 cross-OS bit-identical sincosf used in input_dispatch.rs
# + render_loop/snapshots.rs + input_dispatch/gizmo_drag.rs (T1.3.5
# workspace-wide sweep; the shell's gizmo math mirrors ph2d-ecs's
# Transform::compose and must use the same impl).
libm = { version = "=0.2.16", default-features = false }
ph2d-host = { path = "../../crates/ph2d-host" }
ph2d-core = { path = "../../crates/ph2d-core" }
ph2d-gpu = { path = "../../crates/ph2d-gpu" }
# O carimbo de pigmento no device (doc 33). A ponte e' do shell: o tool publica dado simples e
# `wgpu` nunca entra na `ph2d-tool-painter`.
ph2d-paint-gpu = { path = "../../crates/ph2d-paint-gpu" }
# GPU/M5 Fase 1 (ADR-0126): GPU-resident node cook (PH2D_GPU_COOK=1).
ph2d-gpu-cook = { path = "../../crates/ph2d-gpu-cook" }
ph2d-ecs = { path = "../../crates/ph2d-ecs" }
# A saida de SINAIS (ADR-0143 + ADR-0075). Crate-folha, sem uma unica dependencia:
# a timeline e a fisica publicam nela, e cada consumidor le com o proprio cursor.
# A shell e' o lugar onde as duas fontes se encontram -- e isso ja estava escrito
# no doc do produtor da fisica (`bridge/signals.rs`), nao e' escolha desta linha.
ph2d-runtime = { path = "../../crates/ph2d-runtime" }
ph2d-physics-ecs = { path = "../../crates/ph2d-physics-ecs" }
# The world-settings panel (ADR-0131 D8 / W2b). The shell drains its intents
# in `render_loop::physics_panel_bridge`.
ph2d-panel-physics = { path = "../../crates/ph2d-panel-physics" }
# O painel de TOKENS (plano UI/UX W6): a shell drena os intents dele e faz o
# read-back do picker, entao a dep e' direta e nao-opcional, como a de fisica.
ph2d-panel-tokens = { path = "../../crates/ph2d-panel-tokens" }
ph2d-panel-authored = { path = "../../crates/ph2d-panel-authored" }
ph2d-panel-sculpt3d = { path = "../../crates/ph2d-panel-sculpt3d" }
ph2d-panel-wet-tuning = { path = "../../crates/ph2d-panel-wet-tuning" }
ph2d-render = { path = "../../crates/ph2d-render" }
# Os PIXELS PRÓPRIOS de um sprite dentro do arquivo de projeto (plano `docs/Sprite_projeto/17`
# §3). Crate fina, ao lado da `ph2d-render` porque é a mesma matéria vista do lado do disco: ela
# é dona do `SpriteSource`, esta é dona dos bytes que o `Individual` deixava morrer com o
# processo. Consumida por `project_sprite_pixels`.
ph2d-sprite-sheet = { path = "../../crates/ph2d-sprite-sheet" }
# Wave 11 color-space migration (ADR-0042 §6 #2): typed color wrappers
# (SrgbRgba) at the IO boundary. The shell casts between the existing
# Vec<u8> pixel buffers and the tools' typed signatures via
# bytemuck::cast_slice.
ph2d-color = { path = "../../crates/ph2d-color" }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
# Node-system substrate for the Motion Nodes module (docs/Motion Nodes/): the
# `MotionState` cook path (motion_state.rs + render_loop/motion_bridge.rs) cooks
# the graph per frame and lowers its stream to `RenderInstance`s via
# `ph2d-eval-motion`. (Replaced the retired PH2D_MOTION_SMOKE debug scene.)
ph2d-nodegraph = { path = "../../crates/ph2d-nodegraph" }
# A cena `=58` desenha a curva do relogio pela MESMA porta que o editor autora --
# um segundo serializador divergiria do que o painel escreve no documento.
ph2d-curve = { path = "../../crates/ph2d-curve" }
ph2d-node-registry = { path = "../../crates/ph2d-node-registry" }
ph2d-eval-motion = { path = "../../crates/ph2d-eval-motion" }
# ADR-0155: the setup diagnoser — the shell runs `diagnose` after a constructive
# gesture and heals an inert force chain through the integrator it forgot.
ph2d-motion-diagnose = { path = "../../crates/ph2d-motion-diagnose" }
# ADR-0154: `source.shape` — the shell builds each shape's `VecPath` from the
# node's params (`ShapeParams::read`) under its content key (`shape_key`) and
# publishes it into the cook, then draws it live (GPU vector, not a baked tile).
ph2d-node-motion-shape = { path = "../../crates/ph2d-node-motion-shape" }
# Motion Nodes module (docs/Motion Nodes/): document model + full node registry.
# `MotionState` (motion_state.rs) holds the persistent `Cook`, the registry (all
# registered node ops) and the transport; `motion_bridge` cooks it per frame
# while the Motion tool is active.
ph2d-motion-doc = { path = "../../crates/ph2d-motion-doc" }
ph2d-node-registry-init = { path = "../../crates/ph2d-node-registry-init" }
# The reroute node types the wire-splice gesture inserts (doc 45): the shell picks the one
# that fits the wire, so it must name them.
ph2d-node-util-reroute = { path = "../../crates/ph2d-node-util-reroute" }
# doc 67: the shell reads the fx.glow node's params to drive the Motion glow pass.
ph2d-node-fx-glow = { path = "../../crates/ph2d-node-fx-glow" }
# Time scopes (M2.N1): the substrate keys scopes by NodeId and knows no node
# types, so the shell asks the node crate that OWNS the semantic to translate
# `motion.time_remap` params into `TimeMap`s before each cook (and to refuse a
# wire that would drag a sequential node under a rewritten clock).
ph2d-node-motion-time-remap = { path = "../../crates/ph2d-node-motion-time-remap" }
# A porta `fired_rows`/`NAME_KEY` do `pulse.signal` — a soleira do disparo e a chave do
# nome moram no NÓ, e a ponte pergunta em vez de re-derivar (o precedente do time-remap).
ph2d-node-pulse-signal = { path = "../../crates/ph2d-node-pulse-signal" }# A fonte de objeto, para a MEMBRANA. Aqui a dep não é de gate: o shell tem de
# varrer o documento atrás dos `time_offset` que os `source.object` pedem, e o
# nome do tipo + o nome do param são do nó. Um literal `"source.object"` na
# membrana seria a segunda cópia de uma string que o nó já declara, e o dia em
# que uma delas mudasse a varredura ficaria VAZIA — em silêncio, com a cena
# desenhando o quadro atual e nada reclamando.
ph2d-node-source-object = { path = "../../crates/ph2d-node-source-object" }
# doc 89 folha 14: a membrana do `source.text` autora os params pelo NOME que o nó
# declara (o manifesto, a chave, o pivô) — um literal aqui seria uma segunda cópia
# de números que o nó já é dono.
ph2d-node-source-text = { path = "../../crates/ph2d-node-source-text" }
# `value.attribute`, para a CENA da DIREÇÃO (`PH2D_GPU_COOK_DEMO=38`): ela autora o
# `mode` do canal, e um LITERAL aqui seria a segunda cópia de um número que o nó
# declara — no dia em que o degrau se movesse, a cena desenharia traços NÃO-alinhados
# afirmando demonstrar alinhamento. Aresta interna de path, nenhum pacote novo.
ph2d-node-value-attribute = { path = "../../crates/ph2d-node-value-attribute" }
# Pelo MESMO motivo, um grupo adiante: a cena `=44` autora a TABELA do
# `value.pattern` por TEXT PARAM, e a chave dela é do NÓ. Um literal `"table"`
# aqui seria a segunda cópia de uma string que o nó já declara, e no dia em que
# ela mudasse a cena semearia uma chave que ninguém lê — desenhando o caminho
# LEGADO enquanto anuncia a tabela. Aresta interna de path, nenhum pacote novo.
ph2d-node-value-pattern = { path = "../../crates/ph2d-node-value-pattern" }
# General timeline data layer (M0): keyframe store + curves. Backs the
# app-general TimelineDoc (authoring + sampling at the engine Playhead) and the
# per-component SpriteAnimation apply path.
ph2d-anim = { path = "../../crates/ph2d-anim" }
# General-timeline runtime (M0/W1): binds ph2d-anim Clips to scene entities and
# applies them at the Playhead each frame (render_loop apply pass), and drives
# the app-general TimelineDoc via apply_from_doc. The
# `render` feature enables the sprite-opacity resolver (writes Sprite.tint[3]).
ph2d-timeline = { path = "../../crates/ph2d-timeline", features = ["render", "physics"] }
# Docked timeline panel — the shell publishes its view snapshot each frame via
# `set_current_timeline` (the panel is also pulled transitively by
# panel-registry-init, but the direct dep names that publish fn).
ph2d-panel-timeline = { path = "../../crates/ph2d-panel-timeline" }
# Tool registry — convention-by-discovery infrastructure (PR 8 of
# the migration plan: `docs/Migracao/2026-05-convention-by-discovery.md`).
# `init.rs` calls `register_all()` at boot and stashes the built
# `Registry` on `AppGfx`. PR 9 will replace the `pending_X` drains
# with a registry-driven dispatcher reading from this instance.
ph2d-tool-registry = { path = "../../crates/ph2d-tool-registry" }
ph2d-tool-registry-init = { path = "../../crates/ph2d-tool-registry-init" }
# ADR-0054 W0.T6: image I/O registries populated at boot.
ph2d-imageio = { path = "../../crates/ph2d-imageio" }
ph2d-imageio-registry-init = { path = "../../crates/ph2d-imageio-registry-init" }
# Wave 10 / Etapa 1.B — generic helpers for the per-tool bridges
# (drive_source_push / drive_preview_cache / drive_pending_commit /
# drive_deactivate_cleanup over `RasterEditTool`). Each *_bridge.rs
# composes these so bridges shrink ~30-50 LOC each.
ph2d-tool-runtime = { path = "../../crates/ph2d-tool-runtime" }
# Background Removal — the shell constructs + downcasts to BgRemovalTool
# (interactive preview, eyedropper, protect-brush) and runs the full-res
# commit. Now its own crate (ADR-0040 T2); was reached via editor-core.
ph2d-tool-bgremoval = { path = "../../crates/ph2d-tool-bgremoval" }
# Painter — the layers + effects host. Shell downcasts to PainterTool for the
# layer-composite GPU preview + Apply bake (painter_bridge.rs / painter_gpu_*).
ph2d-tool-painter = { path = "../../crates/ph2d-tool-painter", features = [
    "gpu",
] }
# Layer blend modes + adjustment effects — `painter_gpu_flatten.rs` reads
# BlendMode + adjustment LUTs to drive the GPU LayerCompositor.
ph2d-painter-effects = { path = "../../crates/ph2d-painter-effects" }
# Vector — the single first-class Vector drawing tool (ADR-0108 cutover).
# Shell downcasts to VectorTool for its Style config (stroke/fill/width) and
# routes the pointer to the shell-held Pen over `AppGfx.vec_scene`
# (vector_bridge.rs). Replaces the retired Pen/Pencil/Shape/Select/Direct tools.
ph2d-vec-blend = { path = "../../crates/ph2d-vec-blend" }
# ADR-0129: o motor do envelope/warp (deformação não-afim de geometria Bézier).
ph2d-vec-envelope = { path = "../../crates/ph2d-vec-envelope" }
ph2d-tool-vector = { path = "../../crates/ph2d-tool-vector" }
# O estabilizador do lápis (`lazy_mouse_step`) — a MESMA função que o pincel do Painter usa.
# ⚠️ Aresta de custo ZERO, medido: a crate já vem transitivamente pela `ph2d-tool-painter`.
ph2d-painter-brush = { path = "../../crates/ph2d-painter-brush" }
# Flip drawing tool (ADR-0114 W2) — the shell's `flip_bridge` downcasts it for
# the brush style + routes canvas pointer → world → `FlipDoc` stroke.
ph2d-tool-flip = { path = "../../crates/ph2d-tool-flip" }
# Make Square one-shot — the shell drain calls
# `ph2d_tool_make_square::make_square` on the selected sprite's source
# RGBA and swaps the texture (ADR-0040 T1.5: was reached via the
# editor-core facade, now the crate directly; editor-core ⊥ tools).
ph2d-tool-make-square = { path = "../../crates/ph2d-tool-make-square" }
# Trim Transparency one-shot — the shell drain calls
# `ph2d_tool_trim_transparency::trim_transparency` and crops the sprite
# (ADR-0040 T3; was reached via editor-core).
ph2d-tool-trim-transparency = { path = "../../crates/ph2d-tool-trim-transparency" }
# Real Size one-shot — the shell drain applies `real_size_scale` to the
# selected sprite's ECS Transform (see render_loop/image_edit.rs).
ph2d-tool-real-size = { path = "../../crates/ph2d-tool-real-size" }
# Padding bake — the shell drain runs `add_padding` on the selected
# sprite's source RGBA and swaps the texture (see hero_intents/image_edit.rs).
ph2d-tool-padding = { path = "../../crates/ph2d-tool-padding" }
# Color Equalization bake — the shell drain pushes each selected
# sprite's source RGBA into the active tool's preview cache and runs
# `run_full_resolution` for the bake (see render_loop/
# color_equalization_bridge.rs + hero_intents/image_edit.rs).
ph2d-tool-color-equalization = { path = "../../crates/ph2d-tool-color-equalization", features = [
    "gpu",
] }
# Equalize Sizes bake — multi-sprite size normalization. The shell drain
# collects per-sprite inputs from `hero.gizmo.iter_selected()` and runs
# `EqualizeSizesTool::run_full_resolution_multi` in one batch (see
# render_loop/equalize_sizes_bridge.rs + hero_intents/image_edit.rs).
ph2d-tool-equalize-sizes = { path = "../../crates/ph2d-tool-equalize-sizes" }
# Rasterize one-shot — bakes Transform.scale + .rotation into the
# sprite source pixels and resets Transform to identity (see
# render_loop/image_edit.rs + hero_intents/image_edit.rs).
ph2d-tool-rasterize = { path = "../../crates/ph2d-tool-rasterize" }
# Upscale bake — stateful sabor 3. The shell drain pushes each
# selected sprite's source RGBA into the active tool's preview cache
# and runs `run_full_resolution` for the bake (see render_loop/
# upscale_bridge.rs + hero_intents/image_edit.rs).
ph2d-tool-upscale = { path = "../../crates/ph2d-tool-upscale" }
# Wave 8 Phase 1 — panel registry install at boot. `register_all_panels()`
# is mandatory BEFORE the first `HeroScreen::new` (audit B1 closure:
# the previous auto-install in `HeroScreen::new` silently overrode
# `panel-*` cargo features at runtime). `default-features = false` so
# the shell's own `[features]` table drives panel selection; defaults
# below re-enable all 4 panels for the standard build.
ph2d-panel-registry-init = { path = "../../crates/ph2d-panel-registry-init", default-features = false }
# Integration demo deps:
# - ph2d-asset (M6): PNG load, blake3 ids, hot-reload watcher
# - ph2d-script (M7): Luau ScriptHost, ph2d.set/get/input bindings
# - ph2d-input (M8): gamepad/pencil device abstraction
# - ph2d-editor (M12): FloatingPanel, ZenMode, ToastQueue (data layer
#   visible via window title until Vello widget paint wires in)
# - ph2d-tokens (M12): semantic tokens for theme switching
ph2d-asset = { path = "../../crates/ph2d-asset" }
# KTX2 Fase 2 (W2.T4): the `PH2D_KTX2_SMOKE` harness cooks an RGBA8 KTX2 in
# memory via `encode_uncompressed_rgba8` so the cooked-texture loader path has
# a real artifact to render — no ISPC / committed binary fixture. Pure
# read+write codec crate, no GPU / cycle.
ph2d-asset-ktx2 = { path = "../../crates/ph2d-asset-ktx2" }
ph2d-script = { path = "../../crates/ph2d-script" }
ph2d-input = { path = "../../crates/ph2d-input" }
ph2d-editor = { path = "../../crates/ph2d-editor" }
# ADR-0029 Phase C.1: direct dep on the panel-inspector crate so the
# host can publish per-frame snapshots via the typed thread-local
# setters that replace the pre-C.1 `hero.inspector.<field> = ...`
# writes. Gated by the `panel-inspector` feature alongside the
# registry-init's mirror feature.
ph2d-panel-inspector = { path = "../../crates/ph2d-panel-inspector", optional = true }
# Audio Mixer panel (Phase 2.3c) — the render_loop bridge publishes live
# levels via `set_snapshot` + reads `master_muted` to drive the master gain.
ph2d-panel-audio-mixer = { path = "../../crates/ph2d-panel-audio-mixer", optional = true }
# Audio Editor panel (docs/Audio/, W1) — the render_loop editor bridge reads the
# transport intents + drives the preview engine + publishes position back.
ph2d-panel-audio-editor = { path = "../../crates/ph2d-panel-audio-editor", optional = true }
ph2d-panel-bgremoval = { path = "../../crates/ph2d-panel-bgremoval", optional = true }
ph2d-panel-color-equalization = { path = "../../crates/ph2d-panel-color-equalization", optional = true }
ph2d-panel-equalize-sizes = { path = "../../crates/ph2d-panel-equalize-sizes", optional = true }
ph2d-panel-upscale = { path = "../../crates/ph2d-panel-upscale", optional = true }
ph2d-panel-padding = { path = "../../crates/ph2d-panel-padding", optional = true }
# Vector Style panel (ADR-0108 cutover) — typed panel with the `vector` tool's
# Width slider + Stroke / Fill OKLCH colour swatches + Fill "None". Right-docked
# (Inspector slot takeover) while the `vector` tool is active. Shell publishes
# the snapshot via `ph2d_panel_vector::set_current_vector_style` (vector_bridge).
ph2d-panel-vector = { path = "../../crates/ph2d-panel-vector", optional = true }
# Flip Style panel (ADR-0114 W2) — typed panel with the `flip` tool's Mode /
# Brush / Color / Layers controls. Right-docked (Inspector slot takeover) while
# the `flip` tool is active. Shell publishes the style + layers snapshots via
# `ph2d_panel_flip::set_current_flip_*` (flip_bridge).
ph2d-panel-flip = { path = "../../crates/ph2d-panel-flip", optional = true }
ph2d-panel-flip-frames = { path = "../../crates/ph2d-panel-flip-frames", optional = true }
# Motion Nodes graph-editor panel — the shell's `motion_bridge` publishes the
# graph view via `ph2d_panel_motion_graph::set_current_motion_graph` (M1.E10),
# so the shell needs a direct optional dep beyond the registry-init feature.
ph2d-panel-motion-graph = { path = "../../crates/ph2d-panel-motion-graph", optional = true }
# Motion params panel — the bridge publishes the selected node's params
# (`set_current_params`) + drains its edits (`drain_param_intents`) + reads its
# widget states for the undo bracket (M1.P1), so a direct optional dep is needed.
ph2d-panel-motion-params = { path = "../../crates/ph2d-panel-motion-params", optional = true }
# Painter layers panel — typed panel listing the LayerStack (thumb + name +
# visibility + opacity + blend) + adjustment-layer editors. Right-docked
# (Inspector slot takeover) when the Painter (layers + effects) tool is active.
# Gated por feature `panel-painter-layers`. Shell publica o snapshot via
# `ph2d_panel_painter_layers::set_current_layers` (painter_bridge.rs).
ph2d-panel-painter-layers = { path = "../../crates/ph2d-panel-painter-layers", optional = true }
# ADR-0029 Phase C.2: direct dep on the panel-hierarchy crate so the
# host can call `sync_from_hierarchy` / `clear_live_hierarchy` /
# `set_live_component_count` and read the panel-owned live entries
# thread-local. Gated by the `panel-hierarchy` feature alongside the
# registry-init's mirror feature.
ph2d-panel-hierarchy = { path = "../../crates/ph2d-panel-hierarchy", optional = true }
ph2d-i18n = { path = "../../crates/ph2d-i18n" }
# A MATH dos tokens (plano UI/UX W4c.3). ⚠️ A aresta e do SHELL, nunca da `ph2d-tokens`: e o
# que impede o substrato de grafo (`ph2d-expr` -> `ph2d-nodegraph`) de chegar a 44 widgets.
ph2d-token-math = { path = "../../crates/ph2d-token-math" }
ph2d-tokens = { path = "../../crates/ph2d-tokens" }
# O CODEC DTCG (plano UI/UX W9) — o interop da tabela de tokens. ⚠️ A aresta e do SHELL pelo mesmo
# motivo da math acima: a `ph2d-tokens` declara zero deps de runtime, e um parser de JSON no
# caminho de compilacao de 44 widgets seria a aresta ao contrario. A shell e a unica que tem o
# dialogo nativo, entao ela e' tambem o unico chamador possivel.
ph2d-tokens-dtcg = { path = "../../crates/ph2d-tokens-dtcg" }
# M11 widget paint pass — Vello scene encoder + parley text contexts.
# Editor's `Paint` trait lowers widgets into a `VectorScene` that the
# render crate's `VelloPass` then composites onto the surface.
ph2d-vector = { path = "../../crates/ph2d-vector" }
# ADR-0108 Fase 0: pipeline vetorial NOVA (modelo editor-first `ph2d-vec-scene`
# + render `ph2d-vec-render` sobre o VectorScene fundacional). Aditiva — coexiste
# com o sistema de edição antigo até o cutover (Fase R).
ph2d-vec-scene = { path = "../../crates/ph2d-vec-scene" }
ph2d-vec-render = { path = "../../crates/ph2d-vec-render" }
# ADR-0108 Fase 1.1: máquinas de edição interativa (Pen agora) sobre a cena nova.
ph2d-vec-edit = { path = "../../crates/ph2d-vec-edit" }
ph2d-guides = { path = "../../crates/ph2d-guides" }
# Os ESTADOS de UI + o Smart Animate (plano UI/UX W7).
ph2d-ui-state = { path = "../../crates/ph2d-ui-state" }
# O CODEGEN DE PAINEL (plano UI/UX W8b): a arvore autorada descreve um painel, e a shell e quem
# a LE (ela e' a unica que ve o ECS e o documento). O gerador nao ve nenhum dos dois.
ph2d-ui-codegen = { path = "../../crates/ph2d-ui-codegen" }
# O motor de AUTO LAYOUT (ADR-0153): a crate-folha que confina o `taffy`. A shell monta a árvore a
# partir do ECS e consome retângulos — o motor não conhece ECS, documento nem tema.
ph2d-vec-layout = { path = "../../crates/ph2d-vec-layout" }
# ADR-0108 Fase 1: booleanas edit-time (union/intersect/subtract via linesweeper).
ph2d-vec-boolean = { path = "../../crates/ph2d-vec-boolean" }
# Conectores: o roteador (A*/OVG) da linha que gruda em duas formas e as segue. A
# shell re-cozinha a rota a cada frame em `connector_live`.
ph2d-vec-connect = { path = "../../crates/ph2d-vec-connect" }
# ADR-0114: documento do Flip (animação quadro-a-quadro). W0 = dados + ponte ECS
# (flip_entities) + undo/save; render e tool vêm nas waves seguintes.
ph2d-flip = { path = "../../crates/ph2d-flip" }
# ADR-0114 W1: pipeline wgpu dedicado do traço do Flip (passe no present.rs).
ph2d-flip-render = { path = "../../crates/ph2d-flip-render" }
# ADR-0161 — o tracador do modulo de modelagem 3D. E o caminho pelo qual o artista
# ve a peca: medido na W0, o campo tracado da quina de navalha e filete liso,
# enquanto a mesma cena extraida em malha serrilha. A malha fica para EXPORTAR.
ph2d-field-render = { path = "../../crates/ph2d-field-render" }
ph2d-field = { path = "../../crates/ph2d-field" }
# `half`: SO para converter os texels f16 de um matcap da casa
# (`ph2d-mesh-render::matcap::decode`) em f32 linear, no smoke do campo. Ja esta
# no `Cargo.lock` — e aresta, nao pacote novo.
half = "2"
# ADR-0150 — a malha residente e o passe wgpu dela. `optional`: e o que torna a
# feature `sculpt3d` uma promessa de remocao verificavel, e nao uma opiniao.
ph2d-mesh = { path = "../../crates/ph2d-mesh", optional = true }
ph2d-mesh-render = { path = "../../crates/ph2d-mesh-render", optional = true }
# O rig de luz do artista, para a cena 3D acender pelas MESMAS lampadas da tinta.
# ⚠️ NAO e `optional`: `ph2d-light` e a unica peca nao-removivel do modulo 3D
# (docs/3D/02.3) e ja chega aqui pelo Painter de qualquer jeito -- marca-la de
# opcional afirmaria uma removibilidade que ela nao tem.
ph2d-light = { path = "../../crates/ph2d-light" }
ph2d-sculpt3d = { path = "../../crates/ph2d-sculpt3d", optional = true }
# O voxel remesh (W7). `optional` pelo mesmo motivo dos outros tres: e a
# quarta crate do modulo, e a promessa de removibilidade so e verificavel se
# todas elas caírem com a feature.
ph2d-sdf = { path = "../../crates/ph2d-sdf", optional = true }
ph2d-quadflow = { path = "../../crates/ph2d-quadflow" }
ph2d-remesh-iso = { path = "../../crates/ph2d-remesh-iso" }
ph2d-crossfield = { path = "../../crates/ph2d-crossfield" }
# As tres fases restantes da cadeia GLOBAL (ADR-0162): tracado dos patches,
# quantizacao Bi-MDF e a quadrangulacao por patch. Nao sao `optional` pela mesma
# razao das duas de cima: a `quad_remesh_global` e' um gesto do shell, e a
# feature `sculpt3d` cobre a CENA, nao o algoritmo.
ph2d-trace = { path = "../../crates/ph2d-trace" }
ph2d-quantize = { path = "../../crates/ph2d-quantize" }
ph2d-quadfill = { path = "../../crates/ph2d-quadfill" }
# O balde (ADR-0114 W4) — solver CPU puro; o shell é a fronteira modelo↔solver.
ph2d-flip-fill = { path = "../../crates/ph2d-flip-fill" }
ph2d-flip-colorize = { path = "../../crates/ph2d-flip-colorize" }
# A escultura de traço (ADR-0114 W5) — idem: solver CPU puro, o shell traduz o gesto.
ph2d-flip-reshape = { path = "../../crates/ph2d-flip-reshape" }
# Texto vetorial (W1): glyph outlines (skrifa) → VecPath do motor novo. O crate é
# foundational mas está FORA do gate congelado (que só escaneia -doc/-traits).
ph2d-vector-font = { path = "../../crates/ph2d-vector-font" }
ph2d-text = { path = "../../crates/ph2d-text" }
# Enumeração de fontes do sistema (famílias + bytes) para a escolha de fonte do
# texto vetorial. Mesma versão que o parley do ph2d-text já traz na árvore.
fontique = "0.6"
# bevy_ecs is required as a direct dep so `#[derive(Component)]` can
# resolve its `::bevy_ecs::*` absolute paths. The shell is the
# application layer and is the only place we tolerate this leak.
bevy_ecs = "0.18"
# image: shell uses for procedural-PNG-fixture generation at first
# launch (so M6 has real files to consume). Same dep ph2d-asset
# pulls — workspace Cargo.lock unifies version.
image = { version = "0.25", default-features = false, features = ["png"] }
# postcard: serialize Transform (and future component blobs) for the
# editor command pipeline (M14.A). Pushed as `EditorCommand::SetComponent
# { data: Vec<u8> }` and decoded by `apply_editor_commands` via the
# `ComponentRegistry` registered at boot.
postcard = { version = "1", features = ["alloc"] }
# serde: the `Serialize` bound on the §7 ordering-edit `queue_set` helper
# (postcard-encodes optional sorting components). Already in the lockfile
# transitively; declaring it direct just names the trait.
serde = "1"
wgpu = "28"
winit = "0.30"
gilrs = "0.11"
# Phase 2.1 audio wiring. `cpal` owns the OS output device (HR-1: the platform
# backend lives in the shell, never in `ph2d-audio`); the core `AudioRenderer`
# fills the callback buffer. cpal on Linux uses ALSA (`alsa-lib`).
ph2d-audio = { path = "../../crates/ph2d-audio" }
# Load-time decode of real audio files (PH2D_AUDIO_FILE smoke) → SampleData.
ph2d-audio-decode = { path = "../../crates/ph2d-audio-decode" }
# Audio Editor (docs/Audio/, W1) — offline EditClip (peak cache) + WAV export.
# Optional, pulled in only by the `panel-audio-editor` feature.
ph2d-audio-edit = { path = "../../crates/ph2d-audio-edit", optional = true }
ph2d-audio-encode = { path = "../../crates/ph2d-audio-encode", optional = true }
ph2d-node-audio-bands = { path = "../../crates/ph2d-node-audio-bands" }
# ⚠️ **NAO e mais opcional, e a razao e um CONSUMIDOR novo:** o `audio.bands`
# (doc 63 §3) le o espectro de um arquivo para dirigir geometria, e ele nao e do
# editor de audio. Decodificar um arquivo e olhar o espectro dele deixaram de ser
# capacidades PRIVADAS daquele painel no dia em que um no de Motion precisou das
# duas — o mesmo argumento que o `decode_any` ja fazia por si ("uma porta para todo
# arquivo de audio que o app abre"). A alternativa era gatear a membrana na feature
# do painel, o que deixaria o no REGISTRADO e sempre em silencio num build sem ele:
# um controle morto, que e o que esta casa recusa.
ph2d-audio-spectral = { path = "../../crates/ph2d-audio-spectral" }
# Idem: o `decode_any` roteia Opus por conteudo, e ele agora tem um consumidor fora
# do painel de audio.
ph2d-audio-opus = { path = "../../crates/ph2d-audio-opus" }
# W7 ML denoise (ADR-0123). Optional, pulled ONLY by the `audio-ml` feature (OFF by default): a
# default build never resolves `tract`, never compiles the inference stack, never embeds the
# model. It carries the whole DeepFilterNet dependency; the RT mixer (`ph2d-audio`) must never
# reach it (gate `no_ml_runtime_reaches_the_mixer`).
ph2d-audio-ml = { path = "../../crates/ph2d-audio-ml", optional = true }
cpal = "0.15"
# arboard: system clipboard read/write for the Cmd+C/V/X handlers in
# ph2d-editor's dispatch. Constructed once at startup; pasted text is
# fed back to the store via `apply_clipboard_paste`.
arboard = "3"
# bumpalo: per-frame arena for HeroScreen interaction events
# (ADR-0024). Allocated once at AppGfx construction; reset every
# frame after dispatch.
bumpalo = "3"
# rfd: native file picker (M14.4c "Import…" button + future Save As).
# Cross-platform (macOS / Windows / Linux); modal `pick_files()`
# blocks the main thread for the duration of the dialog — acceptable
# for a user-initiated import flow.
rfd = "0.15"

# core-graphics: macOS-only live cursor query. winit 0.30 does NOT
# emit `CursorMoved` during external file drag operations, so the
# cached cursor is stale by the time `DroppedFile` fires. We ask
# CoreGraphics for the live cursor instead. Already a transitive
# dep via winit/macos; promoting to a direct dep is free (no extra
# compile unit) and keeps the crate `forbid(unsafe_code)`-clean
# because all wrapping is inside the core-graphics crate itself.
# ⚠️ Os dois entram por DOIS motivos, e o segundo é o que os torna obrigatórios aqui: a
# cena `=77` autora o `Echo Operator`/`Flash Operator` pelo NOME do param (nunca por um
# literal), e o arch-gate do operador por-linha pina o vocabulário deles contra o do sink —
# um nó é uma folha e não importa do irmão, então a shell é o único sítio que vê os três.
ph2d-node-motion-trail = { path = "../../crates/ph2d-node-motion-trail" }
ph2d-node-motion-strobe = { path = "../../crates/ph2d-node-motion-strobe" }

[dev-dependencies]
# O harness headless de painel (`MockPanelHost`) — a shell precisa dele para medir a
# GEOMETRIA que um painel de fato registra. O censo de linhas (doc 88 B3) mede quantas
# linhas um nó produz; a metade que faltava é se elas CABEM na altura do dock, e a única
# testemunha honesta disso são os retângulos que o próprio painel registrou (uma segunda
# aritmética de altura ao lado dele divergiria no dia em que uma linha composta mudar).
ph2d-ui-testkit = { path = "../../crates/ph2d-ui-testkit" }
# O sink de render, para o arch-gate do modo de composição (doc 89, folha 17). A
# shell é o único lugar que enxerga as DUAS folhas — o nó que declara o param e o
# substrato que o lê — e nenhuma delas pode depender da outra, então o acordo entre
# as duas strings só é verificável daqui. Dev-only: o `src/` não o toca (o registro
# dos nós é do `ph2d-node-registry-init`).
ph2d-node-motion-output = { path = "../../crates/ph2d-node-motion-output" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[package.metadata.cargo-machete]
# `bevy_ecs` is reached only through `#[derive(Component)]` expansion,
# which machete can't see. See dep comment above.
ignored = ["bevy_ecs"]

# Wave 8 Phase 1 — host-level cargo features that proxy through to
# `ph2d-panel-registry-init`. `default` re-enables all 4 panels for
# the standard build; lite distributions and panel-isolated runs
# pick the subset they want via `--no-default-features --features X`.
[features]
default = [
    "sculpt3d",
    "panel-widget-gallery",
    "panel-hierarchy",
    "panel-inspector",
    "panel-grid-snap",
    "panel-bgremoval",
    "panel-padding",
    "panel-color-equalization",
    "panel-equalize-sizes",
    "panel-upscale",
    "panel-painter-layers",
    "panel-vector",
    "panel-flip",
    "panel-flip-frames",
    "panel-audio-mixer",
    "panel-audio-editor",
    "panel-motion-graph",
    "panel-motion-params",
    "panel-timeline",
    "panel-physics",
    "panel-wet-tuning",
    "panel-tokens",
    "panel-authored",
    "panel-sculpt3d",
]
# `lite` = explicit "no panels" — host boots with chrome only
# (TopBar + LeftRail + BottomHUD + canvas). Useful for distribution
# builds that ship only the rendering surface (e.g., embedded
# preview windows) without the editor sidecars.
lite = []
# ADR-0150 — o modulo de escultura 3D. LIGADA no `default` de proposito: o
# `ship.sh` roda clippy SEM `--all-features`, entao codigo atras de uma feature
# desligada nao e lintado e apodrece. A flag continua sendo o CONTRATO de
# removibilidade (docs/3D/02.3): as deps sao `optional`, e desliga-la tem de
# apagar o modulo do binario sem tocar em nada do 2D.
sculpt3d = ["dep:ph2d-mesh", "dep:ph2d-mesh-render", "dep:ph2d-sculpt3d", "dep:ph2d-sdf"]
panel-widget-gallery = ["ph2d-panel-registry-init/panel-widget-gallery"]
panel-hierarchy      = ["ph2d-panel-registry-init/panel-hierarchy", "dep:ph2d-panel-hierarchy"]
panel-inspector      = ["ph2d-panel-registry-init/panel-inspector", "dep:ph2d-panel-inspector"]
panel-bgremoval      = ["ph2d-panel-registry-init/panel-bgremoval", "dep:ph2d-panel-bgremoval"]
panel-padding        = ["ph2d-panel-registry-init/panel-padding", "dep:ph2d-panel-padding"]
panel-color-equalization = ["ph2d-panel-registry-init/panel-color-equalization", "dep:ph2d-panel-color-equalization"]
panel-equalize-sizes = ["ph2d-panel-registry-init/panel-equalize-sizes", "dep:ph2d-panel-equalize-sizes"]
panel-upscale        = ["ph2d-panel-registry-init/panel-upscale", "dep:ph2d-panel-upscale"]
panel-painter-layers = ["ph2d-panel-registry-init/panel-painter-layers", "dep:ph2d-panel-painter-layers"]
# Motion Nodes docked panels (M0). No `dep:` — `motion_bridge` drives them
# entirely through `hero.panel_visibility` + the shared layout, with no
# panel-side static channel (the document lives in `MotionState`, not the panel),
# so the shell needs only the registry-init feature, not a direct crate dep.
panel-motion-graph   = ["ph2d-panel-registry-init/panel-motion-graph", "dep:ph2d-panel-motion-graph"]
panel-motion-params  = ["ph2d-panel-registry-init/panel-motion-params", "dep:ph2d-panel-motion-params"]
# Vector Style panel + its render_loop bridge (`vector_bridge` publishes the
# snapshot via `ph2d_panel_vector::set_current_vector_style` + reads the OKLCH
# picker back into the tool), so the shell needs the direct dep too.
panel-vector         = ["ph2d-panel-registry-init/panel-vector", "dep:ph2d-panel-vector"]
# Flip Style panel + its render_loop bridge (`flip_bridge` publishes the style +
# layers snapshots via `ph2d_panel_flip::set_current_flip_*` + reads the OKLCH
# picker back into the tool), so the shell needs the direct dep too.
panel-flip           = ["ph2d-panel-registry-init/panel-flip", "dep:ph2d-panel-flip"]
panel-flip-frames    = ["ph2d-panel-registry-init/panel-flip-frames", "dep:ph2d-panel-flip-frames"]
panel-grid-snap      = ["ph2d-panel-registry-init/panel-grid-snap"]
# Direct dep too: the render_loop bridge publishes live levels via
# `set_snapshot` + reads `master_muted` to drive the engine's master gain.
panel-audio-mixer    = ["ph2d-panel-registry-init/panel-audio-mixer", "dep:ph2d-panel-audio-mixer"]
# General timeline docked panel. `ph2d-panel-timeline` is already a non-optional
# direct dep (render_loop publishes its snapshot via `set_current_timeline`), so
# this only needs to flip the registry-init feature that compiles in the
# `register_all_panels()` push for `TimelinePanel`.
panel-timeline       = ["ph2d-panel-registry-init/panel-timeline"]
# Physics WORLD panel (ADR-0131 D8 / W2b). `ph2d-panel-physics` is already a
# non-optional direct dep (`render_loop::physics_panel_bridge` publishes its
# snapshot and drains its intents), so this only has to flip the registry-init
# feature that compiles the panel INTO the registry.
#
# ⚠️ The shell sets `default-features = false` on `ph2d-panel-registry-init`, so
# that crate's own `default` list reaches nobody: a panel is in the running app
# only if it is BOTH here and in the `default` above. Missing this line is what
# made the panel unreachable in the first smoke — every unit gate green, and
# `W` toggling the visibility of a panel that was not in the registry.
panel-physics        = ["ph2d-panel-registry-init/panel-physics"]
# Painel de TOKENS (plano UI/UX W6). `ph2d-panel-tokens` e' dep direta nao-opcional
# (`render_loop::tokens_bridge` drena os intents e faz o read-back do picker); esta
# linha liga a feature do registry-init que compila o painel PARA DENTRO do
# registro. ⚠️ Vale o mesmo aviso do physics acima: sem ela o `T` alternaria a
# visibilidade de um painel que nao esta' no registro, com todos os gates verdes.
panel-tokens         = ["ph2d-panel-registry-init/panel-tokens"]
# O painel AUTORADO (plano UI/UX W8b.2) — o painel que o artista desenhou.
# `ph2d-panel-authored` e' dep direta nao-opcional (a ponte drena os intents e o
# `AuthoredPanel::ID` e' a chave de visibilidade); esta linha liga a feature do
# registry-init que o compila PARA DENTRO do registro. ⚠️ Vale o mesmo aviso do
# physics acima: sem ela o interruptor alternaria a visibilidade de um painel
# que nao esta' no registro, com todos os gates verdes.
panel-authored       = ["ph2d-panel-registry-init/panel-authored"]
# Painel da cena 3D (ADR-0150 W12). `ph2d-panel-sculpt3d` e' dep direta
# nao-opcional (`render_loop::sculpt3d_panel_bridge` publica o retrato e drena os
# intents); esta linha liga a feature do registry-init que o compila PARA DENTRO
# do registro. ⚠️ Vale o mesmo aviso do physics acima — sem ela o painel nasce
# invisivel com TODOS os gates verdes, que foi como o de fisica reprovou no
# primeiro smoke.
#
# ⚠️ E ela NAO e' a feature `sculpt3d`: aquela liga o MODULO (a cena, o gesto, o
# passe), esta liga o PAINEL no registro. O painel compila sem o modulo — ele
# fala `ph2d-sculpt3d`, que e' a crate do pincel, nao a cena do shell — e e' isso
# que o mantem fora do caminho do `cfg` que atravessa o shell.
panel-sculpt3d       = ["ph2d-panel-registry-init/panel-sculpt3d"]
# Wet Tuning side panel (doc 22). `ph2d-panel-wet-tuning` is a non-optional
# direct dep (the painter bridge publishes its brush snapshot and mirrors the
# Tuning checkbox into its visibility); this line flips the registry-init
# feature that compiles the panel INTO the registry (see the physics warning
# above: the shell sets `default-features = false` there).
panel-wet-tuning     = ["ph2d-panel-registry-init/panel-wet-tuning"]
# Direct dep too: the render_loop editor bridge reads the transport intents +
# drives the preview engine + publishes position back for the readout/playhead.
panel-audio-editor   = ["ph2d-panel-registry-init/panel-audio-editor", "dep:ph2d-panel-audio-editor", "dep:ph2d-audio-edit", "dep:ph2d-audio-encode"]
# W7 AI Denoise (ADR-0123), OFF by default — NOT in `default`. Turning it on pulls the native
# DeepFilterNet stack (`ph2d-audio-ml` → `tract`) and lights the "AI Denoise" button in the audio
# editor. It implies `panel-audio-editor`, which is where the button and its bridge live.
audio-ml             = ["panel-audio-editor", "dep:ph2d-audio-ml"]
