# Vector Select — Stateful tool, network-level selection (plan T2.3).
# Click picks the topmost filled region's network; marquee picks by
# bounding box. Operates on the shared committed scene + the shell-owned
# VectorSelection (passed by-ref). Sibling of vector_direct.
#
# Cluster `vector_tools`. Canonical source for
# `crates/ph2d-tool-vector-select/src/lib.rs`.

[tool]
id          = "vector_select"
cluster     = "vector_tools"
zone        = "top_right"
order       = 40
a11y_role   = "Button"
icon_slug   = "vector-select"
touches_sim = false

[label]
pt_br_inline = "Selecionar"
en_us_inline = "Select"
fluent_key   = "tool.vector_select.label"

[memory_budget]
vram_mb        = 0
ram_mb         = 1
heap_script_mb = 0
