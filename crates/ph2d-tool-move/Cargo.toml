[package]
name = "ph2d-tool-move"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Move — the transform tool (modal, palette). ADR-0040 T-close: a
# behavior-only tool crate — exposes `make() -> Box<dyn Tool>` for the
# codegen-wired ToolRegistry, no `ToolManifest`. Depends on
# ph2d-editor-core for the Tool/FloatingPanel/widget contract.

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y = { path = "../ph2d-a11y" }
