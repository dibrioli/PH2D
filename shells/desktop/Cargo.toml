[package]
name = "ph2d-host-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ph2d-host-desktop"
path = "src/main.rs"

[dependencies]
# libm — HR-5 cross-OS bit-identical sincosf used in input_dispatch.rs
# + render_loop/snapshots.rs + input_dispatch/gizmo_drag.rs (T1.3.5
# workspace-wide sweep; the shell's gizmo math mirrors ph2d-ecs's
# Transform::compose and must use the same impl).
libm = { version = "=0.2.16", default-features = false }
ph2d-host = { path = "../../crates/ph2d-host" }
ph2d-core = { path = "../../crates/ph2d-core" }
ph2d-gpu = { path = "../../crates/ph2d-gpu" }
ph2d-ecs = { path = "../../crates/ph2d-ecs" }
ph2d-render = { path = "../../crates/ph2d-render" }
# Wave 11 color-space migration (ADR-0042 §6 #2): typed color wrappers
# (SrgbRgba) at the IO boundary. The shell casts between the existing
# Vec<u8> pixel buffers and the tools' typed signatures via
# bytemuck::cast_slice.
ph2d-color = { path = "../../crates/ph2d-color" }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
# Node-system substrate for the Motion Nodes module (docs/Motion Nodes/): the
# `MotionState` cook path (motion_state.rs + render_loop/motion_bridge.rs) cooks
# the graph per frame and lowers its stream to `RenderInstance`s via
# `ph2d-eval-motion`. (Replaced the retired PH2D_MOTION_SMOKE debug scene.)
ph2d-nodegraph = { path = "../../crates/ph2d-nodegraph" }
ph2d-node-registry = { path = "../../crates/ph2d-node-registry" }
ph2d-eval-motion = { path = "../../crates/ph2d-eval-motion" }
# Motion Nodes module (docs/Motion Nodes/): document model + full node registry.
# `MotionState` (motion_state.rs) holds the persistent `Cook`, the registry (all
# registered node ops) and the transport; `motion_bridge` cooks it per frame
# while the Motion tool is active.
ph2d-motion-doc = { path = "../../crates/ph2d-motion-doc" }
ph2d-node-registry-init = { path = "../../crates/ph2d-node-registry-init" }
# General timeline data layer (M0): keyframe store + curves. Used by the
# timeline visual smoke (render_loop/timeline_smoke.rs, PH2D_TIMELINE_SMOKE=1) to
# animate the sprite grid from a Clip sampled at the engine Playhead.
ph2d-anim = { path = "../../crates/ph2d-anim" }
# General-timeline runtime (M0): binds ph2d-anim Clips to scene entities and
# applies them at the Playhead each frame (render_loop apply pass + the KeyB
# demo bind). SpriteAnimation -> Transform.
ph2d-timeline = { path = "../../crates/ph2d-timeline" }
# Tool registry — convention-by-discovery infrastructure (PR 8 of
# the migration plan: `docs/Migracao/2026-05-convention-by-discovery.md`).
# `init.rs` calls `register_all()` at boot and stashes the built
# `Registry` on `AppGfx`. PR 9 will replace the `pending_X` drains
# with a registry-driven dispatcher reading from this instance.
ph2d-tool-registry = { path = "../../crates/ph2d-tool-registry" }
ph2d-tool-registry-init = { path = "../../crates/ph2d-tool-registry-init" }
# ADR-0054 W0.T6: image I/O registries populated at boot.
ph2d-imageio = { path = "../../crates/ph2d-imageio" }
ph2d-imageio-registry-init = { path = "../../crates/ph2d-imageio-registry-init" }
# Wave 10 / Etapa 1.B — generic helpers for the per-tool bridges
# (drive_source_push / drive_preview_cache / drive_pending_commit /
# drive_deactivate_cleanup over `RasterEditTool`). Each *_bridge.rs
# composes these so bridges shrink ~30-50 LOC each.
ph2d-tool-runtime = { path = "../../crates/ph2d-tool-runtime" }
# Background Removal — the shell constructs + downcasts to BgRemovalTool
# (interactive preview, eyedropper, protect-brush) and runs the full-res
# commit. Now its own crate (ADR-0040 T2); was reached via editor-core.
ph2d-tool-bgremoval = { path = "../../crates/ph2d-tool-bgremoval" }
# Painter — the layers + effects host. Shell downcasts to PainterTool for the
# layer-composite GPU preview + Apply bake (painter_bridge.rs / painter_gpu_*).
ph2d-tool-painter = { path = "../../crates/ph2d-tool-painter", features = [
    "gpu",
] }
# Layer blend modes + adjustment effects — `painter_gpu_flatten.rs` reads
# BlendMode + adjustment LUTs to drive the GPU LayerCompositor.
ph2d-painter-effects = { path = "../../crates/ph2d-painter-effects" }
# Vector — the single first-class Vector drawing tool (ADR-0108 cutover).
# Shell downcasts to VectorTool for its Style config (stroke/fill/width) and
# routes the pointer to the shell-held Pen over `AppGfx.vec_scene`
# (vector_bridge.rs). Replaces the retired Pen/Pencil/Shape/Select/Direct tools.
ph2d-tool-vector = { path = "../../crates/ph2d-tool-vector" }
# Make Square one-shot — the shell drain calls
# `ph2d_tool_make_square::make_square` on the selected sprite's source
# RGBA and swaps the texture (ADR-0040 T1.5: was reached via the
# editor-core facade, now the crate directly; editor-core ⊥ tools).
ph2d-tool-make-square = { path = "../../crates/ph2d-tool-make-square" }
# Trim Transparency one-shot — the shell drain calls
# `ph2d_tool_trim_transparency::trim_transparency` and crops the sprite
# (ADR-0040 T3; was reached via editor-core).
ph2d-tool-trim-transparency = { path = "../../crates/ph2d-tool-trim-transparency" }
# Real Size one-shot — the shell drain applies `real_size_scale` to the
# selected sprite's ECS Transform (see render_loop/image_edit.rs).
ph2d-tool-real-size = { path = "../../crates/ph2d-tool-real-size" }
# Padding bake — the shell drain runs `add_padding` on the selected
# sprite's source RGBA and swaps the texture (see hero_intents/image_edit.rs).
ph2d-tool-padding = { path = "../../crates/ph2d-tool-padding" }
# Color Equalization bake — the shell drain pushes each selected
# sprite's source RGBA into the active tool's preview cache and runs
# `run_full_resolution` for the bake (see render_loop/
# color_equalization_bridge.rs + hero_intents/image_edit.rs).
ph2d-tool-color-equalization = { path = "../../crates/ph2d-tool-color-equalization", features = [
    "gpu",
] }
# Equalize Sizes bake — multi-sprite size normalization. The shell drain
# collects per-sprite inputs from `hero.gizmo.iter_selected()` and runs
# `EqualizeSizesTool::run_full_resolution_multi` in one batch (see
# render_loop/equalize_sizes_bridge.rs + hero_intents/image_edit.rs).
ph2d-tool-equalize-sizes = { path = "../../crates/ph2d-tool-equalize-sizes" }
# Rasterize one-shot — bakes Transform.scale + .rotation into the
# sprite source pixels and resets Transform to identity (see
# render_loop/image_edit.rs + hero_intents/image_edit.rs).
ph2d-tool-rasterize = { path = "../../crates/ph2d-tool-rasterize" }
# Upscale bake — stateful sabor 3. The shell drain pushes each
# selected sprite's source RGBA into the active tool's preview cache
# and runs `run_full_resolution` for the bake (see render_loop/
# upscale_bridge.rs + hero_intents/image_edit.rs).
ph2d-tool-upscale = { path = "../../crates/ph2d-tool-upscale" }
# Wave 8 Phase 1 — panel registry install at boot. `register_all_panels()`
# is mandatory BEFORE the first `HeroScreen::new` (audit B1 closure:
# the previous auto-install in `HeroScreen::new` silently overrode
# `panel-*` cargo features at runtime). `default-features = false` so
# the shell's own `[features]` table drives panel selection; defaults
# below re-enable all 4 panels for the standard build.
ph2d-panel-registry-init = { path = "../../crates/ph2d-panel-registry-init", default-features = false }
# Integration demo deps:
# - ph2d-asset (M6): PNG load, blake3 ids, hot-reload watcher
# - ph2d-script (M7): Luau ScriptHost, ph2d.set/get/input bindings
# - ph2d-input (M8): gamepad/pencil device abstraction
# - ph2d-editor (M12): FloatingPanel, ZenMode, ToastQueue (data layer
#   visible via window title until Vello widget paint wires in)
# - ph2d-tokens (M12): semantic tokens for theme switching
ph2d-asset = { path = "../../crates/ph2d-asset" }
# KTX2 Fase 2 (W2.T4): the `PH2D_KTX2_SMOKE` harness cooks an RGBA8 KTX2 in
# memory via `encode_uncompressed_rgba8` so the cooked-texture loader path has
# a real artifact to render — no ISPC / committed binary fixture. Pure
# read+write codec crate, no GPU / cycle.
ph2d-asset-ktx2 = { path = "../../crates/ph2d-asset-ktx2" }
ph2d-script = { path = "../../crates/ph2d-script" }
ph2d-input = { path = "../../crates/ph2d-input" }
ph2d-editor = { path = "../../crates/ph2d-editor" }
# ADR-0029 Phase C.1: direct dep on the panel-inspector crate so the
# host can publish per-frame snapshots via the typed thread-local
# setters that replace the pre-C.1 `hero.inspector.<field> = ...`
# writes. Gated by the `panel-inspector` feature alongside the
# registry-init's mirror feature.
ph2d-panel-inspector = { path = "../../crates/ph2d-panel-inspector", optional = true }
# Audio Mixer panel (Phase 2.3c) — the render_loop bridge publishes live
# levels via `set_snapshot` + reads `master_muted` to drive the master gain.
ph2d-panel-audio-mixer = { path = "../../crates/ph2d-panel-audio-mixer", optional = true }
ph2d-panel-bgremoval = { path = "../../crates/ph2d-panel-bgremoval", optional = true }
ph2d-panel-color-equalization = { path = "../../crates/ph2d-panel-color-equalization", optional = true }
ph2d-panel-equalize-sizes = { path = "../../crates/ph2d-panel-equalize-sizes", optional = true }
ph2d-panel-upscale = { path = "../../crates/ph2d-panel-upscale", optional = true }
ph2d-panel-padding = { path = "../../crates/ph2d-panel-padding", optional = true }
# Vector Style panel (ADR-0108 cutover) — typed panel with the `vector` tool's
# Width slider + Stroke / Fill OKLCH colour swatches + Fill "None". Right-docked
# (Inspector slot takeover) while the `vector` tool is active. Shell publishes
# the snapshot via `ph2d_panel_vector::set_current_vector_style` (vector_bridge).
ph2d-panel-vector = { path = "../../crates/ph2d-panel-vector", optional = true }
# Motion Nodes graph-editor panel — the shell's `motion_bridge` publishes the
# graph view via `ph2d_panel_motion_graph::set_current_motion_graph` (M1.E10),
# so the shell needs a direct optional dep beyond the registry-init feature.
ph2d-panel-motion-graph = { path = "../../crates/ph2d-panel-motion-graph", optional = true }
# Motion params panel — the bridge publishes the selected node's params
# (`set_current_params`) + drains its edits (`drain_param_intents`) + reads its
# widget states for the undo bracket (M1.P1), so a direct optional dep is needed.
ph2d-panel-motion-params = { path = "../../crates/ph2d-panel-motion-params", optional = true }
# Painter layers panel — typed panel listing the LayerStack (thumb + name +
# visibility + opacity + blend) + adjustment-layer editors. Right-docked
# (Inspector slot takeover) when the Painter (layers + effects) tool is active.
# Gated por feature `panel-painter-layers`. Shell publica o snapshot via
# `ph2d_panel_painter_layers::set_current_layers` (painter_bridge.rs).
ph2d-panel-painter-layers = { path = "../../crates/ph2d-panel-painter-layers", optional = true }
# ADR-0029 Phase C.2: direct dep on the panel-hierarchy crate so the
# host can call `sync_from_hierarchy` / `clear_live_hierarchy` /
# `set_live_component_count` and read the panel-owned live entries
# thread-local. Gated by the `panel-hierarchy` feature alongside the
# registry-init's mirror feature.
ph2d-panel-hierarchy = { path = "../../crates/ph2d-panel-hierarchy", optional = true }
ph2d-i18n = { path = "../../crates/ph2d-i18n" }
ph2d-tokens = { path = "../../crates/ph2d-tokens" }
# M11 widget paint pass — Vello scene encoder + parley text contexts.
# Editor's `Paint` trait lowers widgets into a `VectorScene` that the
# render crate's `VelloPass` then composites onto the surface.
ph2d-vector = { path = "../../crates/ph2d-vector" }
# ADR-0108 Fase 0: pipeline vetorial NOVA (modelo editor-first `ph2d-vec-scene`
# + render `ph2d-vec-render` sobre o VectorScene fundacional). Aditiva — coexiste
# com o sistema de edição antigo até o cutover (Fase R).
ph2d-vec-scene = { path = "../../crates/ph2d-vec-scene" }
ph2d-vec-render = { path = "../../crates/ph2d-vec-render" }
# ADR-0108 Fase 1.1: máquinas de edição interativa (Pen agora) sobre a cena nova.
ph2d-vec-edit = { path = "../../crates/ph2d-vec-edit" }
# ADR-0108 Fase 1: booleanas edit-time (union/intersect/subtract via linesweeper).
ph2d-vec-boolean = { path = "../../crates/ph2d-vec-boolean" }
ph2d-text = { path = "../../crates/ph2d-text" }
# bevy_ecs is required as a direct dep so `#[derive(Component)]` can
# resolve its `::bevy_ecs::*` absolute paths. The shell is the
# application layer and is the only place we tolerate this leak.
bevy_ecs = "0.18"
# image: shell uses for procedural-PNG-fixture generation at first
# launch (so M6 has real files to consume). Same dep ph2d-asset
# pulls — workspace Cargo.lock unifies version.
image = { version = "0.25", default-features = false, features = ["png"] }
# postcard: serialize Transform (and future component blobs) for the
# editor command pipeline (M14.A). Pushed as `EditorCommand::SetComponent
# { data: Vec<u8> }` and decoded by `apply_editor_commands` via the
# `ComponentRegistry` registered at boot.
postcard = { version = "1", features = ["alloc"] }
# serde: the `Serialize` bound on the §7 ordering-edit `queue_set` helper
# (postcard-encodes optional sorting components). Already in the lockfile
# transitively; declaring it direct just names the trait.
serde = "1"
wgpu = "28"
winit = "0.30"
gilrs = "0.11"
# Phase 2.1 audio wiring. `cpal` owns the OS output device (HR-1: the platform
# backend lives in the shell, never in `ph2d-audio`); the core `AudioRenderer`
# fills the callback buffer. cpal on Linux uses ALSA (`alsa-lib`).
ph2d-audio = { path = "../../crates/ph2d-audio" }
# Load-time decode of real audio files (PH2D_AUDIO_FILE smoke) → SampleData.
ph2d-audio-decode = { path = "../../crates/ph2d-audio-decode" }
cpal = "0.15"
# arboard: system clipboard read/write for the Cmd+C/V/X handlers in
# ph2d-editor's dispatch. Constructed once at startup; pasted text is
# fed back to the store via `apply_clipboard_paste`.
arboard = "3"
# bumpalo: per-frame arena for HeroScreen interaction events
# (ADR-0024). Allocated once at AppGfx construction; reset every
# frame after dispatch.
bumpalo = "3"
# rfd: native file picker (M14.4c "Import…" button + future Save As).
# Cross-platform (macOS / Windows / Linux); modal `pick_files()`
# blocks the main thread for the duration of the dialog — acceptable
# for a user-initiated import flow.
rfd = "0.15"

# core-graphics: macOS-only live cursor query. winit 0.30 does NOT
# emit `CursorMoved` during external file drag operations, so the
# cached cursor is stale by the time `DroppedFile` fires. We ask
# CoreGraphics for the live cursor instead. Already a transitive
# dep via winit/macos; promoting to a direct dep is free (no extra
# compile unit) and keeps the crate `forbid(unsafe_code)`-clean
# because all wrapping is inside the core-graphics crate itself.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[package.metadata.cargo-machete]
# `bevy_ecs` is reached only through `#[derive(Component)]` expansion,
# which machete can't see. See dep comment above.
ignored = ["bevy_ecs"]

# Wave 8 Phase 1 — host-level cargo features that proxy through to
# `ph2d-panel-registry-init`. `default` re-enables all 4 panels for
# the standard build; lite distributions and panel-isolated runs
# pick the subset they want via `--no-default-features --features X`.
[features]
default = [
    "panel-widget-gallery",
    "panel-hierarchy",
    "panel-inspector",
    "panel-grid-snap",
    "panel-bgremoval",
    "panel-padding",
    "panel-color-equalization",
    "panel-equalize-sizes",
    "panel-upscale",
    "panel-painter-layers",
    "panel-vector",
    "panel-audio-mixer",
    "panel-motion-graph",
    "panel-motion-params",
]
# `lite` = explicit "no panels" — host boots with chrome only
# (TopBar + LeftRail + BottomHUD + canvas). Useful for distribution
# builds that ship only the rendering surface (e.g., embedded
# preview windows) without the editor sidecars.
lite = []
panel-widget-gallery = ["ph2d-panel-registry-init/panel-widget-gallery"]
panel-hierarchy      = ["ph2d-panel-registry-init/panel-hierarchy", "dep:ph2d-panel-hierarchy"]
panel-inspector      = ["ph2d-panel-registry-init/panel-inspector", "dep:ph2d-panel-inspector"]
panel-bgremoval      = ["ph2d-panel-registry-init/panel-bgremoval", "dep:ph2d-panel-bgremoval"]
panel-padding        = ["ph2d-panel-registry-init/panel-padding", "dep:ph2d-panel-padding"]
panel-color-equalization = ["ph2d-panel-registry-init/panel-color-equalization", "dep:ph2d-panel-color-equalization"]
panel-equalize-sizes = ["ph2d-panel-registry-init/panel-equalize-sizes", "dep:ph2d-panel-equalize-sizes"]
panel-upscale        = ["ph2d-panel-registry-init/panel-upscale", "dep:ph2d-panel-upscale"]
panel-painter-layers = ["ph2d-panel-registry-init/panel-painter-layers", "dep:ph2d-panel-painter-layers"]
# Motion Nodes docked panels (M0). No `dep:` — `motion_bridge` drives them
# entirely through `hero.panel_visibility` + the shared layout, with no
# panel-side static channel (the document lives in `MotionState`, not the panel),
# so the shell needs only the registry-init feature, not a direct crate dep.
panel-motion-graph   = ["ph2d-panel-registry-init/panel-motion-graph", "dep:ph2d-panel-motion-graph"]
panel-motion-params  = ["ph2d-panel-registry-init/panel-motion-params", "dep:ph2d-panel-motion-params"]
# Vector Style panel + its render_loop bridge (`vector_bridge` publishes the
# snapshot via `ph2d_panel_vector::set_current_vector_style` + reads the OKLCH
# picker back into the tool), so the shell needs the direct dep too.
panel-vector         = ["ph2d-panel-registry-init/panel-vector", "dep:ph2d-panel-vector"]
panel-grid-snap      = ["ph2d-panel-registry-init/panel-grid-snap"]
# Direct dep too: the render_loop bridge publishes live levels via
# `set_snapshot` + reads `master_muted` to drive the engine's master gain.
panel-audio-mixer    = ["ph2d-panel-registry-init/panel-audio-mixer", "dep:ph2d-panel-audio-mixer"]
