# cargo-nextest config — https://nexte.st/book/configuration.html
#
# Surgical handling of the vendored ISPC encoders in ph2d-asset-cooker, which:
#   (a) are globally thread-UNSAFE → must run serially (the old
#       `RUST_TEST_THREADS=1` rule; nextest expresses it as a max-threads=1 group);
#   (b) SIGBUS ~50% NON-deterministically even single-threaded + isolated
#       (characterized W1.T15: same binary, run 1 crash / run 2 ok — infra flake,
#       not a code bug) → bounded retries.
#
# Scoped to ph2d-asset-cooker ONLY. We do NOT retry globally — that would mask
# real flaky tests elsewhere. ship.sh and CI both read this file, so the cook
# job stops flaking in both.

[test-groups.asset-cooker-ispc]
# Serialize all ph2d-asset-cooker tests (ISPC global state is not thread-safe).
max-threads = 1

[[profile.default.overrides]]
filter = 'package(ph2d-asset-cooker)'
test-group = 'asset-cooker-ispc'
# Bumped 3 → 6 (2026-05-29): the W1.T15-characterized ~50% per-run vendored-ISPC
# SIGABRT means retries=3 (4 tries) still fails ~0.5^4 ≈ 6% of the time, which
# cook_all_intra_machine_byte_identity hit on CI macOS. 6 retries (7 tries) →
# ~0.5^7 ≈ 0.8%. This is the ONLY effective lever: the crash is in vendored ctt
# (no code root-cause our side — see the test-group note above). The heavier
# cook_all_* tests do the most encoder work, so they're the most exposed.
retries = 6
