[lib]

[dependencies]
# As ROTAS das setas do Quadro (W2): onde cada ponta encosta, o roteador reusado do vectorial
# (`ph2d-vec-connect`, puro) e a cache que só refaz a seta cuja ponta ou obstáculo mexeu. Sem ECS
# nem UI; a curva e as pontas de seta são as do catálogo vectorial (`ph2d-vec-scene`).
ph2d-board-model = { path = "../ph2d-board-model" }
ph2d-board-geom = { path = "../ph2d-board-geom" }
ph2d-vec-connect = { path = "../ph2d-vec-connect" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
ph2d-vec-render = { path = "../ph2d-vec-render" }
ph2d-vector = { path = "../ph2d-vector" }

