[package]
name = "ph2d-kanban-views"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# As vistas Tabela, Calendário, Linha do tempo e Painel de um Kanban (TrelloClone W7). O estado é da
# VISTA; o documento só muda pelo `Plan` que cada gesto devolve ao chamador (`apply_logged`).
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-host = { path = "../ph2d-host" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-kanban-dates = { path = "../ph2d-kanban-dates" }
ph2d-kanban-filter = { path = "../ph2d-kanban-filter" }
ph2d-kanban-model = { path = "../ph2d-kanban-model" }
ph2d-text = { path = "../ph2d-text" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-vector = { path = "../ph2d-vector" }

[dev-dependencies]
# As fotos das vistas (`#[ignore]`): a placa pinta a cena e o PNG grava-se em `docs/TrelloClone/smoke/W7/`.
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-render = { path = "../ph2d-render" }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
