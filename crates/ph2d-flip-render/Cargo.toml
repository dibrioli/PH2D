[package]
name = "ph2d-flip-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Documento Flip (fonte da geometria a rasterizar).
ph2d-flip = { path = "../ph2d-flip" }
# Vec2 + math (posições, câmera ortográfica).
ph2d-core = { path = "../ph2d-core" }
# Pipeline wgpu dedicado (ADR-0114 §Decisão 5): o traço do Flip NÃO vai pela
# vello::Scene — vai por este passe wgpu, pela performance de tempo real. wgpu 29
# em lockstep com ph2d-render/ph2d-gpu.
wgpu = "29.0.4"
# Empacotamento de storage buffers (Pod/Zeroable + cast_slice), mesma convenção
# do `instance_buffer` do ph2d-render.
bytemuck = { version = "1", features = ["derive"] }
# ⭐ A CÂMERA do traço (`camera.rs`) desceu da `ph2d-app-flip` na auditoria de arquitectura de
# 2026-09-12 (A1): ela converte a `Camera2d` (ph2d-render) com o tamanho da janela (ph2d-host) e o
# `model` do objecto (ph2d-vec-scene) no uniform deste passe. ⚠️ O COMPOSITOR continua orquestrado
# pela shell — o que é produção aqui é só a conversão da câmera.
ph2d-host = { path = "../ph2d-host" }
ph2d-render = { path = "../ph2d-render" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }

[dev-dependencies]
# block_on para os testes GPU headless (`--ignored`), como os testes do ph2d-gpu.
# ⛔ TETO: ver `ph2d-gpu/Cargo.toml` (segurado pelo rfd).
pollster = "0.4.0"
ph2d-gpu = { path = "../ph2d-gpu" }
# O wire u8 dos 22 modos (Normal/Multiply) para montar a op-list do teste.
ph2d-painter-effects = { path = "../ph2d-painter-effects" }
# SÓ diagnóstico (`--ignored`): grava o alvo offscreen num PNG para OLHAR o pixel —
# o oráculo desta linha (BUGS #2: um gate verde pode conviver com o bug na tela).
image = { version = "0.25", default-features = false, features = ["png"] }
# O balde: o teste de ENCAIXE rasteriza a cena real (o fill que o solver devolve + a
# linha por cima) e mede o vão entre a cor e o contorno.
ph2d-flip-fill = { path = "../ph2d-flip-fill" }
# O Colorize: a sonda visual do zíper (6º smoke) rasteriza as regiões que o colorize
# devolve numa arte de MÃO (densa + ruidosa) — o pixel é o oráculo.
ph2d-flip-colorize = { path = "../ph2d-flip-colorize" }
# SÓ o gate de paridade da DUREZA (`tests/hardness_law.rs`): o perfil que o `flip.wgsl`
# pinta é a lei do Painter, e o oráculo tem de ser a função REAL dele — uma reescrita local
# seria a segunda porta da mesma pergunta. Crate FOLHA (`[dependencies]` vazio) e dev-only:
# o `src/` do flip-render não a toca (machete-safe), como as crates-nó do gate de paridade
# CPU×GPU da `line/gpu-nodes`.
ph2d-painter-brush = { path = "../ph2d-painter-brush" }

[lints]
workspace = true
