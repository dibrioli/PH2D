[package]
name = "ph2d-vector-fill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Foundational, ISOLATED drop-crate (ADR-0060 §2.1): the procedural-fill shader
# graph lives entirely here. It does NOT touch `ph2d-vector-doc`'s frozen
# StyleTable/FillRef contract — the Region⇄FillGraph reference is wired by the
# Coordenador (cross-crate plumbing), this crate stays self-sufficient.
[dependencies]
# 🔥 Reuse, don't reinvent (handoff §3): `noise1` (the deterministic integer
# hash, bit-identical CPU↔GPU) + `wgsl_prelude()` (the `ph2d_noise1` WGSL helper)
# are the parity substrate every 2D noise here is built on.
ph2d-expr = { path = "../ph2d-expr" }
# Authoring colors are OKLCH (Solid/gradient/ramp stops); `to_linear()` is the
# only correct sRGB-free path into the UBO's linear-light `vec4` slots.
ph2d-color = { path = "../ph2d-color" }
# glam — `Vec2`/`Vec3`/`Vec4` for the CPU reference evaluator + UBO authoring.
# Pinned to the vector-module convention (0.30, same as ph2d-vector{,-doc}).
glam = "0.30"
# SmallVec-backed FillGraph (ADR-0060: nodes inline 16, connections inline 32).
smallvec = { version = "1", features = ["union"] }
# Topology hash key (HR-6 hash family); only TOPOLOGY enters the hash, never
# params (they ride the UBO) — that's what makes animation recompile-free.
blake3 = "1"
# UBO is `#[repr(C)]` Pod so per-frame updates are a zero-copy `write_buffer`
# of `bytemuck::bytes_of(&ubo)` (HR-3 zero-alloc hot loop).
bytemuck = { version = "1", features = ["derive"] }
# Pre-flight: every generated shader is parsed + validated through naga (the
# same WGSL frontend wgpu uses) before it enters the compile cache, so an
# invalid topology fails at codegen time, not at GPU pipeline creation.
naga = { version = "28", features = ["wgsl-in"] }

# Golden/smoke integration test (`tests/diffusion_golden.rs`, W7): authors
# Vec2/OklchColor diffusion scenes through the public API, so it needs the same
# `glam` + `ph2d-color` the lib uses (Cargo dedups — same versions, no lock churn).
[dev-dependencies]
glam = "0.30"
ph2d-color = { path = "../ph2d-color" }
# GPU WoS parity + tier-budget gate (`tests/diffusion_gpu_parity.rs`, W7 — Coord):
# dispatches `diffusion.wgsl` and validates GPU↔CPU against `walk_on_spheres_field`.
# wgpu/ph2d-gpu are DEV-only — the lib stays compute-pipeline-free (impl's design).
ph2d-gpu = { path = "../ph2d-gpu" }
wgpu = "28"
bytemuck = { version = "1", features = ["derive"] }
ph2d-expr = { path = "../ph2d-expr" }
