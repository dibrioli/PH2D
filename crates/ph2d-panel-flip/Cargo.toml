[package]
name = "ph2d-panel-flip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Flip Style panel — typed `Panel<State>` (ADR-0114 W2). Right-docked (Inspector
# slot); visible only while the `flip` tool is active. Mode row (Select/Draw/
# Erase) + Brush section (size/hardness/opacity/smoothing) + Color swatch (OKLCH
# picker) + Layers section (add/delete/reorder/visibility/lock/opacity/blend).
# The tool `FloatingPanel` is unpainted, so this docked panel is the live UI
# (mirror of `ph2d-panel-vector`). The shell publishes the style + layers
# snapshots each frame via `set_current_flip_*` (flip_bridge).

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
# The Flip Style vocabulary (`FlipStyleSnapshot` + slider mappings) lives in the
# tool crate (mirror of `ph2d-tool-vector::params`): the panel reads the snapshot
# it paints + the slider↔value mapping from there.
ph2d-tool-flip = { path = "../ph2d-tool-flip" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-tokens = { path = "../ph2d-tokens" }
# Concrete paint types named by the section painters (Vello scene + text shaper).
ph2d-text = { path = "../ph2d-text" }
# The `VectorScene` type named by `BodyCtx` (mirror of the Vector / Painter-layers
# panels — the Vello scene the section painters draw into). Graphics only, no doc.
ph2d-vector = { path = "../ph2d-vector" }
# The blend-mode enum (`BlendMode::name()` + `MAX_BLEND_MODES`) for the per-layer
# blend dropdown — the SAME enum stored in `FlipLayer::blend` (mirror of the
# Painter layers panel depending on the blend enum). Names only; no doc-model dep.
ph2d-painter-effects = { path = "../ph2d-painter-effects" }

[dev-dependencies]
# Blindagem Fase 1.2: headless behavioral seam harness (populate → apply_event →
# bus → handle_panel_event). Dev-dep only — the cycle-prevention gate reads
# `[dependencies]` only, so this builds no runtime cycle.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
