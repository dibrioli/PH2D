[package]
name = "ph2d-vec-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# A pipeline de render da cena vetorial nova. Alcança vello/kurbo/peniko SÓ pelas
# re-exports de `ph2d-vector` (não importa vello direto) — fica gate-proof p/ o
# `vello_kurbo_only_in_ph2d_vector` (ADR-0059, deferido) e imune a skew de versão
# (os tipos são os mesmos monomórficos que o `VectorScene` do frame espera).
ph2d-vector = { path = "../ph2d-vector" }
# O modelo editor-first que esta pipeline renderiza.
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# Tokens de design (HR-15) — a alça de raio de quina é a primeira coisa TOKENIZADA deste
# crate. O overlay de âncoras e as alças de conector ainda usam literais (dívida da Fase
# 1, registrada no doc-comment delas); migrá-las muda a aparência do que já existe, e isso
# é decisão do Enio.
ph2d-tokens = { path = "../ph2d-tokens" }
