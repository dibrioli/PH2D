[package]
name = "ph2d-physics-outline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# The PRODUCER of the «Outline» collision shape (plan f2, W2c): picture → mask → trace → ECS write.
# Glue outside `ph2d-app-*` (their LOC ceilings); the app only calls it.
[dependencies]
# The session-only `OutlineSeen` component (not registered: outside save and undo).
bevy_ecs = "0.20"
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-render = { path = "../ph2d-render" }
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }
ph2d-outline-trace = { path = "../ph2d-outline-trace" }
ph2d-inspector-ordering = { path = "../ph2d-inspector-ordering" }
# The pixels (`AssetDb::image_rgba8`) and the card edit that asks for a retrace.
ph2d-asset = { path = "../ph2d-asset" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
# «Merge by distance» (a lei pura dos pontos e a seleção do canvas); W5 testa pelas portas do ponteiro.
ph2d-shape-handles = { path = "../ph2d-shape-handles" }
# Os pontos (51/52) nos canais: a chave anterior e o Fit que apaga a trilha (`canais_pontos`).
ph2d-anim = { path = "../ph2d-anim" }
ph2d-timeline = { path = "../ph2d-timeline" }

[dev-dependencies]
ph2d-core = { path = "../ph2d-core" }
ph2d-host = { path = "../ph2d-host" }

[lints]
workspace = true
