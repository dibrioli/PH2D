[package]
name = "ph2d-asset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Content-addressed identity per HR-6: blake3 over the raw bytes is the
# canonical AssetId. blake3 is the same hash family the spike used for
# C9 cross-OS replay determinism, so we get one hash crate, not two.
blake3 = "1"
# PNG decode for the M6 visual gate. `default-features = false` +
# explicit format opt-ins keep the dep slim. M14.4c added webp +
# jpeg to support the Import… button + drag-and-drop (M14.4d) of
# the most common sprite formats.
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
# Off-thread file watcher. notify wraps OS-native watchers (FSEvents on
# macOS, inotify on Linux, ReadDirectoryChangesW on Windows) and keeps
# its own background thread.
notify = "8"
# serde derives on AssetId so it can cross the postcard pipeline that
# PrefabDoc/SceneDoc (M14.3) and LuauScript (M14.2) consume.
serde = { version = "1", features = ["derive"] }
# postcard wire format for cooked Prefab/Scene assets (HR-6 + HR-14).
# The same crate `tests/spike/src/bin/c13_migration.rs` uses for
# save/replay snapshots — single canonical wire format.
postcard = { version = "1", features = ["alloc"] }
# JSON parser for M14.5 B hand-packed atlases (Aseprite + TexturePacker
# both export JSON). Aligned with ph2d-mcp's serde_json major.
serde_json = "1"
# ADR-0054 wire-up (W3.T1.0, 2026-05-27): bridge AssetDb decode path
# to the imageio pipeline so user-imported TIFF/ORA/APNG/PSD/GIF/
# .ph2d-native actually go through the 9 audited format crates (with
# OOM caps, NaN reject, path-traversal reject, recursion bomb caps,
# EOF semantics, etc.). Closes the X-HIGH-1 architectural gap flagged
# repeatedly in audits 7-12 ("registries dead-on-arrival"). PNG/WEBP/
# JPEG remain on the legacy `image` 0.25 path for back-compat (the
# imageio versions of PNG/WEBP/JPEG share the same `image` 0.25
# transitive dep, so no codec duplication — only dispatch glue).
ph2d-color = { path = "../ph2d-color" }
ph2d-imageio = { path = "../ph2d-imageio" }
ph2d-imageio-registry-init = { path = "../ph2d-imageio-registry-init" }

[dev-dependencies]
tempfile = "3"
