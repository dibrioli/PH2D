[package]
name = "ph2d-vector-kurbo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-vector-doc = { path = "../ph2d-vector-doc" }
# Math primitives — glam::Vec2 (the network carries glam vectors).
glam = "0.30"
# The lingua franca the geometry engines speak. Confined to this bridge crate so
# the node fan-out shares one VectorNetwork⇄BezPath conversion and kurbo stays in
# one place (the future `vello_kurbo_only_in_ph2d_vector` whitelist target).
kurbo = "0.13"
# Exact-topology boolean engine (ADR-0058 §2.2.2 / ADR-0065; cited in
# `docs/Vector Module/16_referencias.md`). MIT/Apache, kurbo-native.
linesweeper = "0.3"
