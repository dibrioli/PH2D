[package]
name = "ph2d-painter-fluid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Fluid Brushes Extension (ADR-0049, opt-in W15). Live watercolor wet-on-wet
# on the GPU. **Leaf, isolated, feature-gated.** Without `--features fluid` the
# crate is a no-op `stub` (mobile/web/CI builds pay zero binary + zero VRAM).
#
# **Solver = mirror of `ph2d_painter_brush::diffusion`** (gated diffusion-
# advection, Curtis 1997), NOT the Shallow-Water model ADR-0049 §2.7 sketched.
# Rationale (ADR-0049-amendment-1): the diffusion solver is the one that
# shipped + was visually ratified (ADR-0077 W15.2/D12), so the GPU path
# reproduces the validated look AND the CPU `diffusion.rs` is a true bit-near
# parity reference + the HR-5 det fallback. Gravity/gyroscope (§2.2/§2.6) is a
# Shallow-Water concept the diffusion model has no use for → `GravitySource` is
# kept (capped, forward-compat) but dormant in v1.

[features]
# **fluid** — compiles the real GPU solver + sim. Absent ⇒ `pub mod stub` no-op
# (ADR-0049 §2.1). Canon flag; the consumer (`ph2d-tool-painter`) re-exports it.
fluid = []
# **det-painter** — HR-5 cross-OS replay. The GPU solver is non-deterministic
# (ADR-0049 §2.11), so det builds run the CPU `diffusion` reference at reduced
# res. No-op until the det arm is wired (W15.3 phase 2).
det-painter = []

[dependencies]
# The proven diffusion solver is REUSED as the CPU reference + det fallback
# (handoff §2.A: "mirror of diffusion.rs"). Also the `Brush` type for the
# `fluid_enabled` opt-in check.
ph2d-painter-brush = { path = "../ph2d-painter-brush" }
# GpuContext (Device/Queue) for the GPU compute solver (phase 2 pipeline).
ph2d-gpu = { path = "../ph2d-gpu" }
# Versioned postcard-friendly params (FluidParams/GravitySource serialize like
# every other brush param so MCP/replay can drive the sim — ADR-0049 §2.5/§2.6).
serde = { version = "1", features = ["derive"] }
# `#[repr(C)]` Pod UBO for zero-copy per-frame `write_buffer` of the solver
# coefficients (HR-3).
bytemuck = { version = "1", features = ["derive"] }
# Direct wgpu types for the compute pipeline / bind groups (phase 2). Pinned to
# match ph2d-gpu (version skew → Comfy post-mortem, SKILL §15).
wgpu = "28"

[dev-dependencies]
# Pre-flight WGSL validation: the solver shader is parsed + analyzed through the
# same frontend wgpu uses, so an invalid shader fails at test time, not GPU init.
naga = { version = "28", features = ["wgsl-in"] }
