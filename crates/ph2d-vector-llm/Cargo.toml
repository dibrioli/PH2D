[package]
name = "ph2d-vector-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Frozen data model + primitives + the adversarial caps (MAX_SPIRAL_TURNS etc.)
# this crate's sanitizer enforces (ADR-0056 / ADR-0061 §2.8). Read-only.
ph2d-vector-doc = { path = "../ph2d-vector-doc" }
# LLM4SVG semantic tokens are structured JSON (ADR-0061 §2.3) — typed serde
# deserialization IS the first validation layer (unknown/ill-typed → rejected).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# blake3 — prompt_hash for the (prompt_hash, seed) result cache key (§2.1/§3.3).
blake3 = "1"
# glam::Vec2 — the network's coordinate type.
glam = "0.30"
