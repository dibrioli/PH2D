[lib]

# The IR + lowerings (expr/eval/wgsl) are dependency-free; the `stream` module
# adds the Field->column glue over ph2d-nodegraph's attribute Stream, so the
# crate depends on the (leaf) substrate. Acyclic: nodegraph does not depend back.
[dependencies]
ph2d-nodegraph = { path = "../ph2d-nodegraph" }
