[package]
name = "ph2d-vector-sdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# `ph2d-vector-sdf` — the **draft** half of ADR-0065's draft+reconcile vector
# boolean (the exact half is `linesweeper` via `ph2d-vector-kurbo`). Computes a
# 2-D signed-distance field of a `VectorNetwork`'s filled silhouette, and
# combines two SDFs with the trivial `min/max` boolean kernel — a real-time
# preview during slider/morph drag (NOT topology). Pure-Rust core first (the
# source of truth + a CPU silhouette fallback + the GPU parity oracle); the GPU
# compute port (wgpu) lands behind the same `min/max` algorithm (ADR-0065 §2.1).
[dependencies]
ph2d-vector-doc = { path = "../ph2d-vector-doc" }
glam = "0.30"
