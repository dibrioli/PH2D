[workspace]
resolver = "3"
# Glob membership: every crate under crates/ and tools/ is a member
# automatically. Dropping a new crate (e.g. a `ph2d-node-*` for fan-out) needs
# ZERO edit here — removing the manual list removes the last central-file
# collision point for parallel agents (audit 2026-05-22, codegen-A1).
# `tests/` is NOT globbed (tests/fixtures has no Cargo.toml); shells listed
# explicitly until the mobile/web shells exist.
members = [
    "crates/*",
    "tools/*",
    "shells/desktop",
    "tests/spike",
]
# Vendored third-party code (ADR-0123 W7): the DeepFilterNet `libDF` runner, copied
# under `ph2d-audio-ml` and consumed as a path dependency. Excluded from the
# workspace so it is treated as an ordinary dependency (`--cap-lints allow`) rather
# than a member: our `-D warnings` clippy, `machete`, `deny` and fmt do not police
# code we did not write. Its own `[lints]` and licences travel with it.
exclude = [
    "crates/ph2d-audio-ml/vendor/deep_filter",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV = o piso MEDIDO, e ele é o próprio pin (2026-08-18). O `1.92` que morava
# aqui era FALSO por dois mecanismos independentes: as deps (cranelift/pulley/
# wasmtime exigem 1.94) e o nosso código (dois `if let` guards em
# `input_dispatch.rs`, estáveis só em 1.95). O gate que devia pegar isto nunca
# rodou 1.92 — `rust-toolchain.toml` vence `rustup default` —, então ele media o
# PIN e ficava verde. Ver
# `crates/ph2d-editor-core/tests/it/architecture_msrv_is_the_pinned_toolchain.rs`
# (o caminho `tests/…` que esta nota citava nunca existiu na raiz).
#
# 1.95 → 1.98 em 2026-08-29 (`docs/Atualizar Stack/`, bloco A). O piso volta a ser
# o pin por construção; se alguém quiser de facto suportar compilador mais velho,
# é aquele gate que fica vermelho e obriga a decisão a ser tomada de propósito.
rust-version = "1.98"
publish = false
license = "LicenseRef-Proprietary"
authors = ["Enio Oliveira Dias Brito <dibrioli@gmail.com>"]

[workspace.lints.rust]
# ⛔ `unsafe` é PROIBIDO em toda crate da workspace — e em TODOS os alvos (lib, bin, `tests/`,
# `benches/`, `examples/`, `build.rs`), coisa que o `#![forbid(unsafe_code)]` no `lib.rs` nunca
# cobriu. Cada membro herda por `[lints] workspace = true`; o gate
# `crates/ph2d-editor-core/tests/it/architecture_every_member_inherits_the_workspace_lints.rs`
# afirma-o, com as DUAS excepções nomeadas (FFI). Auditoria de arquitectura 2026-09-12, A2: o
# atributo não viajou com o código quando as famílias saíram da shell.
unsafe_code = "forbid"

[profile.dev]
opt-level = 0
# `line-tables-only` (era `true` = DWARF completo) — medido 2026-09-10 (auditoria de
# velocidade §4-C8, A/B a frio sobre a amostra da DIRETIVA §2-bis: `cargo build --tests
# -p ph2d-anim -p ph2d-timeline`): 22,2 s · 2,2 GB → 20,9 s · 1,8 GB (deps 1,6 → 1,2 GB,
# **−25 % de disco**). O backtrace mantém `file:line` (é a `.debug_line`, que este nível
# guarda); o que sai é a informação de tipos/variáveis para o `gdb`, que ninguém usa no
# ciclo de teste. A Oxide (omicron) usa o mesmo valor. ⚠️ Mudar isto refaz o `target/debug`
# de cada worktree uma vez.
debug = "line-tables-only"
# ⚠️ **O DWARF fica nos `.o`/`.dwo` em vez de ser COPIADO para dentro de cada artefato.** Medido em
# 2026-08-16 (A/B sobre `cargo build --tests -p ph2d-anim -p ph2d-timeline`, targets separados):
# `off` = 11 GB · `unpacked` = 4,4 GB, com os 6.479 `.dwo` JÁ contados — **2,5×, 60% a menos**.
# O preço foi medido e é pequeno: a `.debug_line` SOBREVIVE no binário (conferido por `readelf -S`),
# que é a seção de onde um backtrace tira `file:line`, e a mensagem de pânico nem depende de DWARF
# (vem do `core::panic::Location`). O binário encolhe só 26% — o ganho não está nele, está em não
# duplicar a informação de depuração por toda a árvore. Racional e tabela:
# `docs/IntegracaoMultiAgente/DIRETIVA_FIM_DE_DIA.md` §2-bis, Regra 3.
split-debuginfo = "unpacked"

# The watercolor render-path is real per-pixel math (Beer–Lambert LUTs, box blurs, procedural paper,
# rayon fan-out) — at opt-0 it is ~4× slower (measured 10.9 vs 2.9 ms/frame at max knobs), which pushed
# a `cargo run` smoke past the frame budget and read as a "grave FPS drop" that release builds don't
# have. Optimise JUST the paint-math crates in dev (same per-package idiom as `ci-test` below): smoke
# runs stay realistic, everything else keeps fast unoptimised builds.
[profile.dev.package.ph2d-tool-painter]
opt-level = 2
[profile.dev.package.ph2d-painter-brush]
opt-level = 2
[profile.dev.package.ph2d-color]
opt-level = 2
[profile.dev.package.rayon]
opt-level = 2
# Same bargain for the audio DSP (W5, ADR-0115): the spectral tools are per-sample and
# per-bin arithmetic, and at opt-0 they are 15-25x slower — a spectral repair goes from
# 67 ms to 3.1 s, and resizing the spectrogram overlay from 3 ms/frame to 40 ms/frame. That
# is a `cargo run` smoke reporting the feature as broken while the release build is fine,
# which is exactly the phantom "grave FPS drop" this section was created for.
[profile.dev.package.ph2d-audio-spectral]
opt-level = 2
[profile.dev.package.ph2d-audio-edit]
opt-level = 2
[profile.dev.package.realfft]
opt-level = 2
[profile.dev.package.rustfft]
opt-level = 2

# ⭐⭐⭐ **O MESMO NEGÓCIO PARA A CADEIA DE QUADS** (2026-09-15) — e aqui ele não foi escolhido por
# analogia: ele foi **MEDIDO contra um gate VERMELHO**.
#
# Desde 2026-09-10 todo teste deste repo tem tecto de tempo (60 s avisa, **180 s mata**). Corrida a
# suíte inteira, **onze** testes eram MORTOS pelo tecto, e **seis** continuavam a sê-lo sozinhos a
# `load 17` — logo não é a família de flakes de carga do `CLAUDE.md` §5.0, é o perfil de build. As
# quatro crates são as mesmas do botão `Quad Retopology`, e o trabalho delas é aritmética de ponto
# flutuante em varreduras de malha, que é exactamente o caso que as duas notas acima já registaram.
#
# Medido nesta máquina (`cargo nextest run -p ph2d-gridmap -p ph2d-quadchain -p ph2d-quadextract
# -p ph2d-quadfill`, `load 18-21`):
#
#   | perfil | suíte | pior teste | mortos pelo tecto |
#   |---|---|---|---|
#   | `dev` (opt-0) | `181,9 s` | **morto a 180 s** | **6 de 196** |
#   | só as 4 que estouravam | `108,6 s` | `108,2 s` | 0 |
#   | **as 8 da cadeia** | **`71,4 s`** | **`71,3 s`** | **0** |
#
# ⚠️ **As outras quatro (`quantize`, `trace`, `crossfield`, `remesh-iso`) entram porque o TRABALHO
# mora nelas** — as que estouravam só o chamavam. Elas compram `108 → 71 s` no pior teste, que é a
# diferença entre passar com `72 s` de folga contra o tecto e passar com `72 s` de dívida.
#
# ⛔ **Isto não é uma optimização do produto**: o `--release` já era rápido, e o que estava partido
# era só a corrida de testes em `dev`. O `cargo check -p` do laço interno não é tocado.
[profile.dev.package.ph2d-gridmap]
opt-level = 2
[profile.dev.package.ph2d-quadchain]
opt-level = 2
[profile.dev.package.ph2d-quadextract]
opt-level = 2
[profile.dev.package.ph2d-quadfill]
opt-level = 2
[profile.dev.package.ph2d-quantize]
opt-level = 2
[profile.dev.package.ph2d-trace]
opt-level = 2
[profile.dev.package.ph2d-crossfield]
opt-level = 2
[profile.dev.package.ph2d-remesh-iso]
opt-level = 2

# ⭐⭐ **E O MESMO NEGÓCIO PARA OS PESOS DE PELE** (2026-09-15) — a terceira vez que esta lista
# cresce, e sempre pelo mesmo motivo escrito acima: *aritmética de ponto flutuante em varreduras de
# malha*.
#
# O `ph2d-skin-weights` resolve um problema variacional sobre a malha da arte (gradiente conjugado
# com conjunto activo, `Q·x = L(M⁻¹(Lx))` por iteração) e a `ph2d-poly2d` é a malha sobre a qual ele
# corre. ⚠️ **Medido nesta árvore:** a sonda da densidade da cena do osso (cinco malhas, `780` a
# `11 286` triângulos) demorou **mais de 5 minutos** a `opt-0` — e o tecto de morte de um teste
# deste repo é `180 s`.
#
# ⛔ **Isto não é uma optimização do produto:** o gesto de prender corre no `--profile smoke`
# (que herda `release`), onde o solver já custa `16 ms` numa malha típica. O que estava partido era
# a corrida de TESTES em `dev`.
[profile.dev.package.ph2d-skin-weights]
opt-level = 2
[profile.dev.package.ph2d-poly2d]
opt-level = 2

# ⭐⭐⭐ **O MESMO NEGÓCIO PARA O CAMPO IMPLÍCITO** (W147) — e aqui ele foi MEDIDO, não herdado.
#
# O modelador SDF avalia um campo **ponto a ponto** em varreduras de `78³`, e os censos dele são o
# poste do relógio desta workspace. Medido em 2026-09-10, o MESMO trabalho (o `worst_gradient` das
# 58 primitivas do catálogo):
#
#   | `--release` | `3,85 s` |
#   | `dev` (opt-0) | **`44 s`** |
#
# **`11,4×`** — dentro da faixa de `15-25×` que a nota do áudio, seis linhas acima, já tinha
# registado para aritmética por-amostra.
#
# ⚠️⚠️ **É por isto que a caça à optimização deste módulo andou a perseguir o alvo errado:** eu
# contei as avaliações, construí uma varredura em LOTE que é `2,6×` mais rápida isolada, liguei-a ao
# censo e o teste melhorou **`5 %`** — porque a `opt-0` a descodificação que o lote amortiza está
# afogada em código não-optimizado. *O tecto não estava no algoritmo; estava no perfil de build.*
#
# ⛔ A `fidget` entra com eles: o `BinaryOpcode::eval` é a função dela, e a `opt-0` ela nem sequer é
# inlinada — cada nó da fita paga uma chamada.
[profile.dev.package.ph2d-field-eval]
opt-level = 2
[profile.dev.package.ph2d-field]
opt-level = 2
[profile.dev.package.fidget]
opt-level = 2
[profile.dev.package.fidget-core]
opt-level = 2

# ⛔⛔⛔ **E O TRAÇADOR E O MATERIAL FALTAVAM, o que tornava toda comparação CPU-contra-PLACA deste
# módulo inválida** (medido 2026-09-15). A `ph2d-field-render` marcha o campo e pinta cada pixel, e a
# `ph2d-material` é a lei OpenPBR por amostra — as duas ficavam a `opt-0` enquanto o WGSL equivalente
# era compilado pelo driver com tudo ligado. ⇒ o quadro de referência lia-se **artificialmente
# lento**, e a travessia derivada dele (`MAX_VIVOS`, depois `MAX_GUARDADOS`) media o perfil de build.
#
# ⚠️ **A nota de 10/09 recusava esta junção** — *«juntar `ph2d-field-render` · `-mesh` · `-profile`
# parte um teste (`quadro MORNO … pagou 4`), sem mecanismo que o explique»*. ⭐ Esse teste foi
# **curado em 13/09**: ele contava um memo atrás de estado POR THREAD, e hoje corre numa pool de UMA
# thread. *Quem move o número que tornava algo inalcançável tem de reconferir a nota* (§0.0) — e as
# duas crates que entram aqui são as que o quadro de referência corre, não as três da recusa.
[profile.dev.package.ph2d-field-render]
opt-level = 2
[profile.dev.package.ph2d-material]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true

# `smoke` — o perfil do CICLO do dono e do binário que a linha deixa construído
# (CLAUDE.md §5.0, DIRETRIZ §1.5.9 item 9). O `release` continua a ser o que se
# ENTREGA e o que se MEDE. Medido 2026-09-10 (auditoria de velocidade, §3.9-b):
# reconstruir a shell depois de UMA linha editada custa 161 s no `release`
# (`codegen-units = 1` + thin LTO = a crate de 306 k linhas optimizada num só
# thread, 31 núcleos parados) e **3,0 s** aqui; a frio, 75 s contra 184 s. O que
# se perde é a optimização entre crates (LTO): smokes de PERFORMANCE (tectos,
# o Motion a milhões de objectos, PH2D_PAINT_PERF) continuam a pedir `--release`.
# ⚠️ Este perfil tem `incremental/` próprio (`target/smoke/incremental`); a regra
# de fecho `rm -rf target/*/incremental` apaga-o sem risco — só custa o re-aquecer.
[profile.smoke]
inherits = "release"
codegen-units = 16
lto = "off"
incremental = true

# CI-tuned test profile. Used by the workflow's `cargo nextest run
# --cargo-profile ci-test` and `cargo test --doc --profile ci-test`
# calls instead of `--release`.
#
# Why: profile.release has `lto = "thin"` + `codegen-units = 1` for
# distribution builds. Running tests under that profile pays the
# distribution-grade link cost on every CI call — the dominant
# contributor to the Windows job hitting the 30 min timeout.
#
# Trade-off accepted: workspace-local code compiles unoptimized
# (debug-grade speed), but dependencies (wgpu, wasmtime, bevy_ecs,
# vello, etc.) stay at opt-level=3 so test runtime stays fast.
# `package."*"` matches only direct dependencies, NOT workspace
# members — workspace members inherit the top-level `opt-level=1`.
# Performance-sensitive spike fixtures (c4_hot_reload, c14_memory,
# c11_bevy) still use `--release` in their dedicated steps.
[profile.ci-test]
inherits = "dev"
opt-level = 1
debug = false
lto = "off"
codegen-units = 16
# O `ci-test` corre em BATCH (workspace inteiro, 1-2× por jornada): incremental
# não colhe nada e custava 26 GB de `target/ci-test/incremental` no primário
# (medido 2026-09-10). A regra `CARGO_INCREMENTAL=0` vivia em dois scripts e no
# CLAUDE.md — e o `incremental/` provou que alguém correu o perfil sem ela. Aqui
# ela está no ficheiro que o cargo lê; o `dev` (inner loop) fica intacto.
incremental = false

[profile.ci-test.package."*"]
opt-level = 3
