[package]
name = "ph2d-app-sculpt3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐ **ESTA LISTA É O CUSTO REAL DO MÓDULO, e ele só se lê aqui** (HOWTO §1.3). Dentro da shell
# todas estas crates eram dependência do binário e ninguém as somava a esta família.
#
# ⚠️⚠️ **A crate era ZERO-DEPS e NÃO-OPCIONAL na Fase A, e as duas coisas mudaram juntas** — não
# por conveniência, mas porque a razão que as prendia dissolveu-se. A Fase A escreveu, aqui:
# *«não pode ganhar dependências: quem nunca esculpe paga-as»*, e ancorou nisso o passa-adiante do
# `sculpt_doc`. A Fase B mede o resto da frase: uma crate que carrega a FAMÍLIA carrega 28 deps, e
# mantê-la não-opcional faria toda a gente pagar a escultura inteira. ⇒ ela passa a **opcional**,
# como as outras quatro crates do módulo, e **o passa-adiante volta a ser um campo `Vec<u8>` na
# `App`** — que é onde ele sempre esteve antes da Fase A, e o único sítio onde ele pode cumprir a
# promessa. *A cerca era sobre o DOCUMENTO, nunca sobre a crate.*
[dependencies]
# ⚠️ A INTERFACE da shell (`AppFamily`, `AppHost`), não o agregador — importar de
# `ph2d-app-registry-init` fecharia o ciclo `registry → família → registry`.
ph2d-form-donation = { path = "../ph2d-form-donation" }
ph2d-app-host = { path = "../ph2d-app-host" }
# ⭐ A moldura 3D partilhada com a família do campo implícito (HOWTO §1.2). É ela que faz os cinco
# alias `field3d_*` da shell poderem MORRER: os 46 usos desta família passam a nomeá-la.
ph2d-viewport3d = { path = "../ph2d-viewport3d" }

ph2d-core = { path = "../ph2d-core" }
ph2d-crossfield = { path = "../ph2d-crossfield" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-gridmap = { path = "../ph2d-gridmap" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-light = { path = "../ph2d-light" }
ph2d-mesh = { path = "../ph2d-mesh" }
ph2d-mesh-colors = { path = "../ph2d-mesh-colors" }
# ⚠️ **SÓ o PNG**, e a razão é o tecto de dependências desta família: o assado
# grava uma imagem e não lê nenhuma. `default-features = false` é o mesmo que a
# shell já declara para o exportador da folha de sprites.
image = { version = "0.25", default-features = false, features = ["png"] }

# A lei do corte (o desenho vira volume) e a fronteira que corta. Ver o
# ADR-0170 e a `SPEC_trim_gesture.md`.
ph2d-trim = { path = "../ph2d-trim" }
ph2d-mesh-bool = { path = "../ph2d-mesh-bool" }
ph2d-mesh-render = { path = "../ph2d-mesh-render" }
ph2d-painter-brush = { path = "../ph2d-painter-brush" }
# ⭐ O Painter pinta a peça (`painter_na_malha`): família → ferramenta é a
# família a compor a UI do módulo dela, que a lei das camadas permite.
ph2d-tool-painter = { path = "../ph2d-tool-painter" }
ph2d-panel-sculpt3d = { path = "../ph2d-panel-sculpt3d" }
ph2d-quadchain = { path = "../ph2d-quadchain" }
ph2d-quadextract = { path = "../ph2d-quadextract" }
ph2d-quadfill = { path = "../ph2d-quadfill" }
ph2d-quadflow = { path = "../ph2d-quadflow" }
ph2d-quantize = { path = "../ph2d-quantize" }
ph2d-remesh-iso = { path = "../ph2d-remesh-iso" }
ph2d-render = { path = "../ph2d-render" }
ph2d-sculpt3d = { path = "../ph2d-sculpt3d" }
ph2d-sdf = { path = "../ph2d-sdf" }
ph2d-trace = { path = "../ph2d-trace" }
ph2d-untangle = { path = "../ph2d-untangle" }
ph2d-vector = { path = "../ph2d-vector" }
rfd = "0.17"
postcard = { version = "1", features = ["alloc"] }
rayon = "1"
serde = { version = "1", features = ["rc"] }
wgpu = "29.0.4"
winit = "0.30"

[features]
# ⚠️ **`test-support` tem o tamanho do que ATRAVESSA a fronteira, e nada mais** (HOWTO §2.5): um
# `#[cfg(test)]` é invisível do outro lado de uma crate, e abrir os itens todos «por segurança»
# entrega `dead_code` no que ninguém lê. A shell liga-a nas **dev-dependencies**.
test-support = []

[dev-dependencies]
# A régua lexical do HR-15, para o gate por crate (`tests/it/`).
ph2d-label-census = { path = "../ph2d-label-census" }
# ⚠️ **A SEMENTE DE COR do censo dos knobs, e só ela:** os dois verbos que leem
# o ANEL de cor medem-se inertes sobre uma peça branca (a média de branco é
# branco), e a lei que põe a cor a variar vive num `#[cfg(test)]` da outra
# crate — invisível daqui. ⛔ `dev` de propósito: o produto nunca semeia cor.
ph2d-sculpt3d = { path = "../ph2d-sculpt3d", features = ["test-support"] }
# ⚠️ **A RÉGUA DO BALÃO, e as duas são de TESTE:** o gate `o_aviso_cabe_no_balao`
# mede a frase do aviso contra o orçamento real do balão, e para isso precisa do
# sistema de texto (que mede) e do corpo da fonte (o token em que o pintor
# desenha). ⛔ `dev` de propósito: o produto desta crate não mede texto.
ph2d-text = { path = "../ph2d-text" }
ph2d-tokens = { path = "../ph2d-tokens" }

[lints]
workspace = true
