[package]
name = "ph2d-imageio-svg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# `ph2d-imageio-svg` — SVG **parse-only** validator + (deferred)
# vector decode + export (W3.T5). W3.T5 ships `usvg = "0.43"` parse
# (resolves <use>, <style>, gradients into a flat tree) — the tree
# is dropped and the importer returns
# `DecodedImage::Vector(VectorDoc::default())`. The vector body
# (kurbo::BezPath paint stack) is reserved for W3+ ph2d-vector
# amendment. Rasterize-on-import (`resvg`) and SVG export are both
# **deferred** to W3+. Audit-13 Lens FF F3 (2026-05-27): earlier
# comment promised "parse + rasterize-on-import"; corrected to
# "parse-only validator" — rasterize wire-up lands with first real
# client. Audit-13 Lens HH FIN-1 (2026-05-27): `image_href_resolver`
# overridden to neutralise `<image href=…>` filesystem reads.

[dependencies]
ph2d-imageio = { path = "../ph2d-imageio" }
# usvg is the canonical pure-Rust SVG simplifier; parse-only
# validation in W3.T5 (the tree is dropped — see crate doc).
#
# ⚠️ **A feature `svgz` NÃO é opcional para nós, e a ausência dela seria uma regressão
# SILENCIOSA.** Até à 0.43 o `flate2` era dependência não-opcional do usvg, então um `.svg` que
# por dentro é gzip entrava no descompressor. Na 0.48 ele passou para trás desta feature, e sem
# ela o mesmo ficheiro recebe `Err("...enable svgz cargo feature...")`. Medido 2026-08-29, mesma
# entrada nas duas versões. O `flate2` já está no grafo por outros 7 consumidores ⇒ custo zero.
#
# ⭐ Subir também COLAPSA o `kurbo`: a 0.43 arrastava `kurbo 0.11.3` via `svgtypes 0.15`, e era o
# ÚNICO consumidor dessa cópia — a 0.48 pede `^0.13`, que é a que o resto da árvore já usa.
usvg = { version = "0.48", default-features = false, features = ["svgz"] }
