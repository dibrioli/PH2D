[package]
name = "ph2d-pixel-cena"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# O Pixel Sprite na cena (`docs/PixelArt/P14_plano.md` §4): o documento é a verdade e o motor lê
# derivados não gravados. PURA: o mundo e o documento entram, nada de app nem UI.
# ⛔ Nunca depende de `ph2d-app-pixel`: a família compõe esta crate, não o contrário.
[dependencies]
ph2d-pixel-core = { path = "../ph2d-pixel-core" }
ph2d-ecs = { path = "../ph2d-ecs" }
# O `#[derive(Component)]` do `DerivadoDe` expande para caminhos `bevy_ecs::`.
bevy_ecs = "0.20"

[dev-dependencies]
# O gate da porta única: o `.ase` que o Pixel grava, lido pelo leitor do import.
ph2d-pixel-io = { path = "../ph2d-pixel-io" }
ph2d-aseprite = { path = "../ph2d-aseprite" }

[lints]
workspace = true
