[package]
name = "ph2d-panel-skeleton"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐⭐⭐ O painel do ESQUELETO — typed `Panel<State>` (ADR-0029), coluna da direita.
#
# ⛔⛔ Ele era uma SECÇÃO do painel de vetor, e saiu de lá por ordem do dono (2026-09-09) depois de
# uma medição: com só um osso escolhido, o cabeçalho dela caía em `y = 1394 px` sobre uma faixa
# visível de `774`, com **785 px** de secções acima que falam de coisas que um osso não tem —
# traço, preenchimento, mistura, morph. *Ela nunca cabia na tela por si.*
#
# ⚠️ Os ids NÃO foram renomeados: um `NodeId` é o hash de uma STRING, e renomear a string quebra
# tudo o que a referencia por nome. `vector.bone.*` continua a ser o endereço; o que mudou é quem
# os pinta.

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y        = { path = "../ph2d-a11y" }
ph2d-tokens      = { path = "../ph2d-tokens" }
ph2d-i18n        = { path = "../ph2d-i18n" }
ph2d-skeleton    = { path = "../ph2d-skeleton" }
# ⚠️ **O `ph2d-vector` e o `ph2d-text` SAÍRAM na integração de 2026-09-10** (`cargo machete`): este
# painel nasceu com o `Cargo.toml` de um irmão e nunca chegou a nomear nenhum dos dois — quem pinta
# fala com o `ph2d-editor-core` (`paint::rect_to_vello`, `panel::PaintCtx`). ⛔ Só o `ship.sh` corre
# o `machete`, e nenhuma das seis worktrees da rodada o correu.

[dev-dependencies]
ph2d-host = { path = "../ph2d-host" }
bumpalo   = "3"
# Arnês headless de costura — dev-dep só, o `architecture_cycle_prevention` lê `[dependencies]`.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }

[lints]
workspace = true
