[package]
name = "ph2d-expr-recipes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# The RECIPE CATALOG (plano 10) -- the artist-facing half of expressions. A recipe
# is a named, knobbed fragment that EMITS text in the VEX-lite language; a stack of
# recipes folds into ONE formula (`RecipeStack::to_formula`). The catalog is the
# single table four consumers read (paint / populate / event / seam), so a recipe
# added here is born painted, registered, live and swept.
#
# Dependency-free on purpose. It emits STRINGS -- it does not parse and does not
# evaluate -- so it stays a leaf that the timeline UI *and* the Motion node's
# `motion.expression` can both consume (one catalog, two consumers; the echo of
# "one parser, two consumers" from ADR-0144).
[dependencies]

# The parser and the frozen IR are dev-only: the GATES prove that every emitted
# formula parses and that composing two rows equals composing their functions.
# Keeping them out of [dependencies] is what keeps the catalog a leaf -- the
# machete-safe shape `ph2d-gpu-cook` uses with the node crates it only gates.
[dev-dependencies]
ph2d-expr = { path = "../ph2d-expr" }
ph2d-expr-parse = { path = "../ph2d-expr-parse" }
