[package]
name = "ph2d-fx-cells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-fx-op = { path = "../ph2d-fx-op" }
# O empacotador (`fx_atlas`), a pilha (`FxStackPass`), as sprites (`SpriteRenderer`) e a colagem.
ph2d-render = { path = "../ph2d-render" }
# As formas da placa: o passe que as desenha e que mede as caixas delas.
ph2d-shape-gpu = { path = "../ph2d-shape-gpu" }
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-host = { path = "../ph2d-host" }
wgpu = "29.0.4"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
# O disco da fixtura (o `Circle` do kurbo, pela porta única).
ph2d-vector = { path = "../ph2d-vector" }
# A lente do relógio (o passe da lente ao lado da camada, no MESMO processo).
ph2d-lens = { path = "../ph2d-lens" }

[lints]
workspace = true
