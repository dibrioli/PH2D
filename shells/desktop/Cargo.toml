# famílias é uma FOLHA — nunca a casa de uma delas (ADR-0075, HOWTO §1.2). O bloco é
# append-only de propósito: uma linha nova acrescenta ao fim e não colide com ninguém.
ph2d-unique-name = { path = "../../crates/ph2d-unique-name" }
ph2d-entity-visibility = { path = "../../crates/ph2d-entity-visibility" }
ph2d-app-skeleton = { path = "../../crates/ph2d-app-skeleton" }
ph2d-skeleton-demo = { path = "../../crates/ph2d-skeleton-demo" }
ph2d-preview-drive = { path = "../../crates/ph2d-preview-drive" }
ph2d-inspector-ordering = { path = "../../crates/ph2d-inspector-ordering" }
ph2d-transport = { path = "../../crates/ph2d-transport" }
ph2d-vec-entities = { path = "../../crates/ph2d-vec-entities" }
ph2d-app-audio = { path = "../../crates/ph2d-app-audio" }
# A porta de ABRIR ficheiros de áudio (os filtros do diálogo) — desceu para a crate que descodifica.
ph2d-audio-decode = { path = "../../crates/ph2d-audio-decode" }

[dev-dependencies]
# A régua lexical do HR-15 — o gate `every_word_the_shell_shows_comes_from_the_string_table`.
ph2d-label-census = { path = "../../crates/ph2d-label-census" }
# ⚠️ **Estas quatro eram `[dependencies]` e só os TESTES as usam** (0 usos em `src/`, 3–5 em
# `tests/`): a declaração mentia sobre o que o binário leva, e o `cargo machete` não o vê porque
# conta `tests/` como uso (auditoria de arquitectura 2026-09-12, A6). No produto, os três nós
# chegam pelo `ph2d-node-registry-init` e o painel pelo `ph2d-panel-registry-init`.
ph2d-panel-sculpt3d = { path = "../../crates/ph2d-panel-sculpt3d" }
ph2d-node-motion-trail = { path = "../../crates/ph2d-node-motion-trail" }
ph2d-node-motion-strobe = { path = "../../crates/ph2d-node-motion-strobe" }
# …e o TERCEIRO escritor da coluna (doc 89 folha 11): o `shadow_blend` do `fx.drop_shadow`.
ph2d-node-fx-drop-shadow = { path = "../../crates/ph2d-node-fx-drop-shadow" }
# ⚠️ §2.5 — a feature que torna o `driven_value_for_probe` visível ao `driven_row_smoke`.
ph2d-app-motion = { path = "../../crates/ph2d-app-motion", features = ["test-support"] }
# ⚠️ **O arnês do §11 da física** (HOWTO §2.5): três gates ficam nesta shell
# porque atravessam a porta de produção `component_attach::attach_by_name`, e o
# `#[cfg(test)]` da crate é falso quando é ELA a ser compilada como dependência.
ph2d-app-physics = { path = "../../crates/ph2d-app-physics", features = ["test-support"] }
# ⚠️ §2.5 — DUAS costuras de teste ficam nesta shell porque o sujeito delas é meio
# chrome de famílias que ainda não saíram (`render_loop/inspector_presence_probe`
# e `hero_intents/texture_rebind`), e o arnês que elas montam mudou-se para a
# crate. Ver o `test_support` dela, que nomeia as duas.
ph2d-app-components = { path = "../../crates/ph2d-app-components", features = ["test-support"] }
# W2 — os auxiliares de gate da família (`forget_*`, `sync_scene`, …) vivem atrás da feature
# `test-support`: um `#[cfg(test)]` da família é invisível para um teste da shell.
ph2d-app-field3d = { path = "../../crates/ph2d-app-field3d", features = ["test-support"] }
# E o mesmo para a escultura (W2/L3-B): o `encode_doc` que as fixtures de `project_tests`
# consomem era `#[cfg(test)]` da família, e um `cfg(test)` não atravessa uma crate.
ph2d-app-sculpt3d = { path = "../../crates/ph2d-app-sculpt3d", features = ["test-support"] }
# E o mesmo para a folha da pré-visualização (line/shell-folhas): os gates do `preview_drive`
# ficaram na shell porque medem a CAPTURA dela, e dois auxiliares `#[cfg(test)]` do memo
# (`is_empty`, `drivers_of`) passaram a atravessar uma fronteira de crate.
ph2d-app-skeleton = { path = "../../crates/ph2d-app-skeleton", features = ["test-support"] }
ph2d-preview-drive = { path = "../../crates/ph2d-preview-drive", features = ["test-support"] }
# E a fixtura da ponte do vetor (`setup`/`bits`): o irmão da selecção usa-a de dentro da crate e
# o ficheiro de gates que ficou na shell de fora — uma porta só para as duas.
ph2d-vec-entities = { path = "../../crates/ph2d-vec-entities", features = ["test-support"] }
# E o livro das vozes da cena: o `decoded_ok` que o gate do `render_loop` lê era `#[cfg(test)]`.
ph2d-app-audio = { path = "../../crates/ph2d-app-audio", features = ["test-support"] }
# E o `TokenCtx::factory` da família do vetor (W2/L4-B2): quatro ficheiros da shell constroem a
# régua de tokens, e ela é `#[cfg(test)]` — invisível assim que o `vec_bindings` mudou de crate.
ph2d-app-vec = { path = "../../crates/ph2d-app-vec", features = ["test-support"] }
# E os dois auxiliares da folha do esqueleto (`quadro`, `pior_desvio`): o gate da SEQUÊNCIA do
# smoke ficou na shell porque a pose ficou, e eles eram `#[cfg(test)]` da crate.
ph2d-skeleton-live = { path = "../../crates/ph2d-skeleton-live", features = ["test-support"] }
# O harness headless de painel (`MockPanelHost`) — a shell precisa dele para medir a
# GEOMETRIA que um painel de fato registra. O censo de linhas (doc 88 B3) mede quantas
# linhas um nó produz; a metade que faltava é se elas CABEM na altura do dock, e a única
# testemunha honesta disso são os retângulos que o próprio painel registrou (uma segunda
# aritmética de altura ao lado dele divergiria no dia em que uma linha composta mudar).
ph2d-ui-testkit = { path = "../../crates/ph2d-ui-testkit" }
# ⭐⭐⭐ O DESEMARANHADOR, para a SONDA que mede se ele desfaz as dobras do NOSSO mapa.
# ⚠️ `dev-dependency` de propósito: ele ainda NÃO está no produto, e declará-lo como
# dependência normal diria o contrário a quem lê o manifesto. Ver
# `docs/3D/quad-remesh/PLANO_desdobrar_o_mapa.md`.
ph2d-untangle = { path = "../../crates/ph2d-untangle" }
# O sink de render, para o arch-gate do modo de composição (doc 89, folha 17). A
# shell é o único lugar que enxerga as DUAS folhas — o nó que declara o param e o
# substrato que o lê — e nenhuma delas pode depender da outra, então o acordo entre
# as duas strings só é verificável daqui. Dev-only: o `src/` não o toca (o registro
# dos nós é do `ph2d-node-registry-init`).
ph2d-node-motion-output = { path = "../../crates/ph2d-node-motion-output" }

[target.'cfg(target_os = "macos")'.dependencies]
# ⛔ TETO — o `winit 0.30.13` pede `^0.23.1`. O topo é 0.25.0. ⚠️ Este teto CAI
# sozinho quando o `winit 0.31` sair de beta; reconfira então.
core-graphics = "0.23.2"

# Wave 8 Phase 1 — host-level cargo features that proxy through to
# `ph2d-panel-registry-init`. `default` re-enables all 4 panels for
# the standard build; lite distributions and panel-isolated runs
# pick the subset they want via `--no-default-features --features X`.
[features]
default = [
    "sculpt3d",
    "panel-widget-gallery",
    "panel-widget-lab",
    "panel-hierarchy",
    "panel-inspector",
    "panel-grid-snap",
    "panel-bgremoval",
    "panel-padding",
    "panel-color-equalization",
    "panel-equalize-sizes",
    "panel-upscale",
    "panel-painter-layers",
    "panel-vector",
    "panel-skeleton",
    "panel-tags",
    "panel-flip",
    "panel-flip-frames",
    "panel-audio-mixer",
    "panel-audio-editor",
    "panel-motion-graph",
    "panel-timeline",
    "panel-physics",
    "panel-model3d",
    "panel-asset-browser",
    "panel-wet-tuning",
    "panel-tokens",
    "panel-authored",
    "panel-sculpt3d",
]
# `lite` = explicit "no panels" — host boots with chrome only
# (TopBar + LeftRail + BottomHUD + canvas). Useful for distribution
# builds that ship only the rendering surface (e.g., embedded
# preview windows) without the editor sidecars.
lite = []
# ADR-0150 — o modulo de escultura 3D. LIGADA no `default` de proposito: o
# `ship.sh` roda clippy SEM `--all-features`, entao codigo atras de uma feature
# desligada nao e lintado e apodrece. A flag continua sendo o CONTRATO de
# removibilidade (docs/3D/02.3): as deps sao `optional`, e desliga-la tem de
# apagar o modulo do binario sem tocar em nada do 2D.
sculpt3d = ["dep:ph2d-mesh", "dep:ph2d-mesh-render", "dep:ph2d-sculpt3d", "dep:ph2d-sdf"]
panel-widget-gallery = ["ph2d-panel-registry-init/panel-widget-gallery"]
# ⛔⛔ **A feature do shell é obrigatória, e a ausência dela NÃO dá erro nenhum.** O shell põe
# `default-features = false` no `ph2d-panel-registry-init` e re-declara cada painel aqui; um painel
# que exista no `default` DAQUELA crate e não tenha linha AQUI é **compilado para fora do binário**
# — e a linha do menu *Window* continua pintada, clicável e **morta**. Foi exactamente o que
# aconteceu ao Widget Lab em 2026-09-01 (report do Enio: *"Widget Lab não abriu"*).
panel-widget-lab     = ["ph2d-panel-registry-init/panel-widget-lab"]
panel-hierarchy      = ["ph2d-panel-registry-init/panel-hierarchy", "dep:ph2d-panel-hierarchy"]
panel-inspector      = ["ph2d-panel-registry-init/panel-inspector", "dep:ph2d-panel-inspector"]
panel-bgremoval      = ["ph2d-panel-registry-init/panel-bgremoval", "dep:ph2d-panel-bgremoval"]
panel-padding        = ["ph2d-panel-registry-init/panel-padding", "dep:ph2d-panel-padding"]
panel-color-equalization = ["ph2d-panel-registry-init/panel-color-equalization", "dep:ph2d-panel-color-equalization"]
panel-equalize-sizes = ["ph2d-panel-registry-init/panel-equalize-sizes", "dep:ph2d-panel-equalize-sizes"]
panel-upscale        = ["ph2d-panel-registry-init/panel-upscale", "dep:ph2d-panel-upscale"]
# ⚠️ O `ph2d-app-painter/panel-painter-layers` e' obrigatorio: o `painter_bridge` mudou-se para la'
# e o `cfg` dele e' falso por construcao numa crate que nao declara a feature (HOWTO §2.4).
panel-painter-layers = ["ph2d-panel-registry-init/panel-painter-layers", "dep:ph2d-panel-painter-layers", "ph2d-app-painter/panel-painter-layers"]
# Motion Nodes docked panels (M0). No `dep:` — `motion_bridge` drives them
# entirely through `hero.panel_visibility` + the shared layout, with no
# panel-side static channel (the document lives in `MotionState`, not the panel),
# so the shell needs only the registry-init feature, not a direct crate dep.
panel-motion-graph   = ["ph2d-panel-registry-init/panel-motion-graph"]
# Vector Style panel + its render_loop bridge (`vector_bridge` publishes the
# snapshot via `ph2d_panel_vector::set_current_vector_style` + reads the OKLCH
# picker back into the tool), so the shell needs the direct dep too.
panel-vector         = ["ph2d-panel-registry-init/panel-vector", "dep:ph2d-panel-vector"]
# ⭐⭐⭐ O painel do ESQUELETO — a shell publica-lhe o osso em foco, a âncora, o limite e o controlo
# por quadro (`ph2d_panel_skeleton::set_current_*`), e decide se ele é visto: ele só tem sujeito
# numa cena que tem ossos.
panel-skeleton       = ["ph2d-panel-registry-init/panel-skeleton", "dep:ph2d-panel-skeleton"]
# ⭐⭐⭐ O painel TAGS (TOP-20 #9, W4). A shell publica-lhe a árvore por quadro
# (`ph2d_panel_tags::set_current_tags`) e drena os gestos dele pelo barramento.
panel-tags           = ["ph2d-panel-registry-init/panel-tags", "dep:ph2d-panel-tags"]
# Flip Style panel + its render_loop bridge (`flip_bridge` publishes the style +
# layers snapshots via `ph2d_panel_flip::set_current_flip_*` + reads the OKLCH
# picker back into the tool), so the shell needs the direct dep too.
panel-flip           = ["ph2d-panel-registry-init/panel-flip", "ph2d-app-flip/panel-flip"]
panel-flip-frames    = ["ph2d-panel-registry-init/panel-flip-frames", "ph2d-app-flip/panel-flip-frames"]
panel-grid-snap      = ["ph2d-panel-registry-init/panel-grid-snap"]
# Direct dep too: the render_loop bridge publishes live levels via
# `set_snapshot` + reads `master_muted` to drive the engine's master gain.
panel-audio-mixer    = ["ph2d-panel-registry-init/panel-audio-mixer", "dep:ph2d-panel-audio-mixer"]
# General timeline docked panel. `ph2d-panel-timeline` is already a non-optional
# direct dep (render_loop publishes its snapshot via `set_current_timeline`), so
# this only needs to flip the registry-init feature that compiles in the
# `register_all_panels()` push for `TimelinePanel`.
panel-timeline       = ["ph2d-panel-registry-init/panel-timeline"]
# Physics WORLD panel (ADR-0131 D8 / W2b). `ph2d-panel-physics` is already a
# non-optional direct dep (`render_loop::physics_panel_bridge` publishes its
# snapshot and drains its intents), so this only has to flip the registry-init
# feature that compiles the panel INTO the registry.
#
# ⚠️ The shell sets `default-features = false` on `ph2d-panel-registry-init`, so
# that crate's own `default` list reaches nobody: a panel is in the running app
# only if it is BOTH here and in the `default` above. Missing this line is what
# made the panel unreachable in the first smoke — every unit gate green, and
# `W` toggling the visibility of a panel that was not in the registry.
panel-physics        = ["ph2d-panel-registry-init/panel-physics"]
# ADR-0161 W4 — o painel de modelagem 3D. ⚠️ Vale o mesmo aviso do physics
# acima, e ele foi pago la: sem esta linha o painel existe, compila, passa os
# gates da propria crate, e NAO ESTA NO REGISTRO — a visibilidade alterna um
# painel que ninguem pinta.
panel-model3d        = ["ph2d-panel-registry-init/panel-model3d"]
# ⛔⛔ **A SEXTA porta de registo de um painel, e ela mata em silêncio** (report do Enio,
# 2026-08-30: *«clicar no pill Assets não abre nenhuma janela»*). O `ph2d-panel-registry-init`
# entra aqui com `default-features = false`, então a feature `default` DELE não vale nada: quem
# decide o que o binário tem é esta lista. O painel existia, estava no registro, tinha 15 gates
# verdes — e **nunca foi construído**. ⚠️ E o gate que devia apanhá-lo
# (`build_typed_registry_matches_enabled_features`) corre com os defaults DA CRATE, logo mede
# outra coisa: *um gate que mede os defaults de uma crate não diz nada sobre o que o binário
# ship-a*. O gate novo é `every_registry_panel_is_reachable_from_this_shell`.
panel-asset-browser  = ["ph2d-panel-registry-init/panel-asset-browser"]
# Painel de TOKENS (plano UI/UX W6). `ph2d-panel-tokens` e' dep direta nao-opcional
# (`render_loop::tokens_bridge` drena os intents e faz o read-back do picker); esta
# linha liga a feature do registry-init que compila o painel PARA DENTRO do
# registro. ⚠️ Vale o mesmo aviso do physics acima: sem ela o `T` alternaria a
# visibilidade de um painel que nao esta' no registro, com todos os gates verdes.
panel-tokens         = ["ph2d-panel-registry-init/panel-tokens"]
# O painel AUTORADO (plano UI/UX W8b.2) — o painel que o artista desenhou.
# `ph2d-panel-authored` e' dep direta nao-opcional (a ponte drena os intents e o
# `AuthoredPanel::ID` e' a chave de visibilidade); esta linha liga a feature do
# registry-init que o compila PARA DENTRO do registro. ⚠️ Vale o mesmo aviso do
# physics acima: sem ela o interruptor alternaria a visibilidade de um painel
# que nao esta' no registro, com todos os gates verdes.
panel-authored       = ["ph2d-panel-registry-init/panel-authored"]
# Painel da cena 3D (ADR-0150 W12). `ph2d-panel-sculpt3d` e' dep direta
# nao-opcional (`render_loop::sculpt3d_panel_bridge` publica o retrato e drena os
# intents); esta linha liga a feature do registry-init que o compila PARA DENTRO
# do registro. ⚠️ Vale o mesmo aviso do physics acima — sem ela o painel nasce
# invisivel com TODOS os gates verdes, que foi como o de fisica reprovou no
# primeiro smoke.
#
# ⚠️ E ela NAO e' a feature `sculpt3d`: aquela liga o MODULO (a cena, o gesto, o
# passe), esta liga o PAINEL no registro. O painel compila sem o modulo — ele
# fala `ph2d-sculpt3d`, que e' a crate do pincel, nao a cena do shell — e e' isso
# que o mantem fora do caminho do `cfg` que atravessa o shell.
panel-sculpt3d       = ["ph2d-panel-registry-init/panel-sculpt3d"]
# Wet Tuning side panel (doc 22). `ph2d-panel-wet-tuning` is a non-optional
# direct dep (the painter bridge publishes its brush snapshot and mirrors the
# Tuning checkbox into its visibility); this line flips the registry-init
# feature that compiles the panel INTO the registry (see the physics warning
# above: the shell sets `default-features = false` there).
panel-wet-tuning     = ["ph2d-panel-registry-init/panel-wet-tuning"]
# Direct dep too: the render_loop editor bridge reads the transport intents +
# drives the preview engine + publishes position back for the readout/playhead.
panel-audio-editor   = ["ph2d-panel-registry-init/panel-audio-editor", "dep:ph2d-panel-audio-editor", "dep:ph2d-audio-edit", "dep:ph2d-audio-encode", "ph2d-app-audio/panel-audio-editor"]
# W7 AI Denoise (ADR-0123), OFF by default — NOT in `default`. Turning it on pulls the native
# DeepFilterNet stack (`ph2d-audio-ml` → `tract`) and lights the "AI Denoise" button in the audio
# editor. It implies `panel-audio-editor`, which is where the button and its bridge live.
audio-ml             = ["panel-audio-editor", "ph2d-app-audio/audio-ml"]

[lints]
workspace = true
