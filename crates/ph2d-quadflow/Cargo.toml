[package]
name = "ph2d-quadflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# O QUAD REMESH POR CAMPO CRUZADO do modulo de escultura 3D (ADR-0160): a
# superficie de entrada -> campo de orientacao 4-RoSy -> campo de posicao ->
# extracao all-quad. Porte NATIVO do QuadriFlow (Huang et al., SGP 2018), que por
# sua vez e' o Instant Meshes (Jakob et al., SIGGRAPH Asia 2015) mais um passo
# global de consistencia; as duas referencias sao BSD-3-Clause/MIT, entao a
# citacao de FONTE e' permitida nos doc-comments (ao contrario do Blender).
#
# ⚠️ Ela NAO substitui a `ph2d-sdf`: aquela re-amostra um campo de voxels (a
# arrumacao destrutiva) e esta preserva a topologia da entrada (a retopologia).
# O ADR-0160 §1 traz a tabela que separa as duas.
[dependencies]
# ph2d-mesh: a entrada e a saida sao `Mesh`. Um campo cruzado nao e' um formato
# proprio — ele nasce de uma malha e morre virando outra.
ph2d-mesh = { path = "../ph2d-mesh" }
