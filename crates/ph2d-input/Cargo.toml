[package]
name = "ph2d-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ph2d-input is intentionally pure-data: no gilrs / IOKit / evdev /
# winit dep here. Shells (desktop, future iPad) translate their
# native input source into [`Event`] and call apply_event.
# Keeps the crate buildable on every target including no_std-adjacent
# WASM in the future.

[dev-dependencies]
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "input_throughput"
harness = false
