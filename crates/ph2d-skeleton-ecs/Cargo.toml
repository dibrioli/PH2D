[package]
name = "ph2d-skeleton-ecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# ⭐ **A ponte, e o precedente é a `ph2d-physics-ecs`**: uma crate satélite possui os componentes
# dela e os **regista pela própria porta** (`register_skeleton_components`), chamada uma vez no
# arranque ao lado do `register_ecs_components`. É isso que tira o esqueleto de dentro da fundação
# sem que ele perca undo, save, olho, cadeado, reparentar nem timeline.
ph2d-ecs = { path = "../ph2d-ecs" }
bevy_ecs = "0.19"
serde = { version = "1", features = ["derive"] }
