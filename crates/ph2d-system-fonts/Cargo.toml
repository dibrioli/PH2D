[package]
name = "ph2d-system-fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

# W10 Coord: the REAL `ph2d_vector_font::PlatformHost`, backed by the OS font
# collection. Replaces the MockHost so glyph fallback uses the actually-installed
# families (CJK / Arabic / emoji render with a covering font instead of tofu).
# Isolated satellite crate (testable without the heavy shell build); the shell
# just instantiates `SystemFontHost` and hands it to the font resolver.
[lib]

[dependencies]
# The frozen font contract: PlatformHost + FontFamily + CoverageRanges + Locale.
ph2d-vector-font = { path = "../ph2d-vector-font" }
# Linebender system-font enumeration + script fallback — already in the tree via
# parley/vello (0.6). `default = ["system"]` → real installed fonts + OS cascade.
fontique = "0.6"
