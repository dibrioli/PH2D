[package]
name = "ph2d-app-kanban"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# A família do KANBAN (TrelloClone W2, ADR-0195): o documento em aba (o trait `DocumentSurface` do
# `ph2d-editor-core`), sobre o modelo puro `ph2d-kanban-model`.
ph2d-a11y = { path = "../ph2d-a11y" }
# A declaração da família (`FAMILY`) que o registo empurra.
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
# W4 — o Kanban no canvas do Quadro: os ganchos de pintura (`KanbanPainter`, o nível e a lei das cores)
# e as ids do elemento. Acíclico: o Quadro não depende da família.
ph2d-board-model = { path = "../ph2d-board-model" }
ph2d-board-render = { path = "../ph2d-board-render" }
ph2d-host = { path = "../ph2d-host" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-kanban-model = { path = "../ph2d-kanban-model" }
# O verso do cartão (W3): a descrição em markdown ↔ documento rico e as datas no fuso.
ph2d-kanban-md = { path = "../ph2d-kanban-md" }
ph2d-richdoc = { path = "../ph2d-richdoc" }
# W3 — a frente do cartão: o distintivo da entrega no fuso do sistema (`due_tone`, `due_label`).
ph2d-kanban-dates = { path = "../ph2d-kanban-dates" }
# W6 — o filtro, a pesquisa, a ordenação e o envelhecimento (puros).
ph2d-kanban-filter = { path = "../ph2d-kanban-filter" }
# J1 — «Share»: o Kanban ao vivo sozinho (a sala, a presença) pelo transporte do Quadro.
ph2d-kanban-sync = { path = "../ph2d-kanban-sync" }
ph2d-board-sync = { path = "../ph2d-board-sync" }
ph2d-board-net = { path = "../ph2d-board-net" }
ph2d-board-internet = { path = "../ph2d-board-internet" }
# J2 — o Butler no ecrã (painel de automação, botões), as ligações do cartão ao projecto e a lei
# pública das datas do seletor (a mesma da Tabela).
ph2d-kanban-auto = { path = "../ph2d-kanban-auto" }
ph2d-kanban-links = { path = "../ph2d-kanban-links" }
ph2d-kanban-views = { path = "../ph2d-kanban-views" }
# J3 — a porta única do gesto (Butler + scripts), as cenas como modelo e o importar/exportar.
ph2d-kanban-hooks = { path = "../ph2d-kanban-hooks" }
ph2d-kanban-scenes = { path = "../ph2d-kanban-scenes" }
ph2d-kanban-import = { path = "../ph2d-kanban-import" }
# W3 — a capa de IMAGEM descodifica-se pela MESMA porta que a cena e o Quadro usam
# (`ph2d_asset::decode_image`, com os tectos e as recusas do registo `imageio`), fora do fio do desenho.
ph2d-asset = { path = "../ph2d-asset" }
# W3, lote D3 — anexar ficheiros: o diálogo nativo (pela porta `ph2d_app_host::modal`, como o Quadro) e o
# tamanho natural de uma imagem pelo CABEÇALHO (os mesmos formatos que a `ph2d-asset` já compila).
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# A mola do arrasto (a lei vem do `UiMotion` do hero: o carácter e o «movimento reduzido»).
ph2d-spring = { path = "../ph2d-spring" }
ph2d-text = { path = "../ph2d-text" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-vector = { path = "../ph2d-vector" }

[dev-dependencies]
# A porta do carácter confirmado (`HeroScreen::handle_text_input`) pede a arena do despacho.
bumpalo = "3"
# J1 — as fotos da aba (`#[ignore]`: a placa pinta a cena e o PNG grava-se em `docs/TrelloClone/smoke/`).
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-render = { path = "../ph2d-render" }

[lints]
workspace = true
