# Vector Pencil — Stateful tool, second interactive tool of the Vector
# Module (plan T2.1). Freehand stroke recording → Hobby auto-smooth
# (minimum-curvature-variation interpolating spline, NOT Schneider).
#
# Cluster `vector_tools` (shared with the Pen). Shell rendering is the
# `vector_pencil_bridge.rs` preview + committed-stroke pass. Until the
# cluster renderer + central wiring land, the manifest is registered but
# the pill is not painted in the chrome.
#
# Canonical source for `crates/ph2d-tool-vector-pencil/src/lib.rs`.

[tool]
id          = "vector_pencil"
cluster     = "vector_tools"
zone        = "top_right"
order       = 20
a11y_role   = "Button"
icon_slug   = "vector-pencil"
touches_sim = false

[label]
pt_br_inline = "Lápis"
en_us_inline = "Pencil"
fluent_key   = "tool.vector_pencil.label"

[memory_budget]
vram_mb        = 0
ram_mb         = 1
heap_script_mb = 0
