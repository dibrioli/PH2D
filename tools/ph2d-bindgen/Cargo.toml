[package]
name = "ph2d-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ph2d-bindgen"
path = "src/main.rs"

[dependencies]
# The Luau half (runtime/luau/ph2d.d.luau): the script API table (ADR-0188 §3), checked
# against the real VM wiring.
ph2d-script = { path = "../../crates/ph2d-script" }
# The MCP half (runtime/mcp/schema.json): ph2d-mcp::CATALOG (HR-10). CI enforces parity of both.
ph2d-mcp = { path = "../../crates/ph2d-mcp" }
serde_json = "1"

[lints]
workspace = true
