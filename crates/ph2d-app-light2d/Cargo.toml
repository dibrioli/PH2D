[package]
name = "ph2d-app-light2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐ A FAMÍLIA da luz 2D (plano `docs/Luz2D/01_plano.md` §2.1): a composição no quadro — coleta,
# guarda, grade ancorada, solver e os dois receptores. A shell só a CHAMA (três portas).
# ⚠️ Versões LITERAIS, como as irmãs: este workspace não tem `[workspace.dependencies]`.
[dependencies]
# A declaração da família à shell (`FAMILY`).
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-gpu = { path = "../ph2d-gpu" }
# O `PresentWorld` e o `SimRef`: as instâncias que o passe de sprite desenha, casadas com a cena.
ph2d-ecs = { path = "../ph2d-ecs" }
# A coleta (`World → CenaDeLuz`) — a ÚNICA porta do ECS.
ph2d-light2d-ecs = { path = "../ph2d-light2d-ecs" }
# O solver (C0 → C1 → C2) e a `Grade`.
ph2d-light2d-gpu = { path = "../ph2d-light2d-gpu" }
# Os receptores: o passe de sprite e a colagem do vetor (`receber.wgsl`).
ph2d-render = { path = "../ph2d-render" }
bevy_ecs = "0.19"
# O artista (W4): o menu Add (`AddEntry`), o vocabulário da secção do Inspector (`luz_edits`), o
# nome único de um objeto novo, as palavras, e a cor do seletor (sRGB) ↔ a da luz (linear).
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-unique-name = { path = "../ph2d-unique-name" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-color = { path = "../ph2d-color" }
# O gizmo da luz no canvas: a janela da câmera, os tokens de cor e a cena do chrome.
ph2d-host = { path = "../ph2d-host" }
ph2d-tokens = { path = "../ph2d-tokens" }
wgpu = "29.0.4"
# O afim mundo → tela que o Vello usou (o vetor recebe a luz pelo inverso dele).
kurbo = "0.13.1"
# O vetor que bloqueia (W3): a cena vetorial e os afins, e a porta que desenha UM caminho (a mesma
# do tile de uma forma). Só LÊ — o contrato congelado `ph2d-vector-doc` não é tocado.
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
ph2d-vec-render = { path = "../ph2d-vec-render" }
ph2d-vector = { path = "../ph2d-vector" }

[dev-dependencies]
# O censo HR-15 da família (`every_word_this_family_shows_comes_from_the_string_table`).
ph2d-label-census = { path = "../ph2d-label-census" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
ph2d-ecs = { path = "../ph2d-ecs" }
# O quadrado vetorial dos gates desenha-se pela porta do documento (o Vello de verdade).
vello = "0.10.0"
# A fluência sai em `Rgba16Float`; os gates leem-na de volta (já no `Cargo.lock`).
half = "2"
# O gabarito: a paridade da luz recebida mede contra ele.
ph2d-light2d-ref = { path = "../ph2d-light2d-ref" }
# Os escopos de erro do dispositivo (`pop` é um futuro) nas rodadas que medem recusas.
pollster = "0.4.0"

[lints]
workspace = true
