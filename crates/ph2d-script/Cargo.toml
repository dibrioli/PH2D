[package]
name = "ph2d-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
mlua = { version = "0.10", features = ["luau"] }
# blake3 used for source-content hashing — drives the reset+restore
# decision in `ScriptHost::load_script` (HR-16: hot-reload only when
# bytes actually changed, not on every save).
blake3 = "1"

[dev-dependencies]
proptest = "1.11.0"
