[package]
name = "ph2d-vec-blend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Interpolação de formas (Blend / Morph). kurbo é INTERNA a esta crate — como na
# `ph2d-vec-boolean` — e serve a UMA coisa: comprimento de arco (`inv_arclen`), que é
# o que dá a correspondência independente de onde os vértices caíram.
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# Interpolação de COR em OKLab (perceptual): o Blend do Illustrator interpola em RGB device-space
# e passa por cinza lamacento entre matizes opostos; o nosso passa pelo caminho perceptual.
ph2d-color = { path = "../ph2d-color" }
kurbo = "0.13"

[dev-dependencies]
# **Só os gates.** A rosquinha de verdade — a que o artista blenda — não é montada à mão: ela sai
# de um Subtract. Um fixture escrito à mão só prova o que ele contém, e o que ele contém é a MINHA
# ideia de compound path, não a que a booleana de fato produz (contagem de vértices, ordem dos
# contornos, regra de preenchimento). O motor não depende da booleana; o gate depende.
ph2d-vec-boolean = { path = "../ph2d-vec-boolean" }
