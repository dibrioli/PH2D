[package]
name = "ph2d-vector-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Vector Module document data model. Foundational crate per ADR-0056.
# Hosts the canonical VectorNetwork + Vertex + Segment + Region + VectorOp
# + EditLog + Ph2dVectorAsset and the homestead arch-gate
# `architecture_vector_contract_surface` (tests/).
#
# Sub-contracts (CRDT semantics, geometry graph, renderer pipeline,
# procedural fill, LLM authoring, Painter bridge, runtime+physics,
# multi-platform input, SDF Hybrid GPU, Variable Font glyph,
# brush-traits decoupling, Mobile Core tier) live in ADRs 0057..0068.

[lib]

[dependencies]
# Foundational trait crate (AnimValue, AttributeEvaluator, etc.).
# Re-exports nothing from us; pure consumer relationship.
ph2d-vector-traits = { path = "../ph2d-vector-traits" }

# Color types embedded in fills (solid + linear-gradient stops).
ph2d-color = { path = "../ph2d-color" }

# Math primitives — matches ph2d-core 0.30 pin via workspace consensus.
# `serde` feature on so glam types serialize cleanly through postcard.
glam = { version = "0.30", features = ["serde"] }

# Inline-storage vectors with serde derive for VectorNetwork's
# vertices/segments/regions SmallVecs. `union` feature shrinks the
# discriminant via tagged-union layout.
smallvec = { version = "1", features = ["serde", "union"] }

# Postcard — HR-14 versioned binary schema for `.ph2d-vector` assets.
# `use-std` (not `alloc`-only) because we run on hosts that pull std
# anyway and need the `from_bytes`/`to_allocvec` ergonomics.
postcard = { version = "1", features = ["use-std"] }

# Serialization derives for every public type that round-trips
# through postcard.
serde = { version = "1", features = ["derive"] }

# Content-hash for `.ph2d-vector` integrity checks + edit-log
# Checkpoint ops (ADR-0056 §2.8 `VectorOp::Checkpoint`). The default
# features (rayon parallel SIMD) are off — pure-Rust path keeps the
# crate small for deterministic replay.
blake3 = { version = "1", default-features = false }

[dev-dependencies]
walkdir = "2"
