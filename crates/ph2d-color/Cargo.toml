[package]
name = "ph2d-color"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# `bytemuck` derive for Pod + Zeroable on SrgbRgba so callers can
# zero-copy reinterpret between `&[u8]` (the IO boundary, asset
# decoders, png/jpeg readers) and `&[SrgbRgba]` (the algorithm-side
# typed buffer) via `bytemuck::cast_slice`. Wave 11 color-space
# migration sweep (ADR-0042 §6 #2) leans on this.
#
# bytemuck is zero-deps + std-only — small, audited, the Rust
# ecosystem's canonical solution for repr-transparent zero-copy.
[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# `serde` derives on `OklchColor` so the canonical type can round-trip
# through postcard / JSON savefiles. The Painter `PainterParams` stub
# embeds an `OklchColor` and serializes it; T1.3+ cutover (stub → canon)
# would otherwise silently break v1 savefiles.
# See `docs/HANDOFF_ph2d_color_oklch_serde.md` (Painter T1.6 R9 audit).
serde = { version = "1", features = ["derive"] }
