license.workspace = true
authors.workspace = true

# A lei do pincel de POSE — clean-room sob `docs/3D/cleanroom/SPEC_pose_brush.md`
# (atestada à 5.ª passagem do R-pré). O artista aponta a um ponto da malha e
# arrasta; o pincel acha sozinho, pela FORMA e pela LIGAÇÃO da malha, um pivô e
# uma cadeia de segmentos encostada a ele, e faz a região à volta rodar em torno
# desse pivô — como se houvesse uma articulação enterrada ali. Sem esqueleto.
#
# ZERO dependências, de propósito — a mesma disciplina da `ph2d-cloth`, da
# `ph2d-platformer` e da `ph2d-arclen`: ela não sabe o que é uma `Mesh`, um
# pincel, uma câmera ou um evento de ponteiro. Recebe posições, faces e
# controlos, e devolve deslocamentos. É isso que a torna gateável contra o
# corpus do oráculo sem GPU, sem janela e sem escultura — e é isso que impede a
# lei de crescer para dentro do módulo.

[lib]

[dependencies]

# Só o ARNÊS de paridade (`tests/it/oraculo_do_pincel_de_pose.rs`) precisa de
# inflar os `.gz` das fixtures; a lib continua sem dependência nenhuma.
# `miniz_oxide` e não `flate2` pela razão de sempre: já está na árvore.
[dev-dependencies]
miniz_oxide = "0.8"

[lints]
workspace = true
