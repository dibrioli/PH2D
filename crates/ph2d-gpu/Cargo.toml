[package]
name = "ph2d-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-host = { path = "../ph2d-host" }
wgpu = "29.0.4"
# ⛔ TETO — o `rfd 0.17.2` (diálogos de ficheiro, shells/desktop) pede `^0.4`. O topo
# é 1.0.1 e é INALCANÇÁVEL enquanto o rfd não passar: duas cópias de pollster dariam
# dois `block_on` distintos a competir pelo mesmo executor. Reconfira com
# `bash scripts/stack-audit.sh --tetos` (medido 2026-08-29).
pollster = "0.4.0"

[dev-dependencies]
# A régua que apaga os comentários de um fonte — as DUAS formas (`//` e `/* */`, aninhados) e
# nunca o interior de uma string. O gate da voz do dispositivo lia só as linhas começadas por
# `//`, e um bloco `/* */` com o nome do registo deixava-o verde (auditoria do fecho, 2026-09-24).
# Zero dependências: ela não traz nada à árvore desta crate.
ph2d-label-census = { path = "../ph2d-label-census" }

[lints]
workspace = true
