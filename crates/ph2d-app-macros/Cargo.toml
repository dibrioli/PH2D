[package]
name = "ph2d-app-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# A TABELA DE TEXTOS (HR-15): o nome do clipe sai daqui.
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-macro = { path = "../ph2d-macro" }
# A declaração da família ao registo gerado (`FAMILY`).
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-timeline = { path = "../ph2d-timeline" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
# O Painter grava por esta crate; o Motion é outra família e chega pela composição (a gravadora e
# `ph2d_editor_core::macro_etapas::EtapasDaFamilia`).
ph2d-tool-painter = { path = "../ph2d-tool-painter" }

[dev-dependencies]
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
# O gate 7: o painel de verdade, clicado.
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-anim = { path = "../ph2d-anim" }
ph2d-panel-macros = { path = "../ph2d-panel-macros" }
ph2d-panel-timeline = { path = "../ph2d-panel-timeline" }
# A4 (W9): o relógio do clipe que o Parar tem de re-armar.
ph2d-core = { path = "../ph2d-core" }

[lints]
workspace = true
