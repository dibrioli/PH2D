[package]
name = "ph2d-vec-skin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# ⭐ **A LEI mora no MÓDULO; aqui mora só o que o VETOR sabe.** Esta crate é o 1.º cliente do
# esqueleto — a que responde *«o que é um ponto aqui»* (três por vértice: âncora e as duas alças).
# É a mesma repartição do Blender, onde o *Armature modifier* é um só e o Grease Pencil tem a
# implementação dele à parte porque *o que é um ponto* ali é outra coisa.
ph2d-skeleton = { path = "../ph2d-skeleton" }
# O documento vectorial. ⛔ Ele NÃO é dependência da lei: uma pele que precisasse dele deixaria de
# servir raster, 3D e Flip — que é a razão de o módulo existir.
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# ⭐ A malha do DOMÍNIO (a mesma da imagem) e o padrão-ouro dos pesos. As duas são folhas.
ph2d-poly2d = { path = "../ph2d-poly2d" }
ph2d-skin-weights = { path = "../ph2d-skin-weights" }

[lints]
workspace = true

# ⚠️ **DEV-dependency, e é uma SONDA que a pede** (2026-09-19): a `ph2d-vec-envelope` sabe deformar
# geometria Bézier por um mapa **não-afim** — que é exactamente o que a pele é —, e a sonda
# `sonda_da_pele_como_warp` mede se essa rota resolve *«pintar peso ENTRE os nós»* e quanto custa.
# ⛔ Enquanto for dev, o produto não muda: *uma dependência de produto escreve-se quando a decisão
# está tomada, não enquanto ela está a ser medida.*
[dev-dependencies]
ph2d-vec-envelope = { path = "../ph2d-vec-envelope" }
