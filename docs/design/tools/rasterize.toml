# Rasterize — one-shot bake of current transform (scale/rotation/flip)
# into the pixel buffer of every selected sprite, then reset scale=1
# and rotation=0. Image Tools row, order 110 (right of equalize_sizes
# 100, left of upscale 120). Sabor 1 (one-shot stateless): uses
# Mitchell-Netravali B=C=1/3 resample kernel (own implementation, zero
# deps). Multi-sprite obrigatório — iterates selection.
#
# Canonical source for `crates/ph2d-tool-rasterize/src/lib.rs`.
# `tool_manifest_design_sync` test asserts the two stay in sync.

[tool]
id          = "rasterize"
cluster     = "image_tools"
zone        = "top_right"
order       = 110
a11y_role   = "Button"
icon_slug   = "rasterize"
touches_sim = false

[label]
pt_br_inline = "Rasterize"
en_us_inline = "Rasterize"
fluent_key   = "tool.rasterize.label"

[memory_budget]
vram_mb        = 0
ram_mb         = 0
heap_script_mb = 0
