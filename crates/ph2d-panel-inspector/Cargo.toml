[package]
name = "ph2d-panel-inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# ADR-0166 / plano F0: a §7 Ordering é a seção PILOTO — os rótulos das linhas dela vêm do
# descritor, não de literais no pintor. ⚠️ Ligá-la revelou que as duas fontes já discordavam
# ("Sort At Root" × "Sort at Root"), que é exatamente o defeito que uma fonte só apaga.
# Folha PURA (zero dependências), então não puxa nada para o painel.
ph2d-component-desc = { path = "../ph2d-component-desc" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y        = { path = "../ph2d-a11y" }
ph2d-tokens      = { path = "../ph2d-tokens" }
ph2d-text        = { path = "../ph2d-text" }
ph2d-vector      = { path = "../ph2d-vector" }

[dev-dependencies]
# Blindagem Fase 0.1: headless seam harness. Dev-dep only — the
# `architecture_cycle_prevention` gate reads `[dependencies]` only, so this
# builds no runtime cycle. See `tests/seam.rs`.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
