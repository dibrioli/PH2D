[package]
name = "ph2d-imageio-avif"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# `ph2d-imageio-avif` — AVIF decode (W3.T4). Pure-Rust decode via
# `avif-decode = "1.0"`. Encode permanent-deferred — `ravif = "0.13"`
# pulls rav1e (~50 transitive deps) for encode; defer until first
# real export client (Painter HDR export demo). Audit-14 wave-2.1
# (2026-05-27).

[dependencies]
ph2d-imageio = { path = "../ph2d-imageio" }
ph2d-color   = { path = "../ph2d-color" }
avif-decode = "1"
