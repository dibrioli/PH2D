[package]
name = "ph2d-painter-wash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Minimal watercolor core (ADR-0086) — the "ultra-brutal simplification" of the v2
# stack (`ph2d-painter-fluid`, kept intact for side-by-side). Curtis-1997 minimal
# core ONLY: water + gated pigment diffusion + FlowOutward edge-darkening + evaporation
# + subtractive (Beer–Lambert) compositing. NO shallow-water, NO autonomous capillary
# wick, NO lift/branched/MacCormack, NO 24-band spectral K–M. RGB-linear pigment.
#
# Leaf, isolated, feature-gated (like ADR-0049's `fluid`): absent `--features gpu`
# the crate compiles to nothing (zero wgpu/VRAM in CI/mobile/web builds).

[features]
# **gpu** — compiles the real GPU solver. Absent ⇒ empty crate (no deps pulled).
gpu = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
# Direct wgpu for the compute pipeline / bind groups. Pinned to match ph2d-gpu.
wgpu = { version = "28", optional = true }
# `#[repr(C)]` Pod UBO + dab structs for zero-copy `write_buffer` (HR-3).
bytemuck = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# GpuContext (Device/Queue) for the headless invariant tests.
ph2d-gpu = { path = "../ph2d-gpu" }
# Pre-flight WGSL validation through the same frontend wgpu uses.
naga = { version = "28", features = ["wgsl-in"] }
