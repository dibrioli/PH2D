[package]
name = "ph2d-app-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# A TABELA DE TEXTOS (HR-15): tudo o que esta crate diz ao artista sai daqui, nunca de um
# literal no fonte — o gate `every_word_..._comes_from_the_string_table` mede-o.
ph2d-i18n = { path = "../ph2d-i18n" }
# ⚠️ A INTERFACE da shell (`AppFamily`), não o agregador — importar de
# `ph2d-app-registry-init` fecharia o ciclo `registry → família → registry`.
ph2d-app-host = { path = "../ph2d-app-host" }

# ⚠️ A regra desta crate é a DIRECÇÃO das setas: ela depende das crates do
# módulo e do ECS, e **nunca da shell** (que é um `bin` e não pode ser
# dependência de ninguém). É isso que faz dela uma unidade de compilação que o
# `cargo check -p ph2d-app-components` fecha sem tocar nas 225 k linhas do
# `shells/desktop` — o ponto inteiro da W2 (auditoria de velocidade §4-C2).
# ⚠️ Versão LITERAL, como as irmãs: este workspace **não tem**
# `[workspace.dependencies]`, e herdar dele não compila.
ph2d-core = { path = "../ph2d-core" }
ph2d-ecs = { path = "../ph2d-ecs" }
# ⭐ O GATILHO (suplente #24): a ponte que resolve o teclado em acções NOMEADAS vive aqui,
# porque é pura — a shell fica só com a cerca do relógio e a publicação. `ph2d-input` é folha.
ph2d-input = { path = "../ph2d-input" }

# ⭐ **O CUSTO REAL do módulo, e ele só se lê aqui** (HOWTO §1.3): dentro da
# shell todas estas eram dependência do binário, e um ficheiro escrevia
# `ph2d_tokens::…` sem nada que o declarasse. São **20** crates irmãs e **2**
# externas (`bevy_ecs`, `postcard`) — o que diz o que esta família é: composição
# de vocabulário que já existe, não motor novo. ⚠️ Recontado na integração da
# Fase D (12/09): o texto anterior dizia 21 irmãs e zero externas, e o `cargo machete`
# tirou 2 irmãs que nenhum ficheiro usava (`ph2d-asset`, `ph2d-editor-core`).
ph2d-audio = { path = "../ph2d-audio" }
ph2d-audio-encode = { path = "../ph2d-audio-encode" }
# ⭐ **O barramento de sinais** — a `signal_actions_bridge::lido` converte um `Signal` publicado no
# outbox no `Disparo` que a lei consome. ⛔ O `ph2d-ecs` **não** o pode ver (ADR-0075: a fundação não
# conhece o barramento); uma crate de FAMÍLIA pode, e é isso que faz a conversão ter dono.
ph2d-runtime = { path = "../ph2d-runtime" }
ph2d-component-desc = { path = "../ph2d-component-desc" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-inspector-ordering = { path = "../ph2d-inspector-ordering" }
ph2d-entity-visibility = { path = "../ph2d-entity-visibility" }
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }
ph2d-render = { path = "../ph2d-render" }
ph2d-text = { path = "../ph2d-text" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
# ⭐ A lei do mover de VISTA DE CIMA (TOP-20 #13) — a cena de smoke autora-a pelos
# nomes dos modos, e não por bytes de fio escritos à mão.
ph2d-topdown = { path = "../ph2d-topdown" }

# ⭐ A lei do TWEEN (suplente #22) — a ponte traduz o relógio do `Timer` no `Relogio` que ela lê,
# e usa o `Canal` para escolher o campo E a entrada do ledger.
ph2d-tween = { path = "../ph2d-tween" }
# ⭐ A lei do ABANÃO (suplente #25) — a ponte traduz um sinal em TRAUMA (`atenuacao` + `acumula`),
# corre o decaimento e pede à lei o deslocamento da vista. ⚠️ A conversão config → `Lei` NÃO mora
# aqui: ela é o `CameraShake::lei()`, a porta única (uma segunda cópia divergiria no 6.º número).
ph2d-shake = { path = "../ph2d-shake" }
# ⚠️ **As curvas, pelo ALL delas** — o instantâneo traduz uma `Easing` na POSIÇÃO do chip, e o
# dreno faz a volta. Uma tabela de tags aqui seria a segunda lista.
ph2d-anim = { path = "../ph2d-anim" }

# ⭐ A lei do PROJÉCTIL (TOP-20 #14) — a cena de smoke monta as balas pela porta `from_law`.
ph2d-projectile = { path = "../ph2d-projectile" }
# ⭐ A lei do emissor de partículas (TOP-20 #18) — o compilador e a corrida.
ph2d-particles = { path = "../ph2d-particles" }
ph2d-node-registry = { path = "../ph2d-node-registry" }
ph2d-unique-name = { path = "../ph2d-unique-name" }
ph2d-vec-entities = { path = "../ph2d-vec-entities" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }

# ⭐⭐ **Os ASSETS e o PALCO do prefab** (W2 5.ª rodada, 2026-09-13): as leis que vieram da shell
# trazem seis irmãs que só elas usam — o `AssetDb` e o índice (`ph2d-asset`, `ph2d-asset-index`),
# a redução das miniaturas (`ph2d-thumbnail`), o ledger de pré-visualização e o tamanho da janela
# do palco (`ph2d-preview-drive`, `ph2d-host`), e o painel da biblioteca, a quem o índice do
# quadro é publicado (`ph2d-panel-asset-browser` — família → painel é aresta permitida pelo
# `architecture_no_dependency_climbs_a_layer`). ⚠️ O `ph2d-asset` VOLTA: o machete de 12/09
# tirou-o porque nenhum ficheiro da família o usava — e os que o usam chegaram agora.
ph2d-asset = { path = "../ph2d-asset" }
ph2d-asset-index = { path = "../ph2d-asset-index" }
ph2d-host = { path = "../ph2d-host" }
ph2d-panel-asset-browser = { path = "../ph2d-panel-asset-browser" }
ph2d-preview-drive = { path = "../ph2d-preview-drive" }
# A lei do canvas do HUD (TOP-20 #20) — a ponte pergunta-lhe onde a caixa de referencia cai.
ph2d-hud = { path = "../ph2d-hud" }
# ⭐ **Os scripts do artista** (TOP-20 #16): a ponte (`script_bridge`) e a cena de smoke falam com o
# `ScriptHost` e anexam o `LuauScript`. ⚠️ A VM (`mlua` + Luau) já é compilada pela shell, logo esta
# aresta não acrescenta uma unidade à build do binário — só à dos testes desta crate.
ph2d-script = { path = "../ph2d-script" }
ph2d-thumbnail = { path = "../ph2d-thumbnail" }
# ⭐ **A árvore de tags do projecto** (TOP-20 #9): o formato dela dentro do `ProjectState`
# (`tags_doc`) vive nesta família, e a shell só o chama. O `serde` é o do par de fio (`SavedTag`):
# a árvore vive numa folha sem serde, de propósito.
ph2d-tags = { path = "../ph2d-tags" }
serde = { version = "1", features = ["derive"] }

# ⛔ **Esta família já NÃO depende da família da física** (auditoria de arquitectura A1, 2026-09-12).
# A nota que aqui estava chamava-o «legítimo» — uma crate-motor irmã não é a shell —, mas a
# `ph2d-app-physics` não é uma crate-motor: é uma FAMÍLIA, e o ADR-0075 proíbe famílias de se
# chamarem. As sementes chegam pela tabela que a shell injecta (`component_seed::SeedTable`).

# ⚠️ **As duas que o `cargo check` revelou e o `grep` não** (HOWTO §1.3, o custo
# real só se lê depois de a crate existir): o `bevy_ecs` porque o
# `instance_structure` faz consultas com o vocabulário cru do ECS, e o
# `postcard` porque o `instance_docs` compara documentos pelos BYTES.
bevy_ecs = "0.19"
postcard = { version = "1", default-features = false, features = ["use-std"] }

# ⚠️⚠️ **Estas duas entram pelo REGISTO DE COMPONENTES, não pelo código.** Nenhum
# ficheiro desta família nomeia um tipo delas — elas existem aqui porque o
# catálogo que as fixturas montam tem de ser **o mesmo** que o produto monta
# (ver `test_support::registo` e o gate que o prova). ⛔ Tirá-las daqui não é
# uma poda: é fazer as fixturas medirem um catálogo mais pobre que o do produto,
# **em silêncio e a verde**, que é precisamente o defeito que esta família
# inteira existe para apanhar.
ph2d-field-ecs = { path = "../ph2d-field-ecs" }
ph2d-skeleton-ecs = { path = "../ph2d-skeleton-ecs" }

[dev-dependencies]
# ⚠️ **As duas que só os TESTES dos assets pedem, e só o `--all-targets` as revelou** (HOWTO §2.5):
# o `prefab_stage_tests` pergunta ao ledger se a condução continua viva (`PreviewDrive::is_empty`,
# que mora atrás de `test-support` na crate dele — a shell liga-a pela mesma via), e o
# `asset_card_portrait_tests` grava o retrato em PNG quando o `PH2D_PORTRAIT_DUMP` o pede. ⛔ Nas
# `[dependencies]` a feature de teste entraria no binário do produto.
image = { version = "0.25", default-features = false, features = ["png"] }
ph2d-preview-drive = { path = "../ph2d-preview-drive", features = ["test-support"] }
# A régua lexical do HR-15, para o gate por crate (`tests/it/`).
ph2d-label-census = { path = "../ph2d-label-census" }
# ⭐ Os ids do painel da tabela de acções — dois gates da secção SIGNAL ACTIONS medem que o painel
# tem um id por verbo e por linha do modelo (desceram da shell em 2026-09-24, plano 28 W4). ⚠️ Só
# nos TESTES: é família → painel, aresta permitida pela lei das camadas, e o produto não a pede.
ph2d-panel-inspector = { path = "../ph2d-panel-inspector" }

[features]
# ⚠️⚠️ **Um `#[cfg(test)]` da família é INVISÍVEL do outro lado da fronteira**
# (HOWTO §2.5): daqui a shell é um consumidor, e `cfg(test)` é falso nesta crate
# quando ela a compila. Dois gates de COSTURA ficam na shell — porque o sujeito
# deles é meio chrome (`render_loop/inspector_presence_probe` e
# `hero_intents/texture_rebind`, os dois de famílias que ainda não saíram) — e
# precisam do arnês que se mudou para cá.
#
# ⛔ **Ela tem o TAMANHO do que ATRAVESSA, e nada mais:** o piloto abriu 16 itens
# de uma vez e o compilador acusou — `1 de 16` era lido de fora.
#
# ⚠️ Ligada pela shell nas **dev-dependencies**: no `cargo build` do produto ela
# fica desligada, e no `cargo test` fica ligada.
test-support = []

[lints]
workspace = true
