[package]
name = "ph2d-vector-font"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Frozen data model (ADR-0056): a glyph IS a VectorNetwork (ADR-0066 §2.2).
ph2d-vector-doc = { path = "../ph2d-vector-doc" }
# AnimValue / AttributeEvaluator — axes drive the graph as animated attributes
# (ADR-0066 §2.4). Read-only contract dep (the "mocks kill vaporware" crate).
ph2d-vector-traits = { path = "../ph2d-vector-traits" }
# skrifa (Linebender) — variable-font parsing + axis-aware outlines. Already in
# the workspace tree via parley/vello (0.40); pure Rust, no native build deps.
skrifa = "0.40"
# glam::Vec2 — the network's coordinate type.
glam = "0.30"
# SmallVec — axes inline ≤ 8 per glyph (ADR-0066 §2.7 cap).
smallvec = { version = "1", features = ["union"] }
