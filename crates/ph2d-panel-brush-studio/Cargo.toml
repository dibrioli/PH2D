[package]
name = "ph2d-panel-brush-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Brush Studio — typed `Panel<State>` (ADR-0029) for Painter W5. The full
# brush-parameter editor (the sidebar carries only the live painting
# essentials). Shares the right-dock geometry slot with the sidebar / layers
# panels (only one is visible at a time, driven by the shell `painter_bridge`).
#
# Template = `ph2d-panel-inspector` (sections + scroll + row-builders);
# widgets = `ph2d-panel-widget-gallery` canon. Mirrors `ph2d-panel-painter-
# sidebar` for the snapshot plumbing (publishes `BrushStudioSnapshot` per frame,
# emits edits via `EditorAction::ToolPanelEvent` → `PainterUiEdit::SetBrushParam`).

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
# BrushStudioSnapshot + BrushParam + PainterUiEdit (ADR-0040 TG-B canal
# genérico) — the panel reads the snapshot and emits UiEdits via ToolPanelEvent.
ph2d-tool-painter = { path = "../ph2d-tool-painter" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-tokens = { path = "../ph2d-tokens" }

[dev-dependencies]
ph2d-host = { path = "../ph2d-host" }
