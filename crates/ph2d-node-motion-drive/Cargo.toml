[package]
name = "ph2d-node-motion-drive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-nodegraph = { path = "../ph2d-nodegraph" }
ph2d-node-registry = { path = "../ph2d-node-registry" }
# O matiz/saturação/valor de uma cor tem UMA definição neste app, e ela mora aqui.
# Este nó ESCREVE o que o `motion.luminance` LÊ, e as duas metades do laço têm de
# concordar: uma cópia local seria um segundo matiz, divergindo no grafo que desloca
# o matiz e o lê de volta.
ph2d-color = { path = "../ph2d-color" }

# ⚠️ **DEV-dependency, e só isso:** um teste desta crate afirma a PALAVRA que o selector
# mostra, e desde a 5.ª fatia do HR-15 o array carrega CHAVES. O produto não conhece a
# tabela — quem traduz é quem pinta.
[dev-dependencies]
ph2d-i18n = { path = "../ph2d-i18n" }

[lints]
workspace = true
