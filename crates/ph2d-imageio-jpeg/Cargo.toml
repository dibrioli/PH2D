[package]
name = "ph2d-imageio-jpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# `ph2d-imageio-jpeg` — JPEG decode + encode (W1.T2). Mirrors the
# ph2d-imageio-png layout: registry hooks + ImageImporter + ImageExporter
# + tests, all in src/lib.rs. EXIF orientation (1-8) honoured at import.

[dependencies]
ph2d-imageio = { path = "../ph2d-imageio" }
ph2d-color   = { path = "../ph2d-color" }
# Pure-Rust JPEG codec (already workspace-transitive via ph2d-asset).
# `default-features = false` + features = ["jpeg"] keeps the wasm
# surface tight.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
