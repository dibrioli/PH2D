[lib]

# ⭐ A família da aba Input Map (plano `docs/InputMap/01_plano.md` §1 e §3): a `DocumentSurface`, o `install`, o
# `frame` que abre a aba pedida pelo menu, publica o `Snapshot` e aplica os `InputMapEdit` no `hero.input_map`, e a
# vista lembrada nas preferências. A pintura mora na folha `ph2d-input-map-editor`.

[dependencies]
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-host = { path = "../ph2d-host" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-input = { path = "../ph2d-input" }
ph2d-input-map-editor = { path = "../ph2d-input-map-editor" }
ph2d-player-controls = { path = "../ph2d-player-controls" }
ph2d-script = { path = "../ph2d-script" }
ph2d-text = { path = "../ph2d-text" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-vector = { path = "../ph2d-vector" }
tracing = "0.1"

