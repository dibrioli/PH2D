[workspace]
resolver = "3"
members = [
    "crates/ph2d-core",
    "crates/ph2d-host",
    "crates/ph2d-ecs",
    "crates/ph2d-gpu",
    "crates/ph2d-render",
    "crates/ph2d-vector",
    "crates/ph2d-text",
    "crates/ph2d-sdf",
    "crates/ph2d-grid",
    "crates/ph2d-light",
    "crates/ph2d-physics",
    "crates/ph2d-physics-soft",
    "crates/ph2d-fluids",
    "crates/ph2d-audio",
    "crates/ph2d-asset",
    "crates/ph2d-script",
    "crates/ph2d-net",
    "crates/ph2d-input",
    "crates/ph2d-editor",
    "crates/ph2d-editor-core",
    "crates/ph2d-panel-registry-init",
    "crates/ph2d-tool-registry",
    "crates/ph2d-tool-registry-init",
    "crates/ph2d-tool-make-square",
    "crates/ph2d-tool-grid-snap",
    "crates/ph2d-tool-bgremoval",
    "crates/ph2d-tool-trim-transparency",
    "crates/ph2d-tokens",
    "crates/ph2d-mcp",
    "crates/ph2d-i18n",
    "crates/ph2d-a11y",
    "crates/ph2d-save",
    "crates/ph2d-telemetry",
    "tests/spike",
    "shells/desktop",
    "tools/ph2d-bindgen",
    "tools/asset-cooker",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "LicenseRef-Proprietary"
authors = ["Enio Oliveira Dias Brito <dibrioli@gmail.com>"]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true

# CI-tuned test profile. Used by the workflow's `cargo nextest run
# --cargo-profile ci-test` and `cargo test --doc --profile ci-test`
# calls instead of `--release`.
#
# Why: profile.release has `lto = "thin"` + `codegen-units = 1` for
# distribution builds. Running tests under that profile pays the
# distribution-grade link cost on every CI call — the dominant
# contributor to the Windows job hitting the 30 min timeout.
#
# Trade-off accepted: workspace-local code compiles unoptimized
# (debug-grade speed), but dependencies (wgpu, wasmtime, bevy_ecs,
# vello, etc.) stay at opt-level=3 so test runtime stays fast.
# `package."*"` matches only direct dependencies, NOT workspace
# members — workspace members inherit the top-level `opt-level=1`.
# Performance-sensitive spike fixtures (c4_hot_reload, c14_memory,
# c11_bevy) still use `--release` in their dedicated steps.
[profile.ci-test]
inherits = "dev"
opt-level = 1
debug = false
lto = "off"
codegen-units = 16

[profile.ci-test.package."*"]
opt-level = 3
