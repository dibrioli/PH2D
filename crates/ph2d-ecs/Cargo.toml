[package]
name = "ph2d-ecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
bevy_ecs = "0.18"
# ph2d-core re-exports glam math types (Vec2, Vec3, Mat3) that the
# Transform/GlobalTransform components store. Keeps ph2d-core math-only
# and ph2d-ecs the single owner of the Component-shaped wrappers.
ph2d-core = { path = "../ph2d-core" }
# ph2d-asset is consumed by `scene::spawn_prefab` (M14.3b) to resolve
# ComponentBlob bytes into typed Components via ComponentRegistry.
ph2d-asset = { path = "../ph2d-asset" }
# O catálogo ÚNICO de estilos de warp (Enio 2026-07-25): `EnvelopeWarp` é apelido do
# `ph2d_warp_style::WarpStyle`, a MESMA lista do efeito Warp. Folha pura (só serde), não fere a
# regra "a fundação não puxa satélite pesado".
ph2d-warp-style = { path = "../ph2d-warp-style" }
# A casa ÚNICA do perfil de largura (ADR-0148): `VecStrokeProfile` guarda um
# `WidthStops`, e o MESMO tipo é consumido pelo motor da fita (`ph2d-vec-boolean`,
# via o re-export da `ph2d-vec-scene`). Fundação e modelo puro não se veem, então a
# casa é esta folha — mesmo argumento e mesmo precedente da `ph2d-warp-style` acima.
ph2d-stroke-width = { path = "../ph2d-stroke-width" }
# serde derives on every SimComponent (HR-14 mitigation while
# `#[derive(Saveable)]` macro is pending). PrefabDoc/SceneDoc in
# ph2d-asset (M14.3) consume these via postcard.
serde = { version = "1", features = ["derive"] }
# postcard wire format for ComponentBlob serialization in the
# ComponentRegistry (M14.3a). Same crate as ph2d-asset uses for the
# cooked Prefab/Scene format — single canonical wire format.
postcard = { version = "1", features = ["alloc"] }
# blake3 for `stable_type_id`: blake3(canonical_name).first_8_bytes().
# Stable across rustc versions (unlike `std::any::TypeId`), so cooked
# prefabs survive a compiler upgrade.
blake3 = "1"
# libm — pure-Rust IEEE 754 sincosf/tanf for cross-OS bit-identical
# transcendentals (Lens C C1 + W0 carry-over T1.3.5 + spec
# `docs/Sprite_projeto/10_schema_versionamento.md` §10 / §15 +
# `docs/architecture/decisions/0025-amendment-1.md` skew chain).
#
# EXACT version pin (HR-5 — same discipline as `postcard = "=1.1.3"`
# in ph2d-render): the `transform_determinism` gate pins a blake3
# golden hash that depends on libm's exact ulp output. A 0.2.16 →
# 0.2.17 patch could shift the output; the equal-pin makes the
# contract explicit at the dependency layer. Any bump = re-capture
# the EXPECTED_HASH in tests/transform_determinism.rs + cross-OS
# re-verify + ADR amendment.
#
# `default-features = false` disables the `arch` feature which
# would otherwise pull platform-specific intrinsics — exactly the
# divergence source we are trying to eliminate (R1 Lens B M1).
#
# Lineage: published under `rust-lang/compiler-builtins` (not
# archived; consolidated into compiler-builtins repo). Originally a
# pure-Rust port of MUSL libm. MIT-licensed; passes deny.toml
# allowlist (MIT permissive). Also a transitive workspace dep via
# glam — explicit pin here surfaces the contract surface.
#
# Next libm site: `libm::tanf` for `Transform::skew` per
# ADR-0025-amendment-1 (W2.T2.2).
libm = { version = "=0.2.16", default-features = false }

[dev-dependencies]
# dhat-rs for HR-3 zero-alloc verification in propagate_no_alloc.rs.
# Heap-profiling allocator wrapper; only compiled in tests.
dhat = "0.3"
# Sibling crates only needed by the end-to-end M14 pipeline test.
# Production code in ph2d-ecs does NOT depend on render / script /
# cooker — those layer up, not the other way around.
ph2d-render = { path = "../ph2d-render" }
ph2d-asset-cooker = { path = "../../tools/asset-cooker" }
