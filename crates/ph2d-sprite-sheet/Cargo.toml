[package]
name = "ph2d-sprite-sheet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# A ÚNICA dep do PH2D, e é a identidade: `AssetId` é o blake3 do conteúdo (HR-6), o mesmo que o
# `AssetDb` cunha — usar outro tipo aqui criaria um segundo nome para a mesma coisa. Crate fina de
# propósito (plano `docs/Sprite_projeto/17` §3): a shell, o painel e a ferramenta de empacotar
# consomem este documento, e nenhum dos três conhece os outros.
ph2d-asset = { path = "../ph2d-asset" }
# `Precision` — o MESMO tipo que a conversão e o `Asset` usam, para o acessor de
# [`SpritePixelDoc::precision`]. ⚠️ Ele **não é serializado**: a variante do `PixelPayload` já É a
# precisão, e por isso o formato de fio não tem um campo que possa discordar do payload
# (plano `docs/Sprite_projeto/18` W3). ⚠️ Vem do `ph2d-color` e não do `ph2d-imageio`: a conversão
# é a curva sRGB mais uma mudança de representação, logo é uma pergunta de COR — e este é o crate
# leve (bytemuck + serde), não o dos formatos de ficheiro.
ph2d-color = { path = "../ph2d-color" }
serde = { version = "1", features = ["derive"] }
# O MESMO formato de fio canônico do resto do projeto (ProjectFile, PrefabDoc, ComponentBlob).
postcard = { version = "1", features = ["alloc"] }
# O MESMO empacotador (Skyline) que o atlas dinâmico usa desde o M14.4d. Um segundo algoritmo
# aqui seria uma segunda resposta a "como o PH2D arruma retângulos", e as duas divergiriam no dia
# em que uma fosse afinada.
rect_packer = "0.2"
# A ESCRITA do formato do artista (Aseprite "Hash"). Os nomes das regiões vêm do utilizador e
# podem trazer aspas e barras — montar o JSON com `format!` produziria um arquivo inválido no
# ficheiro de outra pessoa. Mesma major que o `ph2d-asset` usa para o LEITOR do mesmo formato.
serde_json = "1"
