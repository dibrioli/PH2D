[package]
name = "ph2d-quadchain"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
# ⚠️ **`license.workspace` não é cerimónia: sem ele o `cargo deny` do ship reprova**
# (`error[unlicensed]: ph2d-quadchain = 0.0.0 is unlicensed`), e nenhum gate da linha o vê —
# o `deny` só corre no `ship.sh`. Uma crate NOVA herda-o das irmãs; esta nasceu sem.
license.workspace = true
publish = false

[dependencies]
# rayon: so' para o exemplo `chain_time`, que mede duas cadeias em paralelo.
rayon = "1"
# A cadeia inteira, na ordem em que ela corre. ⚠️ Esta crate NÃO tem algoritmo: ela é a ORDEM, e a
# ordem é a coisa que duas linhas estavam prestes a escrever duas vezes.
ph2d-mesh = { path = "../ph2d-mesh" }
ph2d-remesh-iso = { path = "../ph2d-remesh-iso" }
ph2d-crossfield = { path = "../ph2d-crossfield" }
ph2d-trace = { path = "../ph2d-trace" }
ph2d-gridmap = { path = "../ph2d-gridmap" }
ph2d-quadextract = { path = "../ph2d-quadextract" }
ph2d-quadfill = { path = "../ph2d-quadfill" }
