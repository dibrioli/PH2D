[package]
name = "ph2d-tool-registry-init"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# `register_all()` — the single append-only point of contact for tool
# registration. Lives in a dedicated crate (not in `ph2d-editor`) so
# tool crates that need to import `ph2d-editor` (widgets, paint,
# FloatingPanel, interaction pipeline — Stateful tools like grid-snap
# and bgremoval do) avoid the dependency cycle that would arise if
# `ph2d-editor` itself imported the tool crates.
#
# Dependency direction:
#   ph2d-tool-registry        (Registry types)
#       ↑
#       ├── ph2d-editor                (re-exports registry types; no tool deps)
#       ├── ph2d-tool-make-square      (action-only; no ph2d-editor dep)
#       └── ph2d-tool-<slug-stateful>  (needs widgets → deps ph2d-editor)
#
#   ph2d-tool-registry-init    (depends on all tool crates + this one for shell to call)
#       ↑
#       └── shells/desktop, shells/ipad, ...  (call `register_all()` at boot)
#
# See `docs/Migracao/2026-05-convention-by-discovery.md` PR 6.0
# retrofit.

[dependencies]
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
# Tool crates registered here. One line per tool, alphabetical order
# to keep merge-conflict surface trivial under multi-agent operation.
# `architecture_register_all_alphabetical` (in this crate's tests/)
# gates the ordering so a new tool inserted mid-alphabet by one agent
# can't silently land next to a competing append by another.
ph2d-tool-bgremoval = { path = "../ph2d-tool-bgremoval" }
ph2d-tool-grid-snap = { path = "../ph2d-tool-grid-snap" }
ph2d-tool-make-square = { path = "../ph2d-tool-make-square" }
ph2d-tool-real-size = { path = "../ph2d-tool-real-size" }
ph2d-tool-trim-transparency = { path = "../ph2d-tool-trim-transparency" }

[dev-dependencies]
# Re-export the platform / budget types for the CI lint tests.
ph2d-core = { path = "../ph2d-core" }
ph2d-a11y = { path = "../ph2d-a11y" }
# Wave 2 PR 11.4 chrome-manifest-coverage test reads the
# `screens::hero::ids` chrome consts from the editor and checks
# they hash-match the manifest ids registered here. Editor isn't a
# normal dep — adding it would let registry-init pull editor types
# into runtime, which violates the dep direction. Dev-dep is safe
# because the editor doesn't depend (directly or transitively) on
# registry-init.
ph2d-editor = { path = "../ph2d-editor" }
# Wave 2 PR 11.5 design-sync test reads `docs/design/tools/*.toml`
# and compares each entry field-by-field against the matching
# registered `ToolManifest`. Dev-only — no runtime dep on serde.
toml = "0.9"
