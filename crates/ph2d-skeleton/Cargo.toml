# ⛔ **UMA dependência, e é a álgebra.** É esta linha que faz do esqueleto um MÓDULO: enquanto a
# lei vivia na `ph2d-vec-skin` ela puxava a `ph2d-vec-scene`, e um esqueleto que serve raster, 3D e
