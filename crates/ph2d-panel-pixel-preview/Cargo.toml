[package]
name = "ph2d-panel-pixel-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# A janela PREVIEW do Pixel Art (P5, ADR-0196): flutuante, mostra o quadro activo (ou o da
# animação dela) com zoom próprio. A imagem chega por um canal desta crate, publicado pela família.
[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y        = { path = "../ph2d-a11y" }
ph2d-tokens      = { path = "../ph2d-tokens" }
ph2d-i18n        = { path = "../ph2d-i18n" }
ph2d-pixel-core  = { path = "../ph2d-pixel-core" }
ph2d-pixel-render = { path = "../ph2d-pixel-render" }
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-vector      = { path = "../ph2d-vector" }

[dev-dependencies]
ph2d-label-census = { path = "../ph2d-label-census" }
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }

[lints]
workspace = true
