[package]
name = "ph2d-panel-pixel-tiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# A tela dos tilemaps do Pixel Art (P10b): o destino do traço, o modo, o tileset e a janela de criar ou
# converter uma camada. O painel não vê a família: o que ela sabe e o que ele pede passam pelo canal.
[dependencies]
ph2d-a11y         = { path = "../ph2d-a11y" }
ph2d-editor-core  = { path = "../ph2d-editor-core" }
ph2d-i18n         = { path = "../ph2d-i18n" }
ph2d-pixel-core   = { path = "../ph2d-pixel-core" }
ph2d-pixel-tiles  = { path = "../ph2d-pixel-tiles" }
ph2d-tokens       = { path = "../ph2d-tokens" }
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-vector       = { path = "../ph2d-vector" }

[[test]]
name = "it"
path = "tests/it/main.rs"

[dev-dependencies]
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }

[lints]
workspace = true
