[package]
name = "ph2d-board-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# O TRANSPORTE do quadro ao vivo na rede local (ADR-0181 §7–§8): quadros de bytes opacos entre um
# anfitrião e convidados, cifrados. Não conhece o quadro nem o protocolo. Threads std, sem async.
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
mdns-sd = { version = "0.21", default-features = false }
if-addrs = "0.15"

[lints]
workspace = true
