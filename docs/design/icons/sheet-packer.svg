<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sheet-packer" aria-label="Sheet Packer">
  <!-- A folha e o arranjo: a moldura externa e três peças DESIGUAIS encaixadas dentro dela.
       As peças têm tamanhos diferentes de propósito — com retângulos iguais o desenho leria como
       uma grade (uma tabela, um calendário), e o que distingue esta ferramenta é justamente o
       encaixe de peças desiguais. Fonte de verdade de icon::sheet_packer_bezpath. -->
  <rect x="3" y="3" width="18" height="18"/>
  <rect x="6" y="6" width="7" height="7"/>
  <rect x="15" y="6" width="3" height="5"/>
  <rect x="6" y="15" width="4" height="3"/>
</svg>
