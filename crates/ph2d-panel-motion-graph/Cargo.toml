[package]
name = "ph2d-panel-motion-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

# Motion Nodes graph-editor panel (Motion Nodes M0.T9). Docked in the
# `motion_graph` region of `HeroLayout`, visible only while the `motion` tool is
# active (the shell's `motion_bridge` drives `panel_visible("motion_graph")`).
# M0 ships the skeleton: it paints the opaque graph canvas background (Fase A —
# covers the sprite render underneath) and publishes its rect for dispatch. Node
# cards / wiring / gestures land in M1.

[lib]

[dependencies]
# A tabela de strings (HR-15) — deixou de escrever texto no fonte em 2026-09-16.
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
# ⭐ Os EDITORES RICOS (curva, gradiente, paleta) — a crate-folha com dois hospedeiros: a row do
# painel lateral e o CARTÃO daqui (doc 101 / doc 103).
ph2d-param-editors = { path = "../ph2d-param-editors" }
# Só os GATES da janela do editor leem a curva de volta (o produto trata-a como texto).
ph2d-curve = { path = "../ph2d-curve" }
# Idem: os gates leem a rampa e a paleta de volta.
ph2d-color = { path = "../ph2d-color" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-tokens = { path = "../ph2d-tokens" }
# `PointerButton` — the add-node menu opens on a right-click (Secondary) on empty
# canvas, so the gesture interpreter distinguishes the button (M1.E7).
ph2d-host = { path = "../ph2d-host" }
# M1 — the graph view model: node UI metadata (category/silhouette) + the port
# axes (Domain/Dim/Clock) that drive socket color/shape, wire color, and the
# live connect-compatibility preview.
ph2d-node-registry = { path = "../ph2d-node-registry" }
# ⚠️ Para CENTRAR o nome na cápsula com a medida REAL do texto
# (`TextSystem::prefix_width_weighted`) — uma estimativa de avanço médio poria o nome
# visivelmente fora do centro numa pastilha que existe para ser lida de longe.
ph2d-text = { path = "../ph2d-text" }
ph2d-nodegraph = { path = "../ph2d-nodegraph" }

[dev-dependencies]
# A régua lexical do HR-15, para o gate por crate.
ph2d-label-census = { path = "../ph2d-label-census" }
# Behavioral seam harness (`MockPanelHost`) — it PAINTS the panel, which is the only
# way to test the add-menu the way the artist meets it: the search field is registered
# by the paint, and the click that picks a row is resolved against what the paint drew.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }

[lints]
workspace = true
