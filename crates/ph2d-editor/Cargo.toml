[package]
name = "ph2d-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[lib]

# Wave 2 PR 11.2: `build.rs` reads `docs/design/icons/*.svg` (89 SVGs,
# Lucide-derived) and generates `OUT_DIR/icons_generated.rs` with
# per-icon `IconCmd` arrays + slug→cmds lookup table. Eliminates 715
# LOC of manually-ported match arms in `icons.rs::cmds()`.

[build-dependencies]

[dependencies]
# ph2d-tool-registry — convention-by-discovery infrastructure
# (ToolManifest, Registry, NodeId hash). Re-exported as
# `ph2d_editor::registry` so existing callers keep working. See
# `docs/Migracao/2026-05-convention-by-discovery.md` PR 4.0.
# ph2d-core (MemoryBudget) flows transitively via ph2d-tool-registry —
# no direct dep needed (cargo-machete enforces this; PR 6.0 retrofit
# moved the integration tests that consumed ph2d-core directly to
# ph2d-tool-registry-init).
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
# Tool crates moved to `ph2d-tool-registry-init` (PR 6.0 retrofit).
# `ph2d-editor` no longer depends on Stateful tools (grid-snap,
# bgremoval) so they can import `ph2d-editor` (widgets, paint,
# FloatingPanel) without a Cargo cycle. Action-only tools
# (no `ph2d-editor` dep) can still be facaded here as a transition
# nicety until PR 10 cleanup removes the facades entirely.
ph2d-tool-make-square = { path = "../ph2d-tool-make-square" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-a11y = { path = "../ph2d-a11y" }
# ph2d-vector + ph2d-text — M11 widget paint pass. The `Paint` trait
# in `paint.rs` lowers each widget into a `vello::Scene` via
# `ph2d-vector::VectorScene`; text labels go through
# `ph2d-text::TextSystem` (parley layout → Vello glyph runs).
ph2d-vector = { path = "../ph2d-vector" }
ph2d-text = { path = "../ph2d-text" }
# ph2d-host — PointerEvent / KeyEvent types consumed by the
# interaction dispatcher (ADR-0024).
ph2d-host = { path = "../ph2d-host" }
# ph2d-grid — grid kinds (Square/Hex/Iso/Staggered/Tri) + snap math
# consumed by `grid_snap/` editor module (slot 1 agent grid-snap).
ph2d-grid = { path = "../ph2d-grid" }
# ph2d-i18n — string-table stub (M13 deferred Fluent). Tooltips and
# toast strings funnel through `tr("key")` so the eventual Fluent
# migration is an impl swap, not a call-site rename. See HR-15.
ph2d-i18n = { path = "../ph2d-i18n" }
# Interaction infrastructure (ADR-0024 plan, HR-3 zero-alloc):
# - smallvec: HitIndex inline storage (no heap until > 128 widgets).
# - bumpalo: per-frame arena for emitted WidgetEvents.
smallvec = "1"
bumpalo = { version = "3", features = ["collections"] }
# image — imageops::resize (lanczos) for bgremoval thumbnail downscale
# + guided-filter ops. `default-features = false` strips decoders
# (ph2d-asset is the canonical decode boundary; this crate only
# operates on already-decoded RGBA).
image = { version = "0.25", default-features = false }
# rayon was requested for parallel guided-filter passes inside
# bgremoval but slot 2's M3 ships the vanilla serial gray-guide
# implementation; cargo machete flagged the import as unused on
# 2026-05-16. Re-add when bgremoval lands a parallel path.

[dev-dependencies]
# dhat-rs: HR-3 enforcement bench — counts allocations in
# `interaction_dispatch_no_alloc` test to assert hot path is
# allocation-free. See ADR-0024 "Plano de conformidade HR-3".
dhat = "0.3"
