[package]
name = "ph2d-editor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[lib]

# Wave 2 PR 11.2 / Wave 6+7 Phase 2: `build.rs` reads
# `docs/design/icons/*.svg` (89 SVGs, Lucide-derived) and generates
# `OUT_DIR/icons_generated.rs` with per-icon `IconCmd` arrays +
# slug→cmds lookup table. Eliminates 715 LOC of manually-ported match
# arms in `icons.rs::cmds()`.

[build-dependencies]

[dependencies]
# **A MOLA do substrato de UI viva** (`motion.rs`). Folha pura (só serde), partilhada com a
# `ph2d-ui-state` — copiá-la daria uma SEGUNDA resposta a "como uma mola integra", e depender da
# `ph2d-ui-state` arrastaria `ph2d-vec-scene` + `ph2d-vec-blend` para dentro de todo painel.
ph2d-spring = { path = "../ph2d-spring" }
# libm — HR-5 cross-OS bit-identical sincosf used in `gizmo/transform.rs`
# (`compose_snapshot` mirrors `ph2d_ecs::Transform::compose`). Same
# exact-version contract as ph2d-ecs (T1.3.5 spec carry-over).
libm                  = { version = "=0.2.16", default-features = false }
ph2d-tokens           = { path = "../ph2d-tokens" }
# `Precision` para a linha **Format** do Inspector, e `SrgbRgba` para os testes que ja' o usavam.
# ⚠️ Era dev-only ate' 2026-08-20 (plano `docs/Sprite_projeto/18` W5): a linha Format passou a
# dizer a precisao MEDIDA em vez de um literal, e o tipo tem de atravessar o snapshot. Crate-folha
# (bytemuck + serde), e o gate de ciclos so' proibe `ph2d-editor` e `ph2d-tool-*`.
ph2d-color            = { path = "../ph2d-color" }
# As GUIAS do documento (plano 25 §9): a régua só precisa do EIXO — o gesto que ela arma diz
# se a linha nasce horizontal ou vertical, e esse vocabulário tem um dono só.
ph2d-guides           = { path = "../ph2d-guides" }
ph2d-a11y             = { path = "../ph2d-a11y" }
# **O INPUT MAP** (plano 30). O `HeroScreen` guarda o mapa AUTORADO deste projecto, exactamente
# como guarda as `ProjectSettings` — e a janela flutuante que o edita PINTA a partir dele, o que
# obriga o tipo a estar ao alcance do pintor (`paint_hero_screen` só recebe o `HeroScreen`).
# ⚠️ É uma FOLHA (só `serde`), com gate próprio a defendê-la: `ph2d-input` não arrasta `winit` nem
# um `World`, e é isso que a mantém legível também do runtime do jogo.
ph2d-input            = { path = "../ph2d-input" }
ph2d-vector           = { path = "../ph2d-vector" }
ph2d-text             = { path = "../ph2d-text" }
ph2d-host             = { path = "../ph2d-host" }
ph2d-tool-registry    = { path = "../ph2d-tool-registry" }
# ph2d-grid — grid kinds (Square/Hex/Iso/Staggered/Tri) + snap math
# consumed by `grid_snap/` module (ADR-0029 Phase B.2 absorbed from
# ph2d-editor).
ph2d-grid             = { path = "../ph2d-grid" }
# ph2d-i18n — string-table stub (M13 deferred Fluent). Tooltips and
# toast strings funnel through `tr("key")` so the eventual Fluent
# migration is an impl swap, not a call-site rename. See HR-15.
ph2d-i18n             = { path = "../ph2d-i18n" }
smallvec              = "1"
bumpalo               = { version = "3", features = ["collections"] }

[dev-dependencies]
# O gate `every_registered_panel_is_reachable_by_the_z_order_walk` compara o REGISTRO real
# com a lista de z-order. Ele precisa do registro que o app monta, e nao de uma copia.
#
# ⚠️ Dependencia de DEV apontando "para cima" (a registry-init depende desta crate): so
# possivel porque cargo permite ciclos via dev-dependencies. Sem isto o gate teria de
# receber a lista de paineis de fora, e uma lista transcrita nao mede nada.
ph2d-panel-registry-init = { path = "../ph2d-panel-registry-init" }
# dhat-rs: HR-3 enforcement bench — counts allocations in
# `interaction_dispatch_no_alloc` test to assert hot path is
# allocation-free. See ADR-0024 "Plano de conformidade HR-3".
dhat = "0.3"
# ph2d-tool-make-square + ph2d-tool-trim-transparency — DEV-only
# (ADR-0040 T1.5/T3). The algorithms moved to their crates (foundation
# ⊥ tools); the editor-core integration test make_square_algorithm.rs
# (incl. its trim↔make_square round-trip) still exercises them.
# Dev-dep doesn't trip the `architecture_cycle_prevention` gate
# (it parses [dependencies] only) and creates no runtime cycle.
ph2d-tool-make-square = { path = "../ph2d-tool-make-square" }
ph2d-tool-trim-transparency = { path = "../ph2d-tool-trim-transparency" }
bytemuck = "1"
# Wave 10 / Etapa 4.2 — staleness gate for chrome handler `mod` block.
ph2d-chrome-sync = { path = "../../tools/ph2d-chrome-sync" }
# Wave 10 / Etapa 4.3 — staleness gate for widget `mod` block.
ph2d-widget-sync = { path = "../../tools/ph2d-widget-sync" }
# ADR-0029 Phase C.1 NOTE: Inspector regression tests that need
# `ph2d_panel_inspector::*` are scheduled to migrate to
# `crates/ph2d-panel-inspector/tests/inspector_regression.rs` in
# Phase D (cycle-free integration tests). A dev-dep here would
# duplicate `ph2d-editor-core` in the test build graph (cargo
# treats dev-dep cycles as distinct crate instances).
