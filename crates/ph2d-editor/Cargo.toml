[package]
name = "ph2d-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ADR-0029 Phase B.5 — `ph2d-editor` is a deprecated shim. All
# substantive content moved to `ph2d-editor-core` in Phase B.2; this
# crate's `lib.rs` is now a `pub use ph2d_editor_core::*;` re-export
# so existing consumers (panel crates, shells, tool crates) keep
# their `ph2d_editor::*` import paths working unchanged.
#
# Targeted for deletion in ADR-0030 (~6 months) once all callers
# migrate to `ph2d_editor_core::*` directly.

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }

[dev-dependencies]
# Tests in `tests/` still live here; they reach editor symbols
# through the shim re-export. `dhat` powers
# `interaction_no_alloc.rs` (HR-3 enforcement bench).
dhat = "0.3"
