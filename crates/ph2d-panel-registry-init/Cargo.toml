[package]
name = "ph2d-panel-registry-init"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-editor-core               = { path = "../ph2d-editor-core" }
# <ph2d-panel-sync:deps:begin>
ph2d-panel-audio-mixer = { path = "../ph2d-panel-audio-mixer", optional = true }
ph2d-panel-bgremoval = { path = "../ph2d-panel-bgremoval", optional = true }
ph2d-panel-color-equalization = { path = "../ph2d-panel-color-equalization", optional = true }
ph2d-panel-equalize-sizes = { path = "../ph2d-panel-equalize-sizes", optional = true }
ph2d-panel-grid-snap = { path = "../ph2d-panel-grid-snap", optional = true }
ph2d-panel-hierarchy = { path = "../ph2d-panel-hierarchy", optional = true }
ph2d-panel-inspector = { path = "../ph2d-panel-inspector", optional = true }
ph2d-panel-padding = { path = "../ph2d-panel-padding", optional = true }
ph2d-panel-painter-layers = { path = "../ph2d-panel-painter-layers", optional = true }
ph2d-panel-upscale = { path = "../ph2d-panel-upscale", optional = true }
ph2d-panel-vector-graph = { path = "../ph2d-panel-vector-graph", optional = true }
ph2d-panel-vector-inspector = { path = "../ph2d-panel-vector-inspector", optional = true }
ph2d-panel-widget-gallery = { path = "../ph2d-panel-widget-gallery", optional = true }
# <ph2d-panel-sync:deps:end>

[features]
default = [
    "panel-widget-gallery", "panel-hierarchy", "panel-inspector", "panel-grid-snap",
    "panel-bgremoval", "panel-padding",
    "panel-color-equalization", "panel-equalize-sizes", "panel-upscale",
    "panel-audio-mixer",
]
# Per-panel toggle features. Each `panel-X` activates the matching
# `dep:ph2d-panel-X` optional dependency. The block is regenerated by
# `cargo run -p ph2d-panel-sync` from a scan of `crates/ph2d-panel-*` —
# do NOT edit between the markers by hand.
# <ph2d-panel-sync:features:begin>
panel-audio-mixer = ["dep:ph2d-panel-audio-mixer"]
panel-bgremoval = ["dep:ph2d-panel-bgremoval"]
panel-color-equalization = ["dep:ph2d-panel-color-equalization"]
panel-equalize-sizes = ["dep:ph2d-panel-equalize-sizes"]
panel-grid-snap = ["dep:ph2d-panel-grid-snap"]
panel-hierarchy = ["dep:ph2d-panel-hierarchy"]
panel-inspector = ["dep:ph2d-panel-inspector"]
panel-padding = ["dep:ph2d-panel-padding"]
panel-painter-layers = ["dep:ph2d-panel-painter-layers"]
panel-upscale = ["dep:ph2d-panel-upscale"]
panel-vector-graph = ["dep:ph2d-panel-vector-graph"]
panel-vector-inspector = ["dep:ph2d-panel-vector-inspector"]
panel-widget-gallery = ["dep:ph2d-panel-widget-gallery"]
# <ph2d-panel-sync:features:end>

[dev-dependencies]
# Wave 10 / Etapa 4.1 — staleness gate uses the codegen library.
ph2d-panel-sync = { path = "../../tools/ph2d-panel-sync" }
