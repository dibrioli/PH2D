# Vector Shape — Stateful tool, third interactive tool of the Vector
# Module (plan T2.2). Five primitive sub-modes (rect/ellipse/polygon/star/
# spiral) via a panel RadioGroup; a drag generates a live preview, release
# commits. Geometry from ph2d-vector-doc::primitives (shared with the W3
# vector-source node).
#
# Cluster `vector_tools` (shared with Pen/Pencil). Shell rendering is the
# `vector_shape_bridge.rs` preview + commit pass.
#
# Canonical source for `crates/ph2d-tool-vector-shape/src/lib.rs`.

[tool]
id          = "vector_shape"
cluster     = "vector_tools"
zone        = "top_right"
order       = 30
a11y_role   = "Button"
icon_slug   = "vector-shape"
touches_sim = false

[label]
pt_br_inline = "Forma"
en_us_inline = "Shape"
fluent_key   = "tool.vector_shape.label"

[memory_budget]
vram_mb        = 0
ram_mb         = 1
heap_script_mb = 0
