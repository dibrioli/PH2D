# cargo-deny configuration for PH2D
# Run: cargo deny check
#
# Three checks: licenses, bans (duplicates), advisories (CVEs).
# Designed to fail the build on any forbidden license, known CVE, or
# duplicate version of a dep that materially bloats the binary.

[graph]
# Audit all targets we ship to.
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

# ----------------------------------------------------------------------------
# Licenses — ph2d is proprietary; deps must be permissive.
# ----------------------------------------------------------------------------
[licenses]
# Confidence threshold for SPDX detection (0.0–1.0). 0.8 = strict.
confidence-threshold = 0.85

# Whitelist of permissive licenses we accept in dependencies.
# (See https://spdx.org/licenses/ for canonical IDs.)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # Our own crates declare this:
    "LicenseRef-Proprietary",
]

# Per-crate license overrides for crates with non-standard or dual licensing
# we've manually audited. Each entry is the choice we accept from a multi-
# license expression.
[[licenses.exceptions]]
# ittapi is dual BSD-3-Clause OR GPL-2.0; we choose BSD.
allow = ["BSD-3-Clause"]
name = "ittapi"

[[licenses.exceptions]]
allow = ["BSD-3-Clause"]
name = "ittapi-sys"

[[licenses.exceptions]]
# r-efi is tri-licensed Apache-2.0 OR LGPL-2.1-or-later OR MIT; we choose MIT.
allow = ["MIT"]
name = "r-efi"

[[licenses.exceptions]]
# error-code + clipboard-win are BSL-1.0 only (Boost Software
# License — permissive, MIT-equivalent, OSI-approved + FSF-Free).
# Both pulled by `arboard`, which shells/desktop uses for Cmd+C/V
# clipboard integration.
allow = ["BSL-1.0"]
name = "error-code"

[[licenses.exceptions]]
allow = ["BSL-1.0"]
name = "clipboard-win"

# Grant clarification for crates whose embedded LICENSE files don't match
# their Cargo.toml `license` field exactly.
[[licenses.clarify]]
name = "encoding_rs"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [{ path = "COPYRIGHT", hash = 0x39f8ad31 }]

# ----------------------------------------------------------------------------
# Advisories — fail on known CVEs and yanked versions.
# ----------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (RUSTSEC-2024-0436) but pulled
    # transitively by rapier2d → nalgebra → simba. No CVE; just
    # archived. The crate is feature-frozen, battle-tested, used
    # only at proc-macro expansion (no runtime risk). Accepted
    # until the rapier upstream chain migrates.
    "RUSTSEC-2024-0436",
    # `atomic-polyfill` unmaintained (RUSTSEC-2023-0089) — transitive
    # embedded-target shim, unused on PH2D's 64-bit targets.
    "RUSTSEC-2023-0089",
    # `jxl-grid` OOB write via integer overflow (RUSTSEC-2026-0151) is
    # 32-bit-ONLY. PH2D ships exclusively 64-bit (Mac ARM64, desktop x64,
    # iPad ARM64) — the overflow path is unreachable on every target.
    # Pulled transitively by jxl-oxide (JPEG-XL decode in ph2d-imageio-jxl).
    # Ignored until jxl-oxide ships a patched jxl-grid; revisit if PH2D ever
    # adds a 32-bit target. (Solo Coord 2026-05-29 — flagged to Enio;
    # bump-vs-ignore is his to override.)
    "RUSTSEC-2026-0151",
]

# ----------------------------------------------------------------------------
# Bans — duplicates and forbidden crates.
# ----------------------------------------------------------------------------
[bans]
# Allow up to 1 duplicate version of any crate (i.e., warn on 2+, deny on 3+).
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

# Force `tokio` ban (HR: async proibido no core, exceto asset loader e net).
# We allow tokio in transitive deps if pulled by quinn/wasmtime/etc., but
# deny direct first-party deps.
#
# W1.T2.4 (D5) defensive bans — texture compression audit fallout.
# Audit `docs/audits/ctt-source-audit-2026-05-27-CONSOLIDATED.md` Lente B
# triage de 13 upstream issues do ctt identificou 2 direções futuras que
# PH2D NÃO consome (ADR-0055-v4 §3 alternativas rejeitadas):
#   - basis-universal-sys: upstream issue #68 propõe integration; PH2D
#     rejeitou Basis runtime por dupla compressão lossy + transcoder.wasm
#     500KB + iOS PrivacyManifest FFI.
#   - nvtt: upstream issue #23 propõe NVTT (NVIDIA Texture Tools)
#     proprietary integration; viola HR-1 §2.7.1 critério #4 (license).
# Banir agora previne pull transitivo silencioso em upgrade futuro do ctt.
deny = [
    # Basis Universal family — todas as variantes publicadas em crates.io
    # (verificado via `cargo search basis-universal` 2026-05-27 noite).
    { name = "basis-universal" },     # high-level wrapper (Aclysma 0.3.1 dormente)
    { name = "basis-universal-sys" }, # unsafe bindings (mesmo maintainer)
    { name = "basisu_c_sys" },        # pure C API binding (underscore name real)
    # NVTT (NVIDIA Texture Tools) family — proprietary SDK violates HR-1 §2.7.1 #4.
    # Nomes REAIS publicados (verificado via `cargo search nvtt`): ambos usam
    # underscore. Hífen-version não existe e banir hífen é silent miss.
    { name = "nvtt_rs" },             # high-level wrapper (nota: underscore!)
    { name = "nvtt_sys" },            # unsafe bindings (nota: underscore!)
]

# Skip duplicate-version checks for crates that legitimately have multiple
# versions in the dep tree (e.g., wasmtime brings older variants).
skip-tree = []

# ----------------------------------------------------------------------------
# Sources — only crates.io, no git/path forks unless declared here.
# ----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
