[package]
name = "ph2d-painter-brush"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Pure raster brush engine — a CLEAN-ROOM reimplementation of the Blender Texture
# Paint brush (behaviour only; Blender is GPL, PH2D is proprietary — see docs/Painter/).
# NOT a continuation of the brush engine deleted by ADR-0099; built fresh with Blender
# as the single reference.
#
# Pure by design: BrushSpec + falloff + the 24 Blender brush blend modes + dab stamping
# into an RGBA8 buffer. No UI, no editor-core, no frozen contract, no GPU — so the layer
# host (`ph2d-tool-painter`) can depend on it and the math stays table-testable. Zero
# dependencies on purpose (the dab blends in the layer's native space, like Blender's
# byte texture-paint path, so no sRGB transfer is needed here).

[dependencies]
# ⚠️ **A EXCEÇÃO do `rayon`, e ela é ESTREITA** — ADR-0158, amparada no ADR-0109. Ela entra
# EXCLUSIVAMENTE na soma corrida do `solid::fill_coverage`: a cobertura de uma linha é a soma da
# derivada DAQUELA linha, nada atravessa a fronteira horizontal, e a ordem das somas dentro da linha
# é a mesma nas duas rotas ⇒ byte-idêntico, MEDIDO e não argumentado.
#
# ⚠️ **O depósito das ARESTAS continua SERIAL, pelo mecanismo:** `acc[cell] += d` em `f32` não é
# associativo e o `x` de uma aresta é caminhado incrementalmente linha a linha, então uma banda que
# comece no meio de uma aresta recomputa `x` e sai um `f32` diferente. Todo uso novo desta dep exige
# ADR novo (a cerca de contenção do ADR-0109).
rayon = "1"
# A LEI da mistura de tintas (K–M), partilhada com o Wet Paint e a Aquarela — ordem do dono
# (2026-09-20): os três meios misturam igual, logo leem a MESMA porta e não três cópias.
#
# ⚠️ **Ela derruba a premissa escrita no cabeçalho acima** (*«Zero dependências de propósito — o dab
# mistura no espaço nativo da camada, logo nenhuma transferência sRGB é precisa aqui»*): a lei da
# tinta É uma transferência sRGB, e quem moveu o número reconfere a nota (§0.0). O que a razão
# antiga protegia — *nada de UI, de editor-core, de contrato nem de GPU* — continua de pé.
ph2d-pigment = { path = "../ph2d-pigment" }

[dev-dependencies]
# A régua lexical do HR-15, para o censo deste motor.
ph2d-label-census = { path = "../ph2d-label-census" }

[lints]
workspace = true
