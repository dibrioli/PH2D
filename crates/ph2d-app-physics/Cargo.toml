[package]
name = "ph2d-app-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# ⚠️ A INTERFACE da shell (`AppFamily`), não o agregador — importar de
# `ph2d-app-registry-init` fecharia o ciclo `registry → família → registry`.
ph2d-app-host = { path = "../ph2d-app-host" }
# ⚠️ A regra desta crate é a DIRECÇÃO das setas: ela depende das crates do
# módulo e do ECS, e **nunca da shell** (que é um `bin` e não pode ser
# dependência de ninguém). É isso que faz dela uma unidade de compilação que o
# `cargo check -p ph2d-app-physics` fecha sem tocar nas 493 k linhas do
# `shells/desktop` — o ponto inteiro da W2 (auditoria de velocidade §4-C2).
# ⚠️ Versão LITERAL, como as irmãs (`ph2d-ecs`, `ph2d-physics-ecs`): este
# workspace **não tem** `[workspace.dependencies]`, e herdar dele não compila.
bevy_ecs = "0.19"
ph2d-core = { path = "../ph2d-core" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }
ph2d-render = { path = "../ph2d-render" }
# ⭐ **O CUSTO REAL do módulo, e ele só se lê aqui** (HOWTO §1.3): dentro da shell todas
# estas eram dependência do binário, e um ficheiro escrevia `ph2d_timeline::…` sem nada que o
# declarasse. ⚠️ A `ph2d-timeline` era um dos SETE prendedores do §6 do handoff da Fase A — e a
# resposta é que ela é uma crate IRMÃ, não a shell: a família pode depender dela.
ph2d-anim = { path = "../ph2d-anim" }
ph2d-editor = { path = "../ph2d-editor" }
ph2d-flip = { path = "../ph2d-flip" }
ph2d-guides = { path = "../ph2d-guides" }
ph2d-host = { path = "../ph2d-host" }
ph2d-input = { path = "../ph2d-input" }
ph2d-panel-physics = { path = "../ph2d-panel-physics" }
ph2d-text = { path = "../ph2d-text" }
ph2d-ui-state = { path = "../ph2d-ui-state" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
ph2d-vector = { path = "../ph2d-vector" }
# `libm`: HR-5, a trigonometria bit-idêntica entre OS que o overlay usa.
libm = { version = "=0.2.16", default-features = false }
# ⚠️⚠️ **As FEATURES não viajam com o código** (HOWTO §2.4, a armadilha MUDA): a shell pede
# `features = ["render", "physics"]` a esta crate, e numa crate que as não declare o `cfg` é falso
# **por construção** — compilaria verde com metade da timeline desligada.
ph2d-timeline = { path = "../ph2d-timeline", features = ["render", "physics"] }
# Transitivas pela `ph2d-physics-ecs` dentro da shell; aqui a família nomeia-as, que é o ponto.
ph2d-physics = { path = "../ph2d-physics" }
ph2d-platformer = { path = "../ph2d-platformer" }
serde = { version = "1", features = ["rc"] }
