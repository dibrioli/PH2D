[package]
name = "ph2d-painter-brush"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Brush engine core — Brush struct + 12 sub-structs + Stamp 96B ABI freeze
# + BrushHandle bit-31 + RenderingMode 6 FROZEN + PigmentMode + GrainSource +
# ProceduralGrain + atlas/library/mixbox stubs.
#
# T1.3 entrega tipos + defaults. GPU compute pipeline (StampPipeline) é T1.4+;
# atlas real é T1.5+; Mixbox WGSL é T-color+T1.X+; Procedural Grain compute
# é W5+.
#
# Contrato congelado por ADR-0044 (cascata W0 ratificada 2026-05-26).

[dependencies]
# HR-14 versionado postcard binary serialization (.ph2d-brush format).
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
# bytemuck Pod+Zeroable derive — Stamp 96B ABI freeze CPU↔GPU.
bytemuck = { version = "1", features = ["derive"] }
# blake3 hash para BrushParamsHash + dedup em stroke history (ADR-0046).
blake3 = "1"
# GPU wrapper para StampPipeline compute (T1.4 ship). Adicionado em T1.3
# (audit 2026-05-26 C-G1) pre-empt — T1.4 wires `StampPipeline` via
# `ph2d-gpu::GpuContext` + direct `wgpu` types for the bind group layout.
ph2d-gpu = { path = "../ph2d-gpu" }
# Direct `wgpu` dep for ComputePipeline/BindGroupLayout/etc types
# referenced by `stamp_pipeline.rs`. Version pinned to match `ph2d-gpu`
# (transitive resolution would otherwise risk version skew on minor
# bumps — Comfy post-mortem cited in SKILL §15).
wgpu = "28"

[dev-dependencies]
# naga reflection in stamp_pipeline tests:
# - `stamp_wgsl_parses_via_naga` / `stamp_wgsl_validates_via_naga`
#   catch syntax + analyzer errors before GPU init.
# - `shader_stamp_struct_size_matches_rust_abi` is the audit D-F9
#   follow-up: WGSL `Stamp` size must equal the Rust 96-byte ABI.
# - `shader_workgroup_size_is_8x8x1` enforces spec §1.8.2.
# Dev-dep only — production paths never reach the reflection helper.
naga = "28"
