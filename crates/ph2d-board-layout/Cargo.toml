[package]
name = "ph2d-board-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# O texto do Quadro: moldar (quebra + centrado) em unidades do MUNDO, guardar o moldado, desenhá-lo a
# qualquer zoom. Mesma parley do `ph2d-text` (os contextos vêm dele).
parley = "0.12.0"
ph2d-board-model = { path = "../ph2d-board-model" }
ph2d-text = { path = "../ph2d-text" }
ph2d-vector = { path = "../ph2d-vector" }
# Ctrl+Backspace: a palavra anterior pelas fronteiras UAX #29 (o parley 0.12 salta duas no fim do texto).
unicode-segmentation = "1.13"

[lints]
workspace = true
