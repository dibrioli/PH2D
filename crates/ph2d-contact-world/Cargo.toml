[package]
name = "ph2d-contact-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-nodegraph = { path = "../ph2d-nodegraph" }
# As portas do colisor, do material e do obstáculo declarado — a MESMA lei que o `sim.collide` lê.
ph2d-contact = { path = "../ph2d-contact" }
# O seno e o cosseno sem `std` (HR-5): a taça é geometria que alimenta a simulação.
ph2d-motion-kit = { path = "../ph2d-motion-kit" }
# O motor da casa (ADR-0131), com as MESMAS features da `ph2d-physics` — o cargo unifica-as, e o
# `enhanced-determinism` é o que faz duas corridas iguais ao bit (doc 121 §9.20).
rapier2d = { version = "0.35", default-features = false, features = ["dim2", "f32", "std", "enhanced-determinism"] }

[dev-dependencies]
# O alocador que conta — a conta dos bytes do mundo (`tests/it`), como os gates HR-3 da casa.
dhat = "0.3"

[lints]
workspace = true
