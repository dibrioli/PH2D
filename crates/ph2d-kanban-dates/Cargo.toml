# O que «hoje», «atrasado» e «esta semana» significam num fuso (ADR-0195 §8). `jiff` 0.2 é
# `Unlicense OR MIT`; a base IANA vem do sistema (`tzdb-zoneinfo`) e, onde não há, embutida
# (`tzdb-bundle-platform`: Windows/wasm).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }

