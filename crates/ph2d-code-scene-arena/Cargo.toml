[lib]

# A cena 15 do smoke do editor de scripts (muitos problemas, muitos donos; dono 10/11): a montagem e
# o roteiro. Crate própria porque `ph2d-code-scenes` e `ph2d-code-smoke` estão no tecto da catraca
