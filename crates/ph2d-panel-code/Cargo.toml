[package]
name = "ph2d-panel-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-code-buffer = { path = "../ph2d-code-buffer" }
ph2d-code-viewmodel = { path = "../ph2d-code-viewmodel" }
# O modelo do quadro do depurador (plano 14) — pinta-o o `debug_card`.
ph2d-code-debugcard = { path = "../ph2d-code-debugcard" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-tokens      = { path = "../ph2d-tokens" }
ph2d-text        = { path = "../ph2d-text" }
ph2d-vector      = { path = "../ph2d-vector" }
ph2d-i18n        = { path = "../ph2d-i18n" }
ph2d-host        = { path = "../ph2d-host" }
ph2d-a11y        = { path = "../ph2d-a11y" }
ph2d-ui-table    = { path = "../ph2d-ui-table" }
parley = "0.12.0"
accesskit = "0.25.2"
unicode-segmentation = "1.13"

[dev-dependencies]
# O teste `peso_na_placa`: a tinta do texto pintado pela porta com peso, medida no píxel (a placa e o
# rasterizador do app).
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-render = { path = "../ph2d-render" }

[lints]
workspace = true
