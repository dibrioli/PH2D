[package]
name = "ph2d-node-vector-boolean"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-nodegraph = { path = "../ph2d-nodegraph" }
ph2d-node-registry = { path = "../ph2d-node-registry" }
ph2d-vector-doc = { path = "../ph2d-vector-doc" }
ph2d-vector-graph = { path = "../ph2d-vector-graph" }
# Math primitives — glam::Vec2 (the network carries glam vectors).
glam = "0.30"
# kurbo BezPath is the lingua franca the exact boolean engine speaks; we
# build it from the network's cubic segments (same control-point convention
# as the `ph2d-vector` renderer) and read the result back. Pinned to the
# version `linesweeper` resolves (already in-tree via `peniko`).
kurbo = "0.13"
# The canonical exact-topology boolean engine (ADR-0058 §2.2.2 / ADR-0065;
# cited in `docs/Vector Module/16_referencias.md`). Robust sweep-line over
# Bézier paths — handles the coincident-edge / shared-vertex cases T3.5
# lens A targets. MIT/Apache; Linebender-adjacent (kurbo-native).
linesweeper = "0.3"
