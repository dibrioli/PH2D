# Icon BezPath.
ph2d-vector = { path = "../ph2d-vector" }

# VectorSelection + Ph2dVectorAsset + hit-test (bbox / region_contains_point).
ph2d-vector-doc = { path = "../ph2d-vector-doc" }

glam = "0.30"
