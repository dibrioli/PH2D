[package]
name = "ph2d-anim-sheets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐ As animações sobre as FOLHAS do Animated Sprite (plano GEF 26): a ponte do quadro motor ↔ painel, o Split by
# rows e as operações das várias folhas. Folha, como `ph2d-anim-signals`: saiu de `ph2d-app-sprite-anim` pela catraca
# `the_shell_only_shrinks_and_every_app_crate_too`; família não chama família.
[dependencies]
ph2d-asset = { path = "../ph2d-asset" }
bytemuck = "1"
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-i18n = { path = "../ph2d-i18n" }
# O collider automático que segue a Largura/Altura de uma sprite Tiled (`tiled`).
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }
# O `Sprite` da folha 0 e a textura da folha promovida (`SheetTextures`); o corte proposto de uma imagem nova.
ph2d-render = { path = "../ph2d-render" }
ph2d-sprite-edit = { path = "../ph2d-sprite-edit" }
ph2d-sprite-sheet = { path = "../ph2d-sprite-sheet" }
# A moldura do uso em Edit: a grelha da folha desdobrada (`use_frame`).
ph2d-sprite-screen = { path = "../ph2d-sprite-screen" }
# O editor de animações (V4): o dropdown das folhas, a tira com a folha de cada quadro e a limpeza dos vazios.
ph2d-text = { path = "../ph2d-text" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-vector = { path = "../ph2d-vector" }
# A `SheetCache` (`#[derive(Resource)]` expande para caminhos `bevy_ecs::`).
bevy_ecs = "0.20"

[package.metadata.cargo-machete]
ignored = ["bevy_ecs"]

[lints]
workspace = true
