[package]
name = "ph2d-app-constraints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐ A FAMÍLIA das constraints (plano `docs/BlenderConstraints/01_plano.md` §2.1): o quadro, o cartão
# do Inspector (lado app), o pick no palco, os gizmos, o bake e o roteador `PH2D_CONSTRAINT_SMOKE`.
# A lei é da `ph2d-constraints`; a pilha no mundo, da `ph2d-constraints-ecs`.
[dependencies]
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-constraints = { path = "../ph2d-constraints" }
ph2d-constraints-ecs = { path = "../ph2d-constraints-ecs" }
# A cola (W5): o dado e o `local` do pino.
ph2d-constraints-cola = { path = "../ph2d-constraints-cola" }
ph2d-skeleton-live = { path = "../ph2d-skeleton-live" }
ph2d-skeleton-ecs = { path = "../ph2d-skeleton-ecs" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# A cena 11 (o HUD) coze o texto da pontuação sem a shell.
ph2d-vec-text = { path = "../ph2d-vec-text" }
ph2d-system-fonts = { path = "../ph2d-system-fonts" }
ph2d-vector-font = { path = "../ph2d-vector-font" }
ph2d-ecs = { path = "../ph2d-ecs" }
# O vocabulário do cartão (`constraint_edits`).
ph2d-editor-core = { path = "../ph2d-editor-core" }
# O losango do Auto Key: os ids do cartão e o estado do canal na linha do tempo.
ph2d-panel-inspector = { path = "../ph2d-panel-inspector" }
# Os nomes das propriedades do ▾ do Follow Value (os do dope-sheet), já traduzidos.
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-timeline = { path = "../ph2d-timeline" }
# O instante da chave de compensação (`compensa`).
ph2d-anim = { path = "../ph2d-anim" }
# A cena 1 conduzida (`smoke_pega`): o relógio que ela arrasta.
ph2d-core = { path = "../ph2d-core" }
ph2d-preview-drive = { path = "../ph2d-preview-drive" }
# O gizmo do palco: a câmera e a janela da cena, os tokens e a cena vectorial do overlay.
ph2d-host = { path = "../ph2d-host" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-vector = { path = "../ph2d-vector" }
# As cenas de smoke: sprites de quadrado e de disco.
ph2d-render = { path = "../ph2d-render" }
bevy_ecs = "0.19"
# O valor do campo que a curva escreve, pelo ledger `fields` do `PreviewDrive`.
serde_json = "1"

# A cena 7 (W4.6): a chave do ângulo (`medida::chave_da`) e a tool Regras na mão.
ph2d-vec-entities = { path = "../ph2d-vec-entities" }
ph2d-tool-vector = { path = "../ph2d-tool-vector" }

[dev-dependencies]
# O gate da cena 11 corre o solver do arranjo sobre as caixas da cena.
ph2d-hud-layout = { path = "../ph2d-hud-layout" }
# A cola pelo caminho real: o clique no cartão do Inspector.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-label-census = { path = "../ph2d-label-census" }
# A cena 6 (a medida animada): a porta do quadro do vetor e a régua do cumprimento.
ph2d-vec-entities = { path = "../ph2d-vec-entities" }
ph2d-vec-constraints = { path = "../ph2d-vec-constraints" }
ph2d-vec-edit = { path = "../ph2d-vec-edit" }
# W5.4: a paridade de cada behaviour com o `eval` do nó do Motion de igual nome.
ph2d-nodegraph = { path = "../ph2d-nodegraph" }
ph2d-node-registry = { path = "../ph2d-node-registry" }
ph2d-node-force-attractor = { path = "../ph2d-node-force-attractor" }
ph2d-node-motion-falloff = { path = "../ph2d-node-motion-falloff" }
ph2d-node-motion-oscillator = { path = "../ph2d-node-motion-oscillator" }
ph2d-node-motion-orbit = { path = "../ph2d-node-motion-orbit" }
ph2d-node-motion-wiggle = { path = "../ph2d-node-motion-wiggle" }

[lints]
workspace = true
