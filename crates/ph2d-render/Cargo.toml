[package]
name = "ph2d-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-host = { path = "../ph2d-host" }
ph2d-core = { path = "../ph2d-core" }
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-ecs = { path = "../ph2d-ecs" }
bevy_ecs = "0.18"
wgpu = "28"
bytemuck = { version = "1", features = ["derive"] }
# Vello renderer for the M11 widget paint pass. Pinned to 0.8 (which
# tracks wgpu 28 — this is why ph2d-gpu/render/desktop downgraded
# from wgpu 29 in this PR; see ADR follow-up). VelloPass takes
# `&vello::Scene` directly so we don't need ph2d-vector here; the
# editor builds the Scene via ph2d-vector and passes it through.
vello = "0.8"
