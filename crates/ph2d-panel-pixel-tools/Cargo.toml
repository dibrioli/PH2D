[package]
name = "ph2d-panel-pixel-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# O painel PIXEL (ADR-0196): ferramentas, cores e a paleta do sprite em edição. Não vê a família
# (`ph2d-app-pixel`): o instantâneo e os pedidos são o vocabulário `ph2d_editor_core::pixel_panel`.
[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y        = { path = "../ph2d-a11y" }
ph2d-card-stack  = { path = "../ph2d-card-stack" }
ph2d-tokens      = { path = "../ph2d-tokens" }
ph2d-i18n        = { path = "../ph2d-i18n" }
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-text        = { path = "../ph2d-text" }
ph2d-vector      = { path = "../ph2d-vector" }
# As formas do Vector no Pixel (P6b): o catálogo dos campos e a chave da string de cada rótulo
# (`ph2d-tool-vector::shapes`) e o contorno das caras da coluna (`ph2d-vec-scene::cook`) — a MESMA
# tabela que o painel do Vector lê, nunca uma cópia.
ph2d-tool-vector = { path = "../ph2d-tool-vector" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# A lei do arrasto da paleta (`palette::drag_permutation` / `copy_insert`): a grelha pinta a ordem
# prevista com a MESMA conta que a família aplica ao largar.
ph2d-pixel-core = { path = "../ph2d-pixel-core" }

[dev-dependencies]
ph2d-host = { path = "../ph2d-host" }
ph2d-label-census = { path = "../ph2d-label-census" }
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
# O Esc a meio do arrasto da paleta vai pelo `dispatch_key` do produto (a arena dele).
bumpalo = { version = "3", features = ["collections"] }

[lints]
workspace = true
