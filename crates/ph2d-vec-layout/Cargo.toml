[package]
name = "ph2d-vec-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# ⚠️ A ÚNICA porta do `taffy` na árvore. `default-features = false` + `flexbox`:
# medido em 0,20 s cold contra 0,63 s com `grid` — e um `dir = grid` que nada
# honraria seria controlo morto. Sem `content_size`: uma folha entra com o tamanho
# que ela JÁ tem (a bbox da geometria cozida), então não há measure function.
taffy = { version = "0.12", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
