[package]
name = "ph2d-joint-editor-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐ O estado da aba Joint Editor sem pintura: o documento, o retrato do mundo, o desenho do gabarito em
# metros, o rato e o teclado, as juntas do gabarito por fazer. Saiu da `ph2d-app-joint-editor` (tecto de
# linhas por crate, 15/11); a pintura, o quadro e o `apply` ficaram lá.

[dependencies]
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-host = { path = "../ph2d-host" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-joint-assembly = { path = "../ph2d-joint-assembly" }
ph2d-joint-templates = { path = "../ph2d-joint-templates" }
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }
ph2d-tokens = { path = "../ph2d-tokens" }
# `libm`: HR-5, a trigonometria bit-idêntica entre OS (o ângulo da alça).
libm = { version = "=0.2.16", default-features = false }

[lints]
workspace = true
