[package]
name = "ph2d-app-board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# A família do QUADRO (MiroClone): o que a shell chama pelo nome. O documento é `ph2d-board-model`,
# o desenho `ph2d-board-render`, as abas e a vista vivem no `ph2d-editor-core`.
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-board-model = { path = "../ph2d-board-model" }
ph2d-board-edit = { path = "../ph2d-board-edit" }
# W17 — o tipo de um objecto da cena dá o nome dele nos avisos do «Send to board…» quando não tem nome.
ph2d-component-desc = { path = "../ph2d-component-desc" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-tokens = { path = "../ph2d-tokens" }
# A cena 8 (W6) faz o mapa mental com o editor do quadro, que mede o texto dos nós; o gate da cena 7
# também conduz o editor.
ph2d-text = { path = "../ph2d-text" }
# W8 — os ficheiros do quadro (`io.rs`): o exportar (o PNG pela placa: a feature `gpu`), o `.excalidraw`,
# o diálogo da casa (`ph2d_app_host::modal`, que embrulha o `rfd`).
ph2d-board-export = { path = "../ph2d-board-export", features = ["gpu"] }
ph2d-board-excalidraw = { path = "../ph2d-board-excalidraw" }
ph2d-board-render = { path = "../ph2d-board-render" }
# W18 (ADR-0185) — o vídeo: a lei (o link canónico) e o lado do mundo (a miniatura, o tocador no navegador
# da pessoa); `ph2d-vector` para pôr os quadros dele no desenho.
ph2d-board-embed = { path = "../ph2d-board-embed" }
ph2d-board-video = { path = "../ph2d-board-video" }
ph2d-board-route = { path = "../ph2d-board-route" }
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-render = { path = "../ph2d-render" }
rfd = "0.17"
# W11 — o quadro ao vivo (`live.rs`, ADR-0181): a sessão PURA e o transporte da rede local.
ph2d-board-sync = { path = "../ph2d-board-sync" }
ph2d-board-net = { path = "../ph2d-board-net" }
# W14 — as imagens entram pela descodificação da cena (`decode_image`); o que o navegador não mostra
# vira PNG (a mesma versão do `png` que o `image` já traz no lock).
ph2d-asset = { path = "../ph2d-asset" }
# W15 — um SVG como imagem do quadro: a árvore pelas defesas da importação e os píxeis a cada nível.
ph2d-imageio-svg = { path = "../ph2d-imageio-svg" }
# O TAMANHO de uma imagem que entra lê-se do cabeçalho (`into_dimensions`), sem descodificar os píxeis
# no fio da janela — a mesma versão e os mesmos formatos que a `ph2d-asset` já liga.
# W16 — e os quadros de um GIF em sequência (o animador do quadro).
image = { version = "0.25", default-features = false, features = ["gif"] }
png = "0.18"
# W18 — o JPEG CORTADO mostra as linhas de cima (o tolerante pára no erro, como os navegadores); as
# mesmas versões que o `image` já puxa.
zune-jpeg = "0.5"
zune-core = "0.5"
# W18 — os quadros de um GIF num iterador `Send` (um passo no grupo de fios do desenho); a versão que o
# `image` já puxa.
gif = "0.14"

ph2d-vector = { path = "../ph2d-vector" }

[dev-dependencies]
# W15 — o `.svgz` de teste (gzip).
flate2 = "1"
# O gate da cena 10 conduz o ecrã real (os eventos do ponteiro e do teclado do hero).
bumpalo = "3"
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-host = { path = "../ph2d-host" }
# O gate da cena 11 lê o ficheiro do dono e mede a ponta contra o contorno.
ph2d-board-geom = { path = "../ph2d-board-geom" }
serde_json = "1"

[lints]
workspace = true
