name: spike

# Wave 10 / Etapa 0.4 — parallel feature-branch CI.
# Triggers:
#   push main/spike/**   → FULL run (lint + msrv + test matrix 3 OS, ~30-45min)
#   push feat/**         → FAST subset (lint + msrv only, ~8-12min)
#                           Matrix test job is gated to NOT run on feat/*.
#                           Use a PR to main to get full matrix before merge.
#   PR to main           → FULL run (matrix test before merging)
#
# Rationale: with the 2-Coords + 4-Implementors parallel model (DIRETRIZ §1.1
# post Wave 10), every Implementor pushes their own feat/* branch. Running
# the full 30-45min matrix on every push would queue runs and serialize
# work. Lint+MSRV (~8-12min on cold cache, ~3-5min warm) gives 90% of the
# value for 20% of the time — and PR-to-main still gates the full matrix.
on:
  push:
    branches: [main, "spike/**", "feat/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Reproducibility: fixed timestamp baked into builds (per SKILL §12.7).
  # Updated only on intentional release tag.
  SOURCE_DATE_EPOCH: "1746662400"

jobs:
  # --------------------------------------------------------------------------
  # Static analysis: format, lint, license/CVE/dependency audit.
  # Runs on Linux only — same answer on every OS, no benefit from matrix.
  # --------------------------------------------------------------------------
  lint:
    name: lint (fmt + clippy + deny + audit)
    runs-on: ubuntu-latest
    # Fmt+clippy+deny+audit+machete+typos run sequentially; observed ~3-5 min
    # historically. 15 min cap = 3× headroom for cold cache + tool installs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Toolchain channel is PINNED to 1.95 (matches rust-toolchain.toml), not
      # @stable. @stable rotates Swatinem/rust-cache's rustc-hash on every Rust
      # release, busting every per-OS cache at once and forcing cold rebuilds —
      # the 2026-06-30 stuck-cold Windows loop (run 28473978977). A fixed channel
      # keeps the cache key stable across releases. Bump these `@1.95` refs in
      # lockstep with rust-toolchain.toml when the pin moves. (MSRV job keeps its
      # own @1.92.)
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Install libudev-dev + libasound2-dev (gilrs → libudev-sys, cpal → alsa-sys; Linux only)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev

      # ph2d-imageio-avif (W3.T4) builds dav1d + rav1e from vendored
      # source: meson+ninja build dav1d, nasm assembles the x86 SIMD.
      # ADR-0054 §5.18 (Path C). Lint compiles --all-targets so it hits
      # the avif crate too.
      - name: Install AVIF build tools (meson + ninja + nasm)
        run: sudo apt-get install -y meson ninja-build nasm

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, all features)
        run: cargo clippy --workspace --all-targets --features ph2d-spike/bevy_ecs -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check (licenses, advisories, bans, sources)
        run: cargo deny --all-features check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (CVE scan)
        # Fails on vulnerabilities; logs unmaintained/yanked as warnings without
        # failing CI (those are usually transitive and out of our control).
        # If a real CVE lands, the default behavior is non-zero exit.
        # Wipe the advisory-db dir first — Swatinem/rust-cache restores a
        # partial copy that cargo-audit refuses to reuse ("Refusing to
        # initialize the non-empty directory").
        run: |
          rm -rf ~/.cargo/advisory-db
          cargo audit

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: cargo machete (unused dependency check)
        # Detects deps in Cargo.toml that no longer have any `use` in code.
        # Reduces supply-chain surface + build time + binary size.
        run: cargo machete

      - name: Install typos-cli
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli

      - name: typos (project-wide typo scan)
        # Config in .typos.toml whitelists project terms.
        # Pre-commit hook catches them locally; CI is the safety net.
        run: typos

      - name: ph2d-bindgen --check (HR-10 parity)
        # The MCP catalog (crates/ph2d-mcp/src/catalog.rs) is the
        # source of truth for both runtime/luau/ph2d.d.luau and
        # runtime/mcp/schema.json. After editing the catalog, the
        # developer must run `cargo run -p ph2d-bindgen -- --write`
        # and commit. This step regenerates in memory and diffs
        # against the committed files; drift fails the build.
        run: cargo run -p ph2d-bindgen --locked -- --check

  # --------------------------------------------------------------------------
  # MSRV check — verifies declared MSRV (rust-version = "1.92") still builds.
  # Bumped from 1.85 to 1.92 in the M11 widget-paint PR (vello 0.8 +
  # wgpu 28 chain require 1.92). Catches drift where toolchain pin
  # (1.95) hides accidental MSRV bumps.
  # --------------------------------------------------------------------------
  msrv:
    name: MSRV (rust 1.92) check
    runs-on: ubuntu-latest
    # Pure `cargo check`, no test execution; observed ~2 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - name: Install libudev-dev + libasound2-dev (gilrs → libudev-sys, cpal → alsa-sys; Linux only)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      # ph2d-imageio-avif vendored dav1d+rav1e build deps (ADR-0054 §5.18).
      - name: Install AVIF build tools (meson + ninja + nasm)
        run: sudo apt-get install -y meson ninja-build nasm
      - name: cargo check --workspace --locked (MSRV)
        run: cargo check --workspace --locked

  # --------------------------------------------------------------------------
  # Cross-OS build + tests + spike fixtures.
  # --locked enforces Cargo.lock is the source of truth (no transient drift).
  # Tests via cargo-nextest: process isolation (panic in one test ≠ takedown
  # of the whole binary), 3× faster, JUnit XML output for future dashboards.
  # --------------------------------------------------------------------------
  test:
    name: ${{ matrix.os }} — workspace check + tests
    runs-on: ${{ matrix.os }}
    needs: [lint, msrv]
    # Wave 10 / Etapa 0.4 — skip on feat/** branches.
    # Feat branches get lint+msrv only (fast feedback ~8-12min).
    # Full matrix runs on PR-to-main and on push to main/spike.
    # If a feat/* push REALLY needs the full matrix (rare), open the PR.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/spike/')
    # sccache was added in Phase 2 but caused all 3 OSes to fail
    # (run 25840452466): GitHub Actions artifact-cache service
    # returned HTTP 400 ("Our services aren't available right now"),
    # sccache crashed instead of falling back, RUSTC_WRAPPER then
    # broke every cargo invocation. Disabled until GHA artifact-cache
    # is reliably available — Phase 2's other improvements (multi-
    # package nextest, dropped cargo check, dropped --release on
    # desktop build) deliver speed-up independently.
    # Workspace check + multi-package nextest + spike fixtures.
    # Phase 2 (this commit), tackles Windows bottlenecks from run
    # 25839341394 logs:
    #   - ph2d-ecs (bevy_ecs dep): 6m 43s
    #   - desktop --release build: 4m 59s
    #   - ph2d-gpu (wgpu dep): 2m 26s
    #   - ph2d-editor: 2m 47s
    #   - cargo check workspace: 3m 16s (redundant — nextest checks)
    # = ~20 min of compile time on Windows alone, before spike fixtures.
    #
    # Changes:
    #   - Collapse 10 per-crate `cargo nextest run -p X` into ONE
    #     multi-package call. Single cargo invocation = single graph
    #     resolution + shared compile setup. Critical on Windows
    #     where each cold-start costs ~10-15s.
    #   - Drop redundant `cargo check --workspace` (nextest does its
    #     own check on the test target during build).
    #   - Move desktop build from `--release` to default profile.
    #     Step exists to verify winit/wgpu link cross-OS, not to
    #     produce a distribution binary. Saves ~3-4 min on Windows.
    #
    # Note: an earlier attempt also added sccache (RUSTC_WRAPPER) but
    # GitHub Actions artifact-cache service returned HTTP 400 in run
    # 25840452466 ("Our services aren't available right now") and
    # sccache crashed all rustc invocations. Reverted; deferred until
    # GHA cache is reliable.
    #
    # Cap history: 30 → 45 (Phase 2; warm Windows ~12-29 min) → 90
    # (2026-06-30). The 45-min cap only ever fit a WARM build. When the
    # Swatinem/rust-cache key misses, Windows does a COLD rebuild of the
    # whole graph incl. the vendored native deps (dav1d/rav1e via
    # meson+nasm+MSBuild) and blows well past 45 min — the nextest build
    # alone took ~40 min in run 28473978977. A cancelled job NEVER runs
    # rust-cache's save step, so a cold run that times out leaves the
    # cache cold → the next run is cold again → permanent stuck-cold loop.
    #
    # The key misses on toolchain drift, not on our commits: CI installs
    # `dtolnay/rust-toolchain@stable`, so a new stable release rotates the
    # rust-cache rustc-hash and invalidates every OS's cache at once
    # (observed 2026-06-30: lockfiles-hash identical, rustc-hash changed).
    # Linux/macOS absorb a cold rebuild under the cap and re-warm; only
    # Windows couldn't. 90 min lets a cold Windows build COMPLETE and save
    # a warm cache, so the pipeline self-heals on every drift/eviction
    # instead of wedging. Warm Windows stays ~12 min, far under the cap.
    # Follow-up to avoid the slow re-warm entirely: pin the toolchain
    # action to 1.95 (matches rust-toolchain.toml) so stable releases stop
    # rotating the cache key.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95

      # Force-install the toolchain pinned in `rust-toolchain.toml`
      # (channel 1.95). Without this, `cargo nextest …` on macos-latest
      # has been hitting `rustup-init`'s "unexpected argument 'nextest'"
      # failure path — the rustup proxy can't auto-install the pinned
      # toolchain on first invocation, so the binary falls back to its
      # bare-init CLI. Linux + Windows runners auto-install transparently;
      # macos-latest (Apple Silicon) needs the explicit pre-step.
      - name: Ensure rust-toolchain.toml channel is installed
        run: rustup show active-toolchain || rustup show

      # Windows-only: load the MSVC dev environment (cl.exe + INCLUDE/LIB)
      # so meson/dav1d-sys (ph2d-imageio-avif Path C) compile dav1d's C
      # with MSVC instead of git-bash's MinGW gcc. Without it, dav1d
      # objects reference MinGW runtime symbols (__mingw_fprintf /
      # ___chkstk_ms / __mingw_v?printf) that rust-lld (MSVC-flavor link)
      # cannot resolve when linking the windows-msvc target — the W3.T4
      # AVIF re-ship broke the windows matrix this way. The env set here
      # persists to the later `cargo nextest` step (where dav1d builds).
      - name: Set up MSVC dev environment (Windows native C builds)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows-only: git-bash ships a coreutils `link.exe` (makes
      # hardlinks) in /usr/bin that SHADOWS MSVC's `link.exe` (the
      # linker) on the bash PATH. meson's dav1d build then finds the
      # coreutils one and dies "Found GNU link.exe instead of MSVC … not
      # a linker". Remove it so meson resolves MSVC's link.exe (now on
      # PATH from msvc-dev-cmd above).
      - name: Unshadow MSVC link.exe (remove git coreutils link)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f "/usr/bin/link.exe" "/usr/bin/link" 2>/dev/null || true

      # Windows-only: exclude `target/` and Cargo home from Defender
      # real-time scan. Defender scanning every .o / .rlib / linker
      # intermediate adds ~15-25 % to the Windows wall clock. This
      # shrinks the matrix gap from ~5× to ~2-3× vs Linux/Mac.
      - name: Disable Windows Defender on target/ + cargo home
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Install libudev-dev + libasound2-dev (gilrs → libudev-sys, cpal → alsa-sys; Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev

      # ph2d-imageio-avif (W3.T4, ADR-0054 §5.18) builds dav1d + rav1e
      # from vendored source: meson+ninja compile dav1d, nasm assembles
      # the x86 SIMD. The matrix job does `cargo check --workspace` +
      # nextest, both of which compile the avif crate on all 3 OSes.
      - name: Install AVIF build tools (meson + ninja + nasm)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get install -y meson ninja-build nasm
              ;;
            macOS)
              brew install meson ninja nasm
              ;;
            Windows)
              choco install -y nasm ninja
              python -m pip install --upgrade meson
              # choco installs nasm to "C:\Program Files\NASM"; put it
              # on PATH for the dav1d meson build.
              echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
              ;;
          esac

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Workspace unit tests in a single multi-package nextest call.
      # One cargo invocation = one graph resolution + one build setup
      # shared across all listed packages. Previously 10 separate
      # `cargo nextest run -p X --cargo-profile ci-test` calls paid
      # ~10-15s cold-start overhead each on Windows (~2-3 min total
      # waste).
      #
      # `--cargo-profile ci-test`: deps at opt-level=3 (test runtime
      # stays fast), workspace-local code at opt-level=1, NO LTO,
      # codegen-units=16. Distribution-grade link cost (thin-LTO +
      # codegen-units=1 in profile.release) was the dominant Windows
      # bottleneck before; ci-test cuts that out.
      #
      # Note: nextest uses `--cargo-profile` for the build profile.
      # `--profile` in nextest is a SEPARATE flag for test settings
      # (retries, parallelism). They're not interchangeable.
      #
      # `--workspace` was tried earlier and forced compilation of
      # test binaries for every workspace member, including ~14
      # stubs with zero tests — Linux/Mac doubled. The explicit
      # `-p` list keeps scope to crates that actually have tests.
      - name: workspace unit tests (multi-package nextest)
        # `shell: bash` explicit — default on Windows runners is
        # pwsh, which treats `\` line continuations as the unary
        # operator `--` followed by garbage. bash is available on
        # all 3 OSes (git bash on Windows).
        shell: bash
        run: |
          cargo nextest run \
            -p ph2d-core \
            -p ph2d-host \
            -p ph2d-gpu \
            -p ph2d-ecs \
            -p ph2d-asset \
            -p ph2d-render \
            -p ph2d-script \
            -p ph2d-mcp \
            -p ph2d-editor \
            -p ph2d-asset-cooker \
            -p ph2d-imageio \
            -p ph2d-imageio-png \
            -p ph2d-imageio-jpeg \
            -p ph2d-imageio-webp \
            -p ph2d-imageio-gif \
            -p ph2d-imageio-ph2d-native \
            -p ph2d-imageio-tiff \
            -p ph2d-imageio-ora \
            -p ph2d-imageio-apng \
            -p ph2d-imageio-psd \
            -p ph2d-imageio-avif \
            -p ph2d-imageio-exr \
            -p ph2d-imageio-hdr-radiance \
            -p ph2d-imageio-jxl \
            -p ph2d-imageio-svg \
            -p ph2d-imageio-registry-init \
            --cargo-profile ci-test --locked

      # Doctests aren't covered by nextest. ph2d-ecs has the
      # `extract!` compile_fail proof that catches mutable-sim
      # regressions; that's the only doctest worth gating on for now.
      - name: ph2d-ecs doc tests (extract! compile_fail proof)
        run: cargo test --doc -p ph2d-ecs --profile ci-test --locked

      # Smoke compile check with bevy_ecs feature flag — verifies
      # the conditional code paths still type-check.
      - name: cargo check (workspace, --features bevy_ecs) --locked
        run: cargo check --workspace --locked --features ph2d-spike/bevy_ecs

      - name: ph2d-bindgen drift check (HR-10 parity)
        run: cargo run --release --locked -p ph2d-bindgen

      # Build (not run) the desktop shell — verifies winit + wgpu
      # link cross-OS. Was `--release` before; switched to default
      # because the step's purpose is link verification, not
      # producing a distribution binary. Saved ~3-4 min on Windows.
      - name: build ph2d-host-desktop (M1 — verifies winit links cross-OS)
        run: cargo build --locked -p ph2d-host-desktop

      # Correctness fixtures only — no perf-gated benches in CI.
      # Bench fixtures (c2_1_messaging, c3_coro_timing, c10_gc_stress,
      # c12_wasm_marshall, c7_bytecode) measure p99 latency vs thresholds
      # calibrated on hardware alvo (Mac M-series local). GitHub-hosted
      # runners are slower and trigger false fails. Real perf gating
      # requires a self-hosted Mac mini M2 (HR-4 enforcer; tracked in
      # plan as M14+ infra work).
      - name: spike correctness fixtures (no ECS)
        run: |
          cargo run --release --locked --bin hello_runner -p ph2d-spike
          cargo run --release --locked --bin c13_migration -p ph2d-spike

      - name: spike correctness fixtures (with bevy_ecs)
        run: |
          cargo run --release --locked --bin c11_bevy --features bevy_ecs -p ph2d-spike
          cargo run --release --locked --bin c4_hot_reload --features bevy_ecs -p ph2d-spike
          cargo run --release --locked --bin c14_memory --features bevy_ecs -p ph2d-spike

  # --------------------------------------------------------------------------
  # Cross-platform replay determinism (HR-5). The whole point: hash equal on
  # Linux, macOS, Windows.
  # --------------------------------------------------------------------------
  determinism:
    name: ${{ matrix.os }} — C9 cross-platform replay hash
    runs-on: ${{ matrix.os }}
    needs: test
    # Single binary run + hash capture; observed ~3-5 min.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Run C9 replay (ECS) and capture baseline hash
        id: replay
        shell: bash
        run: |
          OUT=$(cargo run --release --locked --quiet --bin c9_replay --features bevy_ecs -p ph2d-spike)
          echo "$OUT"
          HASH=$(echo "$OUT" | grep -E '^baseline hash: ' | awk '{print $3}')
          echo "Captured hash: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          # RUNNER_TEMP works on Linux/macOS/Windows; /tmp does not exist on Windows.
          echo "$HASH" > "${RUNNER_TEMP}/c9-hash.txt"

      - name: Upload ECS hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: c9-hash-${{ matrix.os }}
          path: ${{ runner.temp }}/c9-hash.txt
          if-no-files-found: error

      # M10 extends C9 to physics: same protocol (one binary per OS,
      # collect hashes, diff). Different fixture (50-body Rapier sim
      # with `enhanced-determinism` ON), separate artifact namespace
      # so failures point at the right subsystem.
      - name: Run physics C9 (Rapier 50-body) and capture hash
        id: physics_replay
        shell: bash
        run: |
          OUT=$(cargo run --release --locked --quiet --bin ph2d_physics_c9 -p ph2d-physics)
          echo "$OUT"
          HASH=$(echo "$OUT" | grep -E '^physics-c9 hash: ' | awk '{print $3}')
          echo "Captured physics hash: $HASH"
          echo "$HASH" > "${RUNNER_TEMP}/physics-c9-hash.txt"

      - name: Upload physics hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-c9-hash-${{ matrix.os }}
          path: ${{ runner.temp }}/physics-c9-hash.txt
          if-no-files-found: error

  determinism-compare:
    name: C9 cross-platform comparison (ECS + physics)
    needs: determinism
    runs-on: ubuntu-latest
    # Pure artifact diff, no compile; observed <1 min.
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes
      - name: Compare ECS hashes across all OSes
        shell: bash
        run: |
          set -euo pipefail
          echo "Per-OS ECS hashes:"
          for f in hashes/c9-hash-*/c9-hash.txt; do
            os=$(basename "$(dirname "$f")" | sed 's/c9-hash-//')
            hash=$(cat "$f")
            echo "  $os: $hash"
          done
          uniq=$(for f in hashes/c9-hash-*/c9-hash.txt; do cat "$f"; done | sort -u | wc -l)
          if [ "$uniq" -ne 1 ]; then
            echo "FAIL: ECS hashes differ across OSes — HR-5 violated."
            exit 1
          fi
          echo "PASS: ECS hash identical across all OSes."
      - name: Compare physics hashes across all OSes
        shell: bash
        run: |
          set -euo pipefail
          echo "Per-OS physics hashes:"
          for f in hashes/physics-c9-hash-*/physics-c9-hash.txt; do
            os=$(basename "$(dirname "$f")" | sed 's/physics-c9-hash-//')
            hash=$(cat "$f")
            echo "  $os: $hash"
          done
          uniq=$(for f in hashes/physics-c9-hash-*/physics-c9-hash.txt; do cat "$f"; done | sort -u | wc -l)
          if [ "$uniq" -ne 1 ]; then
            echo "FAIL: physics hashes differ across OSes — Rapier enhanced-determinism violated."
            exit 1
          fi
          echo "PASS: physics hash identical across all OSes (M10 gate)."

  # --------------------------------------------------------------------------
  # Bench baseline — runs criterion against `main` to surface regressions in PRs.
  # On main pushes, only stores the new baseline (no comparison).
  # --------------------------------------------------------------------------
  bench:
    name: criterion bench (regression check)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    # Single criterion bench compile+run; observed ~3-5 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench

      - name: Run criterion benches (current PR)
        # Criterion stores baseline in target/criterion/. Without a baseline
        # comparison action set up, we just ensure the bench compiles and runs
        # without panic; full regression detection is a follow-up (track in
        # ADR if it becomes load-bearing).
        # M8 added the input_throughput bench — first frame-budget bench
        # rooted in production code (not just spike fixture).
        run: |
          cargo bench --bench c2_query -p ph2d-spike --locked -- --output-format bencher
          cargo bench --bench input_throughput -p ph2d-input --locked -- --output-format bencher

# =============================================================================
# DEFENSES PARKED (active when prerequisites land — keep these comments as
# the on-ramp checklist; do NOT enable without the noted preconditions).
#
# 1. cargo-fuzz (libFuzzer + LLVM coverage)
#    Activate WHEN: ph2d-script has a real Luau→Rust bridge AND/OR ph2d-net
#    parses untrusted packets. Today the only parse boundary is `postcard`
#    deserialize used in C4/C13 — that lib is already heavily fuzzed upstream.
#    Setup sketch: `cargo install cargo-fuzz`; `cargo fuzz init -p ph2d-script`;
#    add a job `fuzz-quick: cargo fuzz run lua_eval_input -- -max_total_time=120`.
#
# 2. ASan / TSan (address + thread sanitizer)
#    Activate WHEN: ph2d-gpu::interop populated (wgpu-hal needs unsafe per
#    HR-2 + ADR-0008). Until then, every other crate is `#![forbid(unsafe_code)]`
#    so sanitizers have nothing to sanitize.
#    Setup sketch: matrix job with nightly toolchain,
#    `RUSTFLAGS=-Zsanitizer=address cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu`.
#    Same for `thread`. Run weekly (workflow_dispatch).
