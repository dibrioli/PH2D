[package]
name = "servo_spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
servo = { version = "=0.7.0", default-features = false, features = ["bundled", "js_jit", "media-gstreamer"] }
euclid = "0.22"
url = "2"
dpi = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# O `image` não se nomeia no código: liga a função `png` do MESMO `image` que o Servo devolve no `read_to_image`
# (o `img.save(… .png)` da sonda). O `cargo machete` só vê nomes, não a unificação de funções.
[package.metadata.cargo-machete]
ignored = ["image"]

[workspace]
