[package]
name = "ph2d-panel-vector-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Geometry-Graph panel — typed `Panel<State>` (ADR-0029) for the Vector
# module (W3.T3.1). Docked panel hosting 8 horizontal sliders, one per
# `vector.source` node param (kind / width / height / sides / inner_ratio /
# turns / samples_per_turn / rotation). Each slider is the canonical
# normalized `0..1` `SliderState`; on `ValueChanged` the 0..1 track maps to
# the param's real range and the real value lands in a thread-local
# `VectorGraphParams` "param bus" that the shell render bridge reads each
# frame to drive the cook. Sliders only — no node-placement / edge-drag UI.

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-tokens = { path = "../ph2d-tokens" }

[dev-dependencies]
ph2d-host = { path = "../ph2d-host" }
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
