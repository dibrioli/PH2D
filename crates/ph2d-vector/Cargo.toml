[package]
name = "ph2d-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Vello — Linebender's GPU vector renderer (currently 0.x; alpha-
# quality per the M11 plan note "Vello em alpha — risco aceito,
# ADR-0004 a escrever quando aparecer regressão").
# Pinned to 0.10 (which tracks wgpu 29). ⚠️ Este bloco dizia o CONTRARIO ate'
# 2026-08-29, e a historia importa: a M11 baixou o wgpu de 29 para 28 para
# alinhar com o vello 0.8. Isso INVERTEU-SE — o vello 0.10 pede `wgpu ^29.0.3`,
# e hoje o que existe e' um TETO: o `wgpu 30.0.1` esta' publicado e e'
# inalcancavel enquanto o vello nao subir. Decisao e mecanismo: ADR-0168.
# kurbo + peniko reach our public API via `vello::kurbo` /
# `vello::peniko` re-exports — declaring them as direct deps would
# risk version skew (o vello 0.10 traz peniko 0.6.1 e kurbo 0.13 — conte-os no
# `Cargo.lock`, nao aqui: esta linha ja' esteve errada sobre o kurbo).
# `default-features = false` drops vello's CPU-pipeline-cache code
# we don't use; the `wgpu` feature keeps GPU integration on.
vello = { version = "0.10.0", default-features = false, features = ["wgpu"] }

# Vector Module document data model — `VectorNetwork` /
# `Vertex` / `Segment` / `Region` round-trip through the new
# `vector_network.rs` Vello rendering bridge (W1.T1.3 per ADR-0059).
# ph2d-vector remains the SOLE crate authorized to import `vello::*` /
# `kurbo::*` direct (arch-gate `vello_kurbo_only_in_ph2d_vector` —
# long-tail maintenance L6F1).
ph2d-vector-doc = { path = "../ph2d-vector-doc" }

# OklchColor → sRGB conversion for region fill rendering. ph2d-vector
# is positioned downstream of ph2d-color (foundational); no cycle risk.
ph2d-color = { path = "../ph2d-color" }

# glam — `Vec2` is the centerline/vertex vector type for the variable-width
# stroke geometry (`variable_width_band` / `draw_variable_width_stroke`, W5
# T5.1, both `pub`/module-scope) and the ph2d-vector-doc data model. A RUNTIME
# dep since W5 (was dev-only before the stroke geometry landed).
glam = "0.30"
