[package]
name = "ph2d-asset-cooker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "cooker"
path = "src/main.rs"

[dependencies]
# Crates that own the cookable Components — the cooker dispatches by
# canonical name to each type's serde Deserializer.
ph2d-asset = { path = "../../crates/ph2d-asset" }
ph2d-ecs = { path = "../../crates/ph2d-ecs" }
ph2d-render = { path = "../../crates/ph2d-render" }
ph2d-script = { path = "../../crates/ph2d-script" }
ph2d-core = { path = "../../crates/ph2d-core" }
# Cooker wire format: JSON5 source → postcard cooked. serde_json5 has
# JSON-compatible parsing plus comments + trailing commas (ergonomic
# for hand-authored prefab files). serde_json is needed because
# serde_json5's `Value` type uses serde_json::Value underneath.
serde_json5 = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
# Texture compression cooker — ADR-0055-v4 (Accepted 2026-05-27).
# Connor Fitzgerald (wgpu core contributor). Lib API offline-only sob critério
# HR-1 §2.7.1 (nunca embarcado em release-game bundle).
#
# W1.T2.1 (D1) features pinadas — default-features = false + explicit allowlist.
# Razões:
#   - encoder-bc7enc      → BC7 desktop (bc7enc-rdo, Brian Walls reference impl)
#   - encoder-astcenc     → ASTC LDR mobile + critical UI (ARM reference impl)
#   - encoder-etcpak      → ETC2 Android fallback
#   - encoder-intel       → BC1/BC3/BC4/BC5 single-channel atlases (Intel ISPC)
#   - ispc-prebuilt       → evitar build C++ na CI per-commit
#   - encoder-amd OMITIDO → W1.T2 audit Lente A HIGH#2 = Compressonator
#     BC7+UltraFast retorna R=0 silent em Linux/macOS (upstream bug
#     acknowledged em compressonator.rs:296-300). BC7 já coberto por
#     bc7enc-rdo; demais formatos pelo Intel ISPC. Omitir feature elimina
#     ~1944 LOC sub-crate ctt-compressonator + zero exposure ao bug.
# Audit deliverable: docs/audits/ctt-source-audit-2026-05-27-CONSOLIDATED.md
ctt = { version = "0.4.0", default-features = false, features = [
    "encoder-bc7enc",
    "encoder-astcenc",
    "encoder-etcpak",
    "encoder-intel",
    "ispc-prebuilt",
] }
# Image decoder for source files (PNG mainly; jpeg/webp puxados se necessário em W4+).
# Versão alinhada workspace standard (ph2d-asset / ph2d-imageio-*).
image = { version = "0.25", default-features = false, features = ["png"] }
# Audit W1.T11+T14 ι-CRITICAL-1 fix (2026-05-28): Rust std `f32::sin/cos` documenta
# precisão non-deterministic cross-platform. Fixtures que usam transcendentals
# (brush_atlas_256_r8 + normal_map_512) precisam de libm para HR-6 cross-machine
# determinism.
#
# T1.3.5 R2 (2026-05-28): exact-pin `=0.2.16` + `default-features = false`
# alinhado com ph2d-ecs / ph2d-editor-core / ph2d-tool-rasterize / shells/desktop.
# Workspace mantém UMA versão de libm; arch-gate
# `libm_exact_version_pin_enforced_in_workspace` em ph2d-ecs gates esse invariant.
libm = { version = "=0.2.16", default-features = false }

[dev-dependencies]
# Parser TOML para arch-gate `architecture_ctt_features_pinned` — substitui
# parser manual `str::find` que falhava em formatos válidos (campos em ordem
# diferente, arrays multi-linha). Versão alinhada com workspace usage.
toml = "0.9"

# Audit T1.6 CI: machete pega `ctt` como unused porque W1.T0 ainda
# não wired (lib API consumida só em W1.T1+). Dep deliberada per
# ADR-0055-v4; mantém no machete-ignored até T1.1.
[package.metadata.cargo-machete]
ignored = ["ctt"]
