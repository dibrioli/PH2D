[package]
name = "ph2d-panel-bgremoval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Background-Removal panel — typed `Panel<State>` (ADR-0029). Right-docked
# (Inspector geometry slot); visible only while the `bgremoval` tool is
# active. Controls only (Mode / Tolerance / Feather / Refine / Apply) —
# the live preview renders on the canvas itself, not in this panel.

[dependencies]
ph2d-editor-core    = { path = "../ph2d-editor-core" }
# ADR-0040 TG-B: the bgremoval UI vocabulary (`BgRemovalUiSnapshot` /
# `BrushFalloff` + scale consts) moved into the tool crate when the
# generic `ToolPanelEvent` channel landed. Panel reads the snapshot it
# paints from there directly — `editor-core` no longer carries the
# vocab, and the new direction (panel → tool) does not cycle (tool
# depends on editor-core, panel depends on both).
ph2d-tool-bgremoval = { path = "../ph2d-tool-bgremoval" }
ph2d-a11y           = { path = "../ph2d-a11y" }
ph2d-tokens         = { path = "../ph2d-tokens" }
# Wave 11 §2.2: paint_sections.rs takes &mut VectorScene / &mut TextSystem
# directly (instead of the &mut PaintCtx the orchestrator owns) so each
# section helper is a pure y-cursor function with no host coupling.
ph2d-vector         = { path = "../ph2d-vector" }
ph2d-text           = { path = "../ph2d-text" }

[dev-dependencies]
ph2d-host = { path = "../ph2d-host" }
bumpalo   = "3"
# Blindagem Fase 0.1 — headless panel↔tool SEAM harness (MockPanelHost).
# Dev-dep only: the `architecture_cycle_prevention` gate reads
# `[dependencies]`, so this edge builds no runtime cycle. ph2d-tool-bgremoval
# is already a regular dep above (the seam test asserts against it directly).
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
