# cargo-nextest config — https://nexte.st/book/configuration.html
#
# Surgical handling of the vendored ISPC encoders in ph2d-asset-cooker, which:
#   (a) are globally thread-UNSAFE → must run serially (the old
#       `RUST_TEST_THREADS=1` rule; nextest expresses it as a max-threads=1 group);
#   (b) SIGBUS ~50% NON-deterministically even single-threaded + isolated
#       (characterized W1.T15: same binary, run 1 crash / run 2 ok — infra flake,
#       not a code bug) → bounded retries.
#
# Scoped to ph2d-asset-cooker ONLY. We do NOT retry globally — that would mask
# real flaky tests elsewhere. ship.sh and CI both read this file, so the cook
# job stops flaking in both.

[test-groups.asset-cooker-ispc]
# Serialize all ph2d-asset-cooker tests (ISPC global state is not thread-safe).
max-threads = 1

[[profile.default.overrides]]
filter = 'package(ph2d-asset-cooker)'
test-group = 'asset-cooker-ispc'
# Bumped 3 → 6 (2026-05-29) → 10 (2026-06-02): the W1.T15-characterized ~50%
# per-run vendored-ISPC SIGABRT. 6 retries (7 tries) → ~0.5^7 ≈ 0.8% PER TEST,
# but across the ~10 cook tests the aggregate residual is ~1-(0.992)^10 ≈ 8% of
# CI runs — and `seam_cook_decode_ktx2::cook_tagged_desktop_sprite_color_reports_
# straight_intent` hit it on macOS (aborted 7/7) 2026-06-02. 10 retries (11 tries)
# → ~0.5^11 ≈ 0.05% per test, aggregate ~0.5%. This is the ONLY effective lever:
# the crash is in vendored ctt (no code root-cause our side — see the test-group
# note). Retries are nearly free — each aborts in ~0.06s.
retries = 10

# ph2d-painter-brush `painter_no_alloc_hot_path` measures the brush scheduler
# hot path with dhat (heap-block delta). It is alloc-free in isolation (5/5) and
# in a clean full-workspace run, but under HEAVY concurrent nextest load it
# intermittently counts ~3 stray blocks — dhat's own bookkeeping / a background-
# thread lazy alloc landing in the measurement window, NOT the scheduler (the
# test already warms BOTH brushes + `HeapStats::get` before the window). Same
# environmental class as the asset-cooker entry above. A NARROW bounded retry
# (not global) keeps CI green without masking a real regression: a genuine
# hot-path alloc would fail all 3 tries consistently, not 1-in-N under load.
[[profile.default.overrides]]
filter = 'package(ph2d-painter-brush) and test(painter_no_alloc_hot_path)'
retries = 2
