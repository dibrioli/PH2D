[lib]

# A CASA ÚNICA de uma LISTA DE NÚMEROS autorada como texto — a gramática, o ciclo por
# índice e o layout com que ela chega ao device. Folha SEM dependência nenhuma, pelo
# mesmo argumento da `ph2d-curve` e da `ph2d-stroke-width`: o fato tem DOIS consumidores
# independentes — o NÓ que o coza (`ph2d-node-value-pattern`) e o PAINEL que o desenha
# como barras arrastáveis (`ph2d-panel-motion-params`) — e nenhum dos dois é dono do
# outro (o painel não pode depender de uma crate-nó; um nó não pode depender do painel).
#
# Uma segunda cópia da gramática é como a face do artista e o device passam a discordar
# sobre onde um valor acaba.
[dependencies]
