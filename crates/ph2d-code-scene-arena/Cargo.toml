[dependencies]
ph2d-code-scenes = { path = "../ph2d-code-scenes" }
ph2d-code-smoke = { path = "../ph2d-code-smoke" }
ph2d-code-viewmodel = { path = "../ph2d-code-viewmodel" }
ph2d-core = { path = "../ph2d-core" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-script = { path = "../ph2d-script" }
ph2d-vec-entities = { path = "../ph2d-vec-entities" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }

