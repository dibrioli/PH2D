[package]
name = "ph2d-tool-bgremoval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Background Removal — Stateful Tool, isolated crate (ADR-0040). Owns the
# whole feature: ToolManifest (data) + BgRemovalTool (impl Tool) + the pure
# chroma/guided-filter/compose pipeline + scratch buffers + icon + UI/action
# vocabulary (`params` module). Depends on ph2d-editor-core for the
# Tool/widget/FloatingPanel contract (satellite direction).

[dependencies]
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
# The Tool trait + FloatingPanel + widgets the BgRemovalTool builds on, and
# the params/vocabulary module re-exported at this crate's root.
ph2d-editor-core = { path = "../ph2d-editor-core" }
# BezPath for the eraser icon (icon.rs).
ph2d-vector = { path = "../ph2d-vector" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-core = { path = "../ph2d-core" }
# Typed color wrapper — Wave 11 migration (ADR-0042 §6 #2): the
# `set_source_snapshot` inherent takes `Vec<SrgbRgba>` instead of
# `Vec<u8>`. Storage stays `Vec<u8>` (downstream consumes bytes);
# the cast is zero-copy via `bytemuck::allocation::cast_vec`.
ph2d-color = { path = "../ph2d-color" }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
# imageops::resize (lanczos) for the preview thumbnail downscale. Decoders
# stripped — operates on already-decoded RGBA (ph2d-asset is the decode
# boundary).
image = { version = "0.25", default-features = false }
