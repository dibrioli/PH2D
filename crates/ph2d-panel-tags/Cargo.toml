[package]
name = "ph2d-panel-tags"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐⭐⭐ O painel TAGS (TOP-20 #9, W4) — typed `Panel<State>` (ADR-0029), coluna da direita.
#
# A taxonomia do projecto: criar, renomear, aninhar, apagar, e escolher na cena quem pertence.
# A secção do Inspector diz o que UM objecto é; este diz o que o PROJECTO tem.
#
# ⚠️ Ele NÃO depende da `ph2d-tags`: o instantâneo chega em `u64` + `String` pela porta do
# `ph2d-editor-core`, como o do Inspector. Quem conhece a folha das tags é a shell.

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y        = { path = "../ph2d-a11y" }
ph2d-tokens      = { path = "../ph2d-tokens" }
ph2d-i18n        = { path = "../ph2d-i18n" }
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-text        = { path = "../ph2d-text" }
ph2d-vector      = { path = "../ph2d-vector" }

[dev-dependencies]
ph2d-host = { path = "../ph2d-host" }
bumpalo   = "3"
# Arnês headless de costura — dev-dep só, o `architecture_cycle_prevention` lê `[dependencies]`.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }

[lints]
workspace = true
