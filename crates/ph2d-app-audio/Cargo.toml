[package]
name = "ph2d-app-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⛔ **O `cpal` está CONFINADO aqui** — é a razão de existir desta crate, e era a lei que o módulo
# já declarava dentro da shell (HR-1: o mixer `ph2d-audio` fica agnóstico à plataforma). Ela passa
# de promessa num doc-comment a fronteira de compilação.
# ⭐⭐ **É a FAMÍLIA do áudio** (auditoria de arquitectura 2026-09-12, A1): nasceu como
# `ph2d-audio-desktop`, uma folha partilhada, e guardava o runtime INTEIRO do Audio Editor (o painel,
# a entrega, o espectral, o denoise) — código de família com nome de folha. As duas portas que
# outras famílias usavam desceram para as crates-motor (`decode_any` → `ph2d-audio-decode`,
# `signals` → `ph2d-audio`), e o que ficou só a shell consome.
[dependencies]
cpal = "0.18"
# A INTERFACE da shell (`AppFamily`) — os roteadores de smoke do áudio declaram-se ao registo.
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-audio = { path = "../ph2d-audio" }
ph2d-audio-decode = { path = "../ph2d-audio-decode" }
ph2d-audio-edit = { path = "../ph2d-audio-edit", optional = true }
ph2d-audio-encode = { path = "../ph2d-audio-encode", optional = true }
ph2d-audio-ml = { path = "../ph2d-audio-ml", optional = true }
ph2d-audio-opus = { path = "../ph2d-audio-opus" }
ph2d-audio-spectral = { path = "../ph2d-audio-spectral" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
# O texto que o rack do Audio Editor mostra (nomes de efeito, de parâmetro, de preset e as
# unidades da leitura) — HR-15.
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-panel-audio-editor = { path = "../ph2d-panel-audio-editor", optional = true }
ph2d-tokens = { path = "../ph2d-tokens" }

# ⚠️⚠️ **AS FEATURES NÃO VIAJAM COM O CÓDIGO** (HOWTO §2.4, a armadilha MUDA): 21 sítios deste
# módulo vivem sob um `cfg(feature = …)`, e numa crate que não as declara o `cfg` é falso **por
# construção** — ela compilaria VERDE com o editor de áudio e o denoise inteiros desligados, e o
# único aviso seria um `unexpected cfg condition value` no meio da build.
# ⚠️ A composição é a MESMA da shell, lida do manifesto dela e não de memória: o `audio-ml` IMPLICA
# o painel (é onde o botão e a ponte dele vivem), e o painel arrasta o `-edit` e o `-encode`.
[features]
panel-audio-editor = ["dep:ph2d-panel-audio-editor", "dep:ph2d-audio-edit", "dep:ph2d-audio-encode"]
audio-ml = ["panel-audio-editor", "dep:ph2d-audio-ml"]
# ⚠️ A feature `test-support` MORREU na integração de 2026-09-25: o único item que a atravessava
# (`SceneAudio::decoded_ok`) é lido pelo gate da ponte do som, e a ponte desceu para ESTA crate —
# o tamanho da feature é o que atravessa (HOWTO §2.5), e deixou de atravessar nada.

[dev-dependencies]
# O `Vec2` das fixturas da ponte do som de cena (`audio_2d_tests.rs`), que desceu da shell em
# 2026-09-25 com os testes dela.
ph2d-core = { path = "../ph2d-core" }
# E o `.wav` das mesmas fixturas: a normal é OPCIONAL (feature `panel-audio-editor`), e uma
# feature não viaja com o código (HOWTO §2.4) — sem esta linha a crate sozinha não compila os testes.
ph2d-audio-encode = { path = "../ph2d-audio-encode" }
# A régua lexical do HR-15, para o gate por crate (`tests/it/`).
ph2d-label-census = { path = "../ph2d-label-census" }

[lints]
workspace = true
