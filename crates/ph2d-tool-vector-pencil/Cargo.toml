[package]
name = "ph2d-tool-vector-pencil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Vector Module Pencil tool — freehand stroke → Hobby auto-smooth (plan
# T2.1). Drop-crate per DIRETRIZ §3.A: isolated, zero edit central. The
# shell discovers + activates via `cluster: "vector_tools"`; preview +
# commit rendering wired in `vector_pencil_bridge.rs`.

[lib]

[dependencies]
# Tool contract + ToolManifest + chrome Registry.
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-editor-core = { path = "../ph2d-editor-core" }

# A11y role + memory budget canonicals.
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-core = { path = "../ph2d-core" }

# Vello / kurbo via ph2d-vector for the icon BezPath. Same crate hosts the
# `draw_vector_network` bridge the shell wires for preview rendering.
ph2d-vector = { path = "../ph2d-vector" }

# Vector Module data model — VectorNetwork / EditLog / StyleTable /
# StrokeStyle / VectorOp / Ph2dVectorAsset + the Hobby fitter (`hobby`).
ph2d-vector-doc = { path = "../ph2d-vector-doc" }

# OklchColor for the default stroke + `set_default_stroke` color injection.
ph2d-color = { path = "../ph2d-color" }

# Math primitives — glam::Vec2 for canvas / stroke coordinates.
glam = "0.30"
