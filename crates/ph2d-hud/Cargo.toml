[package]
name = "ph2d-hud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⛔ **UMA dependência, e ela é obrigatória pelo desenho.** A aritmética aqui é fechada (duas
# divisões e um `min`): não há transcendental, não há tipo de mundo, não há ECS — quem consome é que
# sabe o que é um `Transform`. O `serde` entra porque o [`Fit`] **viaja no documento** (é campo do
# `UiCanvas`), e a alternativa era declarar um enum gémeo no `ph2d-ecs` com uma conversão no meio:
# *duas respostas à mesma pergunta, que divergem no dia em que uma delas ganhar uma variante.*

[dependencies]
serde = { version = "1", features = ["derive"] }

