[package]
name = "ph2d-sky"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐ O CÉU FOTOGRÁFICO (HDRI) — a lei na CPU (pré-filtro + o `ph2d_material::Environment`) e o gémeo
# em WGSL, numa porta só, como a `ph2d-bloom` e a `ph2d-style`. Sem wgpu: quem desenha é o chamador.
# Os oito céus embarcados (`ceus/`) são os do Blender, da Poly Haven, CC0 (`ceus/LICENSE-CC0.txt`).
[dependencies]
ph2d-material = { path = "../ph2d-material" }
ph2d-imageio = { path = "../ph2d-imageio" }
ph2d-imageio-exr = { path = "../ph2d-imageio-exr" }
rayon = "1"
half = "2"

[lints]
workspace = true
