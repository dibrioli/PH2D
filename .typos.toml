# Configuration for typos-cli (https://github.com/crate-ci/typos)
# Run: typos
#
# False positives we explicitly accept (project-specific terms, acronyms,
# Brazilian Portuguese, etc.).

[default]
extend-ignore-identifiers-re = [
    # mlua + Luau API surface and types
    "luau",
    "mlua",
    "Luau",
]

[default.extend-words]
# Project-specific names (not typos).
ph2d = "ph2d"
PH2D = "PH2D"
# Library/crate names.
rquickjs = "rquickjs"
flecs = "flecs"
naga = "naga"
parley = "parley"
harfrust = "harfrust"
skrifa = "skrifa"
kurbo = "kurbo"
vello = "vello"
taffy = "taffy"
gilrs = "gilrs"
quinn = "quinn"
postcard = "postcard"
linesweeper = "linesweeper"
bumpalo = "bumpalo"
puffin = "puffin"
# Brazilian Portuguese tokens that look like typos to en-US dictionaries.
"nao" = "nao"
"sim" = "sim"
# Technical terms that show up in shaders / numerics.
texel = "texel"
mipmap = "mipmap"
# AccessibilityNode etc.
a11y = "a11y"
# Level of Detail — standard graphics acronym; typos-cli wants "LOAD".
LOD = "LOD"
lod = "lod"
# `edge_thr` = local shorthand for `edge_threshold` (already-scaled) inside
# bgremoval::edge_aware. typos-cli wants "the". Variable name is
# intentional — full `edge_threshold` is the input param, the suffix
# `_thr` distinguishes the post-scale value used in inner-loop comparisons.
thr = "thr"

[files]
extend-exclude = [
    "target/**",
    "Cargo.lock",
    # Snapshots are auto-generated; reviewing typos there is the snapshot's job.
    "**/snapshots/*.snap",
    # Spike fixtures may contain Luau intentionally
    "docs/scripting/examples/spike/**/*.luau",
    # PT-BR docs — typos-cli only knows en-US, would flag every "rever",
    # "sinal", "ser", "vai" etc. as typo. Per SKILL §10.1, code comments
    # are in English (and *those* still get scanned via .rs/.toml).
    "SKILL_Stack_PH2D_Definitiva.md",
    "docs/**/*.md",
    # Same PT-BR exception for `.md.template` files (e.g.
    # STATE.md.template = master copy of the multi-agent live state file).
    "docs/**/*.md.template",
    "README.md",
    "CLAUDE.md",
    "**/HANDOFF.md",
    # Per-feature INTEGRATION.md handoff docs colocated with island source
    # (e.g. crates/ph2d-editor/src/tools/<tool>/INTEGRATION.md). Same PT-BR
    # exception as `docs/**/*.md` — they're handoff notes between agents,
    # not user-facing strings.
    "**/INTEGRATION.md",
    # tests/spike/ has many pt-BR comments (debt — violation of §10.1).
    # When promoting any spike fixture to crates/ production code, rewrite
    # comments in English; remove the corresponding entry here.
    "tests/spike/**",
    # docs/design/ é o pacote do Claude Design — HTML mockups + SVGs +
    # CSS extraído. Contém:
    # - CSS class abbreviations (`pn-` = panel) que typos quer trocar pra `on-`
    # - Erros intencionais (`damge` em 10-script-editor.html demonstra UX
    #   de erro do LSP num mockup do editor de código)
    # - Strings em pt-BR + nomes de tokens + identifiers de design system
    # Não é nosso source — design system handoff de terceiro.
    "docs/design/**",
    # Slot 2 (bgremoval) — mantida durante a migração TG-B; conteúdo agora
    # vive no crate isolado pós-ADR-0040.
    "crates/ph2d-tool-bgremoval/**",
]
