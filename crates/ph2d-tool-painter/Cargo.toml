[package]
name = "ph2d-tool-painter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Painter — Stateful workhorse tool, isolated crate (ADR-0040 + ADR-0043).
# Cascata W0 ratificada 2026-05-26 (11 ADRs 0043..0053). Esta crate
# implementa o contrato ADR-0043 (`PainterTool` + `PainterParams` +
# `PainterUiEdit` + `PainterUiSnapshot`).
#
# T1.1 skeleton: panic-com-todo!() nos métodos que precisam de brush
# engine real (T1.4+). Pill registrada em T1.2. Brush real T1.3 ph2d-painter-brush.

[dependencies]
# Tool trait + FloatingPanel + widgets the PainterTool builds on.
ph2d-editor-core = { path = "../ph2d-editor-core" }
# ToolManifest + ToolHandler + Registry + Zone + McpExposure.
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
# BezPath for the painter icon (icon.rs).
ph2d-vector = { path = "../ph2d-vector" }
# Role for a11y_role no MANIFEST.
ph2d-a11y = { path = "../ph2d-a11y" }
# MemoryBudget for HR-13 boot check.
ph2d-core = { path = "../ph2d-core" }
# Layer blend modes + adjustment-layer effects (BlendMode / AdjustmentKind /
# adjustment editing fns). The layers + effects surface, extracted from the
# (deleted) brush engine.
ph2d-painter-effects = { path = "../ph2d-painter-effects" }
# Pure clean-room Blender brush engine (BrushSpec / Stroke / stamp_dab). Driven
# from `tool/paint.rs` to write dabs into the active layer's `canvas_rgba`.
ph2d-painter-brush = { path = "../ph2d-painter-brush" }
# Content-aware heal (Inpaint paint-mode): multi-scale PatchMatch reconstruction
# of the brushed defect region on pen-up (ADR-0102). CPU reference path.
ph2d-inpaint = { path = "../ph2d-inpaint" }
# Canonical sRGB↔linear byte transfer for the CPU compositor's gamma boundary.
ph2d-color = { path = "../ph2d-color" }
# serde for PainterParams + the layer model serialization.
serde = { version = "1", features = ["derive"] }
