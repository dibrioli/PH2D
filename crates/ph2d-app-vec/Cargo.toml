[package]
name = "ph2d-app-vec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐ **A metade-shell da família `vec`, fora da shell** (W2/L4 — auditoria de velocidade de
# 2026-09-10 §4-C2). A `shells/desktop` é um `bin` de 493 k linhas e a última unidade de todo
# build grande; esta crate é onde a ponte `App` ⇄ módulo vectorial passa a viver.
#
# ⛔ **Ela NÃO depende da shell, e não pode** — a shell é um binário. O sentido é sempre
# shell → crate: quem precisa de algo que só a shell tem (janela, `gfx`, painéis, a captura do
# undo) **fica na shell** e é nomeado no handoff de integração. É a mesma lei do ADR-0075.
#
# ⚠️ **A lista de dependências é MEDIDA, um a um, sobre os ficheiros que de facto aqui vivem** —
# o `cargo machete` do `ship.sh` reprova uma dependência declarada e não usada, e a 1ª redacção
# desta lista trazia quatro (`ph2d-core`, `ph2d-host`, `ph2d-render`, `ph2d-skeleton-ecs`) que
# vinham dos ficheiros que o fecho de módulos acabou por NÃO deixar mover.
[dependencies]
# ⭐ A ponte documento ⇄ árvore, que saiu para uma folha porque a `motion` e a `flip` também a
# consomem (`line/shell-folhas`, 12/09). O `entity_map` desta crate é um re-export dela.
ph2d-vec-entities = { path = "../ph2d-vec-entities" }
# ⚠️ A INTERFACE da shell (`AppFamily`), não o agregador — a família declara-se com um valor
# desta crate, e importá-lo do `ph2d-app-registry-init` fecharia o ciclo `registry → família
# → registry`. Ver o doc-comment de `ph2d-app-host::family`.
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-ecs = { path = "../ph2d-ecs" }
# ⚠️⚠️ **AS QUATRO QUE SÓ A CRATE REVELOU** (HOWTO §1.3: *«a lista de dependências da crate nova é o
# CUSTO REAL do módulo, e ele só se lê aqui»*). Dentro da shell todas eram dependência do binário e
# um ficheiro escrevia `ph2d_core::…` sem nada que o declarasse. O piloto achou quatro; esta família
# achou exactamente quatro também.
ph2d-core = { path = "../ph2d-core" }
ph2d-tool-vector = { path = "../ph2d-tool-vector" }
ph2d-vec-blend = { path = "../ph2d-vec-blend" }
ph2d-vec-fill = { path = "../ph2d-vec-fill" }
ph2d-editor = { path = "../ph2d-editor" }
ph2d-text = { path = "../ph2d-text" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-vec-edit = { path = "../ph2d-vec-edit" }
ph2d-vec-render = { path = "../ph2d-vec-render" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# ⚠️ **MAIS DUAS que só a crate revelou** (HOWTO §1.3) — a Fase A achou quatro, e o corte da 2.ª
# volta achou estas: a lâmina do `cut_line` e o passo de *lazy mouse* do lápis. Dentro da shell as
# duas eram dependência do binário e nada no ficheiro as declarava.
ph2d-painter-brush = { path = "../ph2d-painter-brush" }
# ⚠️ E TRES na 2.ª volta, com os mesmos ficheiros a virem da shell: o painel autorado, o gerador
# de spec de painel, e o importador de SVG. ⭐ Sao SEIS invisiveis nesta linha ao todo -- o
# numero e' a medida de quanto a shell escondia.
ph2d-panel-authored = { path = "../ph2d-panel-authored" }
ph2d-ui-codegen = { path = "../ph2d-ui-codegen" }
ph2d-vec-svg = { path = "../ph2d-vec-svg" }
# ⭐ E a SETIMA: a folha do nome unico (`line/shell-folhas`, 12/09) -- o importador de SVG baptiza
# cada grupo e cada forma que traz, e essa era literalmente a peca que esta linha nomeou como o
# seu bloqueador no handoff da Fase B.
ph2d-unique-name = { path = "../ph2d-unique-name" }
ph2d-vec-boolean = { path = "../ph2d-vec-boolean" }
# ⚠️ **A 10a e a 11a invisiveis, e as duas chegaram com as LEIS VIVAS da Fase C**: o roteamento do
# conector (`ph2d-vec-connect`) e a conversao de cor da pilha de aparencia (`ph2d-color`).
ph2d-color = { path = "../ph2d-color" }
# ⚠️ **A 12a, a 13a e a 14a invisiveis, e as tres vieram com o DUMP de diagnostico dos efeitos**
# (`PH2D_FX_DUMP`): ele le uma textura de volta da GPU, logo fala `wgpu` directamente.
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-painter-effects = { path = "../ph2d-painter-effects" }
wgpu = "29.0.4"
ph2d-vec-connect = { path = "../ph2d-vec-connect" }
# ⚠️ A 15a invisivel: a grelha de ladrilhos da estampa (`TileKind`, `HEX_ROW_RATIO`).
ph2d-vec-pattern = { path = "../ph2d-vec-pattern" }
# ⚠️ **MAIS DUAS na FASE C, e sao a OITAVA e a NONA invisiveis desta familia** (HOWTO §1.3): o
# editor de widget autorado traduz o rotulo de cada `WidgetKind` (`ph2d_i18n::tr`) e a costura das
# setas fala a chave da maquina de estados. Dentro da shell as duas eram dependencia do binario e
# nada nos ficheiros as declarava -- *a lista de dependencias e' o custo real do modulo, e ele so'
# se le' do lado de ca' da fronteira*.
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-morph-machine = { path = "../ph2d-morph-machine" }
# ⭐ A cena `PH2D_VEC_FADE_SMOKE` autora uma track de opacidade. ⚠️ **Uma crate-motor IRMÃ não é a
# shell** (ADR-0075) — é o mesmo precedente que destravou o fim da linha da `line/app-physics`,
# cujos três últimos braços de cena também autoram timeline.
ph2d-anim = { path = "../ph2d-anim" }
ph2d-timeline = { path = "../ph2d-timeline" }
# ⭐ A cena `PH2D_VEC_BONE_SMOKE` monta um esqueleto, prende-lhe uma imagem e gradua a malha dela.
# As três são folhas partilhadas, e as duas primeiras nasceram nesta jornada exactamente para que
# esta cena pudesse sair da shell.
ph2d-skeleton-live = { path = "../ph2d-skeleton-live" }
ph2d-skeleton-ecs = { path = "../ph2d-skeleton-ecs" }
ph2d-skeleton = { path = "../ph2d-skeleton" }
ph2d-image-import = { path = "../ph2d-image-import" }
ph2d-poly2d = { path = "../ph2d-poly2d" }
ph2d-asset = { path = "../ph2d-asset" }
ph2d-render = { path = "../ph2d-render" }
ph2d-vector = { path = "../ph2d-vector" }
ph2d-vector-font = { path = "../ph2d-vector-font" }
ph2d-panel-vector = { path = "../ph2d-panel-vector" }
fontique = "0.11.1"

# ⚠️ **A feature ESPELHA a da shell, e isso não é zelo — é o que o `mod` dizia.** O
# `vec_font_preview` estava atrás de `#[cfg(feature = "panel-vector")]` no `main.rs`, logo a
# pré-visualização de fonte **não** entra num build sem painel vectorial. Uma 1ª redacção desta
# crate declarou a dependência como obrigatória por eu ter lido só o `use` do ficheiro e não o
# `mod` que o declara: *a condição de compilação de um módulo não está escrita nele.*
[dev-dependencies]
# ⚠️ Só os GATES a usam (o `widget_icon_tests` encena um redimensionamento de janela) — logo é
# `dev-`, e não uma dependência do produto.
ph2d-host = { path = "../ph2d-host" }

[features]
# ⚠️ **A feature deixou de LIGAR a dependência e passou a gatear só a PRESENÇA de um módulo**
# (Fase B). O motivo é medido: o `paint_stack` usa `ph2d_panel_vector::state::*` em **9 sítios sem
# `#[cfg]` nenhum**, o `mod vec_paint_stack;` do `main.rs` nunca foi gateado, e o `render_loop`
# chama-o em 10 sítios também sem gate ⇒ a shell já exigia esta dependência sempre. Deixá-la
# opcional aqui só deslocava a quebra de `--no-default-features` para outra mensagem.
# ⛔ O `font_preview`, esse, ERA gateado no `main.rs` e continua a ser — a diferença entre os dois
# é o que o `mod` dizia, e *a condição de compilação de um módulo não está escrita nele* (§2.4).
panel-vector = []

# ⚠️ **`test-support` tem o tamanho do que ATRAVESSA a fronteira, e nada mais** (HOWTO §2.5): um
# `#[cfg(test)]` da família é FALSO quando ela é dependência, e o gate da shell deixa de ver uma
# função que está à vista no ficheiro que o erro cita. Aqui atravessa **uma**: o
# `TokenCtx::factory`, que quatro ficheiros da shell constroem. ⛔ Abrir mais do que atravessa
# paga `dead_code` do lado de cá — o piloto abriu 16 de uma vez e o compilador acusou.
test-support = []
