[package]
name = "ph2d-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[[bin]]
name = "ph2d_physics_c9"
path = "src/bin/c9.rs"

[dependencies]
# rapier2d with `enhanced-determinism` ON (per HR-5 + plan M10
# gate). Default features OFF — `parallel`, `simd-stable`,
# `simd-nightly` all break cross-OS determinism. `dim2` is a
# crate-level decision (we use rapier2d not rapier3d), `f32` is
# fine for 2D games.
# ⚠️ **PARAGEM INTERMEDIA DELIBERADA: 0.31.0 e' a ULTIMA versao em `nalgebra` puro.**
# A 0.32 troca a matematica para `glam` (atraves do wrapper `glamx`) e `parry2d`
# deixa de exportar `Point`, `Isometry` e `Translation` — 47 ficheiros nossos.
# Parar aqui entrega o solver reescrito da 0.29, o `contact_softness`, o
# `InteractionTestMode` e o `CoefficientCombineRule` **sem tocar num `Vector2`**,
# e e' isso que faz o `physics_ecs_c9` isolar EXACTAMENTE a mudanca de solver:
# um hash que se mexe aqui tem uma causa so'. Ver `docs/Atualizar Stack/` §13.
rapier2d = { version = "0.31", default-features = false, features = ["dim2", "f32", "enhanced-determinism"] }
# blake3 for hashing the deterministic state — same hash family as
# C9 cross-OS replay (HR-5 alignment).
blake3 = "1"
# libm for the ONE cross-OS `sin`/`cos` (ellipse collider tessellation,
# `ellipse_vertices`). `f32::sin_cos` is platform-math and differs in the
# last ulps, which would break the `physics_ecs_c9` cross-OS hash; libm is
# pure-Rust, one implementation everywhere — same discipline as `Transform`.
# Pinned to the workspace's existing `ph2d-ecs` version.
libm = { version = "=0.2.16", default-features = false }

[dev-dependencies]
# HR-13 declares a 20 MB physics budget; its ADR-0117 amendment says whoever
# declares a budget owns a gate that MEASURES it. `measure_checkpoint` is that
# gate — it decides the checkpoint ring's stride from real heap bytes.
dhat = "0.3"
