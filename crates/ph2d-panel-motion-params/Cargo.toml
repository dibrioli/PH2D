[package]
name = "ph2d-panel-motion-params"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

# Motion Nodes node-params panel (Motion Nodes M0.T9). Takes over the Inspector
# right-dock slot while the `motion` tool is active (mirror of ph2d-panel-vector;
# the shell's `motion_bridge` drives `panel_visible("motion_params")` + hides the
# real Inspector). M0 ships the skeleton: canonical dark-glass surface + title.
# The per-node param rows (generated from `ParamUiHint`) land in M1.

[lib]

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y = { path = "../ph2d-a11y" }
# The interactive Curve widget (A1): parse/serialize the curve text param + `eval`
# to plot it. Leaf, dependency-free (mirror of the field.remap node's use).
ph2d-curve = { path = "../ph2d-curve" }
# Row layout tokens (ROW_H_PX / Spacing) for the param rows (M1.P1).
ph2d-tokens = { path = "../ph2d-tokens" }
# Paint handles named explicitly by the Angle/Seed row painters in `number_rows`
# (the editor-core widget painters take `&mut VectorScene` / `&mut TextSystem`).
ph2d-text = { path = "../ph2d-text" }
ph2d-vector = { path = "../ph2d-vector" }

[dev-dependencies]
# Behavioural seam gates (DIRETIVA §5 DoD): drive real ValueChanged events
# through `apply_event` and assert the param intent that comes out — the only
# way to prove the soft/hard limit split actually reaches the document.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
