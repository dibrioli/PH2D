[package]
name = "ph2d-timeline-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⛔ **Uma folha por ASSUNTO, nunca um saco** (ESTADO_W2 §2). O assunto desta é UM: *o que a
# timeline escreve enquanto toca é pré-visualização, não autoria* — o censo `O(bindings)` de antes
# do `apply`, a lista dos quatro factos que uma curva conduz, e a declaração no ledger.
#
# ⭐ Ela nasceu na W2 Fase C porque apareceu o SEGUNDO consumidor numa crate diferente: o
# `ph2d-app-skeleton` (os Smart Bones largam exactamente os mesmos quatro factos ao desligar-se) e
# o `render_loop` da shell. *Duas famílias que partilham código partilham uma FOLHA, nunca uma
# delas à outra* (HOWTO §1.2).
#
# ⚠️ **Os GATES dela ficaram na shell** e isso é o desenho: eles medem se o estado de
# pré-visualização atravessa a `ProjectState::capture`, que é da shell (HOWTO §2.6 — *o teste segue
# o SUJEITO*).
[dependencies]
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-preview-drive = { path = "../ph2d-preview-drive" }
ph2d-render = { path = "../ph2d-render" }
ph2d-timeline = { path = "../ph2d-timeline" }
# ⚠️ Invisível enquanto o módulo vivia na shell (HOWTO §1.3): um dos quatro factos é o
# `PhysicsJoint`. ⭐ É a crate dos COMPONENTES da ponte, não a família `ph2d-app-physics`.
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }

[lints]
workspace = true
