[package]
name = "ph2d-panel-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-tokens = { path = "../ph2d-tokens" }
# HR-15: every new panel string goes through `tr()`. The Inspector's
# hardcoded-English exception is NOT inherited by a new panel.
ph2d-i18n = { path = "../ph2d-i18n" }
# `PhysicsSettings` + the MEASURED ranges. The panel paints the world's
# authored settings and emits a whole new one as an intent — it does not
# keep a second copy of any of these numbers.
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }
# A família da aba central «Collision Layers» (`aba::familia`, onda 9a): os tipos do `DocumentSurface`.
ph2d-host = { path = "../ph2d-host" }
ph2d-text = { path = "../ph2d-text" }
ph2d-vector = { path = "../ph2d-vector" }
# A altura e o vão dos botões da aba (`FIELD_H`, `FIELD_GAP`): os do editor de animações (onda 9g); e a
# geometria do cartão nos testes do gesto.
ph2d-card-stack = { path = "../ph2d-card-stack" }

[dev-dependencies]
# As duas bolas do gate do quadro de «Collides with».
ph2d-core = { path = "../ph2d-core" }
ph2d-ecs = { path = "../ph2d-ecs" }
# A régua do HR-15 — dev-dep só: o produto não conhece o censo dele.
ph2d-label-census = { path = "../ph2d-label-census" }
# `architecture_interactive_crate_has_behavioral_test`: a panel with an
# `event.rs` must ship a test that drives a REAL WidgetEvent and asserts the
# observable effect. The debt list is empty; there is no exemption.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
# O Esc real a meio do scrub (`dispatch_key` pede a arena do quadro).
bumpalo = { version = "3", features = ["collections"] }

[lints]
workspace = true
