[package]
name = "ph2d-host-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ph2d-host-desktop"
path = "src/main.rs"

[dependencies]
ph2d-host = { path = "../../crates/ph2d-host" }
ph2d-core = { path = "../../crates/ph2d-core" }
ph2d-gpu = { path = "../../crates/ph2d-gpu" }
ph2d-ecs = { path = "../../crates/ph2d-ecs" }
ph2d-render = { path = "../../crates/ph2d-render" }
# Integration demo deps:
# - ph2d-asset (M6): PNG load, blake3 ids, hot-reload watcher
# - ph2d-script (M7): Luau ScriptHost, ph2d.set/get/input bindings
# - ph2d-input (M8): gamepad/pencil device abstraction
# - ph2d-editor (M12): FloatingPanel, ZenMode, ToastQueue (data layer
#   visible via window title until Vello widget paint wires in)
# - ph2d-tokens (M12): semantic tokens for theme switching
ph2d-asset = { path = "../../crates/ph2d-asset" }
ph2d-script = { path = "../../crates/ph2d-script" }
ph2d-input = { path = "../../crates/ph2d-input" }
ph2d-editor = { path = "../../crates/ph2d-editor" }
ph2d-tokens = { path = "../../crates/ph2d-tokens" }
# M11 widget paint pass — Vello scene encoder + parley text contexts.
# Editor's `Paint` trait lowers widgets into a `VectorScene` that the
# render crate's `VelloPass` then composites onto the surface.
ph2d-vector = { path = "../../crates/ph2d-vector" }
ph2d-text = { path = "../../crates/ph2d-text" }
# bevy_ecs is required as a direct dep so `#[derive(Component)]` can
# resolve its `::bevy_ecs::*` absolute paths. The shell is the
# application layer and is the only place we tolerate this leak.
bevy_ecs = "0.18"
# image: shell uses for procedural-PNG-fixture generation at first
# launch (so M6 has real files to consume). Same dep ph2d-asset
# pulls — workspace Cargo.lock unifies version.
image = { version = "0.25", default-features = false, features = ["png"] }
# postcard: serialize Transform (and future component blobs) for the
# editor command pipeline (M14.A). Pushed as `EditorCommand::SetComponent
# { data: Vec<u8> }` and decoded by `apply_editor_commands` via the
# `ComponentRegistry` registered at boot.
postcard = { version = "1", features = ["alloc"] }
wgpu = "28"
winit = "0.30"
gilrs = "0.11"
# arboard: system clipboard read/write for the Cmd+C/V/X handlers in
# ph2d-editor's dispatch. Constructed once at startup; pasted text is
# fed back to the store via `apply_clipboard_paste`.
arboard = "3"
# bumpalo: per-frame arena for HeroScreen interaction events
# (ADR-0024). Allocated once at AppGfx construction; reset every
# frame after dispatch.
bumpalo = "3"
# rfd: native file picker (M14.4c "Import…" button + future Save As).
# Cross-platform (macOS / Windows / Linux); modal `pick_files()`
# blocks the main thread for the duration of the dialog — acceptable
# for a user-initiated import flow.
rfd = "0.15"

# core-graphics: macOS-only live cursor query. winit 0.30 does NOT
# emit `CursorMoved` during external file drag operations, so the
# cached cursor is stale by the time `DroppedFile` fires. We ask
# CoreGraphics for the live cursor instead. Already a transitive
# dep via winit/macos; promoting to a direct dep is free (no extra
# compile unit) and keeps the crate `forbid(unsafe_code)`-clean
# because all wrapping is inside the core-graphics crate itself.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[package.metadata.cargo-machete]
# `bevy_ecs` is reached only through `#[derive(Component)]` expansion,
# which machete can't see. See dep comment above.
ignored = ["bevy_ecs"]
