[package]
name = "ph2d-app-pixel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# A família Pixel Art (ADR-0196): o objecto Pixel Sprite (Add, modo Edit), as ferramentas internas
# (lápis, borracha, conta-gotas), o desfazer de cada sprite, a vista e o blob do projecto.
# ⛔ Nunca `ph2d-app-painter` nem o contrato `Tool=12`: as ferramentas são da família.
[dependencies]
ph2d-pixel-formas = { path = "../ph2d-pixel-formas" }
ph2d-pixel-core = { path = "../ph2d-pixel-core" }
# P8: a ferramenta Text (o rasterizador de fontes de pixel e do sistema).
ph2d-pixel-text = { path = "../ph2d-pixel-text" }
# P7: a pressão e o relógio do evento (a porta da caneta) e a corda do Stabilizer.
ph2d-pixel-render = { path = "../ph2d-pixel-render" }
# Load/Save Palette (os formatos de ficheiro de paleta).
ph2d-pixel-io = { path = "../ph2d-pixel-io" }
ph2d-pixel-ponte = { path = "../ph2d-pixel-ponte" }
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-component-desc = { path = "../ph2d-component-desc" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-game-dicas = { path = "../ph2d-game-dicas" }
ph2d-host = { path = "../ph2d-host" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-render = { path = "../ph2d-render" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-vector = { path = "../ph2d-vector" }
# As formas do Vector no Pixel (P6b): o `cook` do catálogo — a mesma porta do editor vetorial.
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# A forma VIVA (P6d): a LEI das alças do Vector (só as funções puras de `shape_handles`, nunca o
# `Tool`) e a pintura delas.
ph2d-tool-vector = { path = "../ph2d-tool-vector" }
ph2d-vec-render = { path = "../ph2d-vec-render" }
# A etiqueta do arrasto da forma viva (P6f): a ficha da casa (`ph2d_editor_core::readout`) mede o texto.
ph2d-text = { path = "../ph2d-text" }
winit = "0.30"
# A foto do gesto a meio da cena 16 (`smoke_intervalo::conduz`): os ids da grelha e a arena do despacho.
ph2d-panel-pixel-timeline = { path = "../ph2d-panel-pixel-timeline" }
# A janela Preview (P5): o tocar dela e o canal da imagem.
ph2d-panel-pixel-preview = { path = "../ph2d-panel-pixel-preview" }
# Export e Import (P9b): as janelas e o canal das opções.
ph2d-panel-pixel-export = { path = "../ph2d-panel-pixel-export" }
# A tela dos tilemaps (P10b): o painel e as leis de desenhar.
ph2d-panel-pixel-tiles = { path = "../ph2d-panel-pixel-tiles" }
ph2d-panel-pixel-slices = { path = "../ph2d-panel-pixel-slices" }
ph2d-pixel-tiles = { path = "../ph2d-pixel-tiles" }
# Os números e a arte das cenas de smoke; a ferramenta Slice (P11b).
ph2d-pixel-cenas = { path = "../ph2d-pixel-cenas" }
ph2d-pixel-slices = { path = "../ph2d-pixel-slices" }
# P12a: os atalhos como dados.
ph2d-pixel-keys = { path = "../ph2d-pixel-keys" }
ph2d-panel-pixel-keys = { path = "../ph2d-panel-pixel-keys" }
bumpalo = "3"
# O diálogo de ficheiro do Load/Save Palette (pela porta `ph2d_app_host::modal`).
rfd = "0.17"

[lints]
workspace = true
