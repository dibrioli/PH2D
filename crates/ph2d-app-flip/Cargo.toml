[package]
name = "ph2d-app-flip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⭐ A METADE DE APLICAÇÃO do módulo Flip (W2/L5, 2026-09-11) — a parte que vivia na
# `shells/desktop` por inércia e que não precisa da shell para existir.
#
# # Por que esta crate existe
#
# `shells/desktop` é UMA crate de 493 k linhas e a ÚLTIMA unidade de todo build grande
# (34–45 s sozinha no fim do gate de fecho; o front-end dela é monotarefa). Dentro dela
# viviam famílias inteiras de módulos — 26 777 linhas só do Flip — que ali estavam porque
# a ponte com a `App` foi ficando, não porque precisassem da janela.
# Ver `docs/DevOps/AUDITORIA_VELOCIDADE_DE_DESENVOLVIMENTO_2026-09-10.md` §4-C2.
#
# # A REGRA desta crate, e ela é a razão de ela funcionar
#
# ⛔ **Esta crate NUNCA depende da shell.** A shell é um binário: uma dependência de volta
# seria um ciclo. O corte é aciclico por construção — a shell chama aqui, e o que precisa
# de `App` fica lá (ADR-0075: desacopla-se por estado + eventos, nunca por plugin).
#
# ⚠️ **O DOCUMENTO não é daqui.** `ph2d_flip::FlipDoc` é partilhado (a F8 dos Componentes
# fechou-o em 10/09) e vive na crate de módulo — é a ponte a não partir. O que mora aqui é
# a metade de APLICAÇÃO: as leis puras, os construtores de cena, o estado de interacção.

[dependencies]
# ⚠️ A INTERFACE da shell (`AppFamily`), não o agregador — importar de
# `ph2d-app-registry-init` fecharia o ciclo `registry → família → registry`.
ph2d-app-host = { path = "../ph2d-app-host" }
# Vec2 e a aritmética partilhada.
ph2d-core = { path = "../ph2d-core" }
# O MODELO do Flip: objectos, camadas, desenhos, traços. O documento vem daqui, nunca da shell.
ph2d-flip = { path = "../ph2d-flip" }
# O balde (a dilatação do vão) e a escultura de traço — as leis que o editor chama.
ph2d-flip-fill = { path = "../ph2d-flip-fill" }
ph2d-flip-reshape = { path = "../ph2d-flip-reshape" }
# O ESTILO e os modos da tool (`FlipStyleSnapshot`, `FillMode`, `GAP_MAX_WORLD`) — as cenas de
# smoke e os helpers ao vivo lêem-nos; a tool em si continua a ser quem os autora.
ph2d-tool-flip = { path = "../ph2d-tool-flip" }
# ⚠️ Só pelo `Job` (o worker do Gap Closure) e pelos ids/acções que uma cena de smoke arma.
# NÃO é a shell: o `ph2d-editor` é a crate de widgets, e a shell também depende dela.
ph2d-editor-core = { path = "../ph2d-editor-core" }
# ⚠️ INVISÍVEL até a crate existir (HOWTO §1.3): o `pass_stage` escreve `bytemuck::cast_slice`
# para a impressão digital do buffer de GPU, e dentro da shell isto era dependência do binário.
bytemuck = "1"
# HR-5: a trigonometria determinística (o mesmo `libm` que o resto do desenho usa).
libm = "0.2"
# O empacotamento do desenho para a GPU (`FlipGpuData`, `pack_drawing`, `CameraRaw`) — os
# CORPOS do passe de render vivem aqui; o LAÇO que os chama em ordem fica na shell (HOWTO §4).
ph2d-flip-render = { path = "../ph2d-flip-render" }
# O `Xform` — a lei do traço recebe o afim mundo→local já pronto (ela não o DERIVA: derivar é o
# que está preso no `vec_transform` da shell, §3 do handoff).
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# Só pela `VectorScene` que o cursor do Flip desenha em cima.
ph2d-vector = { path = "../ph2d-vector" }
# O modo de mistura das camadas do Flip.
ph2d-painter-effects = { path = "../ph2d-painter-effects" }
# ⚠️ Só pelo `KeyCode` do `peek`: a POLÍTICA de teclado é pura (tecla -> transição), e é ela
# que está aqui; quem alimenta o evento é a shell.
winit = "0.30"
# ⭐ A fatia do painel que a família importa. `ph2d-panel-flip` publica a tira e as camadas;
# `-frames` é o painel de quadros. Os dois são OPCIONAIS aqui pelo mesmo motivo que na shell.
ph2d-panel-flip = { path = "../ph2d-panel-flip", optional = true }
ph2d-panel-flip-frames = { path = "../ph2d-panel-flip-frames", optional = true }
# O corte LazyBrush do Colorize (o `squeeze_from_bleed` e o solver).
ph2d-flip-colorize = { path = "../ph2d-flip-colorize" }
# O MUNDO do ECS: o `SimWorld`/`Entity`/`Transform` que a ponte de entidades e os dois gizmos
# leem. ⚠️ Não é a shell — é a crate de ECS, irmã (ADR-0075).
ph2d-ecs = { path = "../ph2d-ecs" }
# A `Camera2d` (tela ⟷ mundo) e o `pack_drawing`. Chegam por PARÂMETRO, nunca por handle.
ph2d-render = { path = "../ph2d-render" }
# O `SurfaceContext`/`WindowSize` — só o TAMANHO da janela atravessa, que a câmera precisa.
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-host = { path = "../ph2d-host" }
# ⚠️ INVISÍVEL até a crate existir (HOWTO §1.3): o passe de render nomeia tipos do `wgpu`
# (o `TextureFormat`/`LoadOp` do encoder). Dentro da shell era dependência do binário.
wgpu = "29.0.4"
# Os afins genéricos do ECS que a `line/shell-folhas` tirou da shell em 12/09 — eram eles
# que prendiam 84% desta família (§3 do handoff da Fase B).
ph2d-vec-entities = { path = "../ph2d-vec-entities" }
ph2d-unique-name = { path = "../ph2d-unique-name" }

[features]
# ⛔⛔ HOWTO §2.4 — **as features NÃO viajam com o código**, e esta é a armadilha MUDA mais
# cara da wave: num crate que não as declara, um `#[cfg(feature = "panel-flip")]` é falso
# **por construção**, e a crate compila VERDE com a fiação do painel desligada. O piloto
# perdeu o carregador do matcap exactamente assim.
#
# ⇒ os dois `cfg` que governam código desta família (`strip_drag.rs` e `bridge.rs`) têm de
# ter aqui a feature que os acende, e a shell tem de a repassar.
panel-flip = ["dep:ph2d-panel-flip"]
panel-flip-frames = ["dep:ph2d-panel-flip-frames"]

[lints]
workspace = true
