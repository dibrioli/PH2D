# Configuration for typos-cli (https://github.com/crate-ci/typos)
# Run: typos
#
# False positives we explicitly accept (project-specific terms, acronyms,
# Brazilian Portuguese, etc.).

[default]
extend-ignore-identifiers-re = [
    # Abbreviated git commit hashes quoted in handoffs — typos tokenizes a
    # hex hash like `b685beed` and reads "beed" wanting "bead"/"been".
    "\\b[0-9a-f]{8,40}\\b",
    # mlua + Luau API surface and types
    "luau",
    "mlua",
    "Luau",
    # PNG plural — typos-cli splits "PNGs" into identifiers and reads
    # "PN" wanting "ON". Audit-9 Lens O O-5 (2026-05-26): anchored
    # regex `^PNGs$` instead of unanchored substring `PNGs`.
    "^PNGs$",
    # `ba` — the `vector.boolean` engine's reverse-direction closure (B∘A,
    # mirror of the `ab` = A∘B forward) in `ph2d-node-vector-boolean`. A
    # deliberate short identifier, not a typo of `by`/`be`. Anchored (2026-06-04).
    "^ba$",
    # `pn` — "pigment of the neighbour cell" in the diffusion solver
    # (`ph2d-painter-brush::diffusion`), paired with `pc` (pigment-centre). A
    # deliberate short identifier, not a typo of `on`. Anchored (2026-06-08).
    "^pn$",
]

[default.extend-identifiers]
# NVIDIA FleX (the position-based-dynamics solver `motion.collide` cites for its
# averaged Jacobi push-apart). Checked as a whole so it is not split into `Fle`.
FleX = "FleX"

