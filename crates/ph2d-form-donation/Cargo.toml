[package]
name = "ph2d-form-donation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# **O QUE UMA MALHA DOA A UMA SUPERFÍCIE 2D** — os canais, a luz que os lê, e os dois fios
# por onde eles viajam. ⛔ ZERO dependências de família: é isso que permite à `shells/desktop`
# (que guarda, persiste e reacende) e à `ph2d-app-sculpt3d` (que faz o gesto de assar e de
# doar) partilharem os TIPOS sem que uma dependa da outra.
#
# ⚠️ **Esta crate nasce porque o `baked_form` NÃO pode entrar atrás da feature `sculpt3d`**, e
# a razão está escrita no topo dele desde que existe: *«o runtime lê os canais sem o módulo
# 3D»*. Enquanto a acendida morasse dentro da feature, reabrir um projeto num binário sem
# escultura devolveria um objeto que ninguém consegue iluminar. Com a família a sair da shell
# para uma crate OPCIONAL, «ficar na shell» deixou de ser suficiente — o tipo `RigStamp` é
# campo de uma struct da família, e um tipo atravessa ou não atravessa.
[dependencies]
# ⛔ Folha → folha, e ela traz a LEI e o CORREDOR — nunca uma segunda redacção deles aqui.
ph2d-form-pbr      = { path = "../ph2d-form-pbr" }
ph2d-gpu           = { path = "../ph2d-gpu" }
ph2d-view-transform = { path = "../ph2d-view-transform" }
ph2d-light         = { path = "../ph2d-light" }
ph2d-painter-brush = { path = "../ph2d-painter-brush" }
ph2d-render        = { path = "../ph2d-render" }
# ⚠️ **INVISÍVEL dentro da shell** (armadilha §2.4 do HOWTO): lá o `wgpu` é dependência do
# binário, e o `planes.rs` escrevia `wgpu::Device` sem nada no ficheiro que o declarasse.
wgpu = "29.0.4"
# ⚠️ **Para o passe da forma subir `f32` sem os COPIAR.** Os canais da forma são `[f32]` e a placa
# quer `[u8]`; a alternativa era um `Vec<u8>` novo por acendida — `16 MB` a `1024²`, ou seja
# milissegundos gastos a copiar para um passe que existe para poupar milissegundos.
# ⛔ É a MESMA crate que o passe irmão usa (`ph2d-render`), e pelo mesmo motivo.
bytemuck = "1"
# ⚠️ **Só pelo `derive` da [`lei_da_luz::Lei`], e a razão é o degrau `161` do `PROJECT_SCHEMA`:**
# a lei que acende um objecto assado passou a viajar NO DOCUMENTO, ao lado do `rig` (que já é
# `serde`, pela `ph2d-light`). ⛔ A alternativa era o ficheiro guardar um `u8` e a shell traduzi-lo
# — a **segunda ortografia** da mesma lei, exactamente onde o postcard é posicional e uma troca de
# ordem é silenciosa.
serde = { version = "1", features = ["derive"] }

# ⚠️ **INVISÍVEL dentro da shell, a segunda vez nesta crate** (§2.4): o `#[cfg(test)]` do
# `baked_form` faz round-trip do documento por `postcard`, e lá ele era dependência do binário.
[dev-dependencies]
# ⭐ **Só para a RÉGUA, e por isso é dev.** As sondas do céu leem LUMINÂNCIA de bytes que hoje são
# códigos sRGB ⇒ elas têm de DESCODIFICAR antes de pesar, senão uma RAZÃO delas não é uma razão de
# luz (ver o `lum` do `ceu_da_forma_sondas`). ⛔ O PRODUTO desta crate não a usa: quem codifica é a
# `ph2d-form-pbr`, do lado de quem escreve bytes.
ph2d-color = { path = "../ph2d-color" }
postcard = { version = "1", features = ["alloc"] }
# ⛔⛔ **A `naga` (o MESMO major do `wgpu` 29) — porque um WGSL que ninguém compila é PROSA.**
# O `cargo check` não olha para uma `&str`, e todo gate deste repo que olha para um shader
# precisa de adapter e é `#[ignore]` ⇒ um erro na fonte do passe só apareceria no 1.º quadro de
# quem abrisse a cena. É a mesma dependência, com a mesma justificação, que a `ph2d-form-pbr`
# declara — e aqui ela mede a fonte do PRODUTO, não uma montagem de exemplo.
naga = { version = "29.0.4", features = ["wgsl-in"] }

[lints]
workspace = true
