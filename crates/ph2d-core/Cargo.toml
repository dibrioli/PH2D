[package]
name = "ph2d-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# glam serde feature: enables Serialize/Deserialize for Vec2/Vec3/Mat3
# so SimComponents stored in ph2d-ecs (Transform, …) can derive serde
# end-to-end. HR-14 mitigation while `#[derive(Saveable)]` is pending
# — Prefab/Scene cooked via postcard in M14.3a consume these directly.
glam = { version = "0.30", features = ["serde"] }
