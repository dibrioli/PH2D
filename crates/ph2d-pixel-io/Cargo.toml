[package]
name = "ph2d-pixel-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Entrada e saída do Pixel Art (ADR-0196): `.ase` ler/escrever, folha + JSON, GIF/APNG/PNG, paletas.
# Nasce vazia na P0 (o documento grava-se pelo `ph2d-pixel-core::codec`); a P9 enche-a.
[dependencies]
ph2d-pixel-core = { path = "../ph2d-pixel-core" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-aseprite = { path = "../ph2d-aseprite" }
# O JSON da API do Lospec (Load Palette).
serde_json = "1"
ph2d-sprite-sheet = { path = "../ph2d-sprite-sheet" }
ph2d-imageio = { path = "../ph2d-imageio" }
ph2d-imageio-png = { path = "../ph2d-imageio-png" }
ph2d-imageio-gif = { path = "../ph2d-imageio-gif" }
ph2d-imageio-apng = { path = "../ph2d-imageio-apng" }
ph2d-imageio-webp = { path = "../ph2d-imageio-webp" }

[dev-dependencies]
ph2d-pixel-tiles = { path = "../ph2d-pixel-tiles" }
ph2d-asset = { path = "../ph2d-asset" }
sha2 = "0.11"

[lints]
workspace = true
