[package]
name = "ph2d-imageio-psd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# `ph2d-imageio-psd` — Adobe Photoshop Document (`.psd`) **import**
# (W2.T4). Write is deferred per ADR-0054 W2.5 escape hatch — PSD
# binary encoding compatible with Photoshop CC real is ~600 LOC
# greenfield + golden-test cycles, not justified mid-W2 batch.
# Lands W3 as `ph2d-imageio-psd-write` (or in-place when prioritised).

[dependencies]
ph2d-imageio = { path = "../ph2d-imageio" }
ph2d-color   = { path = "../ph2d-color" }
# Audit W2.T6 H-8: pin `=0.3.5` exact because our
# `map_psd_blend_mode_via_debug` depends on the `Debug` derive's
# variant-name representation being stable. A semver-minor bump
# (0.3.6+) could rename or `#[non_exhaustive]`-mark variants and
# silently make all blend modes fall through to `Normal`. Re-validate
# the hack before unpinning.
psd          = { version = "=0.3.5" }
