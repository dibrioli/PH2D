[package]
name = "ph2d-physics-ecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# The ECS-bridged determinism harness. Mirrors `ph2d_physics_c9` but
# drives the world THROUGH the bridge (components -> sim -> readback),
# so it exercises our conversion + iteration order, not just rapier.
# CI compares its hash across Linux/macOS/Windows (spike.yml).
[[bin]]
name = "physics_ecs_c9"
path = "src/bin/physics_ecs_c9/main.rs"

[dependencies]
ph2d-input = { path = "../ph2d-input" }
# The ECS this bridge reads components from and writes Transform back to.
ph2d-ecs = { path = "../ph2d-ecs" }
# A forma filha e o corpo à volta dela nascem com nome único (dono 09/11): a lei do Duplicate.
ph2d-unique-name = { path = "../ph2d-unique-name" }
# ⭐ A árvore de tags (TOP-20 #9, W3c) — o `SignalTagFilter` pergunta a pertença pela porta dela.
# ⚠️ Folha SEM ECS e sem `serde`, de propósito: ela já entra no fecho do `ph2d-ecs` acima (que a usa
# pelo mesmo motivo), logo não traz nada de novo ao grafo.
ph2d-tags = { path = "../ph2d-tags" }
# ⭐ A DOBRA da casa (plano 28, W6) — o nome de um TIPO de dano compara-se como uma tag (maiúsculas e
# acentos não importam). ⚠️ Já estava no fecho, pela `ph2d-tags`: nada de novo no grafo.
ph2d-label-fold = { path = "../ph2d-label-fold" }
# Direct bevy_ecs (same 0.19 as ph2d-ecs) to name + CACHE a `QueryState`
# in the bridge — building the query fresh every frame allocates; the
# cached state is the zero-alloc idiom (mirrors `TransformPropagationState`
# in ph2d-ecs). Not a determinism-risk dep.
bevy_ecs = "0.20"
# The rapier2d wrapper — the ONLY crate that touches rapier + owns the
# `enhanced-determinism` feature pin. This bridge stays rapier-free
# (holds only the re-exported handle types), so determinism is guarded
# in exactly one Cargo.toml (HR-5).
ph2d-physics = { path = "../ph2d-physics" }
# A forma «Outline» (W2b): as peças convexas derivadas dos anéis do `ColliderOutline`. Folha pura.
ph2d-outline-trace = { path = "../ph2d-outline-trace" }
# A LEI do player de plataforma (W2) — uma folha PURA, sem rapier e sem ECS.
# Ela mora fora desta crate de propósito: é o que torna o coyote gateável sem
# GPU e a fita de entrada (W7) testável sem janela. Esta ponte é o fio entre a
# lei e o wrapper, e não a dona de nenhum dos dois.
ph2d-platformer = { path = "../ph2d-platformer" }
# ⭐ A lei do mover de VISTA DE CIMA (TOP-20 #13) — a irmã da de cima, e pelo
# mesmo desenho: lei pura de um lado, ponte do outro.
ph2d-topdown = { path = "../ph2d-topdown" }

# ⭐ A lei do PROJÉCTIL (TOP-20 #14) — folha pura, como as duas irmãs de controlador.
ph2d-projectile = { path = "../ph2d-projectile" }
# ⭐ A lei da VIDA (plano 28, W1) — folha pura, sem transcendental, ao bit contra o GDevelop.
# A ponte a corre DEPOIS do passo, pelos dois laços (plano 28 §8.2).
ph2d-health = { path = "../ph2d-health" }
# ⭐ A NAVEGAÇÃO (plano 30, W3) — o caminho mais curto e a condução (folha sem dependências) e a
# malha andável a partir dos colisores estáticos. A ponte corre-as DENTRO da porta dos controladores.
ph2d-nav = { path = "../ph2d-nav" }
ph2d-navmesh = { path = "../ph2d-navmesh" }
# ⭐ O DESVIO entre agentes (plano 30, W5) — ORCA numa folha sem dependências, corrida DEPOIS da
# condução e antes do mover, na mesma porta.
ph2d-orca = { path = "../ph2d-orca" }
# (W15) As procuras de caminho A MEIO avançam em paralelo — exceção «sem rayon» restrita a
# `fila::procuras_a_meio` (ADR-0180, plano 30 §23.4): a fatia de cada uma decide-se antes, logo o resultado não
# depende do número de threads. Já resolvido no `Cargo.lock` (é o da `ph2d-navmesh`).
rayon = "1"
# ⭐ O splitmix64 da casa (`ph2d_shake::baralha`), para o sorteio da ESQUIVA: a lei pede UM
# sorteio por golpe, e o gerador tem de ser determinista e ir no anel com a vida.
ph2d-shake = { path = "../ph2d-shake" }
# glam Vec2 (re-exported by ph2d-core) for writing rapier poses back
# into Transform.translation.
ph2d-core = { path = "../ph2d-core" }
# libm — `atan2f`/`sincosf` for the FK gesture (W-FK), which turns a cursor
# into a joint angle and rotates a rigid piece about its anchor. The SAME pin
# as `ph2d-ecs` and `ph2d-physics` on purpose: a pose the artist authors is a
# number that lands in the document, and this line's rule is that every
# transcendental which can reach an authored number resolves to the same bits
# on every OS (the `std` versions are not specified to the last ulp).
libm = { version = "=0.2.16", default-features = false }
# serde derives on RigidBody/Collider so the ComponentRegistry can
# postcard them into the WorldSnapshot (same pattern as every other
# SimComponent).
# `rc`: o `ColliderOutline.rings` é um `Arc<[Ring]>` (serializa como o conteúdo).
serde = { version = "1", features = ["derive", "rc"] }
# Os nomes das camadas (`LayerNames`) viajam num blob postcard com versão própria.
postcard = { version = "1", features = ["use-std"] }
# blake3 for the ECS-bridged determinism hash over the readback poses
# (same hash family as `PhysicsWorld::deterministic_hash`).
blake3 = "1"

[dev-dependencies]
# O catálogo, para o gate `o_lado_forma_cobre_o_catalogo` (a fonte única do lado-forma).
ph2d-component-desc = { path = "../ph2d-component-desc" }

[lints]
workspace = true
