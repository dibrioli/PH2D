[package]
name = "ph2d-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# A malha residente do modulo de escultura 3D (ADR-0150: a malha e primaria, o
# campo e gerador). Crate LEAF: buffers, adjacencia
# CSR, octree de consulta e import OBJ, sem saber o que e uma GPU, uma Tool ou um
# painel. Quem fala com o device e a `ph2d-mesh-render`; quem esculpe e a
# `ph2d-sculpt3d`. Apagar as tres apaga o modulo (docs/3D/02.3).
[dependencies]
# rayon: sancionado pelo ADR-0150 ("a malha nasce residente na CPU, com rayon")
# e pela emenda de 2026-08-10, que somou a travessia de canais autorados.
#
# A LEI, e nao a lista: paraleliza-se aqui o que e' GATHER POR-VERTICE — funcao
# pura de entradas imutaveis, cada tarefa escrevendo so' o proprio slot, sem
# RNG e sem transcendental no laco quente. E' a forma exata do ADR-0109 §2, que
# este repositorio ja' paralelizou seis vezes (sculpt_offset, sculpt_close, o
# campo da aquarela, o fold da luz, o scan do undo) mais o traco de AO da
# ph2d-sdf (ADR-0156).
#
# ⚠️ A frase anterior ENUMERAVA um sitio ("as normais") e ja' tinha apodrecido:
# `curvature.rs` usa rayon desde que nasceu e nunca esteve nela. Enumeracao
# apodrece; a lei, nao. Hoje sao tres familias — normals.rs, curvature.rs e
# mesh_transfer.rs — e a proxima entra se, e so' se, satisfizer a lei acima.
#
# O caminho SERIAL fica em cada uma, congelado sob `cfg(test)`, como oraculo de
# paridade byte-a-byte varrida por numero de threads.
rayon = "1"

# serde: a crate SERIALIZA A SI MESMA (`src/persist.rs`). A alternativa seria o
# shell ler `Mesh`/`Multires` pelas portas publicas e montar o documento la —
# mas `levels`/`details` sao privados de proposito, e um serializador fora da
# crate seria uma SEGUNDA CASA que sabe do que uma pilha e feita, divergindo no
# dia em que a codificacao do detalhe mudar. Sem `postcard` aqui: so os TIPOS
# sao serializaveis; quem escolhe o formato e quem grava o arquivo (o shell), o
# mesmo corte de `ph2d-guides` e `ph2d-stroke-width`.
serde = { version = "1", features = ["derive"] }

# dhat-rs: o HR-13 emendado pelo ADR-0117 — *quem declara budget possui um gate
# que MEDE*. A sonda `measure_memory` responde "quantos MB residentes por milhao
# de triangulos", que e a entrada do teto por tier (ADR-0104) e do K1/K2 de
# docs/3D/03.5. Ela mede ANTES de qualquer `MAX_*` ser escrito.
[dev-dependencies]
dhat = "0.3"

# postcard: SO no gate `the_shape_of_a_saved_mesh_is_pinned`. O `src/` nao o
# toca (o formato e escolha de quem grava o arquivo) ⇒ machete-safe, o padrao
# das crates-no em `[dev-dependencies]` da `ph2d-gpu-cook`.
#
# ⚠️ Ele mora AQUI e nao so no shell de proposito: os gates de
# `shells/desktop/tests/` correm apenas na varredura impactada, e um fechamento
# por `cargo test -p ph2d-mesh` nao os alcanca — este repositorio ja pagou esse
# vermelho-latente tres vezes. O alarme de forma tem de tocar na crate onde a
# forma muda.
postcard = { version = "1", features = ["alloc"] }
