[package]
name = "ph2d-panel-pixel-timeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# A LINHA DO TEMPO do Pixel Art (P4, ADR-0196): camadas × frames na banda de baixo, no idioma do
# Aseprite. Não vê a família (`ph2d-app-pixel`): o instantâneo e os pedidos são o vocabulário
# `ph2d_editor_core::pixel_panel`, o mesmo do painel PIXEL.
[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
# P13 T: as linhas de som (o canal e os picos; folha, nunca a família).
ph2d-pixel-audio = { path = "../ph2d-pixel-audio" }
ph2d-a11y        = { path = "../ph2d-a11y" }
ph2d-tokens      = { path = "../ph2d-tokens" }
ph2d-i18n        = { path = "../ph2d-i18n" }
ph2d-pixel-core  = { path = "../ph2d-pixel-core" }
ph2d-pixel-render = { path = "../ph2d-pixel-render" }
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-vector      = { path = "../ph2d-vector" }

[dev-dependencies]
ph2d-host = { path = "../ph2d-host" }
ph2d-label-census = { path = "../ph2d-label-census" }
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }

[lints]
workspace = true
