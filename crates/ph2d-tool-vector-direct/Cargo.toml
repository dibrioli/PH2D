[package]
name = "ph2d-tool-vector-direct"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Vector Module Direct Select tool — vertex/tangent editing of the shared
# committed scene via event-sourced MoveVertex/MoveTangent ops (plan T2.3).
# Drop-crate per DIRETRIZ §3.A. Operates on `&mut [Ph2dVectorAsset]` +
# `&mut VectorSelection` passed by the shell.

[lib]

[dependencies]
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-core = { path = "../ph2d-core" }

# Icon BezPath.
ph2d-vector = { path = "../ph2d-vector" }

# VectorSelection + Ph2dVectorAsset + VectorOp (MoveVertex/MoveTangent) +
# hit-test (nearest_vertex / nearest_tangent_handle).
ph2d-vector-doc = { path = "../ph2d-vector-doc" }

glam = "0.30"
