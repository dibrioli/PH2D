[package]
name = "ph2d-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-host = { path = "../ph2d-host" }
ph2d-core = { path = "../ph2d-core" }
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-ecs = { path = "../ph2d-ecs" }
bevy_ecs = "0.18"
wgpu = "28"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
# Typed color wrapper (SrgbRgba) — Wave 11 migration (ADR-0042 §6 #2):
# `SpriteImage::new` takes `Vec<SrgbRgba>` instead of `Vec<u8>`.
ph2d-color = { path = "../ph2d-color" }
# Vello renderer for the M11 widget paint pass. Pinned to 0.8 (which
# tracks wgpu 28 — this is why ph2d-gpu/render/desktop downgraded
# from wgpu 29 in this PR; see ADR follow-up). VelloPass takes
# `&vello::Scene` directly so we don't need ph2d-vector here; the
# editor builds the Scene via ph2d-vector and passes it through.
vello = "0.8"
# serde derives on `Sprite` so it can be carried by `PrefabDoc` /
# `SceneDoc` through the postcard pipeline (M14.3). HR-14 mitigation
# until `#[derive(Saveable)]` lands.
serde = { version = "1", features = ["derive"] }
# `SpriteVersioned` wrapper enum (ADR-0070 §2.3): postcard dispatches
# V3 legacy fixtures vs V4 (W1+) at load time. Belongs in src/ (not
# dev-dep) because the W1 `load_sprite` / `save_sprite` paths are
# runtime APIs, not test-only. Pinned to `alloc` feature matching
# ph2d-asset / ph2d-ecs sibling crates so the wire format stays
# bit-identical across the workspace.
#
# EXACT version pin (HR-5): committed `tests/fixtures/sprite_v3_*.postcard`
# blobs are produced by postcard 1.1.3 (LEB128 varint + LE float
# bytes + positional). Postcard 1.x has no contractual "wire format
# frozen" guarantee — a 1.1.4 or 1.2 release could silently shift
# encoding. The `fixtures_match_canonical_serialization` test would
# catch byte drift, but the EXACT pin makes the contract explicit at
# the dependency layer. Any postcard bump = regenerate fixtures +
# re-cross-OS-verify + ADR amendment.
postcard = { version = "=1.1.3", features = ["alloc"] }
# Skyline rectangle-packing for the dynamic atlas (M14.4d retrofit).
# Lightweight (no image-data wrapping like `texture_packer`'s Texture
# trait): we keep RGBA bytes in our own buffers and use rect_packer
# purely for the (x, y) placement decision. Skyline is the same
# algorithm `texture_packer` uses under the hood.
rect_packer = "0.2"

[dev-dependencies]
# Frame-budget bench for the v4 RenderInstance ABI (Sprite Inspector v2
# W1.T1.7b). Same pin as the ph2d-input bench. `default-features = false`
# drops criterion's optional gnuplot/rayon pulls — the bench runs in the
# plain-text reporter path used by the CI bench job.
criterion = { version = "0.7", default-features = false }
# naga (same major as wgpu 28) — parse + validate sprite.wgsl at
# `cargo test` time so a vertex-layout / shader drift (e.g. the
# rotation→basis ABI change, ADR-0070-amendment-4) is caught before it
# reaches a GPU pipeline build. Mirrors ph2d-painter-brush's stamp.wgsl
# naga gate. `wgsl-in` feature for the WGSL front-end.
naga = { version = "28", features = ["wgsl-in"] }

[[bench]]
name = "sprites_upload_144b_vs_72b"
harness = false
