name: spike

on:
  push:
    branches: [main, "spike/**", "m*/**", "ci/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CLAUDE.md"
      - ".gitignore"
      - "LICENSE.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "CLAUDE.md"
      - ".gitignore"
      - "LICENSE.md"

# Cancel in-progress runs on the same branch when a new commit lands.
# Scoped to PRs / non-main branches — never cancels main pushes
# (those validate releases / merges and must complete).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Reproducibility: fixed timestamp baked into builds (per SKILL §12.7).
  SOURCE_DATE_EPOCH: "1746662400"

jobs:
  # --------------------------------------------------------------------------
  # Static analysis: format, lint, license/CVE/dependency audit.
  # Linux-only (same answer on every OS) + mold linker for fast clippy.
  # --------------------------------------------------------------------------
  lint:
    name: lint (fmt + clippy + deny + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No mold here — clippy/check don't link binaries; the
    # `apt-get install mold` (~30-60s) costs more than it saves
    # in jobs that are <1min compile-bound.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, all features)
        run: cargo clippy --workspace --all-targets --features ph2d-spike/bevy_ecs -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check (licenses, advisories, bans, sources)
        run: cargo deny --all-features check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (CVE scan)
        # See spike.yml history for why we wipe advisory-db before each run.
        run: |
          rm -rf ~/.cargo/advisory-db
          cargo audit

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: cargo machete (unused dependency check)
        run: cargo machete

      - name: Install typos-cli
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli

      - name: typos (project-wide typo scan)
        run: typos

  # --------------------------------------------------------------------------
  # MSRV check — verifies declared MSRV (rust-version = "1.85") still builds.
  # --------------------------------------------------------------------------
  msrv:
    name: MSRV (rust 1.85) check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No mold — same reason as `lint`: cargo check doesn't link.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - name: cargo check --workspace --locked (MSRV)
        run: cargo check --workspace --locked

  # --------------------------------------------------------------------------
  # Linux test — runs FIRST in the test chain. Fail-fast: if Linux breaks,
  # macOS and Windows never start (saves ~15min of runner time per fail).
  # --------------------------------------------------------------------------
  test-linux:
    name: ubuntu-latest — workspace check + tests
    runs-on: ubuntu-latest
    needs: [lint, msrv]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo check (workspace, default features) --locked
        run: cargo check --workspace --locked

      - name: cargo check (workspace, --features bevy_ecs) --locked
        run: cargo check --workspace --locked --features ph2d-spike/bevy_ecs

      - name: ph2d-script tests (nextest)
        run: cargo nextest run -p ph2d-script --release --locked

      - name: ph2d-mcp tests (nextest)
        run: cargo nextest run -p ph2d-mcp --release --locked

      - name: spike correctness fixtures (no ECS)
        run: |
          cargo run --release --locked --bin hello_runner -p ph2d-spike
          cargo run --release --locked --bin c13_migration -p ph2d-spike

      - name: spike correctness fixtures (with bevy_ecs)
        run: |
          cargo run --release --locked --bin c11_bevy --features bevy_ecs -p ph2d-spike
          cargo run --release --locked --bin c4_hot_reload --features bevy_ecs -p ph2d-spike
          cargo run --release --locked --bin c14_memory --features bevy_ecs -p ph2d-spike

  # --------------------------------------------------------------------------
  # macOS + Windows — only run if Linux passed (fail-fast economy).
  # --------------------------------------------------------------------------
  test-other:
    name: ${{ matrix.os }} — workspace check + tests
    runs-on: ${{ matrix.os }}
    needs: test-linux
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo check (workspace, default features) --locked
        run: cargo check --workspace --locked

      - name: cargo check (workspace, --features bevy_ecs) --locked
        run: cargo check --workspace --locked --features ph2d-spike/bevy_ecs

      - name: ph2d-script tests (nextest)
        run: cargo nextest run -p ph2d-script --release --locked

      - name: ph2d-mcp tests (nextest)
        run: cargo nextest run -p ph2d-mcp --release --locked

      - name: spike correctness fixtures (no ECS)
        run: |
          cargo run --release --locked --bin hello_runner -p ph2d-spike
          cargo run --release --locked --bin c13_migration -p ph2d-spike

      - name: spike correctness fixtures (with bevy_ecs)
        run: |
          cargo run --release --locked --bin c11_bevy --features bevy_ecs -p ph2d-spike
          cargo run --release --locked --bin c4_hot_reload --features bevy_ecs -p ph2d-spike
          cargo run --release --locked --bin c14_memory --features bevy_ecs -p ph2d-spike

  # --------------------------------------------------------------------------
  # Cross-platform replay determinism (HR-5). Hash equal on all 3 OSes.
  # --------------------------------------------------------------------------
  determinism:
    name: ${{ matrix.os }} — C9 cross-platform replay hash
    runs-on: ${{ matrix.os }}
    needs: [test-linux, test-other]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Run C9 replay and capture baseline hash
        id: replay
        shell: bash
        run: |
          OUT=$(cargo run --release --locked --quiet --bin c9_replay --features bevy_ecs -p ph2d-spike)
          echo "$OUT"
          HASH=$(echo "$OUT" | grep -E '^baseline hash: ' | awk '{print $3}')
          echo "Captured hash: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "$HASH" > "${RUNNER_TEMP}/c9-hash.txt"

      - name: Upload hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: c9-hash-${{ matrix.os }}
          path: ${{ runner.temp }}/c9-hash.txt
          if-no-files-found: error

  determinism-compare:
    name: C9 cross-platform comparison
    needs: determinism
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes
      - name: Compare hashes across all OSes
        shell: bash
        run: |
          set -euo pipefail
          echo "Per-OS hashes:"
          for f in hashes/c9-hash-*/c9-hash.txt; do
            os=$(basename "$(dirname "$f")" | sed 's/c9-hash-//')
            hash=$(cat "$f")
            echo "  $os: $hash"
          done
          uniq=$(for f in hashes/c9-hash-*/c9-hash.txt; do cat "$f"; done | sort -u | wc -l)
          if [ "$uniq" -ne 1 ]; then
            echo "FAIL: hashes differ across OSes — HR-5 violated."
            exit 1
          fi
          echo "PASS: hash identical across all OSes."

# =============================================================================
# DEFENSES PARKED (active when prerequisites land — keep these comments as
# the on-ramp checklist; do NOT enable without the noted preconditions).
#
# 1. cargo-fuzz (libFuzzer + LLVM coverage)
#    Activate WHEN: ph2d-script has a real Luau→Rust bridge AND/OR ph2d-net
#    parses untrusted packets.
#
# 2. ASan / TSan
#    Activate WHEN: ph2d-gpu::interop populated (wgpu-hal needs unsafe).
#
# 3. cargo-mutants
#    Activate WHEN: production code reaches ≥1k LOC in critical paths.
#
# Bench (criterion) lives in .github/workflows/bench.yml (weekly schedule
# + manual dispatch). Removed from PR runs because bench thresholds
# calibrated on hardware alvo (Mac M-series local) cause false positives
# on GitHub-hosted runners.
# =============================================================================
