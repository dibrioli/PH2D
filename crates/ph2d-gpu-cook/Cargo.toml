[package]
name = "ph2d-gpu-cook"
description = "GPU-resident node cook (GPU/M5 Fase 1, ADR-0126): Stream columns as wgpu buffers, node kernels as compute passes, lowering straight into the renderer's instance layout — zero readback on the hot path. The CPU eval stays canonical; this is the performance path, reconciled by ε-tolerance parity gates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
wgpu = "28"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-nodegraph = { path = "../ph2d-nodegraph" }
ph2d-render = { path = "../ph2d-render" }

[dev-dependencies]
# naga (same major as wgpu 28) — parse + validate every generated compute
# module at `cargo test` time, no device needed (mirrors sprite_wgsl_valid).
naga = { version = "28", features = ["wgsl-in"] }
# The parity gates cook a REAL motion chain on both paths.
ph2d-node-registry = { path = "../ph2d-node-registry" }
ph2d-eval-motion = { path = "../ph2d-eval-motion" }
ph2d-node-motion-grid = { path = "../ph2d-node-motion-grid" }
ph2d-node-motion-oscillator = { path = "../ph2d-node-motion-oscillator" }
ph2d-node-motion-move = { path = "../ph2d-node-motion-move" }
ph2d-node-motion-output = { path = "../ph2d-node-motion-output" }
# GPU/M5 Fase 2 — the ported nodes, cooked on both paths by the parity gate.
ph2d-node-motion-transform = { path = "../ph2d-node-motion-transform" }
ph2d-node-motion-rotate = { path = "../ph2d-node-motion-rotate" }
ph2d-node-motion-scale = { path = "../ph2d-node-motion-scale" }
ph2d-node-motion-falloff = { path = "../ph2d-node-motion-falloff" }
ph2d-node-motion-cull = { path = "../ph2d-node-motion-cull" }
ph2d-node-motion-tint = { path = "../ph2d-node-motion-tint" }
ph2d-node-motion-wiggle = { path = "../ph2d-node-motion-wiggle" }
# GPU/M5 Fase 3 — the simulation loop: the integrator + the five forces.
ph2d-node-motion-integrate = { path = "../ph2d-node-motion-integrate" }
ph2d-node-force-wind = { path = "../ph2d-node-force-wind" }
ph2d-node-force-drag = { path = "../ph2d-node-force-drag" }
ph2d-node-force-attractor = { path = "../ph2d-node-force-attractor" }
ph2d-node-force-vortex = { path = "../ph2d-node-force-vortex" }
ph2d-node-force-curl = { path = "../ph2d-node-force-curl" }
ph2d-node-force-buoyancy = { path = "../ph2d-node-force-buoyancy" }
ph2d-node-motion-spring = { path = "../ph2d-node-motion-spring" }
# The colour ramp: the positional key `HAS_<col>` unblocked.
ph2d-node-motion-color-ramp = { path = "../ph2d-node-motion-color-ramp" }
# GPU/M5 (ADR-0140) — the neighbourhood sim: boids on the spatial grid.
ph2d-node-motion-boids = { path = "../ph2d-node-motion-boids" }
ph2d-node-motion-collide = { path = "../ph2d-node-motion-collide" }
# GPU/M5 (ADR-0140) — the sim-zone family: the state loop, its integrator, its
# static collider (the fixed-population simulation on the device).
ph2d-node-sim-zone = { path = "../ph2d-node-sim-zone" }
ph2d-node-sim-step = { path = "../ph2d-node-sim-step" }
ph2d-node-sim-collide = { path = "../ph2d-node-sim-collide" }
# ADR-0136 — the count-changing family (compaction / birth / concat).
ph2d-node-sim-lifetime = { path = "../ph2d-node-sim-lifetime" }
ph2d-node-sim-spawn = { path = "../ph2d-node-sim-spawn" }
ph2d-node-motion-combine = { path = "../ph2d-node-motion-combine" }
ph2d-node-motion-sort = { path = "../ph2d-node-motion-sort" }
# The DEFORMER family — the whole-stream reduction channel (reduce -> broadcast
# -> map). These are the first nodes whose kernel reads a number about the WHOLE
# stream, so they are what the reduce gates cook on both paths.
ph2d-node-motion-bend = { path = "../ph2d-node-motion-bend" }
ph2d-node-motion-twist = { path = "../ph2d-node-motion-twist" }
ph2d-node-motion-spherize = { path = "../ph2d-node-motion-spherize" }
ph2d-node-motion-four-point-warp = { path = "../ph2d-node-motion-four-point-warp" }
# The count-changing deformer (StreamOp SourceRows) that READS its template.
ph2d-node-motion-kaleidoscope = { path = "../ph2d-node-motion-kaleidoscope" }
# The field.* focus-field family — pure per-instance maps that write the
# multiplicative `falloff` mask; cooked on both paths by the falloff-column
# parity gate (a downstream `tint` makes the mask a visible RenderInstance field).
ph2d-node-field-index-range = { path = "../ph2d-node-field-index-range" }
ph2d-node-field-box = { path = "../ph2d-node-field-box" }
ph2d-node-field-combine = { path = "../ph2d-node-field-combine" }
ph2d-node-field-radial-sweep = { path = "../ph2d-node-field-radial-sweep" }
ph2d-node-field-remap = { path = "../ph2d-node-field-remap" }
# ADR-0139 — the engine-algorithm family: Lloyd/JFA voronoi.
ph2d-node-motion-voronoi = { path = "../ph2d-node-motion-voronoi" }
ph2d-node-motion-noise = { path = "../ph2d-node-motion-noise" }
ph2d-node-motion-luminance = { path = "../ph2d-node-motion-luminance" }
ph2d-node-value-map-range = { path = "../ph2d-node-value-map-range" }
ph2d-node-motion-orbit = { path = "../ph2d-node-motion-orbit" }
ph2d-node-motion-pin-constraint = { path = "../ph2d-node-motion-pin-constraint" }
ph2d-node-motion-stagger = { path = "../ph2d-node-motion-stagger" }
ph2d-node-motion-look-at = { path = "../ph2d-node-motion-look-at" }
ph2d-node-motion-drive = { path = "../ph2d-node-motion-drive" }
ph2d-node-value-attribute = { path = "../ph2d-node-value-attribute" }
ph2d-node-value-lfo = { path = "../ph2d-node-value-lfo" }
# The value-domain coherent-noise producer (fBm over the wiggle lattice).
ph2d-node-value-noise = { path = "../ph2d-node-value-noise" }
# The value-domain crossfader (port-overrides-param via HAS_t_v presence).
ph2d-node-value-mix = { path = "../ph2d-node-value-mix" }
# The value-domain staircase (snap to a grid; the posterize/stepped look).
ph2d-node-value-quantize = { path = "../ph2d-node-value-quantize" }
# The value-domain contrast/gamma shaper (Schlick bias/gain, transcendental-free).
ph2d-node-value-gain = { path = "../ph2d-node-value-gain" }
ph2d-node-value-step = { path = "../ph2d-node-value-step" }
ph2d-node-value-normalize = { path = "../ph2d-node-value-normalize" }
ph2d-node-value-unary = { path = "../ph2d-node-value-unary" }
ph2d-node-value-reduce = { path = "../ph2d-node-value-reduce" }
# The value-domain combiner + router (the widest-input count law).
ph2d-node-value-math = { path = "../ph2d-node-value-math" }
ph2d-node-value-switch = { path = "../ph2d-node-value-switch" }
# A VALUE producer, to gate the color-ramp refusal (its `t` port).
ph2d-node-value-instance-field = { path = "../ph2d-node-value-instance-field" }
# The `id` stream the D3 refusal exists for (plan_simulation).
ph2d-node-motion-emitter = { path = "../ph2d-node-motion-emitter" }
