[package]
name = "ph2d-panel-timeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# General timeline panel — typed `Panel<State>` (ADR-0029). Bottom-docked in the
# `timeline` slot; shown while `panel_visible("timeline")`. A transport bar +
# ruler + dope-sheet driven by the app-general TimelineDoc (docs/Timeline/). The
# document lives in the shell (AppGfx.timeline); the panel reads a
# `TimelineViewSnapshot` published each frame and emits `TimelineIntent`s back.
# W2.E0 = scaffold (docked chrome + title); controls land in E2+.

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y = { path = "../ph2d-a11y" }
# Spacing / type / colour tokens named by the transport bar paint (chips,
# toggle labels). Text shaping goes through editor-core's paint_text.
ph2d-tokens = { path = "../ph2d-tokens" }
# Vello scene vocab (BezPath / Affine / Brush / Fill / Color) for the keyframe
# diamonds — the same crate editor-core paints through.
ph2d-vector = { path = "../ph2d-vector" }
# The read-model the panel paints (`TimelineViewSnapshot`).
ph2d-timeline = { path = "../ph2d-timeline" }
# `PointerButton` on the dope-sheet gesture (filter drags to the primary button).
ph2d-host = { path = "../ph2d-host" }
# UI strings (HR-15) — chrome labels routed through `tr()` (W2.E9).
ph2d-i18n = { path = "../ph2d-i18n" }

[dev-dependencies]
# Behavioral seam harness (MockPanelHost) for the transport wire test
# (architecture_interactive_crate_has_behavioral_test).
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
# `Playhead` — the seam tests drive `apply_intent`/`rebuild` to build a real
# document + snapshot (the same objects the shell publishes).
ph2d-core = { path = "../ph2d-core" }
