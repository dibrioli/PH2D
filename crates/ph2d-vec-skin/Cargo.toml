# A LEI da pele, e nada mais. Ela deforma um `VecPath` ponto a ponto por um afim por osso, então
# não precisa de kurbo (não há reamostragem: uma Bézier deformada por um afim **é** uma Bézier, e a
# mistura de afins ainda é um afim). ⛔ É por isso que esta crate é a irmã POBRE da
# `ph2d-vec-envelope`, que precisa de `sample + fit` porque o mapa dela não é afim.
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
