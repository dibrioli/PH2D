[package]
name = "ph2d-panel-padding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Padding panel — typed `Panel<State>` (ADR-0029). Right-docked
# (Inspector geometry slot); visible only while the `padding` tool is
# active. Four signed per-edge NumberInput fields (Top / Right / Bottom
# / Left) + Cancel / Apply. No live preview in v1 — Apply bakes the
# resized canvas shell-side.

[dependencies]
ph2d-editor-core  = { path = "../ph2d-editor-core" }
# ADR-0040 TG-C: the padding UI vocabulary (`PaddingUiSnapshot` +
# `slider_to_px` / `px_to_slider`) moved into the tool crate when the
# generic `ToolPanelEvent` channel landed. The panel reads the snapshot
# it paints and the slider↔chip mirror helpers from there directly.
# `editor-core` no longer carries the vocab; the new direction
# (panel → tool) does not cycle (tool depends on editor-core, panel on
# both).
ph2d-tool-padding = { path = "../ph2d-tool-padding" }
ph2d-a11y         = { path = "../ph2d-a11y" }
ph2d-tokens       = { path = "../ph2d-tokens" }

[dev-dependencies]
ph2d-host = { path = "../ph2d-host" }
bumpalo   = "3"
