[package]
name = "ph2d-vec-boolean"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Booleanas edit-time (ADR-0108): converte `VecPath` ⇄ kurbo `BezPath` e roda o
# linesweeper (motor exato, MIT/Apache). kurbo/linesweeper aqui são INTERNOS (não
# cruzam pro render, que usa a kurbo do vello) → sem risco de skew. Mesmas versões
# do wrapper provado `ph2d-vector-kurbo` (lift, não herança de arquitetura).
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
kurbo = "0.13"
# ⭐ SUBIDO para 0.4 em 2026-08-29, e a causa da recusa anterior era NOSSA.
#
# Esta linha esteve fixada em 0.3 por uma recusa medida: o `linesweeper 0.4` partia o POWER
# STROKE — seis gates a contar formas recebiam 128/60/32/175 peças onde esperavam 1, e o produto
# sairia como centenas de fragmentos em vez de uma fita.
#
# ⛔ A recusa culpava as duas convenções que a 0.4 mudou (o modo de saída aproximado por omissão
# e a inversão do sentido de winding). MEDIDO: nenhuma das duas. A causa estava em `expand.rs`,
# no `Region::of`, que regularizava por `A ∪ A = A` e portanto passava o MESMO caminho como os
# dois operandos — pondo cada aresta na varredura com multiplicidade 2. A partir da 0.4, uma
# multiplicidade PAR faz o motor deixar de dissolver a aresta interna que dois quadriláteros
# vizinhos da fita partilham. `A ∪ ∅` regulariza igual e entra com multiplicidade 1.
#
# ⚠️ O par (esta versão, aquela linha) é INDIVISÍVEL: sob 0.3 a mudança de `expand.rs` é
# byte-idêntica, então nenhuma mutação a mata sozinha. O mecanismo, a varredura de paridade e as
# oito hipóteses eliminadas estão no doc de `Region::of`.
#
# ⚠️ MUDA A REPRESENTAÇÃO da geometria de saída (não a forma): a 0.4 preserva os arcos como
# cúbicas, então um `outline_stroke` de ponta redonda volta com **6 vértices em vez de 141**
# (área igual a 1,1e-14, caixa idêntica). Quem editar os pontos de uma tinta assada vê outra
# coisa; nenhum golden do repo conta vértices de tinta.
linesweeper = "0.4"
