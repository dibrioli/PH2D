# ⛔⛔ **HOWTO §2.4 — AS FEATURES NÃO VIAJAM COM O CÓDIGO, e esta é a armadilha muda.**
# `109` sítios desta família estão atrás destas duas. Numa crate que não as DECLARA o `cfg` é
# falso **por construção**: o `motion_bridge` perderia o `mod surfaces` (o que a ferramenta
# ABRE e FECHA) e compilaria verde com o painel lateral morto.
# ⭐ Aqui ela falhou ALTO, e só por acidente: o `pub(crate) use surfaces::painel_lateral;` ao
# lado do `mod` não está sob `cfg`, então o compilador leu `surfaces` como uma CRATE que não
# existe. *Sem essa linha, o corte tinha passado em silêncio.*
[features]
default = ["panel-motion-graph", "panel-motion-params"]
panel-motion-graph = ["dep:ph2d-panel-motion-graph"]
panel-motion-params = ["dep:ph2d-panel-motion-params"]
# ⚠️ HOWTO §2.5 — do tamanho do que ATRAVESSA: **1** item.
test-support = []

[dependencies.ph2d-panel-motion-graph]
path = "../ph2d-panel-motion-graph"
optional = true

[dependencies.ph2d-panel-motion-params]
path = "../ph2d-panel-motion-params"
optional = true

[dev-dependencies]
# A régua lexical do HR-15, para o gate por crate (`tests/it/`).
ph2d-label-census = { path = "../ph2d-label-census" }
# ⚠️ HOWTO §1.3 — invisíveis dentro da shell, onde já eram dependência do binário.
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
ph2d-panel-timeline = { path = "../ph2d-panel-timeline" }

[lints]
workspace = true
