[package]
name = "ph2d-mesh-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Tudo que o modulo 3D fala com a GPU: upload da malha, camera orbital, o passe
# de matcap e (nas waves seguintes) o G-buffer da doacao. Espelha a
# `ph2d-flip-render`: o `ph2d-render` deliberadamente NAO depende de crates de
# documento, entao um passe wgpu dedicado mora na propria crate e recebe
# device/queue + o alvo do shell.
[dependencies]
# A malha residente — a fonte da geometria a rasterizar.
ph2d-mesh = { path = "../ph2d-mesh" }
# O RIG DE LUZ do artista -- as mesmas lampadas que acendem a tinta do Painter.
# ⚠️ E o unico caminho pelo qual esta crate toca o mundo 2D, e e deliberado
# (docs/3D/02.3): ph2d-light e a UNICA peca nao-removivel do modulo, porque um
# segundo rig faria o artista afinar a arte contra uma iluminacao e ver outra.
ph2d-light = { path = "../ph2d-light" }
# Mat4/Vec3 da camera. `glam` ja e a algebra desta casa (`ph2d-core`,
# `ph2d-vector-doc`); uma Mat4 escrita a mao aqui seria a segunda resposta.
glam = "0.30"
# wgpu 28 em lockstep com ph2d-render/ph2d-gpu/ph2d-flip-render.
wgpu = "28"
# O DECODER DOS MATCAPS. Os nove PNGs de `assets/matcaps/` sao `include_bytes!`,
# e alguem tem de transforma-los em texels -- ver `src/matcap.rs`.
#
# ⚠️ **A porta do repo, e nao o `image` cru:** `ph2d-imageio` ja e o dono da
# pergunta "que formatos este app abre", e um segundo decoder de PNG aqui seria
# a segunda resposta que diverge no dia em que a politica de perfil de cor mudar.
#
# ⚠️ **Nenhum pacote EXTERNO novo entra no `Cargo.lock` por causa disto:** as
# duas sao crates de caminho que a workspace ja compila, e o `image` que elas
# usam ja e dep transitiva via `ph2d-asset`. Sao arestas, nao pacotes.
#
# ⚠️ O EXR entra porque os matcaps do Blender sao meio-float na FONTE, e guarda-los
# em 8 bits erra ~1 nivel de 255 de volta em linear (medido -- ver `src/matcap.rs`).
# Ele NAO le os arquivos originais do Blender: aqueles sao recusados por dois
# motivos escritos no doc dele (layout de canais alem de RGBA -- `diffuse.*` e
# `specular.*` -- e compressao DWA/DWB), e nenhum dos dois e' sobre precisao. E'
# por isso que o cozimento re-embala em RGB/ZIP (`assets/matcaps/LICENSES.md`).
ph2d-imageio = { path = "../ph2d-imageio" }
ph2d-imageio-png = { path = "../ph2d-imageio-png" }
ph2d-imageio-exr = { path = "../ph2d-imageio-exr" }
# A porta sRGB->linear do repo (`srgb_to_linear_byte`). Escrever a curva aqui
# seria a segunda resposta: a sRGB tem JOELHO, e um `x^2.2` a mao erra no
# escuro, que e' metade de um matcap de pele.
ph2d-color = { path = "../ph2d-color" }
# Pod/Zeroable + cast_slice para o uniform e os vertex buffers — a mesma
# convencao do `instance_buffer` do ph2d-render.
bytemuck = { version = "1", features = ["derive"] }
# O G-buffer e `Rgba16Float` e a doacao volta pela CPU, entao alguem tem de
# decodificar `f16`. ⚠️ NAO ha decodificador escrito a mao aqui de proposito: o
# workspace ja tem UM (privado, na `ph2d-flip-render`) e o `half` ja esta no
# `Cargo.lock` (dep da `ph2d-tool-color-equalization`), entao um terceiro seria a
# terceira resposta a uma pergunta so -- e esta alimenta os pixels do artista.
half = "2"

[dev-dependencies]
# Os gates de GPU sao headless e bloqueiam no request_adapter/map_async.
pollster = "0.4"
# ⚠️ DEV-dependency, nunca `[dependencies]`: o gate do upload incremental dirige
# um traco REAL para produzir a lista `last_moved()` que a shell vai passar --
# um deformador escrito a mao no teste seria uma segunda resposta a "que
# vertices um dab move", e ela divergiria em silencio. O `src/` nao a toca, entao
# isto e machete-safe (o padrao que a `line/Flip` usou com `ph2d-painter-brush`).
ph2d-sculpt3d = { path = "../ph2d-sculpt3d" }
# ⚠️ DEV-dependency pela MESMA razao que a de cima, e o gate que a exige e
# `as_duas_fontes_de_ao_medem_o_mesmo_alcance`: o AO de tela e o AO assado tem
# de semear o raio pela MESMA fracao da peca, senao a composicao `min` das duas
# tem uma costura visivel na distancia em que uma acaba. Reescrever a fracao aqui
# seria a segunda resposta -- a que fica velha na primeira afinacao do bake. O
# `src/` nao a toca => machete-safe.
ph2d-sdf = { path = "../ph2d-sdf" }
