# cargo-audit config — kept in parity with deny.toml's [advisories].ignore
# so `cargo audit` (ship.sh + CI) and `cargo deny check advisories` agree.
#
# Each ignore here mirrors a deny.toml entry with the same justification:
#   RUSTSEC-2024-0436  paste — unmaintained, transitive (rapier→nalgebra→simba),
#                      proc-macro only, no runtime risk.
#   RUSTSEC-2023-0089  atomic-polyfill — unmaintained, transitive embedded shim,
#                      unused on PH2D's 64-bit targets.
#   RUSTSEC-2026-0192  ttf-parser unmaintained — Linux/Wayland CSD title text
#                      only (winit chain), unused by PH2D code.
#   RUSTSEC-2026-0194/ quick-xml DoS (quadratic attr scan / unbounded namespace
#   RUSTSEC-2026-0195  alloc) — Linux/Wayland BUILD-TIME only (wayland-scanner
#                      codegen over trusted in-repo protocol XML), never runtime
#                      input; wayland-scanner pins 0.39.x (no reachable fix).
#   RUSTSEC-2026-0217  tract-nnef integer overflow -> OOB read ON MODEL LOAD.
#                      Reached only via the VENDORED deep_filter (ADR-0123) ->
#                      ph2d-audio-ml, `optional = true`, feature `audio-ml` OFF
#                      by default. The one model we load is the DFN3 EMBEDDED at
#                      build time — no PH2D code opens a user-chosen model.
#                      ⚠️ The upgrade was TRIED (2026-07-31): the fix starts at
#                      0.21.16 and bumping the vendored crate to it fails
#                      workspace resolution ("failed to select a version for
#                      half"). Revisit if audio-ml ever ships ON by default.
#   RUSTSEC-2026-0319  anymap2 unmaintained (no CVE, no safe upgrade) — BUILD
#                      dependency of the same chain: liquid-core <- liquid <-
#                      (build) tract-linalg <- deep_filter <- ph2d-audio-ml,
#                      feature `audio-ml` OFF by default. Template engine at build
#                      time only. Revisit with the tract bump 0217 waits for.
#
# RETIRADA 2026-10-02: RUSTSEC-2026-0151 (jxl-grid) — o grafo traz o 0.6.2, fora
# da faixa afectada; o `cargo deny` já a dava como `advisory-not-detected`.
#
# ⚠️ RUSTSEC-2026-0222 (wasmtime, published 2026-07-31) is NOT here on purpose:
# it was FIXED, not ignored. `tests/spike` pinned `wasmtime = "44"` and the whole
# 44 series is outside every fixed range, so `cargo update` could not reach one —
# the bump to "47" (47.0.3) was the real fix, and the spike compiles on it.
[advisories]
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2023-0089",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0217",
    "RUSTSEC-2026-0319",
]
