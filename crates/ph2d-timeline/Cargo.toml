[package]
name = "ph2d-timeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# General-timeline runtime: binds ph2d-anim Clips to scene objects and applies
# them at the engine Playhead (ph2d-core). The first consumer is sprites
# (SpriteAnimation -> Transform); vector/painter/node-param resolvers join later.

[lib]

[features]
# `render` adds the sprite-opacity resolver, which writes `Sprite.tint[3]`.
# `Sprite` lives in `ph2d-render` (a GPU crate); gating keeps the base timeline
# runtime free of wgpu. The desktop shell enables this feature.
render = ["dep:ph2d-render"]
# `physics` adds the joint-parameter resolvers, which write `PhysicsJoint`
# fields (the servo's target, the motor's rate, a spring's rest length, a
# rope's ceiling).
#
# ⚠️ **Feature e não dep direta, e o precedente é o `render` logo acima** — a
# mesma forma, pelo mesmo motivo. O tracker registrava que ligar a timeline ao
# `PhysicsJoint` exigia *"(a) o editor de animação depender do motor de física,
# (b) mover o componente para o `ph2d-ecs`, ou (c) um canal genérico"*, e as
# três eram decisões de arquitetura. Havia uma QUARTA, já shipada nesta crate: o
# `Opacity` dirige um campo do `ph2d_render::Sprite` — outra crate que o runtime
# base não quer conhecer — por dep OPCIONAL atrás de uma feature que a shell
# liga. O runtime base da timeline segue sem física, exatamente como segue sem
# wgpu, e nada de novo foi inventado.
physics = ["dep:ph2d-physics-ecs"]
# `skeleton` adds the bone-handle resolvers, which write `Bone::curve` — as duas
# alças do *Bendy Bone* (ordem do dono, 2026-09-17: *"além de animar os ossos, é
# necessária a capacidade de animar os handles dos ossos"*).
#
# ⚠️ **A terceira ocorrência da MESMA forma**, e é por isso que ela não pede
# discussão nova: `render` para o `Sprite`, `physics` para o `PhysicsJoint`,
# `skeleton` para o `Bone`. O runtime base da timeline segue sem esqueleto como
# segue sem wgpu e sem física.
#
# ⛔ **E não há ciclo**: a `ph2d-skeleton-ecs` depende só da `ph2d-ecs` e da
# `ph2d-skeleton` — foi medido antes de escrever esta linha, porque a armadilha
# tem precedente neste módulo (a `ph2d-skeleton-live` não pôde ser a
# `-ecs` exactamente por um ciclo).
skeleton = ["dep:ph2d-skeleton-ecs"]

[dependencies]
# bevy_ecs for the #[derive(Component)] on SpriteAnimation (same direct-dep
# convention as ph2d-render's RenderInstance).
bevy_ecs = "0.19"
# Timeline data (Clip / Track / AnimValue / AnimTarget) sampled at the playhead.
ph2d-anim = { path = "../ph2d-anim" }
# Transform (the animated target), SimComponent marker, and World for the apply pass.
ph2d-ecs = { path = "../ph2d-ecs" }
# The engine Playhead: transport intents drive it, and the view snapshot reads it.
ph2d-core = { path = "../ph2d-core" }
# Comprimento de arco de uma cubica e a INVERSA dele: em modo Path (ADR-0141) a
# track escalar mede "quanto do caminho", e a amostragem inverte esse numero em
# `t`. Crate-folha ZERO-dep, partilhada com a pilha de efeitos do Vector -- duas
# respostas para "quanto andei nesta curva" divergiriam.
ph2d-arclen = { path = "../ph2d-arclen" }
# Expressões de propriedade (ADR-0144): o IR congelado + o evaluator + a trait
# Bindings (o passe pós-composição avalia contra os valores JÁ compostos), e o
# parser VEX-lite compartilhado (o MESMO que o Motion node usa — porta única).
ph2d-expr = { path = "../ph2d-expr" }
ph2d-expr-parse = { path = "../ph2d-expr-parse" }
# libm — `atan2f` puro-Rust para o auto-orient (ADR-0141 Fatia 5). MESMO pin de
# `ph2d-ecs`/`physics`/`flip`/`wet-paint`: o ângulo que ele produz vai para o
# `Transform`, que o `physics_ecs_c9` compara BIT A BIT entre os três OSes, e
# `f32::atan2` da std não promete a mesma última casa em toda plataforma.
libm = { version = "=0.2.16", default-features = false }
# Versioned document persistence (HR-14) + panel snapshot/intent (de)serialization.
serde = { version = "1", features = ["derive"] }
# Versioned on-disk format for the timeline document (W4 save/load).
postcard = { version = "1", features = ["alloc"] }
# Opacity resolver only (feature-gated): the `Sprite` component whose tint alpha
# is the sprite opacity channel.
ph2d-render = { path = "../ph2d-render", optional = true }
# Joint-parameter resolvers only (feature-gated): the `PhysicsJoint` component
# whose motor target/speed and lengths are the animatable channels of a machine.
# Irmã exata da linha acima — ver o comentário da feature `physics`.
ph2d-physics-ecs = { path = "../ph2d-physics-ecs", optional = true }
# Bone-handle resolvers only (feature-gated): the `Bone` component whose `curve`
# holds the two authored handles of a Bendy Bone.
# Irmã exata das duas linhas acima — ver o comentário da feature `skeleton`.
ph2d-skeleton-ecs = { path = "../ph2d-skeleton-ecs", optional = true }

[dev-dependencies]
# JSON round-trip of the document in serde tests.
serde_json = "1"
# HR-3 zero-alloc gate for the apply pass (tests/no_alloc_bridge.rs), mirroring
# ph2d-anim's sampling gate.
dhat = "0.3"
# ⭐ **Só nos TESTES, e a lei que o permite está escrita no `refusal.rs`:** este motor publica a
# CHAVE da recusa e nunca resolve o catálogo — mas uma régua que mede *«a frase NOMEIA a cura?»*
# tem de ler o que o artista lê. É o idioma que 16 crates de nó e a `ph2d-field` já declaram.
ph2d-i18n = { path = "../ph2d-i18n" }

[lints]
workspace = true
