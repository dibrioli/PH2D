[package]
name = "ph2d-panel-inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
# ADR-0166 / plano F0: a §7 Ordering é a seção PILOTO — os rótulos das linhas dela vêm do
# descritor, não de literais no pintor. ⚠️ Ligá-la revelou que as duas fontes já discordavam
# ("Sort At Root" × "Sort at Root"), que é exatamente o defeito que uma fonte só apaga.
# Folha PURA (zero dependências), então não puxa nada para o painel.
ph2d-component-desc = { path = "../ph2d-component-desc" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
# HR-15: todo texto que o painel pinta sai da tabela de strings (`panel.inspector.*`, 2026-09-13).
# ⭐ **E as frases das TAGS** (TOP-20 #9) — o `hr15_no_hardcoded_ui_strings` mede `.placeholder("…")`
# e o `Pick a tag…` estava escrito em três pintores desta crate. A tabela colapsa-os.
ph2d-i18n        = { path = "../ph2d-i18n" }
ph2d-a11y        = { path = "../ph2d-a11y" }
ph2d-tokens      = { path = "../ph2d-tokens" }
ph2d-text        = { path = "../ph2d-text" }
ph2d-vector      = { path = "../ph2d-vector" }
# ⭐⭐ **A DOBRA de um rótulo** (TOP-20 #9) — a busca da secção Tags tem de honrar a decisão do dono
# («maiúscula não importa, letra acentuada não importa»), e a única forma honesta é passar pela
# MESMA porta que a árvore usa para decidir se duas tags são a mesma. ⛔ Um `to_lowercase` aqui
# seria a segunda resposta à mesma pergunta, e divergiria no primeiro `Énemy`.
# Folha com três ICU, duas das quais o `ph2d-text` já traz — ver o Cargo.toml dela.
ph2d-label-fold  = { path = "../ph2d-label-fold" }

[dev-dependencies]
# Blindagem Fase 0.1: headless seam harness. Dev-dep only — the
# `architecture_cycle_prevention` gate reads `[dependencies]` only, so this
# builds no runtime cycle. See `tests/seam.rs`.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
# ⚠️ **Dev-dep pelo GESTO, não por conveniência**: o `dispatch_pointer_event` do testkit
# pede um `PointerEvent`, e um `WidgetEvent::Click` sintético **pula a checagem de
# focabilidade** — que é exactamente onde um chip pintado e hit-registado morre sob o dedo.
ph2d-host = { path = "../ph2d-host" }
# O gate `every_word_this_panel_shows_comes_from_the_string_table`: a régua lexical partilhada.
ph2d-label-census = { path = "../ph2d-label-census" }

[lints]
workspace = true
