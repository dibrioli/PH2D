[package]
name = "ph2d-host-pixel-scenes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

# ⭐ Os gates do PIXEL ART sobre a cena MONTADA (`PH2D_PIXEL_SMOKE`): a linha do tempo contra o oráculo
# do Aseprite Trial (`tests/fixtures/oracle_trial_timeline.json`) e os sobreviventes das mutações, pelo
# ponteiro e pelas teclas que a shell entrega. Moram aqui e não em `crates/ph2d-app-pixel` porque a
# catraca `the_shell_only_shrinks_and_every_app_crate_too` conta as linhas de `src/` E de `tests/` de
# cada crate app — o precedente é `shells/game-scenes` (e `shells/code-scenes`).

[lib]
path = "src/lib.rs"

[dev-dependencies]
ph2d-app-host = { path = "../../crates/ph2d-app-host" }
ph2d-app-pixel = { path = "../../crates/ph2d-app-pixel" }
ph2d-component-desc = { path = "../../crates/ph2d-component-desc" }
ph2d-ecs = { path = "../../crates/ph2d-ecs" }
ph2d-editor-core = { path = "../../crates/ph2d-editor-core" }
ph2d-pixel-keys = { path = "../../crates/ph2d-pixel-keys" }
# O canal da janela de atalhos (`tests/mapa_da_janela_de_teclas.rs`).
ph2d-panel-pixel-keys = { path = "../../crates/ph2d-panel-pixel-keys" }
ph2d-host = { path = "../../crates/ph2d-host" }
ph2d-i18n = { path = "../../crates/ph2d-i18n" }
ph2d-pen = { path = "../../crates/ph2d-pen" }
ph2d-pixel-core = { path = "../../crates/ph2d-pixel-core" }
ph2d-pixel-cenas = { path = "../../crates/ph2d-pixel-cenas" }
ph2d-pixel-io = { path = "../../crates/ph2d-pixel-io" }
ph2d-pixel-render = { path = "../../crates/ph2d-pixel-render" }
ph2d-pixel-text = { path = "../../crates/ph2d-pixel-text" }
ph2d-panel-pixel-preview = { path = "../../crates/ph2d-panel-pixel-preview" }
ph2d-panel-pixel-export = { path = "../../crates/ph2d-panel-pixel-export" }
ph2d-panel-pixel-tiles = { path = "../../crates/ph2d-panel-pixel-tiles" }
ph2d-panel-pixel-slices = { path = "../../crates/ph2d-panel-pixel-slices" }
ph2d-panel-pixel-history = { path = "../../crates/ph2d-panel-pixel-history" }
ph2d-panel-pixel-tools = { path = "../../crates/ph2d-panel-pixel-tools" }
ph2d-pixel-slices = { path = "../../crates/ph2d-pixel-slices" }
ph2d-pixel-tiles = { path = "../../crates/ph2d-pixel-tiles" }
ph2d-text = { path = "../../crates/ph2d-text" }
ph2d-imageio-png = { path = "../../crates/ph2d-imageio-png" }
ph2d-render = { path = "../../crates/ph2d-render" }
# O gate do palco do jogo lê os píxeis da arte pela placa (`tests/it/palco_do_jogo.rs`).
ph2d-gpu = { path = "../../crates/ph2d-gpu" }
ph2d-tokens = { path = "../../crates/ph2d-tokens" }
ph2d-tool-vector = { path = "../../crates/ph2d-tool-vector" }
ph2d-vec-scene = { path = "../../crates/ph2d-vec-scene" }
ph2d-vector = { path = "../../crates/ph2d-vector" }
# ⭐ P14c-pixel 2 — o Pixel Sprite na luz, pela placa (`pixel_na_luz.rs`): a família da luz e a do Pixel
# juntas só na composição (`architecture_no_dependency_climbs_a_layer`); o arnês é o `comum.rs` da luz.
ph2d-app-light2d = { path = "../../crates/ph2d-app-light2d" }
ph2d-light2d-ecs = { path = "../../crates/ph2d-light2d-ecs" }
ph2d-light2d-gpu = { path = "../../crates/ph2d-light2d-gpu" }
ph2d-pixel-cena = { path = "../../crates/ph2d-pixel-cena" }
ph2d-pixel-luz = { path = "../../crates/ph2d-pixel-luz" }
# A sonda da cena 26 (`cena26.rs`): a física e a regra de animação.
ph2d-physics-ecs = { path = "../../crates/ph2d-physics-ecs" }
bevy_ecs = "0.20"
half = "2"
vello = "0.11.0"
wgpu = "30.0.1"
serde_json = "1"
winit = "0.30"

[lints]
workspace = true
