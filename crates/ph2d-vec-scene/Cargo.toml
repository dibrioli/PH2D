[package]
name = "ph2d-vec-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Modelo puro de documento (Fase 0, ADR-0108): sem vello/kurbo/ph2d-color —
# geometria em [f64;2] cru; a conversão p/ kurbo::BezPath vive no render
# (`ph2d-vec-render`), que alcança a stack Linebender pelas re-exports de
# `ph2d-vector` (gate-proof + skew-proof). serde: undo por snapshot + save
# futuros (mesma disciplina dos SimComponents de ph2d-ecs).
# Comprimento de arco (e a inversa) da cuja casa esta crate foi a origem: extraido
# para uma crate-folha ZERO-dep quando o motion path da timeline (ADR-0141) virou o
# segundo consumidor. `pub mod arclen` re-exporta, entao os 5 sitios de chamada
# desta crate seguem escrevendo `crate::arclen::...` verbatim.
ph2d-arclen = { path = "../ph2d-arclen" }
serde = { version = "1", features = ["derive"] }
# Persistência (ADR-0108 Fase 2): save/load da cena via postcard (mesmo wire
# format canônico do resto do repo). `alloc` p/ to_allocvec.
postcard = { version = "1", features = ["alloc"] }
# O catálogo ÚNICO de estilos de warp (Enio 2026-07-25): o efeito Warp e os presets
# do Envelope re-exportam o MESMO `WarpStyle`, então não podem divergir. Folha pura
# (só serde) — não fere a pureza da cena.
ph2d-warp-style = { path = "../ph2d-warp-style" }
# A casa ÚNICA do perfil de largura (ADR-0148): o `WidthProfile`/`WidthStops` mora nesta folha
# porque tem dois donos que não se veem — este crate (o motor, via `power_stroke`) e o
# `ph2d-ecs` (o componente que o documento guarda). Folha pura (só serde), mesmo precedente da
# `ph2d-warp-style` logo acima. Re-exportado por `lib.rs`.
ph2d-stroke-width = { path = "../ph2d-stroke-width" }
