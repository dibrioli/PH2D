[package]
name = "ph2d-light2d-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# O dispositivo da casa (`GpuContext`): a mesma placa, as mesmas features pedidas.
ph2d-gpu = { path = "../ph2d-gpu" }
# A `CenaDeLuz` — a ÚNICA entrada da GPU (plano `docs/Luz2D/01_plano.md` §2.2).
ph2d-light2d-ecs = { path = "../ph2d-light2d-ecs" }
wgpu = "29.0.4"
bytemuck = { version = "1", features = ["derive"] }
# O escopo de erro da memória ao nascer (`pop` é um futuro; já no `Cargo.lock`, via `ph2d-gpu`).
pollster = "0.4.0"

[dev-dependencies]
# O gabarito: todo gate de qualidade (G3) e a tabela do G12 vêm dele.
ph2d-light2d-ref = { path = "../ph2d-light2d-ref" }
# Ler de volta as texturas `Rgba16Float` — a conversão canónica, não uma à mão. Já está no
# `Cargo.lock` (dependência do naga): não traz nada novo à árvore.
half = "2"

[lints]
workspace = true
