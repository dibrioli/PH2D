[package]
name = "ph2d-app-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# A família do EDITOR DE SCRIPTS (CodeEditor Onda 1, `docs/CodeEditor/02_onda1.md`): os documentos em
# aba (o trait `DocumentSurface` do `ph2d-editor-core`), o texto (`ph2d-code-buffer`), a gramática
# (`ph2d-code-syntax`), a pintura (`ph2d-panel-code`) e a ponte com a cena (`ph2d-script`).
ph2d-app-host = { path = "../ph2d-app-host" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-code-buffer = { path = "../ph2d-code-buffer" }
# A explicação escrita à mão de cada mensagem do Luau (I8).
ph2d-code-explain = { path = "../ph2d-code-explain" }
# O StyLua fixado que formata ao salvar (I13).
ph2d-code-format = { path = "../ph2d-code-format" }
# A página de ajuda (Onda 2, item 5): o catálogo e a porta única `resolve` do Ctrl+clique.
ph2d-code-help = { path = "../ph2d-code-help" }
# O reparse fora da tecla (Onda 2, I1) e a sessão do `luau-lsp` (I2).
ph2d-code-intel = { path = "../ph2d-code-intel" }
# O `luau-lsp` fixado que a sessão liga (`resolve_binary`, `ServerConfig`).
ph2d-code-lsp = { path = "../ph2d-code-lsp" }
ph2d-code-syntax = { path = "../ph2d-code-syntax" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-host = { path = "../ph2d-host" }
ph2d-i18n = { path = "../ph2d-i18n" }
ph2d-panel-code = { path = "../ph2d-panel-code" }
ph2d-script = { path = "../ph2d-script" }
ph2d-text = { path = "../ph2d-text" }
ph2d-tokens = { path = "../ph2d-tokens" }
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
ph2d-vector = { path = "../ph2d-vector" }

[dev-dependencies]
# E14, a bancada tecla→pixel: a placa (`GpuContext`), o rasterizador do app (`VelloPass`) e o
# `wgpu` da cópia de UMA faixa do alvo para a memória (a mesma versão do `ph2d-render`).
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-render = { path = "../ph2d-render" }
wgpu = "29.0.4"
# O carácter confirmado do IME entra pela porta do hero (`handle_text_input`), que pede a arena.
bumpalo = "3"
# Os traços ao acaso do gate da tecla (I1).
fastrand = "2"
# O servidor LSP falso dos gates do assistente (I2) fala JSON-RPC.
serde_json = "1"

[lints]
workspace = true
