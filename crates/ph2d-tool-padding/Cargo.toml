[package]
name = "ph2d-tool-padding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Padding — canvas resize by signed per-edge padding. Condenses the
# legacy engine's "Image Padding" (per-edge add/remove) and "Directional
# Expand" (single-edge grow/shrink) into one tool: directional expand is
# just dragging one edge of the same PaddingSpec. Positive = expand with
# transparent pixels; negative = crop. Recomputes the content offset so
# the caller can keep world-space position (pivot) stable.
#
# Owns the add_padding algorithm AND the stateful PaddingTool (ADR-0040
# T3); depends on ph2d-editor-core for the Tool/FloatingPanel contract
# (the satellite direction) — never the reverse.

[dependencies]
# Registry types (ToolManifest, Zone, Role, etc.).
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
# Tool trait + FloatingPanel the PaddingTool builds on; the params
# vocabulary module is re-exported at this crate's root (ADR-0040 T3).
ph2d-editor-core = { path = "../ph2d-editor-core" }
# Vector primitives (BezPath, Point, Shape) for the icon glyph.
ph2d-vector = { path = "../ph2d-vector" }
# Accessibility (Role) for the manifest a11y declaration (HR-12).
ph2d-a11y = { path = "../ph2d-a11y" }
# MemoryBudget type for the manifest budget declaration (HR-13).
ph2d-core = { path = "../ph2d-core" }
# Typed color wrapper (SrgbRgba) — Wave 11 color-space migration: the
# add_padding entry takes a typed `&[SrgbRgba]` instead of `&[u8]` so
# the IO boundary is explicit.
ph2d-color = { path = "../ph2d-color" }
