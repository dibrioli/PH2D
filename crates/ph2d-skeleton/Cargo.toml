[package]
name = "ph2d-skeleton"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# ⛔ **NENHUMA MÍDIA entra aqui — e é isso que a cerca guarda.**
#
# ⚠️ Ela dizia «UMA dependência, e é a álgebra» até 2026-09-07, e a wave que trouxe o `serde` (para o
# vocabulário do lado da dobra atravessar o ficheiro) escreveu o parágrafo que a reconcilia e não
# emendou o título — que passou a descrever um manifesto que não existe. Hoje são DUAS, e o que a
# cerca proíbe continua a ser o mesmo: uma crate de desenho, de cena, ou de qualquer coisa que saiba
# o que é um ponto. É esta linha que faz do esqueleto um MÓDULO: enquanto a
# lei vivia na `ph2d-vec-skin` ela puxava a `ph2d-vec-scene`, e um esqueleto que serve raster, 3D e
# Flip não pode precisar da cena vectorial para compor `repouso⁻¹ ∘ osso ∘ forma⁻¹`. O que cada
# mídia sabe — *o que é um ponto aqui* — mora do lado dela (`ph2d-vec-skin` é o 1.º cliente).
ph2d-affine = { path = "../ph2d-affine" }
# ⚠️ **A cerca acima continua INTEIRA no que ela protege — nenhuma MÍDIA entra aqui.** O `serde` não
# é uma: ele não sabe o que é uma cena, um pixel ou uma malha, e a lei continua a servir raster, 3D
# e Flip sem os conhecer.
#
# ⭐ Ele entra porque o vocabulário do LADO da dobra ([`reach::BendSide`]) é da lei — quem o consome
# é o `two_bone` — e o documento tem de o gravar. A alternativa era declará-lo **outra vez** na
# `ph2d-skeleton-ecs` com uma conversão no meio, que é exactamente a *segunda porta* que o cabeçalho
# do `skeleton_goal` proíbe por escrito: duas definições do mesmo conceito divergem em silêncio.
serde = { version = "1", features = ["derive"], default-features = false }

[lints]
workspace = true
