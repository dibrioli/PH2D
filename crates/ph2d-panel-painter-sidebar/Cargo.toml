[package]
name = "ph2d-panel-painter-sidebar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Painter sidebar — typed `Panel<State>` (ADR-0029) para Painter W2.
# Right-docked (Inspector geometry slot); visível só quando Painter ativo.
# Controles: size slider (top), modifier square (center), opacity slider
# (bottom), undo/redo buttons. Live preview renderiza no canvas (não no panel).
#
# **W2.T2.1 (plan §5):** drop-crate seguindo padrão BgRemoval/Upscale.
# Day-3 smoke = sidebar visível com sliders placeholders; Day-7 smoke =
# sliders funcionais; Day-10 smoke = undo/redo + commit via on_deactivate.

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
# PainterUiSnapshot + PainterUiEdit (ADR-0040 TG-B canal genérico) —
# sidebar lê snapshot e emite UiEdit via EditorAction::ToolPanelEvent.
ph2d-tool-painter = { path = "../ph2d-tool-painter" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-tokens = { path = "../ph2d-tokens" }
# NOTE: ph2d-vector / ph2d-text were removed (cargo-machete: unused). The
# panel reaches VectorScene / TextSystem through `PaintCtx` (re-exported by
# ph2d-editor-core), not as direct deps — the planned paint_sections.rs
# split never landed. Re-add if a future direct use appears.

[dev-dependencies]
ph2d-host = { path = "../ph2d-host" }
