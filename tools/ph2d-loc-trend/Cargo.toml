# Wave 10 / Etapa 6.3 — LOC trend detector. Records per-file LOC in
# `metrics/loc-trend.json` and fails if a critical-file grew > 10% in
# the last 30 days without an accompanying ADR. Prevents emergent
# god-files.
#
# Library + binary. Pure std (zero deps).

[lib]

[[bin]]
name = "ph2d-loc-trend"
path = "src/main.rs"
