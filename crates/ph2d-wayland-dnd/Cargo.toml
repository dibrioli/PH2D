[package]
name = "ph2d-wayland-dnd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# O `file://` da `text/uri-list` (RFC 2483) — a mesma versão que o `url` já traz ao lock.
percent-encoding = "2.3"

# O receptor de «soltar ficheiros» no Wayland, ao lado do winit 0.30 (que não tem DnD no Wayland:
# `docs/MiroClone/handoffs/HANDOFF_CONTINUACAO_W14_SOLTAR_NO_WAYLAND_2026-10-11.md` Parte 2).
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
# ⛔ TETO — o `winit 0.30.13` segura o `smithay-client-toolkit` em 0.19 e o `wayland-backend` com
# `client_system`; a mesma versão aqui reusa o que já é compilado. Reconfira com o winit 0.31.
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
rustix = { version = "1", features = ["event", "fs", "pipe"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# O rato da sessão VIRTUAL do teste `tests/kwin_drop.rs` (nunca o do dono).
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[lints.rust]
# ⚠️ NÃO herda `[lints] workspace = true`: excepção nomeada do gate
# `architecture_every_member_inherits_the_workspace_lints` — o receptor recebe a `wl_display` e a
# `wl_surface` do winit por ponteiro. `deny`: só o `src/receiver.rs` o autoriza por escrito.
unsafe_code = "deny"
