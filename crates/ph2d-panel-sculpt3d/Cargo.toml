[package]
name = "ph2d-panel-sculpt3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }

# ⚠️ **O `ImageQuality` e a porta de imagem da cena, e só eles.** O preview do
# padrão desenha uma IMAGEM (uma grade de 64² amostras do campo do alpha), e a
# alternativa — desenhar 4096 retângulos — é a que o espectrograma do áudio já
# recusou em letra: *"175k células não são retângulos"*. É a mesma aresta que o
# `ph2d-panel-painter-layers` e o `ph2d-panel-motion-graph` já pagam.
ph2d-vector = { path = "../ph2d-vector" }
ph2d-a11y = { path = "../ph2d-a11y" }
ph2d-tokens = { path = "../ph2d-tokens" }
# HR-15: toda string nova de painel passa pelo `tr()`.
ph2d-i18n = { path = "../ph2d-i18n" }
# `Brush`, `Verb`, `Falloff`, `Symmetry` — o vocabulário do ESCULTOR. O painel
# pinta o pincel autorado e emite um pincel novo inteiro como intent; ele não
# guarda uma segunda cópia de nenhum destes números, e os NOMES dos chips saem
# de `Verb::label()`/`Falloff::label()`, nunca de uma tabela paralela.
ph2d-sculpt3d = { path = "../ph2d-sculpt3d" }
# **`Extract`, e só ele.** Os dois números do extract (a espessura e as passadas
# de costura) são AUTORADOS aqui, e o `Extract::default()` é a fonte deles — dois
# `f32` soltos nesta struct seriam um segundo lugar para o default morar, e o
# dia em que o kernel mudasse o dele o painel continuaria mostrando o antigo.
ph2d-mesh = { path = "../ph2d-mesh" }
# O PISO da elevação da lâmpada (`MIN_ELEV_DEG`) — a faixa do slider é a do
# resolvedor de luz, não um número escolhido no painel.
ph2d-light = { path = "../ph2d-light" }

[dev-dependencies]
# `architecture_interactive_crate_has_behavioral_test`: um painel com `event.rs`
# tem de dirigir um `WidgetEvent` REAL e afirmar o efeito observável.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
