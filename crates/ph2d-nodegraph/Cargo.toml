[package]
name = "ph2d-nodegraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# The v1 contract skeleton was intentionally dependency-free (leaf-level
# substrate every node crate depends on). GPU/M5 Fase 0 (2026-07-15, the
# `docs/plans/2026-07-gpu-resident-node-pipeline.md` cook-parallel line)
# deliberately adds `rayon`: the one audited `attr::par_build` seam lets any node
# spread its per-instance map across cores (already a workspace dep — voronoi's
# PoC). Bit-identical (indexed collect preserves order; a pure map has no float
# reduction to reorder). Nothing else heavy lands here.
[dependencies]
rayon = "1"
