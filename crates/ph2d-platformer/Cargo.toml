publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# ⚠️ UMA, e ela é a regra de determinismo do módulo — não uma conveniência.
#
# Esta crate é a LEI de um controlador de plataforma: dado (config, estado,
# entrada, o que o sensor viu, a velocidade do corpo, a gravidade, dt), qual é a
# aceleração, o boost e a reação no chão. Ela não conhece o rapier, não conhece o
# ECS e não conhece a shell — quem traduz é a ponte (`ph2d-physics-ecs`).
#
# É isso que torna o coyote gateável sem GPU, a fita de entrada testável sem
# janela, e a lei debugável sem simular nada. O precedente desta linha e do repo
# é a `ph2d-guides` e a `ph2d-stroke-width`: uma folha por fato, com os
# consumidores dependendo dela e nunca ela deles.
#
# `libm` entra na W3 pelo ÚNICO transcendental da lei: o limite de rampa é
# autorado em GRAUS e comparado como cosseno (`WalkConfig::max_slope_cos`). O
# número entra no `physics_ecs_c9` pela W7, e a lei do módulo é que 1 ulp de
# diferença entre dois sistemas operacionais é um bug — o `cos` do `std` não é
# pinado cross-OS, o do `libm` é. Mesmo pin de `ph2d-ecs`/`ph2d-physics`.
#
# O resto continua `+ - * /` e `sqrt`, que o IEEE-754 especifica exatamente.
libm = { version = "=0.2.16", default-features = false }
