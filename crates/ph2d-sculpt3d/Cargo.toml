[package]
name = "ph2d-sculpt3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Os verbos de escultura. Na W1/M3 ela existe com UM verbo — o `Draw` — porque
# e o minimo que responde a pergunta do M3: *quanto custa um dab?* O modelo de
# TRACO (o `pre` congelado no pen-down + envelope, docs/3D/04.1), a mascara, a
# simetria e os outros 19 verbos sao a W2, e cada um chega com o gate dele.
[dependencies]
# rayon: EXCEÇÃO sancionada pelo ADR-0159, restrita ao map de vértices do
# `SculptStroke::dab`. ⚠️ A cerca do ADR-0109 vale: **todo sítio novo exige ADR
# novo** — não é licença geral para a crate.
rayon = "1"

ph2d-mesh = { path = "../ph2d-mesh" }

# ⚠️ O ROTOR, e só ele. A conversão azimute→vetor do EIXO do alpha direcional
# passa por `texture::rotate_by_degrees`, que ACUMULA uma rotação de 1° — uma
# sequência numérica específica, não `(cos θ, sin θ)`. Um `sin`/`cos` escrito
# aqui daria outro número nos últimos bits, e o app inteiro (Jitter Rotate,
# Angle por-slot, a luz do impasto, o rig da `ph2d-light`) gira por aquele:
# duas respostas para *"que vetor é este ângulo?"* divergiriam no dia em que
# alguém comparasse um eixo de padrão com uma direção de luz.
#
# ⚠️ **E ele NÃO traz a libm junto:** `ph2d-painter-brush` é FOLHA (zero
# dependências) e o rotor é transcendental-free por construção, então esta crate
# continua `libm`-free — a promessa que o `alpha.rs` faz no cabeçalho.
#
# É a MESMA aresta, pela MESMA razão, que a `ph2d-light` já paga e escreveu no
# `Cargo.toml` dela; folha→folha não inverte arquitetura nenhuma.
ph2d-painter-brush = { path = "../ph2d-painter-brush" }

# libm — os transcendentais do porte do `Twist` (`ref_twist.rs`), e a escolha é
# MEDIDA contra o V8 em 20 000 amostras, não herdada: `atan2` do `libm` é
# **exato** contra o Node (0 divergências) enquanto o do sistema erra em 18,6%
# delas, e `sin`/`cos` do `libm` erram 3× menos. O ECMAScript declara os quatro
# implementation-approximated, então não há resposta exata a espelhar — há a
# biblioteca que chega mais perto, e a tabela está no `ref_twist.rs`.
#
# Mesmo pin de `ph2d-flip`/`ph2d-physics`/`ph2d-editor-core`/`ph2d-node-motion-strobe`
# (e da `ph2d-wet-paint`, o outro porte de JS deste repo) ⇒ é ARESTA, não pacote
# novo no `Cargo.lock`.
libm = { version = "=0.2.16", default-features = false }
