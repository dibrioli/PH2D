[package]
name = "ph2d-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# ⚠️ 0.12: os re-exports da raiz foram refactorados — `ThreadStatus` mudou-se para
# `mlua::thread` e o `Compiler` para `mlua::chunk`. Os ~70 outros usos (create_function,
# set_app_data, app_data_ref, gc_step, sandbox, globals, Thread::resume/status) tem
# assinatura IDENTICA, conferida no fonte das duas versoes.
# ⚠️ A unica mudanca de comportamento medida: o `mlua::Integer` do Luau vai de i32 para
# i64 (o `2^53` era `Number` e passa a `Integer`). As chaves de tabela stringificam
# igual nas duas ⇒ sem deriva no `StateTable`.
mlua = { version = "0.12", features = ["luau"] }
# blake3 used for source-content hashing — drives the reset+restore
# decision in `ScriptHost::load_script` (HR-16: hot-reload only when
# bytes actually changed, not on every save).
blake3 = "1"
# M14.2 — LuauScript Component lives in this crate because it ties an
# ECS entity to a script bytecode asset. ph2d-ecs gives us Component,
# Entity, SimComponent; ph2d-asset gives us AssetId.
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-asset = { path = "../ph2d-asset" }
# bevy_ecs as a direct dep is required because `#[derive(Component)]`
# expands to absolute paths into `bevy_ecs::*`. ph2d-ecs re-exports
# don't satisfy the macro lookup. Same pattern documented in
# shells/desktop/Cargo.toml.
bevy_ecs = "0.19"
# serde derives on LuauScript + PodValue so they round-trip through
# the postcard pipeline that PrefabDoc/SceneDoc consume in M14.3.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"

[package.metadata.cargo-machete]
# bevy_ecs is reached only through `#[derive(Component)]` expansion,
# which machete can't see. See dep comment above.
ignored = ["bevy_ecs"]
