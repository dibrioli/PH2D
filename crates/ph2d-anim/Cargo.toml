[package]
name = "ph2d-anim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Camada 1 of the Motion Nodes study (docs/Motion Nodes/00_estudo_estado_da_arte.md):
# a keyframe store (Track) + editable curves (AnimCurve) giving REAL impls to the
# two animation traits frozen in ph2d-vector-traits (AttributeEvaluator,
# AnimationCurveSampler). Leaf library crate: nothing depends on it yet, no codegen
# sync touches it (not a ph2d-node-*/ph2d-tool-*/ph2d-panel-*). Wiring into the app
# (motion.clip node, timeline) is future lines, out of scope here.

[lib]

[dependencies]
# The frozen animation contracts + AnimValue + the LinearInterp we reuse for
# value interpolation (OKLCH hue short-arc lives there — never re-implemented here).
ph2d-vector-traits = { path = "../ph2d-vector-traits" }
# OklchColor + glam Vec2/Vec3 for the AnimValue serde shim (anim_value_serde.rs):
# AnimValue is frozen and NOT Serialize, so this crate maps it to a serializable
# repr and must construct those value types on deserialize.
ph2d-color = { path = "../ph2d-color" }
glam = "0.30"
# serde derives for the persistable timeline data (Track/Key/Clip/Interp/Easing/
# RationalTime). W0.T4 — HR-14 versioned save (see SCHEMA_VERSION).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# ph2d-core for the Playhead in the general-timeline seam test
# (tests/playhead_drive.rs): advancing the engine Playhead drives a Clip sample.
ph2d-core = { path = "../ph2d-core" }
# serde_json for the human-readable serde round-trip test (tests/serde_roundtrip.rs).
# The real save format is the document's choice (postcard); JSON keeps the test legible.
serde_json = "1"
# dhat-rs for the HR-3 zero-alloc playback gate (tests/no_alloc.rs), mirroring
# ph2d-ecs/tests/propagate_no_alloc.rs + ph2d-audio/tests/no_alloc_render.rs.
dhat = "0.3"
