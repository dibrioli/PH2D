[package]
name = "ph2d-paint-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

# ⚠️ **A AUSÊNCIA de `ph2d-painter-brush` aqui é o desenho, não um esquecimento.**
#
# A armadilha desta wave é [[feedback_two_engines_one_state_is_worse_than_a_slow_engine]]: um kernel
# de GPU que RE-DERIVASSE a silhueta do dab seria uma segunda resposta a *"que forma tem este dab?"*,
# divergindo no único lugar onde ninguém lê um número — uma screenshot. A cura é a mesma do
# `ImpastoLightPass` (o LUT especular sobe PRONTO, e o `powf` nunca roda no device): a CPU calcula o
# falloff com a função que JÁ shipa e manda a TABELA; o device só a amostra.
#
# Não depender da crate do pincel torna isso **estrutural em vez de disciplinar**: esta crate não tem
# acesso ao `falloff_weight`, então ela não CONSEGUE ter uma opinião sobre a lei. O que ela recebe é
# dado simples — uma tabela e uma lista de discos.
[dependencies]
ph2d-gpu = { path = "../ph2d-gpu" }
wgpu = { version = "29.0.4", features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
# ⛔ TETO: ver `ph2d-gpu/Cargo.toml` (segurado pelo rfd).
pollster = "0.4.0"
# ⚠️ O gate de paridade precisa da função REAL do Painter como ORÁCULO — uma reescrita local seria
# a segunda resposta que esta crate existe para não ter. `dev`, não `dependencies`: o `src/` não a
# toca ⇒ machete-safe, o padrão que a `ph2d-flip-render` já usa pelo mesmo motivo.
ph2d-painter-brush = { path = "../ph2d-painter-brush" }
# ⚠️ E o TOOL, so' para a sonda que mede pela porta do ARTISTA (`measure_product_stamp`): a
# decisao *"vale ligar a ponte?"* tem de sair do `on_canvas_pointer`, nao de um banco de teste.
# `dev`, entao o `src/` segue sem alcanca-lo e a seta continua apontando so' para um lado.
ph2d-tool-painter = { path = "../ph2d-tool-painter" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
