[package]
name = "ph2d-imageio-registry-init"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# `ph2d-imageio-registry-init` — codegen'd aggregation point for image I/O
# (ADR-0054, W0.T3). The shell calls `register_all_importers` +
# `register_all_exporters` once at boot to populate the runtime registries
# defined in `ph2d-imageio`. Mirrors `ph2d-tool-registry-init` and
# `ph2d-node-registry-init`.
#
# The body of `src/lib.rs` between `<ph2d-imageio-sync:importers:*>` /
# `:exporters:*` markers, and the deps block in this file between
# `<ph2d-imageio-sync:*>` markers, are REGENERATED by
# `cargo run -p ph2d-imageio-sync` from a scan of `crates/ph2d-imageio-*`.
# The staleness gate (`tests/staleness.rs`) fails CI if drift is checked in.

[dependencies]
# ph2d-imageio — the contract crate (traits + registries + DecodedImage).
ph2d-imageio = { path = "../ph2d-imageio" }

# Format crates (regenerated by `cargo run -p ph2d-imageio-sync`).
# <ph2d-imageio-sync:begin>
ph2d-imageio-apng = { path = "../ph2d-imageio-apng" }
ph2d-imageio-gif = { path = "../ph2d-imageio-gif" }
ph2d-imageio-jpeg = { path = "../ph2d-imageio-jpeg" }
ph2d-imageio-ora = { path = "../ph2d-imageio-ora" }
ph2d-imageio-ph2d-native = { path = "../ph2d-imageio-ph2d-native" }
ph2d-imageio-png = { path = "../ph2d-imageio-png" }
ph2d-imageio-psd = { path = "../ph2d-imageio-psd" }
ph2d-imageio-tiff = { path = "../ph2d-imageio-tiff" }
ph2d-imageio-webp = { path = "../ph2d-imageio-webp" }
# <ph2d-imageio-sync:end>

[dev-dependencies]
# Used by the staleness gate to re-render and compare against the
# checked-in body.
ph2d-imageio-sync = { path = "../../tools/ph2d-imageio-sync" }
