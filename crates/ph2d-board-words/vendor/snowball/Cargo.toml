# Vendored Snowball 3.1.1 (see VENDOR.md). Excluded from the workspace (root Cargo.toml),
# consumed by ph2d-board-words as a path dependency — the ADR-0123 idiom.
[package]
name = "snowball"
version = "3.1.1"
edition = "2015"
license = "BSD-3-Clause"
publish = false

# A raiz do seu PRÓPRIO workspace (o idioma do `deep_filter`): sem isto, um worktree dentro do
# checkout principal subia até ao `Cargo.toml` dele e o `cargo fmt --all` recusava-se a correr.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
