[package]
name = "ph2d-skeleton-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# A LEI e os COMPONENTES do esqueleto (ADR-0169: o esqueleto é módulo próprio).
ph2d-core = { path = "../ph2d-core" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-skeleton = { path = "../ph2d-skeleton" }
ph2d-skeleton-ecs = { path = "../ph2d-skeleton-ecs" }
# ⚠️ **A ponte documento ⇄ árvore, e é ela que proíbe esta lei de viver na
# `ph2d-skeleton-ecs`:** aquela crate é dependência da `ph2d-vec-entities`, então pôr o `bind` lá
# fecharia o ciclo `skeleton-ecs → vec-entities → skeleton-ecs`. *Uma folha nova não é escolha de
# gosto quando a alternativa é um ciclo.*
# ⚠️ **A porta da unicidade de NOMES** — o espelho renomeia a cópia (`Arm.L` → `Arm.R`) e a
# referência durável entre objectos nesta casa é o NOME: dois ossos com o mesmo nome seriam o mesmo
# sujeito para a timeline.
ph2d-unique-name = { path = "../ph2d-unique-name" }
ph2d-vec-entities = { path = "../ph2d-vec-entities" }
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# A malha da tinta e a `Sprite` de onde ela sai — a 2.ª mídia do esqueleto.
# ⚠️⚠️ **A FEATURE não viaja com o código** (HOWTO §2.4): a `serde` da `ph2d-poly2d` é opcional
# («só quem GUARDA uma malha liga isto», diz o Cargo.toml dela) e quem a ligava era a SHELL. Numa
# crate que não a declara, o `postcard::to_allocvec(&Mesh2d)` deixa de compilar — e esta falha
# alto, que é a metade boa; a irmã perigosa é o `#[cfg(feature)]` que fica falso em silêncio.
ph2d-poly2d = { path = "../ph2d-poly2d", features = ["serde"] }
ph2d-render = { path = "../ph2d-render" }
# ⚠️ A lei de deformação da pele. (O `ph2d-asset` saiu com a cache de imagens do Vello, e a
# `ph2d-vector` com o orçamento derivado do buffer dele — a W4 derivou-o do TEMPO do quadro, que esta
# crate mede sozinha: a malha desenha-se com a textura da própria sprite.)
# ⚠️⚠️ **A FEATURE não viaja com o código** (a mesma nota da `ph2d-poly2d` acima): o
# `CampoDoDominio` viaja DENTRO do `SkinnedPath`, logo é esta crate — a que GRAVA — que tem
# de ligar o `serde` dele.
ph2d-vec-skin = { path = "../ph2d-vec-skin", features = ["serde"] }
# ⭐⭐⭐ **O PADRÃO-OURO dos pesos de pele** (Bounded Biharmonic Weights, SIGGRAPH 2011), resolvido
# uma vez ao PRENDER. ⚠️ Ele é uma folha que só depende da `ph2d-poly2d` — não há ciclo por aqui.
ph2d-skin-weights = { path = "../ph2d-skin-weights" }
# ⚠️ A `ph2d-vec-skin` já era dependência (a lei do vector); desde 2026-09-15 ela também resolve os
# pesos do padrão-ouro para um caminho, e o `bind` chama-a.
postcard = { version = "1", features = ["use-std"] }
# ⚠️ A malha GUARDADA passou a levar os pesos dentro (`skinned_mesh`), e o `derive` tem de ser
# desta crate: o `postcard` traz o `serde` mas não o macro.
serde = { version = "1", features = ["derive"] }

[features]
# ⚠️ HOWTO §2.5 — do tamanho do que ATRAVESSA a fronteira, e nada mais.
test-support = []

[lints]
workspace = true
