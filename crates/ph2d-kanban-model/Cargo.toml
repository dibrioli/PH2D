[package]
name = "ph2d-kanban-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# O documento Kanban (ADR-0195) — PURO: sem ECS, sem render, sem UI. Entra e sai por ops e bytes.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
ph2d-frac = { path = "../ph2d-frac" }
# v2 — a chave de um ficheiro é o sha-256 dos bytes (a mesma do `ph2d_board_model::FileId`, ADR-0184).
sha2 = "0.10"

[lints]
workspace = true
