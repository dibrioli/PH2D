[package]
name = "ph2d-editor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[lib]

# Wave 2 PR 11.2 / Wave 6+7 Phase 2: `build.rs` reads
# `docs/design/icons/*.svg` (89 SVGs, Lucide-derived) and generates
# `OUT_DIR/icons_generated.rs` with per-icon `IconCmd` arrays +
# slug→cmds lookup table. Eliminates 715 LOC of manually-ported match
# arms in `icons.rs::cmds()`.

[build-dependencies]

[dependencies]
ph2d-tokens           = { path = "../ph2d-tokens" }
ph2d-a11y             = { path = "../ph2d-a11y" }
ph2d-vector           = { path = "../ph2d-vector" }
ph2d-text             = { path = "../ph2d-text" }
ph2d-host             = { path = "../ph2d-host" }
ph2d-tool-registry    = { path = "../ph2d-tool-registry" }
# ph2d-grid — grid kinds (Square/Hex/Iso/Staggered/Tri) + snap math
# consumed by `grid_snap/` module (ADR-0029 Phase B.2 absorbed from
# ph2d-editor).
ph2d-grid             = { path = "../ph2d-grid" }
# ph2d-i18n — string-table stub (M13 deferred Fluent). Tooltips and
# toast strings funnel through `tr("key")` so the eventual Fluent
# migration is an impl swap, not a call-site rename. See HR-15.
ph2d-i18n             = { path = "../ph2d-i18n" }
smallvec              = "1"
bumpalo               = { version = "3", features = ["collections"] }

[dev-dependencies]
# dhat-rs: HR-3 enforcement bench — counts allocations in
# `interaction_dispatch_no_alloc` test to assert hot path is
# allocation-free. See ADR-0024 "Plano de conformidade HR-3".
dhat = "0.3"
# ph2d-tool-make-square + ph2d-tool-trim-transparency — DEV-only
# (ADR-0040 T1.5/T3). The algorithms moved to their crates (foundation
# ⊥ tools); the editor-core integration test make_square_algorithm.rs
# (incl. its trim↔make_square round-trip) still exercises them.
# Dev-dep doesn't trip the `architecture_cycle_prevention` gate
# (it parses [dependencies] only) and creates no runtime cycle.
ph2d-tool-make-square = { path = "../ph2d-tool-make-square" }
ph2d-tool-trim-transparency = { path = "../ph2d-tool-trim-transparency" }
# Wave 11 — typed-color migration: the integration test
# make_square_algorithm.rs casts its Vec<u8> fixtures into &[SrgbRgba]
# via bytemuck::cast_slice before calling the migrated APIs.
ph2d-color = { path = "../ph2d-color" }
bytemuck = "1"
# Wave 10 / Etapa 4.2 — staleness gate for chrome handler `mod` block.
ph2d-chrome-sync = { path = "../../tools/ph2d-chrome-sync" }
# Wave 10 / Etapa 4.3 — staleness gate for widget `mod` block.
ph2d-widget-sync = { path = "../../tools/ph2d-widget-sync" }
# ADR-0029 Phase C.1 NOTE: Inspector regression tests that need
# `ph2d_panel_inspector::*` are scheduled to migrate to
# `crates/ph2d-panel-inspector/tests/inspector_regression.rs` in
# Phase D (cycle-free integration tests). A dev-dep here would
# duplicate `ph2d-editor-core` in the test build graph (cargo
# treats dev-dep cycles as distinct crate instances).
