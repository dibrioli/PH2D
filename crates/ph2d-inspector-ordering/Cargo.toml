[package]
name = "ph2d-inspector-ordering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⛔ Nenhuma delas é a `App`: esta crate traduz uma EDIÇÃO DE PAINEL (`ph2d-editor`) num comando
# para o MUNDO (`ph2d-ecs`), e nada mais. O `queue_set` dela é a porta que a família `physics`
# usa em seis ficheiros para os componentes dela — é isso que a torna uma folha e não um
# pedaço do Inspector.
[dependencies]
ph2d-core = { path = "../ph2d-core" }
ph2d-ecs = { path = "../ph2d-ecs" }
ph2d-editor-core = { path = "../ph2d-editor-core" }
# ⚠️ **As DUAS metades do `queue_set`, e as duas eram invisíveis dentro da shell** (HOWTO §1.3):
# ele é genérico sobre `Serialize` e codifica o valor com `postcard` antes de o pôr no
# `EditorCommand::SetComponent`.
serde = { version = "1" }
postcard = { version = "1", features = ["alloc"] }

[lints]
workspace = true
