[package]
name = "ph2d-board-edit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Os GESTOS do Quadro (W1): ferramentas, selecção, mover/redimensionar/rodar, guias, texto na forma,
# copiar/colar, desfazer. Sem ecrã nem UI: entra o ponteiro em coordenadas do MUNDO, sai o
# documento mudado (por `BoardOp`) e o que desenhar por cima (`Overlay`).
ph2d-board-model = { path = "../ph2d-board-model" }
ph2d-board-geom = { path = "../ph2d-board-geom" }
ph2d-board-layout = { path = "../ph2d-board-layout" }
ph2d-board-route = { path = "../ph2d-board-route" }
ph2d-text = { path = "../ph2d-text" }
# W7 — as palavras de uma nota (agrupar por palavra).
ph2d-board-words = { path = "../ph2d-board-words" }
# W16 — o recorte pelo gesto conta com o afim (píxel natural → mundo) da geometria do quadro.
ph2d-vector = { path = "../ph2d-vector" }
# W23 B13 — o QuickShape do vetor na caneta do quadro: a MESMA lei e o MESMO gatilho (sem limiares cá).
ph2d-vec-edit = { path = "../ph2d-vec-edit" }

[lints]
workspace = true
