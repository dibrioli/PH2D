[package]
name = "ph2d-imageio-jxl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# `ph2d-imageio-jxl` — JPEG XL decode (W3.T1). Pure-Rust via
# `jxl-oxide` 0.10. JXL is the next-gen lossless + lossy format
# (HDR + alpha + animation in spec; W3.T1 ships decode-only first-
# frame for LDR Flat path). Encode permanent-deferred — jxl-oxide
# is decode-only; native JXL encode lands when a pure-Rust encoder
# materialises (`zune-jxl`?).
#
# Audit-13 W3.T1.5 wave-2 (2026-05-27): real decode shipped —
# replaces the magic-only-stub from cc97cd4.

[dependencies]
ph2d-imageio = { path = "../ph2d-imageio" }
ph2d-color   = { path = "../ph2d-color" }
jxl-oxide = { version = "0.10", default-features = false }
