[package]
name = "ph2d-tool-painter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Painter — Stateful workhorse tool, isolated crate (ADR-0040 + ADR-0043).
# Cascata W0 ratificada 2026-05-26 (11 ADRs 0043..0053). Esta crate
# implementa o contrato ADR-0043 (`PainterTool` + `PainterParams` +
# `PainterUiEdit` + `PainterUiSnapshot`).
#
# T1.1 skeleton: panic-com-todo!() nos métodos que precisam de brush
# engine real (T1.4+). Pill registrada em T1.2. Brush real T1.3 ph2d-painter-brush.

[features]
# `gpu` routes the Inpaint heal (ADR-0102) through the `ph2d-inpaint` GPU compute
# path (jump-flood NNF + voting), reconciled with the CPU reference within ε. Off
# by default so the CPU-only build stays light; the desktop shell enables it. The
# heal still falls back to CPU when no adapter is present OR the crop is small (GPU
# upload/readback overhead beats CPU only above a size threshold).
default = []
gpu = ["dep:ph2d-gpu", "ph2d-inpaint/gpu"]

[dependencies]
# ⭐ A tabela de strings (folha, ZERO dependências): os quatro MEIOS que esta crate publica são
# pintados pelo `ph2d-panel-painter-layers`, e a fronteira entre os dois é cega ao HR-15.
ph2d-i18n = { path = "../ph2d-i18n" }
# Tool trait + FloatingPanel + widgets the PainterTool builds on.
ph2d-editor-core = { path = "../ph2d-editor-core" }
# ToolManifest + ToolHandler + Registry + Zone + McpExposure.
ph2d-tool-registry = { path = "../ph2d-tool-registry" }
# BezPath for the painter icon (icon.rs).
ph2d-vector = { path = "../ph2d-vector" }
# Role for a11y_role no MANIFEST.
ph2d-a11y = { path = "../ph2d-a11y" }
# MemoryBudget for HR-13 boot check.
ph2d-core = { path = "../ph2d-core" }
# Layer blend modes + adjustment-layer effects (BlendMode / AdjustmentKind /
# adjustment editing fns). The layers + effects surface, extracted from the
# (deleted) brush engine.
ph2d-painter-effects = { path = "../ph2d-painter-effects" }
# Pure clean-room Blender brush engine (BrushSpec / Stroke / stamp_dab). Driven
# from `tool/paint.rs` to write dabs into the active layer's `canvas_rgba`.
ph2d-painter-brush = { path = "../ph2d-painter-brush" }
# O RIG DE LUZ, e só ele: quantas lâmpadas há, onde cada uma está, e a conversão
# graus→vetor. Ele saiu daqui porque a escultura do módulo 3D tem de ser acesa
# pelas MESMAS lâmpadas (docs/3D/05.2) — um segundo rig faria o artista afinar a
# arte contra uma iluminação e ver outra. ⚠️ A ÓPTICA não saiu: material, LUT
# especular, wax, metal e o modelo relativo continuam em `tool/paint/impasto_*`.
ph2d-light = { path = "../ph2d-light" }
# Wet Paint (PaintMode::WetPaint): the parity-tested fluid engine — ADR-0134.
ph2d-wet-paint = { path = "../ph2d-wet-paint" }
# ⛔ **A `ph2d-pigment` NÃO entra aqui, e a ausência é um registo.** Ela esteve declarada entre
# 2026-09-20 e o mesmo dia: foi acrescentada para a tentativa de trocar a lei da AQUARELA para o
# K–M, que foi construída, MEDIDA (o `watercolor_soak_…` passou a ler o mesmo pixel para as duas
# demoras — os dois lados saturam) e revertida. A dependência **sobreviveu à reversão** e o
# `cargo machete` apanhou-a. *Quando o único leitor de um valor sai, o valor sai com ele* — e isso
# vale para uma linha de `Cargo.toml` tanto como para um campo. A lei vive na `ph2d-painter-brush`
# (que a lê no `blend_over_pigment`) e na `ph2d-wet-paint`; esta crate só a alcança por elas.
# Content-aware heal (Inpaint paint-mode): multi-scale PatchMatch reconstruction
# of the brushed defect region on pen-up (ADR-0102). CPU reference path; the
# `gpu` feature turns on its GPU compute path.
ph2d-inpaint = { path = "../ph2d-inpaint" }
# Shared GpuContext (Device + Queue) for the `gpu`-feature Inpaint heal — a
# process-wide headless context, created lazily (mirror of color-equalization).
ph2d-gpu = { path = "../ph2d-gpu", optional = true }
# Canonical sRGB↔linear byte transfer for the CPU compositor's gamma boundary.
ph2d-color = { path = "../ph2d-color" }
# serde for PainterParams + the layer model serialization.
serde = { version = "1", features = ["derive"] }
# Data-parallel watercolor composite (ADR-0109 exception to the no-rayon default): the per-pixel optical
# reconstruction is embarrassingly parallel + byte-identical (disjoint output rows, no reduction, no RNG),
# so it distributes over the thread pool without touching deterministic replay.
# ⭐ Usos NOMEADOS depois dele, cada um com ADR e gate byte-a-byte contra o laço em série: as passagens
# POR PIXEL da pilha do Composite Brush (`composite_linhas::tinta`/`borracha`) e o re-amostrar do warp
# (`warp::session::reamostra`) — ADR-0172, sob os MESMOS três invariantes (⚠️ o número soma entre
# linhas: reconte-o). E os da aquarela — o despejo da água (`grow_wet_soak`), as passagens por texel
# do aro, da cobertura e dos campos molhado/estilo, e as faixas verticais do `box_blur` — ADR-0173.
# Todo uso novo exige ADR novo.
rayon = "1"

[dev-dependencies]
# dhat-rs: a medição do HR-13 emendado pelo ADR-0117 — *quem declara budget possui um gate que MEDE*.
# O undo estrutural do painter guarda `ModelSnapshot`s canvas-shaped e o cap dele é por CONTAGEM
# (`DEFAULT_MAX_DEPTH = 300`), que é multiplicador e não teto: `tests/measure_undo_memory.rs`.
dhat = "0.3"

# O round-trip do documento pintado é provado no formato REAL do projeto (postcard, o wire canônico do
# repo) — um teste que serializasse com outro formato não provaria o arquivo que o artista salva.
postcard = { version = "1", features = ["alloc"] }

# ⚠️ O KILL-CRITERION do ADR-0157 mede o cook do Liquify no DEVICE, e o oráculo dele é
# `warp::field::compose_at`, que é `pub(super)`. Uma crate irmã só o alcançaria alargando a superfície
# privada do tool para a workspace inteira — e a lei ainda muda de casa na W1 (o ADR pede um dab
# AUTORADO, pequeno e animável). `dev`, então o `src/` segue sem device nenhum: quem despacha é a shell.
wgpu = { version = "29.0.4", features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
ph2d-gpu = { path = "../ph2d-gpu" }

[lints]
workspace = true
