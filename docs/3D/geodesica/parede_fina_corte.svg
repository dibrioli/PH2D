<text x="590" y="74" fill="#8b93a1" font-family="DejaVu Sans, sans-serif" font-size="19" text-anchor="middle">peca com 0.06 de espessura · pincel com 0.40 de raio · o tracejado e' a forma antes do traco · escala igual nos dois eixos</text>
