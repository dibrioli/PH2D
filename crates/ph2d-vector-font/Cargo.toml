[package]
name = "ph2d-vector-font"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Frozen data model (ADR-0056): a glyph IS a VectorNetwork (ADR-0066 §2.2).
ph2d-vector-doc = { path = "../ph2d-vector-doc" }
# AnimValue / AttributeEvaluator — axes drive the graph as animated attributes
# (ADR-0066 §2.4). Read-only contract dep (the "mocks kill vaporware" crate).
ph2d-vector-traits = { path = "../ph2d-vector-traits" }
# skrifa (Linebender) — variable-font parsing + axis-aware outlines. Already in
# the workspace tree via parley/vello; pure Rust, no native build deps.
# ⛔ TETO: o `vello 0.10.0`, o `parley 0.11.1` e o `usvg` pedem `^0.44.0`, que em
# 0.x significa `>=0.44.0, <0.45.0`. Existem 0.45 e 0.46 no indice, e elas NAO
# "forcam uma escolha" — elas COEXISTEM, e um `OutlineGlyph` de uma copia nao
# serve a` outra. Reconferir com `bash scripts/stack-audit.sh --tetos`.
skrifa = "0.44.0"
# glam::Vec2 — the network's coordinate type.
glam = "0.30"
# SmallVec — axes inline ≤ 8 per glyph (ADR-0066 §2.7 cap).
smallvec = { version = "1", features = ["union"] }
