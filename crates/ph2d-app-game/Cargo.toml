[package]
name = "ph2d-app-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# A família do JOGO a correr (GameEngineFuncional R0, `docs/GameEngineFuncional/04_R0_N0_plano.md`):
# a sessão de Play (o jogo corre sobre uma cópia do documento) e onde ele se mostra.
[dependencies]
# O roteador do smoke (`SmokeRouter`).
ph2d-app-host = { path = "../ph2d-app-host" }
# Os blocos e o jogador de plataforma do nível 1 (`slab`, `spawn_player`) — a folha partilhada com as cenas
# da física. A porta do `+` e o vazio na raiz são de outra família e chegam injectados (`object_add::Portas`).
ph2d-physics-scene = { path = "../ph2d-physics-scene" }
ph2d-core = { path = "../ph2d-core" }
ph2d-ecs = { path = "../ph2d-ecs" }
# Onde o jogo se mostra (`game_stage::GameStage`, a escolha do menu *Run*).
ph2d-editor-core = { path = "../ph2d-editor-core" }
# As regras de animação: as ações premidas (`ActionState`) e os sinais ouvidos (`SignalOutbox`).
ph2d-input = { path = "../ph2d-input" }
# O `#[derive(Resource)]` do estado das regras em curso (o derive pede o caminho `bevy_ecs`).
bevy_ecs = "0.20"
ph2d-runtime = { path = "../ph2d-runtime" }
# O personagem: o `CharacterAnimations`, a vista do player e os corpos dos objectos do menu Add.
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }
ph2d-render = { path = "../ph2d-render" }
# As cores das ilustrações das dicas do menu Add.
ph2d-tokens = { path = "../ph2d-tokens" }
# As moedas correm um script da biblioteca do projecto.
ph2d-script = { path = "../ph2d-script" }
# A miniatura do que a câmera vê pinta-se sobre a moldura dela.
ph2d-vector = { path = "../ph2d-vector" }
ph2d-camera-frame = { path = "../ph2d-camera-frame" }
ph2d-game-dicas = { path = "../ph2d-game-dicas" }
# A cena do `PH2D_SFX_SMOKE`, por cima do nível 2.
ph2d-sfx-scene = { path = "../ph2d-sfx-scene" }
ph2d-sprite-anim-scene = { path = "../ph2d-sprite-anim-scene" }
# As cenas da aba Input Map (6..13): o mapa do dono, os leitores e o estado da aba, como folha.
ph2d-input-map-scene = { path = "../ph2d-input-map-scene" }

[lints]
workspace = true
