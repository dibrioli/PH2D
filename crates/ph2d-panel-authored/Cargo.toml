[package]
name = "ph2d-panel-authored"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-a11y = { path = "../ph2d-a11y" }
# A régua do painel (ROW_H_PX, Spacing) e o tema — nenhum literal de px nasce aqui (HR-15).
ph2d-tokens = { path = "../ph2d-tokens" }
# ⚠️ **A GEOMETRIA entrou com o `IconButton`, e a aresta é honesta.** A row de um botão de ícone
# carrega o glifo que o artista desenhou; o gerado o traz como texto SVG e o `rows()` o reconstitui
# UMA vez. Reparsear a string por quadro seria um parser no laço de pintura, e guardar o texto em
# vez da curva empurraria a mesma conta para o pintor. Nenhum pacote externo novo: o
# `ph2d-editor-core` ao lado já depende desta crate.
ph2d-vector = { path = "../ph2d-vector" }

# ⚠️ **Sem `ph2d-i18n`, e a ausência é a decisão.** Toda string que este painel mostra — o título
# e o rótulo de cada row — é o `Name` que o ARTISTA digitou; ela viaja no documento como o nome de
# uma camada. Passá-la por `tr()` procuraria uma chave que não existe e devolveria a própria
# string, dando a impressão de que o painel é traduzível quando ele é *autorado*. HR-15 governa
# strings que o PROGRAMA escreve; aqui não há nenhuma.

[dev-dependencies]
# `architecture_interactive_crate_has_behavioral_test`: um painel com `event.rs` tem de trazer um
# teste que dirige um WidgetEvent REAL.
ph2d-ui-testkit = { path = "../ph2d-ui-testkit" }
# O gesto REAL do seam (Down+Up) precisa do tipo de evento de ponteiro. Um `WidgetEvent::Click`
# sintético prova a allowlist e PULA a checagem de focabilidade no store.
ph2d-host = { path = "../ph2d-host" }
# ⚠️ **`dev-dependency`, e a direção é a wave inteira numa linha:** o gate de staleness precisa do
# EMISSOR para re-emitir o painel versionado e comparar byte a byte, mas o `src/` desta crate não
# pode alcançá-lo — o gerador é quem escreve este código, não quem ele consome. Em
# `[dependencies]` seria a aresta que deixa o painel compilado depender do gerador que o produziu.
ph2d-ui-codegen = { path = "../ph2d-ui-codegen" }
