[package]
name = "ph2d-vec-skin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# ⭐ **A LEI mora no MÓDULO; aqui mora só o que o VETOR sabe.** Esta crate é o 1.º cliente do
# esqueleto — a que responde *«o que é um ponto aqui»* (três por vértice: âncora e as duas alças).
# É a mesma repartição do Blender, onde o *Armature modifier* é um só e o Grease Pencil tem a
# implementação dele à parte porque *o que é um ponto* ali é outra coisa.
ph2d-skeleton = { path = "../ph2d-skeleton" }
# O documento vectorial. ⛔ Ele NÃO é dependência da lei: uma pele que precisasse dele deixaria de
# servir raster, 3D e Flip — que é a razão de o módulo existir.
ph2d-vec-scene = { path = "../ph2d-vec-scene" }
# ⭐ A malha do DOMÍNIO (a mesma da imagem) e o padrão-ouro dos pesos. As duas são folhas.
ph2d-poly2d = { path = "../ph2d-poly2d" }
ph2d-skin-weights = { path = "../ph2d-skin-weights" }

# ⭐⭐⭐ **A CURVA deformada** (F30, 2026-09-19): a pele é um mapa **não-afim**, e só transformações
# afins comutam com a avaliação de Bézier — deformar os pontos de controlo acerta nos nós e **no
# interior nunca**. A `ph2d-vec-envelope` já resolveu essa metade (o refit adaptativo e a remontagem
# do contorno) e o `kurbo` é o fitter. ⚠️ **Ela entrou como DEV-dependency enquanto a rota estava a
# ser medida** (`sonda_da_pele_como_warp`) e passou a produção quando a medição decidiu.
ph2d-vec-envelope = { path = "../ph2d-vec-envelope" }
kurbo = "0.13"

# ⚠️ **Só quem GUARDA o campo do domínio liga isto** — o mesmo idioma (e a mesma frase) do
# `Cargo.toml` da `ph2d-poly2d`, de que esta feature é o reencaminhamento. A lei em si não
# serializa nada.
serde = { version = "1", features = ["derive"], optional = true }

[features]
# ⚠️⚠️ **A FEATURE NÃO VIAJA COM O CÓDIGO** (HOWTO §2.4): quem precisar de gravar um
# [`pesos::CampoDoDominio`] tem de a declarar na crate DELE — numa que não a declare, o
# `postcard::to_allocvec` deixa de compilar, e essa falha é a metade boa. ⛔ A irmã perigosa é o
# `#[cfg(feature)]` que fica falso em silêncio e deixa o campo de fora do ficheiro.
serde = ["dep:serde", "ph2d-poly2d/serde"]

[lints]
workspace = true
