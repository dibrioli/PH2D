[package]
name = "ph2d-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# Vello — Linebender's GPU vector renderer (currently 0.x; alpha-
# quality per the M11 plan note "Vello em alpha — risco aceito,
# ADR-0004 a escrever quando aparecer regressão").
# Pinned to 0.8 (which tracks wgpu 28). The whole workspace is on
# wgpu 28 to align with Vello — bumped from 29 in the M11 widget-
# paint PR; downgrade rationale documented in the same commit.
# kurbo + peniko reach our public API via `vello::kurbo` /
# `vello::peniko` re-exports — declaring them as direct deps would
# risk version skew (vello 0.8 ships peniko 0.6, kurbo 0.12).
# `default-features = false` drops vello's CPU-pipeline-cache code
# we don't use; the `wgpu` feature keeps GPU integration on.
vello = { version = "0.8", default-features = false, features = ["wgpu"] }
