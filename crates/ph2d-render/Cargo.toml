[package]
name = "ph2d-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-host = { path = "../ph2d-host" }
ph2d-core = { path = "../ph2d-core" }
ph2d-gpu = { path = "../ph2d-gpu" }
ph2d-ecs = { path = "../ph2d-ecs" }
bevy_ecs = "0.18"
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
# Vello dropped in the egui-migration PR — egui has its own
# rasterizer that handles widgets. ph2d-render is back to sprite-only
# for now; vector graphics (SVG, brush strokes) come back as a
# follow-up if/when needed.
