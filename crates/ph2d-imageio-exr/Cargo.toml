[package]
name = "ph2d-imageio-exr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# `ph2d-imageio-exr` — OpenEXR decode (W3.T2). Pure-Rust via `exr`
# 1.x. Single-part RGBA float32 → FlatHdr. Used for VFX / IBL /
# scene-linear pipelines (Blender / Houdini / Nuke).
#
# Audit-13 W3.T1.5 wave-2 (2026-05-27): real decode shipped —
# replaces the magic-only-stub from cc97cd4. Encode still deferred
# (the SpecificChannels::Image construction wants typed callback
# wires that lock down to first real export client).

[dependencies]
ph2d-imageio = { path = "../ph2d-imageio" }
ph2d-color   = { path = "../ph2d-color" }
exr = { version = "1", default-features = false }
