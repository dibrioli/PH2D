[package]
name = "ph2d-node-motion-luminance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-nodegraph = { path = "../ph2d-nodegraph" }
ph2d-node-registry = { path = "../ph2d-node-registry" }
# O matiz/saturação/valor de uma cor tem UMA definição neste app, e ela mora
# aqui (é a mesma que o `RampColorMode::Hsv` do `motion.color_ramp` interpola).
# Uma cópia local seria um segundo matiz, divergindo exatamente no grafo que
# rampeia em HSV e lê o canal de volta.
ph2d-color = { path = "../ph2d-color" }
