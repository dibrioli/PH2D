[package]
name = "ph2d-audio-decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# Load-time audio decoding (bytes → ph2d_audio::SampleData) via Symphonia. Kept
# separate from `ph2d-audio` so Symphonia's dep tree never reaches the RT mixer.
[dependencies]
ph2d-audio = { path = "../ph2d-audio" }
# A porta ÚNICA `decode_any` roteia o Opus (que o app escreve, ADR-0116) para a crate que o lê.
ph2d-audio-opus = { path = "../ph2d-audio-opus" }
# Symphonia — royalty-free / patent-expired codecs ONLY (HR-1 FFI criterion #6):
# WAV (PCM/ADPCM), AIFF, FLAC, Ogg Vorbis, MP3 (patents expired 2017). AAC / ALAC
# / MP4 (isomp4) are deliberately excluded — they are patent-encumbered.
symphonia = { version = "0.6", default-features = false, features = [
    "wav",
    "pcm",
    "adpcm",
    "aiff",
    "flac",
    "ogg",
    "vorbis",
    "mp3",
] }
thiserror = "2"

[dev-dependencies]
# Os gates da `decode_any` provam o ida-e-volta: o que o app ESCREVE, o app lê.
ph2d-audio-encode = { path = "../ph2d-audio-encode" }

[lints]
workspace = true
