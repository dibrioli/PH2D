[package]
name = "ph2d-shape-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
# `BezPath` + o aplanamento e a expansão do traço (re-exportados pela porta única do kurbo).
ph2d-vector = { path = "../ph2d-vector" }
# O `GpuContext` — o dispositivo e a fila onde o passe vive.
ph2d-gpu = { path = "../ph2d-gpu" }
wgpu = "29.0.4"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
# Os gates de paridade de PIXEL rasterizam as MESMAS cópias pelo Vello e comparam.
vello = { version = "0.10.0", default-features = false, features = ["wgpu"] }
# ⛔ E pelo renderer do PRODUTO — o dono da escolha de anti-aliasing (o gate
# `the_pass_aa_is_never_chosen_by_a_text_preference` proíbe nomeá-la fora dele).
# `ph2d-render` não depende desta crate ⇒ sem ciclo.
ph2d-render = { path = "../ph2d-render" }
pollster = "0.4.0"
# ⭐ E a LEI DA CASA do traço sob escala não uniforme (`pen_for` + `ajusta_no_ecra`), chamada e não
# copiada: a régua do tracejado (doc 121 §9.9) não pode ter uma cópia da lei que ela mede.
# `ph2d-vec-render` não depende desta crate ⇒ sem ciclo.
ph2d-vec-render = { path = "../ph2d-vec-render" }

[lints]
workspace = true
