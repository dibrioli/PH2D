[package]
name = "ph2d-brush-traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Foundational decoupling crate per ADR-0067 — breaks the Painter ↔
# Vector circular dep risk (L6F2 Antigravity 3rd iteration HIGH).
#
# CRITICAL: zero deps on `ph2d-painter-*` OR `ph2d-vector-*`. Caps
# congelados: 3 trait methods on BrushEngine + 7 StampSpec fields +
# 3 total deps (serde + glam + ph2d-color).

[lib]

[dependencies]
# BrushRef derives Serialize/Deserialize for round-trip through
# .ph2d-brush / .ph2d-vector postcard schemas (ADR-0067 §2.2).
serde = { version = "1", features = ["derive"] }

# glam 0.30 — matches ph2d-core's Vec2 pin. StampSpec embeds Vec2
# directly (pos / tangent / tilt / jitter).
glam = "0.30"

# ph2d-color is reserved for future StampSpec color extensions
# (per-stamp tint overrides etc.); currently unused but kept in the
# dep list because ADR-0067 §2.6 caps deps at exactly 3 — adding it
# later would require an amendment.
ph2d-color = { path = "../ph2d-color" }
