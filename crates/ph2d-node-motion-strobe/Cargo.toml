[package]
name = "ph2d-node-motion-strobe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[dependencies]
ph2d-nodegraph = { path = "../ph2d-nodegraph" }
ph2d-node-registry = { path = "../ph2d-node-registry" }
# libm — `powf` puro-Rust (porte do MUSL) para a taxa do envelope sair bit-identica em
# Linux/macOS/Windows: `f32::powf` da plataforma nao e especificado ao ulp, e o brilho de
# um flash dirige TAMANHO e COR, que sao ARTE. Roda UMA vez por tick, nunca por linha.
# MESMO pin `=0.2.16` de ph2d-ecs / physics / wet-paint / motion-trail: uma aresta, nao um
# pacote novo.
libm = { version = "=0.2.16", default-features = false }
# ph2d-curve — a FOLHA que define o que uma curva desenhada e' (o mesmo motor do
# `value.curve` e do contour Curve do `field.remap`). Uma segunda resposta a "como
# esta curva e' amostrada?" divergiria do editor que a desenha. Folha dep-free.
ph2d-curve = { path = "../ph2d-curve" }
