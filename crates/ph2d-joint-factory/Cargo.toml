[package]
name = "ph2d-joint-factory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

# As PEÇAS DE FÁBRICA de um gabarito («Make the parts») e as fileiras de uma montagem feita («Planks»):
# saíram da `ph2d-joint-assembly` (tecto de linhas por crate, 16/11), com os testes que montam máquinas
# com essas peças; e o desenho do gabarito em metros (`stage`, vindo da `ph2d-joint-editor-doc`). Fica ACIMA da montagem (usa `assemble`/`joints_of`) e abaixo do documento da aba.
[lib]

[dependencies]
ph2d-core = { path = "../ph2d-core" }
ph2d-ecs = { path = "../ph2d-ecs" }
# O `Rect` do desenho (`stage::StageMap`).
ph2d-editor-core = { path = "../ph2d-editor-core" }
ph2d-joint-assembly = { path = "../ph2d-joint-assembly" }
ph2d-joint-templates = { path = "../ph2d-joint-templates" }
ph2d-physics-ecs = { path = "../ph2d-physics-ecs" }
# A aparência simples das peças de fábrica (`joint_factory`, «Make the parts»).
ph2d-render = { path = "../ph2d-render" }
ph2d-unique-name = { path = "../ph2d-unique-name" }

[dev-dependencies]
ph2d-label-census = { path = "../ph2d-label-census" }

[lints]
workspace = true
