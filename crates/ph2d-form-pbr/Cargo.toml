[package]
name = "ph2d-form-pbr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]

# ⛔ UMA dependência de produção, e ela é a LEI: a `ph2d-material` é o port Apache-2.0 do OpenPBR, e
# esta crate não reimplementa uma linha dela — ela é o LAÇO POR TEXEL que a chama. Uma segunda
# redacção da óptica aqui seria a divergência que a `ph2d-material` existe para impedir.
#
# ⛔ **Sem `ph2d-light`, de propósito.** As lâmpadas entram como DADOS ([`Lampada`]), e quem as
# resolve é o chamador — que já tem o rig. Depender dela arrastaria a `ph2d-painter-brush` para
# dentro de uma lei que não sabe o que é um pincel, e a folha deixaria de o ser.
[dependencies]
ph2d-material = { path = "../ph2d-material" }
# ⭐ A segunda, e ela é a lei de «cena linear → ecrã»: esta lei é ABSOLUTA, logo sem a vista
# ela chega ao ecrã como radiância crua — o objecto sai escuro. Folha sem dependências.
ph2d-view-transform = { path = "../ph2d-view-transform" }

# ⛔⛔ **naga (o MESMO major do wgpu 29) — porque um WGSL que ninguem compila e' PROSA.**
# O `cargo check` nao olha para uma `&str`, e todo gate que olha para um shader neste repo precisa
# de adapter e e' `#[ignore]` ⇒ um erro de sintaxe no gemeo so' apareceria no 1.º quadro de quem
# abrisse a cena. Aqui ele e' aritmetica, nao uma pergunta para a placa.
[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] }

[lints]
workspace = true
